# Durable Supabase Edge Function platform-authentication contract.
# Keep every current function explicit. Application-layer authentication remains
# enforced inside functions even when the platform JWT check is disabled.

# Custom server authentication: Vercel signs every bootstrap request with the
# shared TUX_BOOTSTRAP_HMAC_SECRET. No user/device Authorization JWT is sent.
[functions.device-bootstrap]
verify_jwt = false

# Public/bootstrap provisioning boundary: possession of a valid one-time device
# enrollment code is verified by the function. The caller does not have a device JWT yet.
[functions.device-enroll]
verify_jwt = false

# Public customer catalog read boundary. Shop UUID validation/isolation and the
# narrow customer-safe projection are enforced by catalog-public itself.
[functions.catalog-public]
verify_jwt = false

# Public customer order-intake boundary. No customer JWT exists. The function parses
# a strict transport contract, re-resolves canonical catalog authority, recomputes
# trusted pricing, and writes PENDING requests only with the server-side service role.
[functions.order-intake]
verify_jwt = false

# Canonical Admin mutation boundary. Supabase verifies the caller JWT at the
# platform edge, then catalog-admin independently resolves the user and active
# OWNER/ADMIN membership before any privileged database/storage operation.
[functions.catalog-admin]
verify_jwt = true

# Enrolled Operations devices call these functions with their Supabase device session JWT.
[functions.operations-config]
verify_jwt = true

[functions.operations-sync]
verify_jwt = true

[functions.worker-auth]
verify_jwt = true