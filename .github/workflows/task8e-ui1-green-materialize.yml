name: Task 8E UI1 GREEN Materializer
on:
  push:
    branches:
      - work/operations-whatsapp-inbox-live
    paths:
      - '.tux-live/task8e-ui1-green.patch'
      - '.github/workflows/task8e-ui1-green-materialize.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact Task 8E UI1 GREEN tree
        shell: bash
        run: |
          set -euo pipefail
          cp .tux-live/task8e-ui1-green.patch /tmp/task8e-ui1-green.patch
          test "$(sha256sum /tmp/task8e-ui1-green.patch | cut -d' ' -f1)" = "81a420fb8df2e63f735b814447fcd07370072821c64bc2b4bd37896ce2cbdf84"
          git rm .tux-live/task8e-ui1-green.patch
          git rm .github/workflows/task8e-ui1-green-materialize.yml
          git apply --index /tmp/task8e-ui1-green.patch
          test "$(git write-tree)" = "443e7fb11a61d27e31ac44ae4dca67df3019743d"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "wip(task8e): establish premium WhatsApp split layout"
          test "$(git rev-parse HEAD^{tree})" = "443e7fb11a61d27e31ac44ae4dca67df3019743d"
          git push origin HEAD:refs/heads/work/operations-whatsapp-inbox-live
