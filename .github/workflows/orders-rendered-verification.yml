name: Orders isolated rendered verification (temporary)

on:
  push:
    branches:
      - fix/orders-production-remediation-20261025
    paths:
      - '.github/workflows/orders-rendered-verification.yml'
      - 'apps/admin/src/orders/**'
      - 'apps/admin/server/orders/**'
      - 'apps/admin/api/admin/orders.ts'
      - 'e2e/admin-orders.spec.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orders-rendered-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admin-rendered:
    name: Admin Orders rendered QA
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck Admin
        run: npm run typecheck:admin
      - name: Build Admin
        run: npm run build:admin
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run existing Admin rendered E2E
        run: npm run test:e2e:admin
      - name: Preserve screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orders-admin-rendered-e2e
          path: |
            playwright-report-admin
            test-results
          if-no-files-found: warn
          retention-days: 14

  postgres-cancellation:
    name: Paid cancellation PostgreSQL regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Execute isolated order approval, refund, return, and paid cancellation RPC tests
        run: node scripts/test-admin-order-approval-postgres.mjs
