name: PR119 Temporary Inventory Approval Canonical Formatter
on:
  push:
    branches:
      - fix/admin-plans1-7-functional-completeness
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-plans1-7-functional-completeness
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Canonical Prettier
        run: >-
          npx prettier --write
          apps/admin/server/inventory/inventoryApproval.ts
          apps/admin/api/admin/inventory.ts
          apps/admin/server/approvals/approvalExecutionRunner.ts
          apps/admin/server/approvals/inventoryApprovalRegistry.test.ts
          apps/admin/src/inventory/AdjustStockSheet.tsx
          apps/admin/src/inventory/InventoryPage.tsx
          apps/admin/src/inventory/useInventory.ts
          packages/admin-contracts/src/inventory.ts
      - name: Commit canonical scoped formatting
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/admin/server/inventory/inventoryApproval.ts apps/admin/api/admin/inventory.ts apps/admin/server/approvals/approvalExecutionRunner.ts apps/admin/server/approvals/inventoryApprovalRegistry.test.ts apps/admin/src/inventory/AdjustStockSheet.tsx apps/admin/src/inventory/InventoryPage.tsx apps/admin/src/inventory/useInventory.ts packages/admin-contracts/src/inventory.ts
            git commit -m "style(admin): canonical inventory approval correction formatting"
            git push
          fi
