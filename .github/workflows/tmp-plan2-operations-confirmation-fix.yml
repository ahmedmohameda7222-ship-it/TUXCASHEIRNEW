name: Temp Plan 2 Operations Confirmation Fix

on:
  push:
    branches:
      - feat/admin-02-catalog-settings

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/admin-02-catalog-settings
      - name: Use canonical PaymentDraft confirmation fields
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('apps/operations/src/app/OrdersCart.tsx'),
              Path('apps/operations/src/app/OnlineOrderInboxPanel.tsx'),
          ]
          total = 0
          for path in paths:
              text = path.read_text()
              count = text.count('manuallyConfirmed')
              if count == 0:
                  raise SystemExit(f'{path}: no confirmation draft fields found')
              path.write_text(text.replace('manuallyConfirmed', 'manualConfirmed'))
              total += count
          print(f'renamed {total} Operations draft confirmation references')
          PY
      - name: Commit canonical draft-field fix
        run: |
          git rm .github/workflows/tmp-plan2-operations-confirmation-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/operations/src/app/OrdersCart.tsx apps/operations/src/app/OnlineOrderInboxPanel.tsx
          git commit -m "fix(plan2): use canonical payment confirmation draft fields"
          git push origin HEAD:feat/admin-02-catalog-settings
