name: PR119 Temporary Catalog Copy Formatter
on:
  push:
    branches: [fix/admin-plans1-7-functional-completeness]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-plans1-7-functional-completeness
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Canonical formatting of Catalog Copy
        run: >-
          npx prettier --write
          apps/admin/api/admin/catalog.ts
          apps/admin/src/catalog/CatalogCopyPanel.tsx
          apps/admin/src/catalog/PublishReviewPage.tsx
      - name: Commit scoped formatter output
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/admin/api/admin/catalog.ts apps/admin/src/catalog/CatalogCopyPanel.tsx apps/admin/src/catalog/PublishReviewPage.tsx
            git commit -m "style(admin): canonical Catalog Copy source formatting"
            git push
          fi
