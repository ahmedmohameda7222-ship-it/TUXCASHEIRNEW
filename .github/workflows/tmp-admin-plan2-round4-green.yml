name: Temporary Admin Plan 2 Round 4 GREEN

on:
  push:
    branches:
      - tmp/admin-plan2-final-review-3-fixes
    paths:
      - '.github/workflows/tmp-admin-plan2-round4-green.yml'

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/admin-plan2-final-review-3-fixes
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Correct non-recurring fixture source
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/test-admin-plan2-round4-hardening.mjs';
          let text = fs.readFileSync(path, 'utf8');
          const from = "'${businessId}', '${shopId}', 3, 3, 'ROLLBACK', '{}'::jsonb, now()";
          const to = "'${businessId}', '${shopId}', 3, 3, 'IMMEDIATE_AVAILABILITY', '{}'::jsonb, now()";
          if (!text.includes(from)) throw new Error('round4 non-recurring fixture anchor missing');
          text = text.replace(from, to);
          fs.writeFileSync(path, text);
          NODE
      - name: Wire Round 4 behavior into permanent scheduler gate
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/test-admin-catalog-scheduler-migration.mjs';
          let text = fs.readFileSync(path, 'utf8');
          const anchor = "const baseMigrationPath = 'supabase/migrations/20260910111000_admin_catalog_scheduler.sql';";
          if (!text.includes(anchor)) throw new Error('scheduler permanent-gate anchor missing');
          if (!text.includes('test-admin-plan2-round4-hardening.mjs')) {
            const wiring = `const round4Result = spawnSync(\n  process.execPath,\n  ['scripts/test-admin-plan2-round4-hardening.mjs'],\n  { env: process.env, encoding: 'utf8' },\n);\nif (round4Result.status !== 0) {\n  process.stderr.write(round4Result.stdout ?? '');\n  process.stderr.write(round4Result.stderr ?? '');\n  process.exit(round4Result.status ?? 1);\n}\nprocess.stdout.write(round4Result.stdout ?? '');\n\n`;
            text = text.replace(anchor, wiring + anchor);
          }
          fs.writeFileSync(path, text);
          NODE
      - name: Format changed files
        run: >-
          npx prettier --write
          apps/admin/src/catalog/finalReviewRound4Regressions.source.test.ts
          apps/admin/src/settings/SettingsPage.tsx
          apps/admin/src/settings/SettingsPage.test.tsx
          apps/admin/server/settings/settingsOperationalState.ts
          packages/admin-contracts/src/settings.ts
          scripts/test-admin-plan2-round4-hardening.mjs
          scripts/test-admin-catalog-scheduler-migration.mjs
      - name: Focused Round 4 regressions
        run: >-
          npx vitest run
          apps/admin/src/catalog/finalReviewRound4Regressions.source.test.ts
          apps/admin/src/catalog/ProductEditor.test.tsx
          apps/admin/src/settings/SettingsPage.test.tsx
          apps/admin/src/settings/useSettings.test.ts
          apps/admin/server/settings/settingsOperationalState.test.ts
          apps/admin/server/settings/settingsService.test.ts
          apps/admin/api/admin/settings.test.ts
      - name: Admin contracts typecheck
        run: npm run typecheck -w @tux/admin-contracts
      - name: Admin API and server typecheck
        run: npx tsc --noEmit -p tsconfig.api.json
      - name: Admin UI typecheck
        run: npm run typecheck -w @tux/admin
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Fresh migration chain
        run: node scripts/test-migrations.mjs
      - name: Permanent scheduler gate including Round 4 behavior
        run: node scripts/test-admin-catalog-scheduler-migration.mjs
      - name: Commit verified non-workflow patch
        run: |
          git add apps/admin/src/settings/SettingsPage.tsx packages/admin-contracts/src/settings.ts scripts/test-admin-plan2-round4-hardening.mjs scripts/test-admin-catalog-scheduler-migration.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(admin): verify final Codex round 4 hardening"
          git push origin HEAD:tmp/admin-plan2-final-review-3-fixes
