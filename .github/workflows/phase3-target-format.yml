name: Phase 3 targeted format repair

on:
  push:
    branches:
      - feat/ops-03-business-day-operator

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/operations-desktop/src/main/session.integration.test.ts apps/operations-desktop/src/preload/sessionResult.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/operations-desktop/src/main/session.integration.test.ts apps/operations-desktop/src/preload/sessionResult.test.ts
          git commit -m "Format Phase 3 validation tests"
          git push
