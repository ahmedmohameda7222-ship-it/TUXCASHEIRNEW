name: Task 5B SQLite WhatsApp GREEN

on:
  push:
    branches:
      - feat/ops-whatsapp-task5b-red

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare SQLite migration/export and Instant typing
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import re
          from pathlib import Path
          migrations = Path('packages/persistence/src/sqlite/migrations.ts')
          text = migrations.read_text()
          if "name: 'whatsapp_local_cache'" not in text:
              marker = "  },\n];\n\nexport function applySqliteMigrations"
              addition = base64.b64decode('').decode()
              if marker not in text:
                  raise SystemExit('SQLite migration insertion marker not found')
              migrations.write_text(text.replace(marker, addition, 1))
          index = Path('packages/persistence/src/sqlite/index.ts')
          index_text = index.read_text()
          export_line = "export { SqliteWhatsAppStore } from './SqliteWhatsAppStore';\n"
          if export_line not in index_text:
              index.write_text(index_text + export_line)

          test = Path('packages/persistence/src/sqlite/SqliteWhatsAppStore.test.ts')
          test_text = test.read_text()
          if '  instant,\n  parseEntityId,' not in test_text:
              test_text = test_text.replace('  parseEntityId,\n', '  instant,\n  parseEntityId,\n', 1)
          test_text = test_text.replace(
              '    lastMessageAt,\n  };',
              '    lastMessageAt: lastMessageAt === null ? null : instant(lastMessageAt),\n  };',
              1,
          )
          test_text = test_text.replace('    createdAt,\n  };', '    createdAt: instant(createdAt),\n  };', 1)
          test_text = re.sub(r"linkedAt: '([^']+)'", r"linkedAt: instant('\1')", test_text)
          test_text = re.sub(r"updatedAt: '([^']+)'", r"updatedAt: instant('\1')", test_text)
          test.write_text(test_text)

          store = Path('packages/persistence/src/sqlite/SqliteWhatsAppStore.ts')
          store_text = store.read_text()
          if "import { instant } from '@tux/domain';" not in store_text:
              store_text = store_text.replace(
                  "import type {\n  ShopId,",
                  "import { instant } from '@tux/domain';\nimport type {\n  ShopId,",
                  1,
              )
          store_text = store_text.replace('      updatedAt: row.updated_at,', '      updatedAt: instant(row.updated_at),', 1)
          store.write_text(store_text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/sqlite/migrations.ts packages/persistence/src/sqlite/index.ts packages/persistence/src/sqlite/SqliteWhatsAppStore.ts packages/persistence/src/sqlite/SqliteWhatsAppStore.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix: type Task 5B SQLite candidate"
            git push origin HEAD:feat/ops-whatsapp-task5b-red
          fi
      - name: Task 5B SQLite tests
        run: npm test -- packages/persistence/src/sqlite/SqliteWhatsAppStore.test.ts
      - name: Existing SQLite Operations regression
        run: npm test -- packages/persistence/src/sqlite/SqliteOperationsDatabase.test.ts
      - name: Persistence typecheck
        run: npm run typecheck -w @tux/persistence
