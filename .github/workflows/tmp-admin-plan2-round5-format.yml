name: Temporary Admin Plan 2 Round 5 Format

on:
  push:
    branches:
      - tmp/admin-plan2-final-review-3-fixes
    paths:
      - '.github/workflows/tmp-admin-plan2-round5-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/admin-plan2-final-review-3-fixes
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/admin/src/catalog/finalReviewRound5Regressions.source.test.ts
      - run: |
          git add apps/admin/src/catalog/finalReviewRound5Regressions.source.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(admin): format round 5 RED regression"
          git push origin HEAD:tmp/admin-plan2-final-review-3-fixes
