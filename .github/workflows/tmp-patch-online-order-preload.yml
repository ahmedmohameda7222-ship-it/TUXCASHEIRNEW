name: Temporary online-order preload patch

on:
  push:
    branches:
      - work/menu-online-orders-integration
    paths:
      - .github/workflows/tmp-patch-online-order-preload.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/menu-online-orders-integration
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Patch preload bridge deterministically
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/operations-desktop/src/preload/index.ts')
          text = path.read_text()

          import_anchor = "import { assertOrderTransitionResult, assertOrdersBoardResult } from './ordersBoardResult';\n"
          import_insert = import_anchor + "import {\n  assertOnlineOrderInboxRequest,\n  assertOnlineOrderInboxSnapshot,\n  assertOnlineOrderInboxVoidResult,\n} from './onlineOrderInboxResult';\n"
          if text.count(import_anchor) != 1:
              raise SystemExit('expected exactly one ordersBoardResult import anchor')
          text = text.replace(import_anchor, import_insert, 1)

          channel_anchor = "const IPC_END_DAY_CLOSE = 'tux:end-day:close';\n"
          channel_insert = channel_anchor + "const IPC_ONLINE_ORDERS_LOAD = 'tux:online-orders:load';\nconst IPC_ONLINE_ORDERS_CLAIM = 'tux:online-orders:claim';\nconst IPC_ONLINE_ORDERS_RELEASE = 'tux:online-orders:release';\nconst IPC_ONLINE_ORDERS_REJECT = 'tux:online-orders:reject';\nconst IPC_ONLINE_ORDERS_CHANGED = 'tux:online-orders:changed';\n"
          if text.count(channel_anchor) != 1:
              raise SystemExit('expected exactly one end-day channel anchor')
          text = text.replace(channel_anchor, channel_insert, 1)

          api_anchor = "  whatsapp: Object.freeze({\n"
          api_insert = """  onlineOrders: Object.freeze({
            load: async () =>
              assertOnlineOrderInboxSnapshot((await ipcRenderer.invoke(IPC_ONLINE_ORDERS_LOAD)) as unknown),
            claim: async (requestId: string) =>
              assertOnlineOrderInboxRequest(
                (await ipcRenderer.invoke(IPC_ONLINE_ORDERS_CLAIM, { requestId })) as unknown,
              ),
            release: async (requestId: string, processingOrderId: string) =>
              assertOnlineOrderInboxRequest(
                (await ipcRenderer.invoke(IPC_ONLINE_ORDERS_RELEASE, {
                  requestId,
                  processingOrderId,
                })) as unknown,
              ),
            reject: async (requestId: string, processingOrderId: string, reason: string) =>
              assertOnlineOrderInboxVoidResult(
                (await ipcRenderer.invoke(IPC_ONLINE_ORDERS_REJECT, {
                  requestId,
                  processingOrderId,
                  reason,
                })) as unknown,
              ),
            subscribe: (listener: Parameters<TuxDesktopApi['onlineOrders']['subscribe']>[0]) => {
              const wrapper = (_event: IpcRendererEvent, value: unknown): void => {
                listener(assertOnlineOrderInboxSnapshot(value));
              };
              ipcRenderer.on(IPC_ONLINE_ORDERS_CHANGED, wrapper);
              return () => ipcRenderer.removeListener(IPC_ONLINE_ORDERS_CHANGED, wrapper);
            },
          }),
          """ + api_anchor
          if text.count(api_anchor) != 1:
              raise SystemExit('expected exactly one WhatsApp API anchor')
          text = text.replace(api_anchor, api_insert, 1)

          path.write_text(text)
          PY
      - name: Format touched files
        run: npx prettier --write apps/operations-desktop/src/preload/index.ts apps/operations-desktop/src/preload/onlineOrderInboxResult.ts packages/platform-contracts/index.d.ts
      - name: Verify focused contracts
        run: npx vitest run apps/operations-desktop/src/preload/onlineOrderInboxBridge.test.ts apps/operations-desktop/src/main/onlineOrderInboxIpc.test.ts
      - name: Commit implementation
        run: |
          git config user.name "ahmedmohameda7222-ship-it"
          git config user.email "ahmed.mohameda7222@gmail.com"
          git add apps/operations-desktop/src/preload/index.ts apps/operations-desktop/src/preload/onlineOrderInboxResult.ts packages/platform-contracts/index.d.ts
          git diff --cached --check
          git commit -m "feat(desktop): expose online-order inbox preload bridge"
          git push origin HEAD:work/menu-online-orders-integration
