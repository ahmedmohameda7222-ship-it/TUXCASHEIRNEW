name: Task 6C RED
on:
  push:
    branches: [feat/ops-whatsapp-task6c-red]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Add desktop remote test before module
        run: |
          cat > apps/operations-desktop/src/main/desktopWhatsAppRemote.test.ts <<'EOF'
          import { describe, expect, it, vi } from 'vitest';
          import {
            DesktopWhatsAppRemote,
            parseTuxOperationsApiOrigin,
          } from './desktopWhatsAppRemote';

          describe('DesktopWhatsAppRemote', () => {
            it('requires an HTTPS origin-only API base', () => {
              expect(parseTuxOperationsApiOrigin('https://ops.example')).toBe('https://ops.example');
            });

            it('captures only the allowed Desktop authority headers and application mutation claims', async () => {
              const sessionManager = {
                resolveSession: vi.fn().mockResolvedValue({
                  status: 'VALID',
                  session: {
                    shopId: '11111111-1111-4111-8111-111111111111',
                    deviceId: '22222222-2222-4222-8222-222222222222',
                    accessToken: 'short-lived-access',
                    refreshToken: 'must-not-leak',
                    expiresAt: 2_000_000_000,
                  },
                }),
              };
              const fetcher = vi.fn().mockResolvedValue(
                new Response(JSON.stringify({
                  conversations: [], messages: [], quickReplies: [], orderLinks: [], nextCursor: null,
                }), { status: 200 }),
              );
              const remote = new DesktopWhatsAppRemote({
                apiOrigin: 'https://ops.example',
                sessionManager: sessionManager as never,
                fetcher,
              });
              await remote.loadInbox();
              expect(fetcher).toHaveBeenCalledTimes(1);
            });
          });
          EOF
      - name: Expected module-missing RED
        run: npm test -- apps/operations-desktop/src/main/desktopWhatsAppRemote.test.ts
