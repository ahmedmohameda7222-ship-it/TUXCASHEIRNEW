name: Task 15 browser contract commit

on:
  push:
    branches:
      - 'ui/tux-pos-refinement'

permissions:
  contents: write

concurrency:
  group: task15-browser-contracts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  commit-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply approved browser contract updates
        run: |
          python scripts/task15_visual_qa.py
          npx prettier --write e2e/operations.e2e.ts
      - name: E2E typecheck
        run: npm run typecheck:e2e
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify corrected flow contracts
        run: >-
          npx playwright test e2e/operations.e2e.ts
          --retries=0
          --grep "Operations V2 full browser-fallback workflow stays durable and responsive|category persistence failure keeps editor and draft intact"
      - name: Commit permanent browser contracts
        shell: bash
        run: |
          changed="$(git status --short --untracked-files=no | awk '{print $2}')"
          if [ -z "$changed" ]; then
            echo 'Browser contracts already applied.'
            exit 0
          fi
          test "$changed" = "e2e/operations.e2e.ts" || { echo "Unexpected tracked diff: $changed"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/operations.e2e.ts
          git commit -m 'test: align POS browser contracts with approved refinement'
          git push origin HEAD:ui/tux-pos-refinement
