name: Task 5D WhatsApp Application GREEN

on:
  push:
    branches:
      - feat/ops-whatsapp-task5d-red

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply Task 5D implementation
        run: |
          node scripts/task5d-apply-whatsapp-service.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/application/src/whatsapp.ts \
            packages/application/src/whatsappRemote.ts \
            packages/application/src/index.ts \
            apps/operations/src/app/browserWhatsAppRemote.ts \
            apps/operations/src/app/browserWhatsAppRemote.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "feat: add WhatsApp application service candidate"
            git push origin HEAD:feat/ops-whatsapp-task5d-red
          fi
      - name: Task 5D application GREEN
        run: npm test -- packages/application/src/whatsapp.test.ts
      - name: Browser WhatsApp remote regression
        run: npm test -- apps/operations/src/app/browserWhatsAppRemote.test.ts
      - name: Application typecheck
        run: npm run typecheck -w @tux/application
      - name: Operations typecheck
        run: npm run typecheck -w @tux/operations
