name: Reports export final format
on:
  push:
    branches:
      - feat/admin-reports-r1-r5-report-first-20261029
    paths:
      - .github/workflows/reports-export-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx prettier --write apps/admin/server/reports/reportApi.ts apps/admin/server/reports/reportPdfExport.test.ts apps/admin/server/reports/reportPdfRenderer.test.ts apps/admin/server/reports/reportPdfRenderer.ts apps/admin/src/reports/ReportExportActions.test.tsx apps/admin/src/reports/ReportExportActions.tsx apps/admin/src/reports/ReportsPage.tsx e2e/admin-reports.spec.ts
      - name: Commit formatted report export files
        run: |
          if ! git diff --quiet -- apps/admin/server/reports apps/admin/src/reports e2e/admin-reports.spec.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/admin/server/reports/reportApi.ts apps/admin/server/reports/reportPdfExport.test.ts apps/admin/server/reports/reportPdfRenderer.test.ts apps/admin/server/reports/reportPdfRenderer.ts apps/admin/src/reports/ReportExportActions.test.tsx apps/admin/src/reports/ReportExportActions.tsx apps/admin/src/reports/ReportsPage.tsx e2e/admin-reports.spec.ts
            git commit -m "style(reports): format PDF export implementation"
            git push
          fi
