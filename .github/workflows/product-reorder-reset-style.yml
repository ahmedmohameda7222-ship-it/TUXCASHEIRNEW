name: Product Reorder Reset Style

on:
  push:
    branches:
      - feat/apple-product-card-reorder

jobs:
  apply-style:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/apple-product-card-reorder
      - name: Apply quiet Reset styling
        shell: bash
        run: |
          python3 -c "from pathlib import Path; import base64; p=Path('apps/operations/src/styles/final-pos-corrections.css'); s=p.read_text(); old=base64.b64decode('LnByb2R1Y3QtcmVvcmRlci1hY3Rpb25zID4gLnRleHQtYWN0aW9uLAoucHJvZHVjdC1yZW9yZGVyLWFjdGlvbnMtcHJpbWFyeSA+IGJ1dHRvbiB7CiAgbWluLWhlaWdodDogNDRweDsKfQ==').decode(); new=base64.b64decode('').decode(); assert s.count(old)==1, 'Reset styling source block mismatch'; p.write_text(s.replace(old,new))"
          git diff --check
          git rm .github/workflows/product-reorder-reset-style.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/operations/src/styles/final-pos-corrections.css
          git commit -m "style: polish product reorder Reset action"
          git push origin HEAD:feat/apple-product-card-reorder
