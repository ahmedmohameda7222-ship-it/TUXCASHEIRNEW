name: Temp Plan 2 Green V3

on:
  push:
    branches:
      - tmp/admin-plan2-final-review-2-fixes

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/admin-plan2-final-review-2-fixes
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Apply isolated patch
        run: python scripts/tmp_plan2_green_patch.py
      - name: Install locked dependencies
        run: npm ci
      - name: Format touched sources
        run: >-
          npx prettier --write
          packages/domain/src/orderDraftParser.ts
          packages/application/src/orders.ts
          packages/domain/src/syncContract.ts
          apps/operations/src/app/OrdersCart.tsx
          apps/operations/src/app/OnlineOrderInboxPanel.tsx
          packages/application/src/ordersBoard.ts
          apps/operations/src/app/OrdersBoardWorkspace.tsx
          packages/application/src/nonDeliveryPhonePersistence.test.ts
          apps/admin/src/settings/useSettings.test.ts
          scripts/test-admin-plan2-second-review-hardening.mjs
      - name: Focused review regressions
        run: >-
          npx vitest run
          packages/application/src/nonDeliveryPhonePersistence.test.ts
          packages/domain/src/catalogSafePriceBoundary.test.ts
          packages/domain/src/orderReturnReason.test.ts
          packages/domain/src/paymentManualConfirmation.test.ts
          apps/admin/src/settings/useSettings.casCapture.test.ts
          apps/admin/src/settings/useSettings.test.ts
      - name: Commit validated green patch
        run: |
          git rm .github/workflows/tmp-plan2-green-v3.yml
          git rm scripts/tmp_plan2_green_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(plan2): close fresh review authority gaps"
          git push origin HEAD:tmp/admin-plan2-final-review-2-fixes
