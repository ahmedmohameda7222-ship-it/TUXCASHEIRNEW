name: Task 4 boundary patch

on:
  push:
    branches:
      - 'work/menu-online-orders-integration'
    paths:
      - '.github/workflows/task4-boundary-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Patch trusted acceptance composition
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing patch anchor in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'apps/operations-desktop/src/main/index.ts',
              '  OperationsConfigurationSyncService,\n  OperationsOnlineOrderInboxService,',
              '  OperationsConfigurationSyncService,\n  OperationsOnlineOrderAcceptanceService,\n  OperationsOnlineOrderInboxService,',
          )
          replace_once(
              'apps/operations-desktop/src/main/index.ts',
              '  onlineOrderInboxIpcRuntime = new OnlineOrderInboxIpcRuntime({ service: onlineOrderInboxService });\n',
              '',
          )
          replace_once(
              'apps/operations-desktop/src/main/index.ts',
              "  ordersService = new OperationsOrdersService(\n    operationsDatabase,\n    operatorReadModel,\n    orderDraftStore,\n    runtime,\n    coordinator,\n    new ElectronOrderPrinter(),\n  );\n",
              "  ordersService = new OperationsOrdersService(\n    operationsDatabase,\n    operatorReadModel,\n    orderDraftStore,\n    runtime,\n    coordinator,\n    new ElectronOrderPrinter(),\n  );\n  onlineOrderInboxIpcRuntime = new OnlineOrderInboxIpcRuntime({\n    service: onlineOrderInboxService,\n    acceptance: new OperationsOnlineOrderAcceptanceService(ordersService, runtime),\n  });\n",
          )

          replace_once(
              'apps/operations-desktop/src/preload/index.ts',
              "const IPC_ONLINE_ORDERS_REJECT = 'tux:online-orders:reject';\n",
              "const IPC_ONLINE_ORDERS_REJECT = 'tux:online-orders:reject';\nconst IPC_ONLINE_ORDERS_ACCEPT = 'tux:online-orders:accept';\n",
          )
          replace_once(
              'apps/operations-desktop/src/preload/index.ts',
              "    subscribe: (listener: Parameters<TuxDesktopApi['onlineOrders']['subscribe']>[0]) => {\n",
              "    accept: async (\n      request: Parameters<TuxDesktopApi['onlineOrders']['accept']>[0],\n      confirmation: Parameters<TuxDesktopApi['onlineOrders']['accept']>[1],\n    ) =>\n      assertOrderPlacementResult(\n        (await ipcRenderer.invoke(IPC_ONLINE_ORDERS_ACCEPT, { request, confirmation })) as unknown,\n      ),\n    subscribe: (listener: Parameters<TuxDesktopApi['onlineOrders']['subscribe']>[0]) => {\n",
          )

          replace_once(
              'apps/operations/src/app/sessionClient.ts',
              '  OperationsEndDayService,\n  OperationsExpensesService,',
              '  OperationsEndDayService,\n  OperationsExpensesService,\n  OperationsOnlineOrderAcceptanceService,',
          )
          anchor = 'export function createOperationsOrdersClient(): OperationsOrdersClient {\n'
          helper = "export function createOperationsOnlineOrderAcceptanceClient(): Pick<\n  OperationsOnlineOrderAcceptanceService,\n  'accept'\n> {\n  const desktop = window.tuxDesktop?.onlineOrders;\n  if (desktop !== undefined) return desktop;\n  return {\n    accept: async (request, confirmation) => {\n      const runtime = await browserRuntime();\n      return new OperationsOnlineOrderAcceptanceService(\n        runtime.orders,\n        { now: () => instant(new Date()), createUuid: () => crypto.randomUUID() },\n      ).accept(request, confirmation);\n    },\n  };\n}\n\n"
          replace_once('apps/operations/src/app/sessionClient.ts', anchor, helper + anchor)

          Path('.github/workflows/task4-boundary-patch.yml').unlink()
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/operations-desktop/src/main/index.ts apps/operations-desktop/src/preload/index.ts apps/operations/src/app/sessionClient.ts .github/workflows/task4-boundary-patch.yml
          git commit -m 'feat(orders): wire online-order acceptance boundaries'
          git push origin HEAD:work/menu-online-orders-integration
