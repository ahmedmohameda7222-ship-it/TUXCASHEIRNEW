name: Admin Completeness Temporary Formatting
on:
  push:
    branches: [fix/admin-plans1-7-functional-completeness]
permissions:
  contents: write
concurrency:
  group: admin-completeness-format
  cancel-in-progress: true
jobs:
  prettier:
    if: github.event.head_commit.message != 'chore(admin): format functional completeness changes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only changed tracked TypeScript, CSS, JSON and YAML files
        shell: bash
        run: |
          git diff --name-only --diff-filter=ACM -z origin/main...HEAD |
            grep -z -E '\.(ts|tsx|mjs|css|json|yml)$' |
            xargs -0 -r npx prettier --write
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apps packages scripts e2e .github 2>/dev/null || true
            git commit -m 'chore(admin): format functional completeness changes'
            git push origin HEAD:fix/admin-plans1-7-functional-completeness
          fi
