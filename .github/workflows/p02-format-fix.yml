name: P02 Formatting Correction
on:
  push:
    branches:
      - feat/admin-premium-p02-catalog-settings
permissions:
  contents: write
jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-premium-p02-catalog-settings
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format exact files
        run: npx prettier --write apps/admin/src/settings/SettingOverrideEditor.tsx e2e/admin-settings.spec.ts apps/admin/src/catalog/catalog.css
      - name: Commit formatter changes
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add apps/admin/src/settings/SettingOverrideEditor.tsx e2e/admin-settings.spec.ts apps/admin/src/catalog/catalog.css
          if ! git diff --cached --quiet; then
            git commit -m "style(admin): format P02 final corrections"
            git push
          fi
