name: Task 4B WhatsApp Gateway GREEN

on:
  push:
    branches:
      - feat/ops-whatsapp-task4b-compile-red

jobs:
  green:
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Task 4B gateway GREEN
        run: npm test -- server/whatsappOperationsGateway.test.ts
      - name: Task 4B gateway typecheck
        run: npm run typecheck
