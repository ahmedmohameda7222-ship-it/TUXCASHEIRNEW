name: Task 4B WhatsApp Shared Contract GREEN

on:
  push:
    branches:
      - feat/ops-whatsapp-task4b-compile-red

jobs:
  green:
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Task 4B shared contract compile GREEN
        run: npm run typecheck -w @tux/application
      - name: Task 4B shared contract runtime GREEN
        run: npm test -- packages/application/src/whatsappRemote.test.ts
