name: Task 4B WhatsApp Data Config RED

on:
  push:
    branches:
      - feat/ops-whatsapp-task4b-compile-red

jobs:
  red:
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Task 4B data-plane config RED
        run: npm test -- server/whatsappServerConfig.test.ts
