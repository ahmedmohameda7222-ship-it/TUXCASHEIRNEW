name: Task 4B WhatsApp Combined GREEN

on:
  push:
    branches:
      - feat/ops-whatsapp-task4b-compile-red

jobs:
  green:
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Task 4B focused GREEN
        run: |
          npm test -- \
            packages/application/src/whatsappRemote.test.ts \
            server/whatsappServerConfig.test.ts \
            server/whatsappOperationsRepository.test.ts \
            server/whatsappOperationsGateway.test.ts
      - name: Task 4B typecheck
        run: npm run typecheck
      - name: Task 4B lint
        run: npm run lint
