name: Temporary Vercel ESM Normalizer

on:
  push:
    branches:
      - fix/vercel-runtime-esm-package-boundary

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/vercel-runtime-esm-package-boundary
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Normalize reachable ESM relative imports
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const ROOT = process.cwd();
          const START = path.join(ROOT, 'apps', 'operations', 'api');
          const packageTypeCache = new Map();

          function collectTsFiles(directory) {
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const absolute = path.join(directory, entry.name);
              if (entry.isDirectory()) return collectTsFiles(absolute);
              return entry.isFile() && entry.name.endsWith('.ts') ? [absolute] : [];
            });
          }

          function packageTypeFor(file) {
            let directory = path.dirname(file);
            while (directory.startsWith(ROOT)) {
              if (packageTypeCache.has(directory)) return packageTypeCache.get(directory);
              const packageJson = path.join(directory, 'package.json');
              if (fs.existsSync(packageJson)) {
                const parsed = JSON.parse(fs.readFileSync(packageJson, 'utf8'));
                const type = parsed.type === 'module' ? 'module' : 'commonjs';
                packageTypeCache.set(directory, type);
                return type;
              }
              const parent = path.dirname(directory);
              if (parent === directory) break;
              directory = parent;
            }
            return 'commonjs';
          }

          function sourceTarget(importer, specifier) {
            if (!specifier.startsWith('.')) return null;
            const resolved = path.resolve(path.dirname(importer), specifier);
            if (/\.(?:js|mjs|cjs|json)$/.test(specifier)) {
              if (specifier.endsWith('.js')) {
                const ts = `${resolved.slice(0, -3)}.ts`;
                return fs.existsSync(ts) ? ts : null;
              }
              return null;
            }
            const direct = `${resolved}.ts`;
            if (fs.existsSync(direct)) return direct;
            const index = path.join(resolved, 'index.ts');
            return fs.existsSync(index) ? index : null;
          }

          function runtimeSpecifier(importer, specifier) {
            if (!specifier.startsWith('.') || /\.(?:js|mjs|cjs|json)$/.test(specifier)) {
              return specifier;
            }
            const resolved = path.resolve(path.dirname(importer), specifier);
            if (fs.existsSync(`${resolved}.ts`)) return `${specifier}.js`;
            if (fs.existsSync(path.join(resolved, 'index.ts'))) {
              return `${specifier.replace(/\/$/, '')}/index.js`;
            }
            return specifier;
          }

          function specifiers(source) {
            const values = [];
            for (const pattern of [
              /(?:import|export)\s+(?:type\s+)?(?:[^'\"]*?\sfrom\s*)?['\"]([^'\"]+)['\"]/g,
              /import\(\s*['\"]([^'\"]+)['\"]\s*\)/g,
            ]) {
              for (const match of source.matchAll(pattern)) if (match[1]) values.push(match[1]);
            }
            return values;
          }

          const queue = collectTsFiles(START);
          const visited = new Set();
          const changed = new Set();

          while (queue.length) {
            const file = queue.shift();
            if (!file || visited.has(file)) continue;
            visited.add(file);

            let source = fs.readFileSync(file, 'utf8');
            const original = source;
            const esm = packageTypeFor(file) === 'module';
            const before = specifiers(source);

            for (const specifier of before) {
              const target = sourceTarget(file, specifier);
              if (target && !visited.has(target)) queue.push(target);
              if (!esm) continue;
              const replacement = runtimeSpecifier(file, specifier);
              if (replacement === specifier) continue;
              source = source.split(`'${specifier}'`).join(`'${replacement}'`);
              source = source.split(`"${specifier}"`).join(`"${replacement}"`);
            }

            if (source !== original) {
              fs.writeFileSync(file, source);
              changed.add(path.relative(ROOT, file).split(path.sep).join('/'));
            }
          }

          console.log(`Normalized ${changed.size} reachable ESM modules.`);
          for (const file of [...changed].sort()) console.log(`- ${file}`);
          NODE
      - name: Verify only runtime TypeScript files changed
        shell: bash
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(api|server)/.*\.ts$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected codemod changes:"
            echo "$unexpected"
            exit 1
          fi
      - name: Verify ESM import graph
        run: node scripts/test-operations-vercel-esm-imports.mjs
      - name: Commit normalized imports
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No normalization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api server
          git commit -m "fix(vercel): normalize root runtime ESM imports"
          git push origin HEAD:fix/vercel-runtime-esm-package-boundary
