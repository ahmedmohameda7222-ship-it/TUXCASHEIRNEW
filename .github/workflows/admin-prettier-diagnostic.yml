name: Admin Prettier Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/admin-prettier-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  print-formatted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print canonical formatted files
        shell: bash
        run: |
          for file in \
            apps/admin/src/catalog/AvailabilityStatus.tsx \
            apps/admin/src/catalog/ProductEditor.tsx \
            apps/admin/src/catalog/ProductInspector.tsx \
            apps/admin/src/catalog/ProductList.tsx \
            apps/admin/src/catalog/useCatalog.ts \
            packages/admin-contracts/src/catalog.ts; do
            echo "=====BEGIN:${file}====="
            npx prettier "${file}"
            echo "=====END:${file}====="
          done
