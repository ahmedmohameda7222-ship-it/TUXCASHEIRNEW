name: Phase 7 Validation Gate

on:
  push:
    branches:
      - feat/ops-07-bulk-stock
    paths:
      - '.phase7-validate-temp.trigger'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ops-07-bulk-stock
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Run permanent checks and record result
        shell: bash
        run: |
          set +e
          npm ci > /tmp/phase7.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            for command in 'npm run format:check' 'npm run lint' 'npm run typecheck' 'npm run test' 'npm run build'
            do
              echo "===== $command =====" >> /tmp/phase7.log
              bash -lc "$command" >> /tmp/phase7.log 2>&1
              status=$?
              if [ "$status" -ne 0 ]; then
                break
              fi
            done
          fi
          if [ "$status" -eq 0 ]; then
            printf 'PASS\n' > .phase7-validation-result.txt
          else
            { printf 'FAIL\n\n'; tail -n 320 /tmp/phase7.log; } > .phase7-validation-result.txt
          fi
      - name: Remove temporary gate
        run: |
          rm -f .phase7-validate-temp.trigger .github/workflows/phase7-validate-temp.yml
      - name: Commit validation result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record Phase 7 validation result'
          git push origin HEAD:feat/ops-07-bulk-stock
