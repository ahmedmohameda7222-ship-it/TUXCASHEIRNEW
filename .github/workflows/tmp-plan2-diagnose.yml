      - name: Count Orders Board matcher blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('apps/operations/src/app/OrdersBoardWorkspace.tsx').read_text()
          checks = {
            'submission': """type CancellationSubmission = {
            readonly foodPrepared: boolean;
