          };
          """,
            'state': """  const [cancellationReasons, setCancellationReasons] = useState<
            readonly CancellationReasonOption[]
          >([]);
            const [tab, setTab] = useState<BoardTab>('ACTIVE');
          """,
            'refresh': """    setCancellationReasonMode(result.value.cancellationReasonMode);
            setCancellationReasons(result.value.cancellationReasons);
            setError(null);
          """,
            'return-invocation': """      <ReturnDialog
                order={returnTarget}
                busy={busy}
                onClose={() => setReturnTarget(null)}
                onConfirm={async (reason) => {
                  const changed = await mutate(
                    () => client.returnDelivery({ orderId: returnTarget.id, reason }),
