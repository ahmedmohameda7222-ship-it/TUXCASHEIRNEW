name: Task 8E UI3 Electron RED Materializer

on:
  push:
    branches:
      - work/operations-whatsapp-inbox-live
    paths:
      - .github/workflows/task8e-ui3-electron-red-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact Electron RED tree
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .recovery/ui3-electron-red.patch.gz.b64 | gzip -d > /tmp/ui3-electron-red.patch
          test "$(sha256sum /tmp/ui3-electron-red.patch | awk '{print $1}')" = "de26a6d44c6a02199a59a66fe651fabeef843b3d45591bd7b302c142e26c632e"
          git rm .recovery/ui3-electron-red.patch.gz.b64 .github/workflows/task8e-ui3-electron-red-materialize.yml
          git apply --index /tmp/ui3-electron-red.patch
          test "$(git write-tree)" = "73f079b03d0cef815b81320100cb93866a741ca6"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'wip(task8e): red electron messaging policy transport'
          git push origin HEAD:work/operations-whatsapp-inbox-live
