name: Temporary Orders O2 Prettier diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/orders-o2-format-diagnostic.yml'
      - 'apps/admin/src/orders/OrdersPage.tsx'

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Print exact formatter patch without committing
        run: |
          npx prettier --write apps/admin/src/orders/OrdersPage.tsx
          git diff --no-ext-diff --unified=3 -- apps/admin/src/orders/OrdersPage.tsx
          echo 'ORDERS_O2_PRETTIER_DIAGNOSTIC_FINISHED'
