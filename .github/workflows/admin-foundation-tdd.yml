name: Admin Foundation TDD

on:
  pull_request:
    paths:
      - '.github/workflows/admin-foundation-tdd.yml'
      - 'apps/admin/**'
      - 'packages/admin-contracts/**'
      - 'scripts/test-admin-*.mjs'
      - 'supabase/migrations/*admin*.sql'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'

permissions:
  contents: read

jobs:
  migration-invariant:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Admin business/auth migration invariant
        run: node scripts/test-admin-business-auth-migration.mjs

  migration-smoke:
    runs-on: ubuntu-24.04
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Migration-chain smoke
        run: node scripts/test-migrations.mjs
      - name: Admin business/auth migration invariant
        run: node scripts/test-admin-business-auth-migration.mjs

  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Admin contract tests
        run: npx vitest run packages/admin-contracts/src/auth.test.ts
      - name: Admin contracts typecheck
        run: npx tsc --noEmit -p packages/admin-contracts/tsconfig.json
