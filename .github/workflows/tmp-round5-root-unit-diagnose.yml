name: TMP Round 5 root unit diagnose

on:
  push:
    branches:
      - tmp/admin-plan2-final-review-3-fixes

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run root unit suite and print compact failure evidence
        shell: bash
        run: |
          set +e
          npm run test > /tmp/vitest.log 2>&1
          status=$?
          set -e
          echo "vitest_exit=$status"
          echo '--- compact failure evidence ---'
          grep -n -E 'FAIL|Failed Tests|AssertionError|expected|received|Test Files|Tests|Error:' /tmp/vitest.log | tail -n 160 || true
          echo '--- context around failing tests ---'
          awk '
            /FAIL|Failed Tests|AssertionError/ { remaining=35 }
            remaining > 0 { print; remaining-- }
          ' /tmp/vitest.log | tail -n 220 || true
          exit "$status"
