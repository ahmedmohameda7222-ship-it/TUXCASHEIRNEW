name: Temporary E2E Format

on:
  push:
    branches:
      - ui/current-order-rounded-section-cards
    paths:
      - '.github/workflows/temporary-format-e2e.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/current-order-rounded-section-cards
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format rendered QA contract
        run: npx prettier --write e2e/operations.e2e.ts
      - name: Commit formatting only
        shell: bash
        run: |
          git diff --check
          test -n "$(git status --porcelain -- e2e/operations.e2e.ts)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/operations.e2e.ts
          git commit -m 'style: format rendered QA contract'
          git push origin HEAD:ui/current-order-rounded-section-cards
