name: Temporary order intake lock generator

on:
  push:
    branches:
      - work/menu-online-orders-integration

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build minimal workspace lockfile from last permanent GREEN authority
        run: |
          git show f9c49a1e21d0d3025c4f8088a98b86db82d798fb:package-lock.json > package-lock.json
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package-lock.json';
          let lock = fs.readFileSync(path, 'utf8');
          const linkNeedle = `    "node_modules/@tux/operations-desktop": {\n      "resolved": "apps/operations-desktop",\n      "link": true\n    },\n    "node_modules/@tux/persistence": {`;
          const linkReplacement = `    "node_modules/@tux/operations-desktop": {\n      "resolved": "apps/operations-desktop",\n      "link": true\n    },\n    "node_modules/@tux/order-intake-contracts": {\n      "resolved": "packages/order-intake-contracts",\n      "link": true\n    },\n    "node_modules/@tux/persistence": {`;
          const packageNeedle = `    "packages/domain": {\n      "name": "@tux/domain",\n      "version": "0.0.0"\n    },\n    "packages/persistence": {`;
          const packageReplacement = `    "packages/domain": {\n      "name": "@tux/domain",\n      "version": "0.0.0"\n    },\n    "packages/order-intake-contracts": {\n      "name": "@tux/order-intake-contracts",\n      "version": "0.0.0"\n    },\n    "packages/persistence": {`;
          if (!lock.includes(linkNeedle) || !lock.includes(packageNeedle)) {
            throw new Error('expected lockfile anchors not found');
          }
          lock = lock.replace(linkNeedle, linkReplacement).replace(packageNeedle, packageReplacement);
          fs.writeFileSync(path, lock);
          NODE
      - name: Verify generated lockfile with npm ci
        run: npm ci --ignore-scripts
      - name: Verify lockfile diff is minimal
        run: |
          git diff --check -- package-lock.json
          test "$(git diff --numstat f9c49a1e21d0d3025c4f8088a98b86db82d798fb -- package-lock.json | awk '{print $1":"$2}')" = "8:0"
      - name: Commit minimal lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(orders): minimize order intake workspace lockfile"
          git push origin HEAD:work/menu-online-orders-integration
