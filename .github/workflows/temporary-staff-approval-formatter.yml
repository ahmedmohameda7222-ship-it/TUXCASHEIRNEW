name: Temporary Staff approval formatter
on:
  pull_request:
    paths:
      - 'apps/admin/src/staff/StaffPage.tsx'
      - 'apps/admin/src/staff/StaffPaymentPage.tsx'
      - 'e2e/admin-workforce.spec.ts'
      - '.github/workflows/temporary-staff-approval-formatter.yml'
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply exact Prettier to staff approval changes
        run: |
          npx prettier --write \
            apps/admin/src/staff/StaffPage.tsx \
            apps/admin/src/staff/StaffPaymentPage.tsx \
            e2e/admin-workforce.spec.ts
          for file in \
            apps/admin/src/staff/StaffPage.tsx \
            apps/admin/src/staff/StaffPaymentPage.tsx \
            e2e/admin-workforce.spec.ts
          do
            echo "===FORMATTED_START:${file}==="
            cat "${file}"
            echo
            echo "===FORMATTED_END:${file}==="
          done
