name: Admin One-Shot Format

on:
  pull_request:
    paths:
      - '.github/workflows/admin-format-fix.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format Admin implementation and tests
        run: >-
          npx prettier --write
          apps/admin/**/*.{ts,tsx,css,html,json}
          e2e/admin-auth.spec.ts
          e2e/admin-shell.spec.ts
          scripts/test-admin-*.mjs
          playwright.admin.config.ts
          .github/workflows/admin-foundation-tdd.yml
          .github/workflows/ci.yml
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/admin-format-fix.yml
          git add apps/admin e2e/admin-auth.spec.ts e2e/admin-shell.spec.ts scripts/test-admin-*.mjs playwright.admin.config.ts .github/workflows/admin-foundation-tdd.yml .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(admin): apply repository formatting'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
