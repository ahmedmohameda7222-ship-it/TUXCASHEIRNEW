name: Admin P01 scoped formatting
on:
  push:
    branches:
      - feat/admin-premium-p01-dashboard-navigation
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  format-p01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format approved P01 files
        run: |
          npx prettier --write apps/admin/src/dashboard/HomeDashboard.tsx apps/admin/src/dashboard/homeDashboard.css apps/admin/src/components/shell/MobileTabBar.tsx apps/admin/src/app/routes.tsx e2e/admin-dashboard.spec.ts e2e/admin-shell.spec.ts
      - name: Apply formatting to P01 branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/admin-premium-p01-dashboard-navigation'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/admin/src/dashboard/HomeDashboard.tsx apps/admin/src/dashboard/homeDashboard.css apps/admin/src/components/shell/MobileTabBar.tsx apps/admin/src/app/routes.tsx e2e/admin-dashboard.spec.ts e2e/admin-shell.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(admin-p01): apply canonical formatter to approved Dashboard and nav files'
            git push origin HEAD:refs/heads/feat/admin-premium-p01-dashboard-navigation
          fi
