name: Phase 9 Final Validation Gate

on:
  push:
    branches:
      - feat/ops-09-sync
    paths:
      - '.phase9-validate-final.trigger'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ops-09-sync
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Run complete permanent suite
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Remove temporary validation helper
        run: |
          rm -f .phase9-validate-final.trigger .github/workflows/phase9-validate-final.yml
      - name: Commit clean validated tree and passed gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Validate Phase 9 automatic sync'
          git push origin HEAD:feat/ops-09-sync
          git push --force origin HEAD:refs/heads/gate/ops-09-sync-passed
