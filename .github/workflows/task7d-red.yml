name: Task 7D RED

on:
  push:
    branches:
      - feat/ops-whatsapp-task7d-red

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Task 7D expected product-integration RED
        run: npm test -- apps/operations/src/app/App.whatsapp.test.tsx
