name: Plan 4 Task 3 Exact Prettier

on:
  push:
    branches:
      - feat/admin-04-inventory-purchasing
    paths:
      - '.github/workflows/prettier-plan4-task3.yml'

jobs:
  exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Render exact Task 3 files
        run: |
          npx prettier --write "apps/admin/api/admin/inventory.ts" "apps/admin/src/inventory/AdjustStockSheet.tsx" "apps/admin/src/inventory/InventoryItemPage.tsx" "apps/admin/src/inventory/RecordWasteSheet.tsx" "apps/admin/src/inventory/TransferPage.tsx"
          echo "FILE_0_BEGIN"
          base64 -w0 "apps/admin/api/admin/inventory.ts"
          echo
          echo "FILE_0_END"
          echo "FILE_1_BEGIN"
          base64 -w0 "apps/admin/src/inventory/AdjustStockSheet.tsx"
          echo
          echo "FILE_1_END"
          echo "FILE_2_BEGIN"
          base64 -w0 "apps/admin/src/inventory/InventoryItemPage.tsx"
          echo
          echo "FILE_2_END"
          echo "FILE_3_BEGIN"
          base64 -w0 "apps/admin/src/inventory/RecordWasteSheet.tsx"
          echo
          echo "FILE_3_END"
          echo "FILE_4_BEGIN"
          base64 -w0 "apps/admin/src/inventory/TransferPage.tsx"
          echo
          echo "FILE_4_END"
