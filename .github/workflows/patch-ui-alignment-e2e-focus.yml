name: Patch TUX UI alignment E2E focus lifecycle

on:
  push:
    branches:
      - ui/tux-input-alignment-fixes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/tux-input-alignment-fixes
          fetch-depth: 0
      - name: Patch rendered focus helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/operations.e2e.ts')
          text = path.read_text()
          old = """    await expect
      .poll(async () => wrapper.evaluate((node) => getComputedStyle(node).boxShadow))
      .not.toBe('none');
  }
"""
          new = """    await expect
      .poll(async () => wrapper.evaluate((node) => getComputedStyle(node).boxShadow))
      .not.toBe('none');
    await input.blur();
  }
"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one focus helper baseline, found {text.count(old)}.')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format and verify bounded diff
        run: |
          npx prettier --write e2e/operations.e2e.ts
          git diff --check
          test "$(git diff --name-only)" = "e2e/operations.e2e.ts"
      - name: Commit harness repair
        run: |
          git config user.name "TUX POS Verification"
          git config user.email "actions@users.noreply.github.com"
          git add e2e/operations.e2e.ts
          git commit -m "test: stabilize money input focus regression"
          git push origin HEAD:ui/tux-input-alignment-fixes
