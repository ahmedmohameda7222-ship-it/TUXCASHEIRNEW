name: Task 8C Tree Materializer

on:
  push:
    branches:
      - tmp/task8c-materialize-recovery

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify exact Task 8C tree
        shell: bash
        run: |
          set -euo pipefail
          cat .recovery/task8c/c00.txt .recovery/task8c/c01.txt .recovery/task8c/c02.txt .recovery/task8c/c03.txt .recovery/task8c/c04.txt .recovery/task8c/c05.txt .recovery/task8c/c06.txt .recovery/task8c/c07.txt | base64 -d > /tmp/task8c.patch
          git apply --index /tmp/task8c.patch
          rm -rf .recovery
          rm .github/workflows/task8c-materialize.yml
          git add -A
          actual="$(git write-tree)"
          test "$actual" = "d453c658d3495f3120852abe5d36c8735aa759e2"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: materialize exact Task 8C tree"
          git push origin HEAD:tmp/task8c-materialize-recovery
