name: CRM4 temporary Prettier diagnosis

on:
  push:
    branches:
      - feat/admin-eight-tabs-approved-ui-20261025
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Print exact CRM4 Prettier diff
        run: |
          npx prettier apps/admin/src/customers/CustomersPage.tsx > /tmp/CustomersPage.formatted.tsx
          diff -u apps/admin/src/customers/CustomersPage.tsx /tmp/CustomersPage.formatted.tsx || true
