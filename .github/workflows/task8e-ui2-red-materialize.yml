name: Task 8E UI2 RED Materializer

on:
  push:
    branches:
      - work/operations-whatsapp-inbox-live
    paths:
      - '.recovery/task8e-ui2-red/**'
      - '.github/workflows/task8e-ui2-red-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact UI2 RED tree
        shell: bash
        run: |
          set -euo pipefail
          cat .recovery/task8e-ui2-red/c{00..06} > /tmp/task8e-ui2-red.patch.b64
          base64 -d /tmp/task8e-ui2-red.patch.b64 > /tmp/task8e-ui2-red.patch
          echo '7bf1c2efc56c4c16671af5bdf56aaca294d2cd4d6d5791a329ee6a2ea6030fe6  /tmp/task8e-ui2-red.patch' | sha256sum -c -
          rm -rf .recovery/task8e-ui2-red .github/workflows/task8e-ui2-red-materialize.yml
          git add -A
          git apply --index /tmp/task8e-ui2-red.patch
          actual="$(git write-tree)"
          test "$actual" = 'c73bb092abf9a8a08adf71707a6b8be69f8d9c8d'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'wip(task8e): red order context card'
          git push origin HEAD:work/operations-whatsapp-inbox-live
