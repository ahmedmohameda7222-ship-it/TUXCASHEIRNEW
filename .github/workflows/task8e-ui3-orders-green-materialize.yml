name: Task 8E UI3 Orders GREEN Materializer

on:
  push:
    branches:
      - work/operations-whatsapp-inbox-live
    paths:
      - .github/workflows/task8e-ui3-orders-green-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact Orders GREEN tree
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .recovery/ui3-orders-green.patch.gz.b64 | gzip -d > /tmp/ui3-orders-green.patch
          test "$(sha256sum /tmp/ui3-orders-green.patch | awk '{print $1}')" = "615ab61baf993808ce14832a3f539d0fe18fd07ee7798172cee49739f99dfdbc"
          git rm .recovery/ui3-orders-green.patch.gz.b64 .github/workflows/task8e-ui3-orders-green-materialize.yml
          git apply --index /tmp/ui3-orders-green.patch
          test "$(git write-tree)" = "71432e57d768f974618cf47d9b9a87a36761fb7c"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'wip(task8e): wire orders conflicts and internal navigation'
          git push origin HEAD:work/operations-whatsapp-inbox-live
