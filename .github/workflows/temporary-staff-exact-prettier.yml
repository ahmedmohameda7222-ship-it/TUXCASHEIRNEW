name: Temporary Staff exact Prettier proof

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-staff-exact-prettier.yml'
      - 'apps/admin/src/staff/**'
      - 'e2e/admin-workforce.spec.ts'
      - 'apps/admin/server/staff/**'
      - 'packages/admin-contracts/src/staff.ts'

permissions:
  contents: read

jobs:
  formatter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Write exact formatter output for authored changed files
        run: |
          npx prettier --write \
            apps/admin/src/staff/StaffPage.tsx \
            apps/admin/src/staff/EmployeeDetailPage.tsx \
            apps/admin/src/staff/PermissionsEditor.tsx \
            apps/admin/src/staff/LeavePage.tsx \
            apps/admin/src/staff/AttendancePage.tsx \
            apps/admin/src/staff/StaffPaymentPage.tsx \
            apps/admin/src/staff/staffSummaryMetrics.ts \
            apps/admin/src/staff/staffSummaryMetrics.test.ts \
            e2e/admin-workforce.spec.ts \
            apps/admin/server/staff/staffStore.ts
          for file in \
            apps/admin/src/staff/StaffPage.tsx \
            apps/admin/src/staff/EmployeeDetailPage.tsx \
            apps/admin/src/staff/PermissionsEditor.tsx \
            apps/admin/src/staff/LeavePage.tsx \
            apps/admin/src/staff/AttendancePage.tsx \
            apps/admin/src/staff/StaffPaymentPage.tsx \
            apps/admin/src/staff/staffSummaryMetrics.ts \
            apps/admin/src/staff/staffSummaryMetrics.test.ts \
            e2e/admin-workforce.spec.ts \
            apps/admin/server/staff/staffStore.test.ts
          do
            echo "===FORMATTED_START:${file}==="
            cat "${file}"
            echo
            echo "===FORMATTED_END:${file}==="
          done
