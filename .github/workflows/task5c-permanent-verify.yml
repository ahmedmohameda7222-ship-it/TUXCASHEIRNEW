name: Task 5C Permanent Verify

on:
  push:
    branches:
      - feat/ops-whatsapp-task5c-permanent-verify

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- packages/persistence/src/browser/IndexedDbWhatsAppStore.test.ts
      - run: npm test -- packages/persistence/src/browser/indexedDbMigrations.test.ts
      - run: npm run typecheck -w @tux/persistence
