name: Prettier online inbox client diagnostic

on:
  push:
    branches:
      - work/menu-online-orders-integration

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print canonical Prettier diff
        run: |
          npx prettier --write apps/operations/src/app/onlineOrderInboxClient.ts
          git diff -- apps/operations/src/app/onlineOrderInboxClient.ts
