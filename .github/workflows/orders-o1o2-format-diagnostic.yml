name: Temporary Orders O1/O2 format diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/orders-o1o2-format-diagnostic.yml'
      - 'e2e/admin-orders.spec.ts'
      - 'apps/admin/src/orders/**'

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Print exact diff of staged Orders browser formatting without committing
        run: |
          npx prettier --write e2e/admin-orders.spec.ts apps/admin/src/orders/OrdersPage.tsx
          git diff --no-ext-diff --unified=3 -- e2e/admin-orders.spec.ts apps/admin/src/orders/OrdersPage.tsx
          echo ORDERS_FORMAT_DIAGNOSTIC_DONE
