name: Admin Plan 6 Workforce TDD

concurrency:
  group: admin-plan6-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [feat/admin-06-workforce]
  pull_request:

jobs:
  finance-core-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: node scripts/test-admin-finance-core-migration.mjs
  finance-core-postgres:
    needs: finance-core-static
    runs-on: ubuntu-latest
    env: { TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres }
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - run: node scripts/test-admin-finance-core-postgres.mjs
  workforce-static:
    needs: finance-core-postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: node scripts/test-admin-workforce-migration.mjs
  workforce-postgres:
    needs: workforce-static
    runs-on: ubuntu-latest
    env: { TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres }
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - run: node scripts/test-admin-workforce-postgres.mjs
      - run: node scripts/test-admin-workforce-review-hardening-postgres.mjs
      - run: node scripts/test-admin-workforce-reactivation-postgres.mjs
      - run: node scripts/test-admin-production-parity-postgres.mjs
      - run: node scripts/test-admin-workforce-tenant-isolation-postgres.mjs
      - run: node scripts/test-admin-workforce-order-approval-terminal-replay-postgres.mjs
  employee-pin-security:
    needs: workforce-postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx vitest run apps/admin/server/staff/employeePin.test.ts apps/admin/server/staff/staffApproval.test.ts apps/admin/server/reauth.test.ts apps/admin/server/pin.test.ts apps/operations-desktop/src/main/pinVerifier.test.ts
      - run: node scripts/test-admin-worker-pin-compatibility.mjs
  workforce-services:
    needs: employee-pin-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx vitest run apps/admin/server/staff/staffService.test.ts apps/admin/server/staff/staffApprovalRouting.test.ts apps/admin/server/staff/staffStore.test.ts apps/admin/server/staff/staffApi.test.ts
      - run: npx tsc --noEmit -p tsconfig.api.json
  workforce-calculations:
    needs: workforce-services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx vitest run apps/admin/server/staff/timekeeping.test.ts apps/admin/server/staff/wages.test.ts apps/admin/server/staff/attendanceSummary.test.ts
      - run: npx tsc --noEmit -p tsconfig.api.json
  workforce-ui:
    needs: workforce-calculations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx vitest run apps/admin/src/lib/adminApi.test.ts apps/admin/src/lib/retainedCommandIds.test.ts apps/admin/src/staff/EmployeeDetailPage.test.tsx apps/admin/src/staff/PermissionsEditor.test.tsx apps/admin/src/staff/StaffMetricsPanel.test.tsx apps/admin/src/staff/useStaff.test.ts apps/admin/src/staff/businessTime.test.ts
      - run: npm run typecheck -w @tux/admin
  workforce-e2e:
    needs: workforce-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.admin.config.ts e2e/admin-workforce.spec.ts
  workforce-regression:
    needs: workforce-e2e
    runs-on: ubuntu-latest
    env: { TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres }
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - run: npm run test:migrations
      - run: npm test
      - run: npm run typecheck
