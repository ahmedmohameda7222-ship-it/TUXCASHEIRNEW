name: Admin Plan 6 Workforce TDD

concurrency:
  group: admin-plan6-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - feat/admin-06-workforce
    paths:
      - 'supabase/migrations/**'
      - 'scripts/test-admin-finance-core-*.mjs'
      - 'scripts/test-admin-workforce-*.mjs'
      - 'apps/admin/server/staff/**'
      - 'apps/admin/server/reauth.ts'
      - 'apps/admin/server/reauth.test.ts'
      - 'apps/admin/api/admin/staff.ts'
      - 'apps/admin/src/staff/**'
      - 'apps/admin/src/app/routes.tsx'
      - 'packages/admin-contracts/src/staff.ts'
      - 'packages/admin-contracts/src/index.ts'
      - 'e2e/admin-workforce.e2e.ts'
      - 'package.json'
      - '.github/workflows/admin-plan6-workforce-tdd.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/test-admin-finance-core-*.mjs'
      - 'scripts/test-admin-workforce-*.mjs'
      - 'apps/admin/server/staff/**'
      - 'apps/admin/server/reauth.ts'
      - 'apps/admin/server/reauth.test.ts'
      - 'apps/admin/api/admin/staff.ts'
      - 'apps/admin/src/staff/**'
      - 'apps/admin/src/app/routes.tsx'
      - 'packages/admin-contracts/src/staff.ts'
      - 'packages/admin-contracts/src/index.ts'
      - 'e2e/admin-workforce.e2e.ts'
      - 'package.json'
      - '.github/workflows/admin-plan6-workforce-tdd.yml'

jobs:
  finance-core-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Finance core migration invariants
        run: node scripts/test-admin-finance-core-migration.mjs

  finance-core-postgres:
    needs: finance-core-static
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Finance core PostgreSQL behavior
        run: node scripts/test-admin-finance-core-postgres.mjs

  workforce-static:
    needs: finance-core-postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Workforce migration invariants
        run: node scripts/test-admin-workforce-migration.mjs

  workforce-postgres:
    needs: workforce-static
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Workforce PostgreSQL behavior
        run: node scripts/test-admin-workforce-postgres.mjs

  employee-pin-security:
    needs: workforce-postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Workforce employee PIN tests
        run: npx vitest run apps/admin/server/staff/employeePin.test.ts apps/admin/server/staff/staffApproval.test.ts apps/admin/server/reauth.test.ts apps/admin/server/pin.test.ts apps/operations-desktop/src/main/pinVerifier.test.ts
      - name: Admin and Operations PIN format compatibility
        run: node scripts/test-admin-worker-pin-compatibility.mjs

  workforce-services:
    needs: employee-pin-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Workforce service tests
        run: npx vitest run apps/admin/server/staff/staffService.test.ts
      - name: Admin server and API typecheck
        run: npx tsc --noEmit -p tsconfig.api.json


  workforce-calculations:
    needs: workforce-services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Workforce time and wage calculations
        run: npx vitest run apps/admin/server/staff/timekeeping.test.ts apps/admin/server/staff/wages.test.ts
      - name: Admin typecheck
        run: npx tsc --noEmit -p tsconfig.api.json


  workforce-ui:
    needs: workforce-calculations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Workforce component tests
        run: npx vitest run apps/admin/src/staff/EmployeeDetailPage.test.tsx apps/admin/src/staff/useStaff.test.ts apps/admin/src/staff/businessTime.test.ts
      - name: Admin workspace typecheck
        run: npm run typecheck -w @tux/admin


  workforce-e2e:
    needs: workforce-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Workforce E2E
        run: npx playwright test e2e/admin-workforce.e2e.ts
