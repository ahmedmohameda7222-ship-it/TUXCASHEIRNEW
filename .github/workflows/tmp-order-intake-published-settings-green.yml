name: Temporary Order Intake Published Settings GREEN
# retry after the accepted-replay fixture adopted the published checkout authority dependency

on:
  push:
    branches:
      - feat/admin-02-catalog-settings
    paths:
      - '.github/workflows/tmp-order-intake-published-settings-green.yml'

permissions:
  contents: write

jobs:
  green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/admin-02-catalog-settings
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
      - run: npm ci
      - name: Apply minimal published-settings authority GREEN
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          order = Path('supabase/functions/order-intake/order-intake.ts')
          text = order.read_text()

          marker = "export interface OnlineOrderIntakeStore {\n"
          types = """export interface OnlineOrderPublishedOrderType {\n  behavior: 'TAKE_AWAY' | 'DINE_IN' | 'DELIVERY' | 'OTHER';\n  active: boolean;\n}\n\nexport interface OnlineOrderPublishedPaymentMethod {\n  id: string;\n  displayName: string;\n  logicType: 'CASH' | 'CARD' | 'DIGITAL' | 'OTHER';\n  active: boolean;\n  channel: 'POS' | 'ONLINE' | 'BOTH';\n  integrationReference: string | null;\n}\n\nexport interface OnlineOrderPublishedCheckoutAuthority {\n  shopId: string;\n  configurationVersion: number;\n  settingsVersion: number | null;\n  lifecycleState: 'ACTIVE' | 'SUSPENDED' | 'ARCHIVED';\n  temporaryClosed: boolean;\n  onlineOrdersPaused: boolean;\n  minimumOrderMinor: number;\n  orderTypes: readonly OnlineOrderPublishedOrderType[];\n  paymentMethods: readonly OnlineOrderPublishedPaymentMethod[];\n}\n\n"""
          assert text.count(marker) == 1
          text = text.replace(marker, types + marker)

          old_store = """export interface OnlineOrderIntakeStore {\n  loadCatalog(shopId: string): Promise<OnlineOrderCatalogAuthority | null>;\n"""
          new_store = """export interface OnlineOrderIntakeStore {\n  loadCatalog(shopId: string): Promise<OnlineOrderCatalogAuthority | null>;\n  loadPublishedCheckoutAuthority?(\n    shopId: string,\n  ): Promise<OnlineOrderPublishedCheckoutAuthority | null>;\n"""
          assert text.count(old_store) == 1
          text = text.replace(old_store, new_store)

          handler_marker = """export async function handleOrderIntakeRequest(\n"""
          policy = """function isOnlinePaymentMethod(method: OnlineOrderPublishedPaymentMethod): boolean {\n  return method.active && (method.channel === 'ONLINE' || method.channel === 'BOTH');\n}\n\nfunction isPublishedInstaPayMethod(method: OnlineOrderPublishedPaymentMethod): boolean {\n  if (method.logicType !== 'DIGITAL') return false;\n  const integration = method.integrationReference?.trim().toUpperCase() ?? null;\n  if (integration !== null) return integration === 'INSTAPAY';\n  return method.displayName.replace(/\\s+/g, '').toUpperCase() === 'INSTAPAY';\n}\n\nfunction publishedCheckoutPolicyError(\n  request: OnlineOrderRequestV1,\n  itemsSubtotalMinor: number,\n  authority: OnlineOrderPublishedCheckoutAuthority,\n): Response | null {\n  if (authority.shopId !== request.shopId) {\n    throw new Error('published checkout authority shop mismatch');\n  }\n  assertTrustedMoney(authority.minimumOrderMinor, 'published minimum order');\n\n  if (authority.lifecycleState !== 'ACTIVE') return errorResponse(409, 'shop_unavailable');\n  if (authority.temporaryClosed) return errorResponse(409, 'shop_temporarily_closed');\n  if (authority.onlineOrdersPaused) return errorResponse(409, 'online_orders_paused');\n\n  const requiredBehavior = request.fulfillmentPreference === 'DELIVERY' ? 'DELIVERY' : 'TAKE_AWAY';\n  if (\n    !authority.orderTypes.some(\n      (orderType) => orderType.active && orderType.behavior === requiredBehavior,\n    )\n  ) {\n    return errorResponse(409, 'fulfillment_unavailable');\n  }\n\n  if (itemsSubtotalMinor < authority.minimumOrderMinor) {\n    return errorResponse(409, 'minimum_order_not_met');\n  }\n\n  const onlineMethods = authority.paymentMethods.filter(isOnlinePaymentMethod);\n  const cashAvailable = onlineMethods.some((method) => method.logicType === 'CASH');\n  const instaPayAvailable = onlineMethods.some(isPublishedInstaPayMethod);\n  const paymentAvailable =\n    request.paymentPreference === 'CASH'\n      ? cashAvailable\n      : request.paymentPreference === 'INSTAPAY'\n        ? instaPayAvailable\n        : cashAvailable && instaPayAvailable;\n\n  return paymentAvailable ? null : errorResponse(409, 'payment_method_unavailable');\n}\n\n"""
          assert text.count(handler_marker) == 1
          text = text.replace(handler_marker, policy + handler_marker)

          old_trusted = """    const trusted = buildTrustedItems(parsed, catalog);\n    if (trusted instanceof Response) return trusted;\n    const catalogRevision = await sha256Hex(canonicalCatalogForRevision(catalog));\n"""
          new_trusted = """    const trusted = buildTrustedItems(parsed, catalog);\n    if (trusted instanceof Response) return trusted;\n\n    const loadPublishedCheckoutAuthority = store.loadPublishedCheckoutAuthority;\n    if (!loadPublishedCheckoutAuthority) {\n      return errorResponse(503, 'published_configuration_unavailable');\n    }\n    const checkoutAuthority = await loadPublishedCheckoutAuthority.call(store, parsed.shopId);\n    if (!checkoutAuthority) return errorResponse(503, 'published_configuration_unavailable');\n    const policyError = publishedCheckoutPolicyError(\n      parsed,\n      trusted.itemsSubtotalMinor,\n      checkoutAuthority,\n    );\n    if (policyError) return policyError;\n\n    const catalogRevision = await sha256Hex(canonicalCatalogForRevision(catalog));\n"""
          assert text.count(old_trusted) == 1
          text = text.replace(old_trusted, new_trusted)
          order.write_text(text)

          index = Path('supabase/functions/order-intake/index.ts')
          text = index.read_text()
          old_import = """  type OnlineOrderPendingInsert,\n  type OnlineOrderProductModifierLink,\n"""
          new_import = """  type OnlineOrderPendingInsert,\n  type OnlineOrderProductModifierLink,\n  type OnlineOrderPublishedCheckoutAuthority,\n"""
          assert text.count(old_import) == 1
          text = text.replace(old_import, new_import)
          import_anchor = """} from './order-intake.ts';\n"""
          assert text.count(import_anchor) == 1
          text = text.replace(
              import_anchor,
              import_anchor + "import { projectPublishedCheckoutAuthority } from './published-checkout-authority.ts';\n",
          )
          find_marker = """  async findByIdempotency(\n"""
          loader = """  async loadPublishedCheckoutAuthority(\n    shopId: string,\n  ): Promise<OnlineOrderPublishedCheckoutAuthority | null> {\n    const { data, error } = await this.client\n      .from('operations_configuration_snapshots')\n      .select('bundle_json')\n      .eq('shop_id', shopId)\n      .order('version', { ascending: false })\n      .limit(1)\n      .maybeSingle();\n    if (error) throw error;\n    if (!data) return null;\n    const row = record(data, 'published Operations configuration');\n    return projectPublishedCheckoutAuthority(row.bundle_json, shopId);\n  }\n\n"""
          assert text.count(find_marker) == 1
          text = text.replace(find_marker, loader + find_marker)
          index.write_text(text)

          script = Path('scripts/order-intake.deno.ts')
          text = script.read_text()
          old_type_import = """  type OnlineOrderPendingInsert,\n  type OnlineOrderStoredRequest,\n"""
          new_type_import = """  type OnlineOrderPendingInsert,\n  type OnlineOrderPublishedCheckoutAuthority,\n  type OnlineOrderStoredRequest,\n"""
          assert text.count(old_type_import) == 1
          text = text.replace(old_type_import, new_type_import)
          script_marker = """class MemoryStore implements OnlineOrderIntakeStore {\n"""
          default_authority = """function publishedCheckoutAuthority(): OnlineOrderPublishedCheckoutAuthority {\n  return {\n    shopId: SHOP_ID,\n    configurationVersion: 1,\n    settingsVersion: null,\n    lifecycleState: 'ACTIVE',\n    temporaryClosed: false,\n    onlineOrdersPaused: false,\n    minimumOrderMinor: 0,\n    orderTypes: [\n      { behavior: 'TAKE_AWAY', active: true },\n      { behavior: 'DELIVERY', active: true },\n    ],\n    paymentMethods: [\n      {\n        id: 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',\n        displayName: 'Cash',\n        logicType: 'CASH',\n        active: true,\n        channel: 'BOTH',\n        integrationReference: null,\n      },\n      {\n        id: 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',\n        displayName: 'InstaPay',\n        logicType: 'DIGITAL',\n        active: true,\n        channel: 'BOTH',\n        integrationReference: 'INSTAPAY',\n      },\n    ],\n  };\n}\n\n"""
          assert text.count(script_marker) == 1
          text = text.replace(script_marker, default_authority + script_marker)
          catalog_method = """  async loadCatalog(shopId: string): Promise<OnlineOrderCatalogAuthority | null> {\n    return shopId === SHOP_ID ? this.catalog : null;\n  }\n\n"""
          policy_method = catalog_method + """  async loadPublishedCheckoutAuthority(\n    shopId: string,\n  ): Promise<OnlineOrderPublishedCheckoutAuthority | null> {\n    return shopId === SHOP_ID ? publishedCheckoutAuthority() : null;\n  }\n\n"""
          assert text.count(catalog_method) == 1
          text = text.replace(catalog_method, policy_method)
          script.write_text(text)

          rate = Path('supabase/functions/order-intake/order-intakeRateLimit.test.ts')
          text = rate.read_text()
          load_catalog = """      loadCatalog: vi.fn().mockResolvedValue(catalog()),\n"""
          load_policy = load_catalog + """      loadPublishedCheckoutAuthority: vi.fn().mockResolvedValue({\n        shopId: SHOP_ID,\n        configurationVersion: 1,\n        settingsVersion: null,\n        lifecycleState: 'ACTIVE',\n        temporaryClosed: false,\n        onlineOrdersPaused: false,\n        minimumOrderMinor: 0,\n        orderTypes: [{ behavior: 'TAKE_AWAY', active: true }],\n        paymentMethods: [\n          {\n            id: '55555555-5555-4555-8555-555555555555',\n            displayName: 'Cash',\n            logicType: 'CASH',\n            active: true,\n            channel: 'BOTH',\n            integrationReference: null,\n          },\n        ],\n      }),\n"""
          assert text.count(load_catalog) == 1
          text = text.replace(load_catalog, load_policy)
          rate.write_text(text)
          PY

          npx prettier --write \
            supabase/functions/order-intake/order-intake.ts \
            supabase/functions/order-intake/index.ts \
            supabase/functions/order-intake/published-checkout-authority.ts \
            supabase/functions/order-intake/order-intakeRateLimit.test.ts \
            scripts/order-intake.deno.ts
      - name: Focused Vitest GREEN
        run: >-
          npx vitest run
          supabase/functions/order-intake/order-intakePublishedSettingsAuthority.test.ts
          supabase/functions/order-intake/order-intakeRateLimit.test.ts
          supabase/functions/order-intake/order-intakeAcceptedReplay.test.ts
          supabase/functions/order-intake/order-intakeComboAuthority.test.ts
          supabase/functions/order-intake/order-intakeStandaloneModifierAuthority.test.ts
      - name: Deno order-intake regression
        run: deno test scripts/order-intake.deno.ts
      - name: Edge Function typecheck
        run: deno check supabase/functions/order-intake/index.ts
      - name: Commit GREEN and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            supabase/functions/order-intake/order-intake.ts \
            supabase/functions/order-intake/index.ts \
            supabase/functions/order-intake/published-checkout-authority.ts \
            supabase/functions/order-intake/order-intakeRateLimit.test.ts \
            scripts/order-intake.deno.ts
          git rm .github/workflows/tmp-order-intake-published-settings-green.yml
          git commit -m "feat(order-intake): enforce published checkout settings"
          git push origin HEAD:feat/admin-02-catalog-settings
