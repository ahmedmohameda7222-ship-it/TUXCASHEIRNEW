name: Admin Correction Format
on:
  push:
    branches:
      - fix/admin-production-runtime-performance
    paths:
      - '.github/workflows/admin-correction-format.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format changed Admin files
        run: |
          npx prettier --write \
            apps/admin/api/admin/orders.ts \
            apps/admin/src/dashboard/OwnerSummaryCard.test.tsx \
            apps/admin/src/dashboard/OwnerSummaryCard.tsx \
            apps/admin/src/finance/EndDayHistoryPage.tsx \
            apps/admin/src/finance/FinancePage.tsx \
            apps/admin/src/finance/RecurringExpenses.tsx \
            apps/admin/src/reports/reportCaching.test.tsx \
            apps/admin/src/reports/ReportFilters.tsx \
            apps/admin/src/reports/ReportsPage.tsx \
            apps/admin/src/reports/SavedViews.tsx
      - name: Commit formatting on correction branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin
          if ! git diff --cached --quiet; then
            git commit -m "style(admin): normalize correction formatting"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
