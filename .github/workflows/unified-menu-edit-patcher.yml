name: Unified Menu Edit Patcher

on:
  push:
    branches:
      - ui/unified-menu-edit-mode
    paths:
      - .github/workflows/unified-menu-edit-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/unified-menu-edit-mode
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format Task 6 RED contract
        run: npx prettier --write apps/operations/src/app/unifiedMenuEditMode.source.test.ts
      - name: Commit RED formatting if needed
        run: |
          git config user.name "tux-implementation-bot"
          git config user.email "tux-implementation-bot@users.noreply.github.com"
          if ! git diff --quiet -- apps/operations/src/app/unifiedMenuEditMode.source.test.ts; then
            git add apps/operations/src/app/unifiedMenuEditMode.source.test.ts
            git commit -m "test: format keyboard motion contract"
            git push origin HEAD:ui/unified-menu-edit-mode
          fi
      - name: Task 6 RED unit gate
        run: npm run test
