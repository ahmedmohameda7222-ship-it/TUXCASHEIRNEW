name: Unified Menu Edit Patcher

on:
  push:
    branches:
      - ui/unified-menu-edit-mode
    paths:
      - .github/workflows/unified-menu-edit-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/unified-menu-edit-mode
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply structural Task 4 patch
        run: python .github/scripts/unified-menu-edit-patcher.py
      - name: Capture formatter diagnostic
        run: |
          set +e
          npx prettier --write apps/operations/src/app/OrdersWorkspace.tsx > /tmp/task4-prettier.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            cp /tmp/task4-prettier.log .github/task4-prettier-diagnostic.txt
            git config user.name "tux-implementation-bot"
            git config user.email "tux-implementation-bot@users.noreply.github.com"
            git add .github/task4-prettier-diagnostic.txt
            git commit -m "chore: capture task 4 parser diagnostic"
            git push origin HEAD:ui/unified-menu-edit-mode
            exit "$status"
          fi
          git diff --check
      - name: Commit production patch
        run: |
          git config user.name "tux-implementation-bot"
          git config user.email "tux-implementation-bot@users.noreply.github.com"
          git add apps/operations/src/app/OrdersWorkspace.tsx
          git commit -m "feat: reorder product cards inline"
          git push origin HEAD:ui/unified-menu-edit-mode
