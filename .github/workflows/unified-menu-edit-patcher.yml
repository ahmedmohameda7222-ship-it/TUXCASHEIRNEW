name: Unified Menu Edit Patcher

on:
  push:
    branches:
      - ui/unified-menu-edit-mode
    paths:
      - .github/workflows/unified-menu-edit-patcher.yml

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/unified-menu-edit-mode
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify test formatting
        run: npm run format:check
      - name: Task 5 RED unit gate
        run: npm run test
