name: Unified Menu Edit Patcher

on:
  push:
    branches:
      - ui/unified-menu-edit-mode
    paths:
      - .github/workflows/unified-menu-edit-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/unified-menu-edit-mode
          fetch-depth: 0
      - name: Apply Task 3 production patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/operations/src/app/OrdersWorkspace.tsx')
          source = path.read_text()

          exact_replacements = [
              (
                  "import { categoryLayoutPreferenceInput } from './workerUiPreferenceEditing';\n",
                  "",
              ),
              (
                  "  const [categoryEditAlignment, setCategoryEditAlignment] = useState<CategoryAlignment>('left');\n"
                  "  const [categoryEditSaving, setCategoryEditSaving] = useState(false);\n"
                  "  const [categoryEditError, setCategoryEditError] = useState<string | null>(null);\n"
                  "  const [categoryResetRequested, setCategoryResetRequested] = useState(false);\n"
                  "  const [draggedCategoryId, setDraggedCategoryId] = useState<MenuCategoryId | null>(null);\n",
                  "  const [categoryEditAlignment, setCategoryEditAlignment] = useState<CategoryAlignment>('left');\n"
                  "  const [draggedCategoryId, setDraggedCategoryId] = useState<MenuCategoryId | null>(null);\n",
              ),
              (
                  "    setSearch('');\n    setCategoryEditError(null);\n    void preferencesClient\n",
                  "    setSearch('');\n    void preferencesClient\n",
              ),
              (
                  "    setCategoryEditAlignment(categoryAlignment);\n    setCategoryEditError(null);\n    setCategoryResetRequested(false);\n    setDraggedCategoryId(null);\n",
                  "    setCategoryEditAlignment(categoryAlignment);\n    setDraggedCategoryId(null);\n",
              ),
          ]

          for old, new in exact_replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:120]!r}')
              source = source.replace(old, new, 1)

          functions_start = source.index('  function moveCategory(')
          functions_end = source.index('  function addProduct(', functions_start)
          source = source[:functions_start] + '''  function moveDraggedCategory(targetId: MenuCategoryId): void {
    const sourceId = draggedCategoryId;
    if (sourceId === null || sourceId === targetId) return;
    setCategoryEditOrder((current) => {
      const sourceIndex = current.indexOf(sourceId);
      const targetIndex = current.indexOf(targetId);
      if (sourceIndex < 0 || targetIndex < 0) return current;
      const next = [...current];
      const [moved] = next.splice(sourceIndex, 1);
      if (moved === undefined) return current;
      next.splice(targetIndex, 0, moved);
      return next;
    });
  }

''' + source[functions_end:]

          render_start = source.index('              {menuEditActive ? (\n')
          render_end = source.index('            </div>\n\n            <div className="product-grid"', render_start)
          inline_categories = '''              <div className="field-stack category-navigation-stack">
                <div className="category-navigation">
                  <div
                    className="category-rail"
                    aria-label="Menu categories"
                    data-alignment={menuEditActive ? categoryEditAlignment : categoryAlignment}
                  >
                    {(menuEditActive ? categoryEditorCategories : activeCategories).map(
                      (category) => (
                        <button
                          type="button"
                          key={category.id}
                          className={[
                            'category-tab',
                            selectedCategoryId === category.id ? 'selected' : '',
                            menuEditActive ? 'category-tab-reordering' : '',
                            draggedCategoryId === category.id ? 'category-tab-dragging' : '',
                          ]
                            .filter(Boolean)
                            .join(' ')}
                          draggable={menuEditActive && draggedCategoryId !== category.id}
                          onDragStart={(event) => {
                            if (!menuEditActive) return;
                            setDraggedCategoryId(category.id);
                            event.dataTransfer.effectAllowed = 'move';
                            event.dataTransfer.setData('text/plain', category.id);
                          }}
                          onDragEnter={(event) => {
                            if (!menuEditActive || draggedCategoryId === null) return;
                            event.preventDefault();
                            moveDraggedCategory(category.id);
                          }}
                          onDragOver={(event) => {
                            if (menuEditActive && draggedCategoryId !== null) event.preventDefault();
                          }}
                          onDragEnd={() => setDraggedCategoryId(null)}
                          onDrop={(event) => {
                            event.preventDefault();
                            setDraggedCategoryId(null);
                          }}
                          onClick={() => {
                            setSelectedCategoryId(category.id);
                            setSelectedFamily(null);
                            setSearch('');
                          }}
                        >
                          {category.name}
                        </button>
                      ),
                    )}
                  </div>
                  <div className="category-nav-actions">
                    {menuEditActive ? (
                      <div
                        className="category-alignment category-alignment-inline"
                        role="group"
                        aria-label="Category alignment"
                      >
                        {(['left', 'center', 'right'] as const).map((alignment) => (
                          <button
                            type="button"
                            key={alignment}
                            aria-pressed={categoryEditAlignment === alignment}
                            onClick={() => setCategoryEditAlignment(alignment)}
                          >
                            {alignment === 'left'
                              ? 'Left'
                              : alignment === 'center'
                                ? 'Center'
                                : 'Right'}
                          </button>
                        ))}
                      </div>
                    ) : null}
                    {categoryMode === 'IDLE' ? (
                      <button
                        type="button"
                        className={
                          menuEditActive
                            ? 'category-icon-action category-edit-active'
                            : 'category-icon-action'
                        }
                        aria-label="Edit menu"
                        title="Edit menu"
                        aria-pressed={menuEditActive}
                        onClick={() => {
                          if (!menuEditActive) beginMenuEdit();
                        }}
                      >
                        <EditPencilIcon />
                      </button>
                    ) : null}
                    {!menuEditActive && categoryMode === 'SEARCH' ? (
                      <div className="product-search category-search-inline">
                        <SearchIcon className="category-search-glyph" />
                        <input
                          ref={searchRef}
                          id="product-search"
                          type="search"
                          aria-label="Search menu"
                          value={search}
                          placeholder="Search products"
                          autoComplete="off"
                          onChange={(event) => setSearch(event.target.value)}
                        />
                        <button
                          type="button"
                          className="category-search-clear"
                          aria-label="Clear search"
                          title="Clear search"
                          onClick={() => {
                            setSearch('');
                            setCategoryMode('IDLE');
                          }}
                        >
                          ×
                        </button>
                      </div>
                    ) : !menuEditActive ? (
                      <button
                        type="button"
                        className="category-icon-action"
                        aria-label="Search menu"
                        title="Search menu"
                        onClick={() => setCategoryMode('SEARCH')}
                      >
                        <SearchIcon />
                      </button>
                    ) : null}
                  </div>
                </div>
                {!menuEditActive && activeFamilies.length > 0 ? (
                  <div
                    className="segmented-control product-family-filter"
                    aria-label="Product families"
                  >
                    <button
                      type="button"
                      className={selectedFamily === null ? 'selected' : undefined}
                      onClick={() => setSelectedFamily(null)}
                    >
                      All
                    </button>
                    {activeFamilies.map((family) => (
                      <button
                        type="button"
                        key={family}
                        className={selectedFamily === family ? 'selected' : undefined}
                        onClick={() => setSelectedFamily(family)}
                      >
                        {family}
                      </button>
                    ))}
                  </div>
                ) : null}
              </div>
'''
          source = source[:render_start] + inline_categories + source[render_end:]

          path.write_text(source)
          PY
          npx prettier --write apps/operations/src/app/OrdersWorkspace.tsx
          git diff --check
      - name: Commit Task 3 production change
        run: |
          git config user.name "tux-implementation-bot"
          git config user.email "tux-implementation-bot@users.noreply.github.com"
          git add apps/operations/src/app/OrdersWorkspace.tsx
          git commit -m "feat: edit categories inline in menu header"
          git push origin HEAD:ui/unified-menu-edit-mode
