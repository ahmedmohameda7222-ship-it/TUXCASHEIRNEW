name: Unified Menu Edit Patcher

on:
  push:
    branches:
      - ui/unified-menu-edit-mode
    paths:
      - .github/workflows/unified-menu-edit-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/unified-menu-edit-mode
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply Task 5 production patch
        run: python .github/scripts/unified-menu-edit-patcher.py
      - name: Format Task 5 files
        run: |
          npx prettier --write apps/operations/src/app/OrdersWorkspace.tsx apps/operations/src/app/unifiedMenuEditMode.source.test.ts apps/operations/src/app/workerUiPreferenceEditing.ts apps/operations/src/app/workerUiPreferenceEditing.test.ts
          git diff --check
      - name: Task 5 GREEN unit gate
        run: npm run test
      - name: Commit Task 5 production change
        run: |
          git config user.name "tux-implementation-bot"
          git config user.email "tux-implementation-bot@users.noreply.github.com"
          git add apps/operations/src/app/OrdersWorkspace.tsx apps/operations/src/app/unifiedMenuEditMode.source.test.ts apps/operations/src/app/workerUiPreferenceEditing.ts apps/operations/src/app/workerUiPreferenceEditing.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "feat: save unified menu edit draft"
            git push origin HEAD:ui/unified-menu-edit-mode
          fi
