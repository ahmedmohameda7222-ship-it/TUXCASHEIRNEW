name: PR119 Temporary Worker Formatting

on:
  push:
    branches:
      - fix/admin-plans1-7-functional-completeness
    paths:
      - .github/workflows/pr119-worker-format-temporary.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-plans1-7-functional-completeness
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Format first-worker correction files
        run: npx prettier --write apps/admin/server/staff/staffService.test.ts apps/admin/server/staff/staffStore.test.ts apps/admin/server/staff/staffStore.ts apps/admin/server/staff/staffService.ts apps/admin/server/staff/staffApi.ts apps/admin/src/staff/EmployeeDetailPage.tsx apps/admin/src/staff/EmployeeDetailPage.test.tsx apps/admin/src/staff/StaffPage.tsx packages/admin-contracts/src/staff.ts scripts/test-admin-first-operations-worker-provision-postgres.mjs
      - name: Commit only formatted correction files
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- apps/admin/server/staff/staffService.test.ts apps/admin/server/staff/staffStore.test.ts apps/admin/server/staff/staffStore.ts apps/admin/server/staff/staffService.ts apps/admin/server/staff/staffApi.ts apps/admin/src/staff/EmployeeDetailPage.tsx apps/admin/src/staff/EmployeeDetailPage.test.tsx apps/admin/src/staff/StaffPage.tsx packages/admin-contracts/src/staff.ts scripts/test-admin-first-operations-worker-provision-postgres.mjs
            git commit -m "style(admin): apply canonical Prettier to worker provisioning correction"
            git push origin HEAD:fix/admin-plans1-7-functional-completeness
          fi
