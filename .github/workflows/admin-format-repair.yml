name: Admin Format Repair

on:
  pull_request:
    paths:
      - '.github/workflows/admin-format-repair.yml'
      - 'apps/admin/api/admin/settings.test.ts'
      - 'apps/admin/server/settings/settingsService.ts'
      - 'packages/admin-contracts/src/settings.ts'
      - 'packages/application/src/configurationSync.settings.sqlite.test.ts'
      - 'packages/domain/src/configurationBundle.settings.test.ts'
      - 'packages/domain/src/configurationBundle.ts'

permissions:
  contents: write

jobs:
  format-repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format only known Task 5 debt
        run: >-
          npx prettier --write
          apps/admin/api/admin/settings.test.ts
          apps/admin/server/settings/settingsService.ts
          packages/admin-contracts/src/settings.ts
          packages/application/src/configurationSync.settings.sqlite.test.ts
          packages/domain/src/configurationBundle.settings.test.ts
          packages/domain/src/configurationBundle.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/admin/api/admin/settings.test.ts \
            apps/admin/server/settings/settingsService.ts \
            packages/admin-contracts/src/settings.ts \
            packages/application/src/configurationSync.settings.sqlite.test.ts \
            packages/domain/src/configurationBundle.settings.test.ts \
            packages/domain/src/configurationBundle.ts
          git commit -m 'style(admin): format settings runtime files'
          git push origin HEAD:${GITHUB_HEAD_REF}
