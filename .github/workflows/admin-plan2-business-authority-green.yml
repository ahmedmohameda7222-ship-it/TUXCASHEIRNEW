name: Admin Plan 2 Business Authority GREEN

on:
  push:
    branches:
      - feat/admin-02-catalog-settings
    paths:
      - '.github/workflows/admin-plan2-business-authority-green.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  business-default-authority-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply guarded BFF authority patch
        run: python scripts/admin-plan2-business-authority-green.py
      - name: Format
        run: npx prettier --write apps/admin/server/authorization.ts apps/admin/server/settings/settingsService.ts apps/admin/server/settings/businessDefaultAuthority.test.ts
      - name: Business-wide authority behavior
        run: npx vitest run apps/admin/server/settings/businessDefaultAuthority.test.ts
      - name: Admin API typecheck
        run: npx tsc --noEmit -p tsconfig.api.json
      - name: Verify closure migration invariants
        run: |
          grep -q "assert_admin_business_settings_permission_v1" supabase/migrations/20260910120800_admin_plan2_closure_hardening.sql
          grep -q "checkout.allowDiscountStacking" supabase/migrations/20260910120800_admin_plan2_closure_hardening.sql
      - name: Commit verified BFF patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/server/settings/settingsService.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(admin): enforce business-wide default authority"
          git push origin HEAD:feat/admin-02-catalog-settings
