name: Phase 7 Documentation Closeout

on:
  push:
    branches:
      - feat/ops-07-bulk-stock
    paths:
      - '.phase7-doc-close.trigger'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ops-07-bulk-stock
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Phase 7 documentation evidence
        run: python scripts/phase7_finalize_docs.py
      - name: Remove temporary Phase 7 closeout files
        run: |
          rm -f .phase7-doc-close.trigger .phase7-validation-result.txt
          rm -f scripts/phase7_finalize_docs.py .github/workflows/phase7-doc-close.yml
      - name: Validate final clean Phase 7 tree
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Commit Phase 7 closeout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close Phase 7 Bulk Stock evidence'
          git push origin HEAD:feat/ops-07-bulk-stock
