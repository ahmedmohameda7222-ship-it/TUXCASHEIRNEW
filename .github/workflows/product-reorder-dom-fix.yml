name: Product Reorder DOM Fix

on:
  push:
    branches:
      - feat/apple-product-card-reorder

jobs:
  apply-fix:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/apple-product-card-reorder
      - name: Update rendered category action contract
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('e2e/operations.e2e.ts'); s=p.read_text(); old=\"  await expect(actionButtons).toHaveCount(2);\\n  await expect(actionButtons.nth(0)).toHaveAccessibleName('Edit categories');\\n  await expect(actionButtons.nth(1)).toHaveAccessibleName('Search menu');\"; new=\"  await expect(actionButtons).toHaveCount(3);\\n  await expect(actionButtons.nth(0)).toHaveAccessibleName('Manage order');\\n  await expect(actionButtons.nth(1)).toHaveAccessibleName('Edit categories');\\nn  await expect(actionButtons.nth(2)).toHaveAccessibleName('Search menu');\"; assert s.count(old)==1, 'category action contract mismatch'; p.write_text(s.replace(old,new))"
          python3 -c "from pathlib import Path; p=Path('e2e/operations.e2e.ts'); s=p.read_text(); p.write_text(s.replace('\\nn  await expect(actionButtons.nth(2))','\\n  await expect(actionButtons.nth(2))'))"
          git diff --check
          git rm .github/workflows/product-reorder-dom-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/operations.e2e.ts
          git commit -m "test: align category actions with product reorder"
          git push origin HEAD:feat/apple-product-card-reorder
