name: PR119 temporary cashier approval formatting
on:
  push:
    branches:
      - fix/admin-plans1-7-functional-completeness
    paths:
      - '.github/workflows/pr119-scoped-cashier-format.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format-five-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/admin-plans1-7-functional-completeness
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install canonical formatting dependency
        run: npm ci
      - name: Format five checked files only
        run: |
          npx prettier --write \
            apps/admin/server/approvals/approvalRulesRoute.ts \
            apps/admin/server/approvals/financeCashierReconciliationApproval.test.ts \
            apps/admin/server/finance/financeCashierReconciliationApprovalRoute.ts \
            apps/admin/src/finance/useFinanceOperations.ts \
            e2e/admin-finance.spec.ts
          npx prettier --check \
            apps/admin/server/approvals/approvalRulesRoute.ts \
            apps/admin/server/approvals/financeCashierReconciliationApproval.test.ts \
            apps/admin/server/finance/financeCashierReconciliationApprovalRoute.ts \
            apps/admin/src/finance/useFinanceOperations.ts \
            e2e/admin-finance.spec.ts
      - name: Commit scoped Prettier output only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/admin/server/approvals/approvalRulesRoute.ts \
            apps/admin/server/approvals/financeCashierReconciliationApproval.test.ts \
            apps/admin/server/finance/financeCashierReconciliationApprovalRoute.ts \
            apps/admin/src/finance/useFinanceOperations.ts \
            e2e/admin-finance.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(admin): canonical cashier approval formatting"
            git push origin HEAD:fix/admin-plans1-7-functional-completeness
          fi
