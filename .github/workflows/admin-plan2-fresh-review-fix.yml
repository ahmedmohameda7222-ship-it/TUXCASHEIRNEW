name: Plan 2 Fresh Review Fix

on:
  push:
    branches:
      - feat/admin-02-catalog-settings
    paths:
      - '.github/workflows/admin-plan2-fresh-review-fix.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply deterministic fresh-review fixes
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, from, to) {
            const source = fs.readFileSync(path, 'utf8');
            const count = source.split(from).length - 1;
            if (count !== 1) throw new Error(`${path}: expected one exact replacement, found ${count}`);
            fs.writeFileSync(path, source.replace(from, to));
          }

          function replaceRegexOnce(path, regex, replacer) {
            const source = fs.readFileSync(path, 'utf8');
            const flags = regex.flags.includes('g') ? regex.flags : `${regex.flags}g`;
            const matches = source.match(new RegExp(regex.source, flags));
            if (!matches || matches.length !== 1) {
              throw new Error(`${path}: expected one regex replacement, found ${matches?.length ?? 0}`);
            }
            fs.writeFileSync(path, source.replace(regex, replacer));
          }

          const contracts = 'packages/catalog-contracts/src/index.ts';
          replaceOnce(
            contracts,
            `  readonly allowDiscountStacking?: boolean;\n  readonly fulfillmentPreferences: readonly PublicFulfillmentPreferenceV2[];`,
            `  readonly allowDiscountStacking?: boolean;\n  readonly requireCustomerPhone?: boolean;\n  readonly fulfillmentPreferences: readonly PublicFulfillmentPreferenceV2[];`,
          );
          replaceOnce(
            contracts,
            `      'allowDiscountStacking',\n      'fulfillmentPreferences',`,
            `      'allowDiscountStacking',\n      'requireCustomerPhone',\n      'fulfillmentPreferences',`,
          );
          replaceOnce(
            contracts,
            `    allowDiscountStacking:\n      row.allowDiscountStacking === undefined\n        ? false\n        : requiredBoolean(row.allowDiscountStacking, \`\${path}.allowDiscountStacking\`),\n    fulfillmentPreferences:`,
            `    allowDiscountStacking:\n      row.allowDiscountStacking === undefined\n        ? false\n        : requiredBoolean(row.allowDiscountStacking, \`\${path}.allowDiscountStacking\`),\n    requireCustomerPhone:\n      row.requireCustomerPhone === undefined\n        ? false\n        : requiredBoolean(row.requireCustomerPhone, \`\${path}.requireCustomerPhone\`),\n    fulfillmentPreferences:`,
          );

          const intake = 'supabase/functions/order-intake/order-intake.ts';
          replaceOnce(
            intake,
            `  readonly serviceChargeBps?: number;\n  readonly taxBps?: number;\n  readonly orderTypes: readonly OnlineOrderPublishedOrderType[];`,
            `  readonly serviceChargeBps?: number;\n  readonly taxBps?: number;\n  readonly requireCustomerPhone?: boolean;\n  readonly orderTypes: readonly OnlineOrderPublishedOrderType[];`,
          );
          replaceOnce(
            intake,
            `function publishedCheckoutPolicyError(\n  request: OnlineOrderRequestV1,\n  itemsSubtotalMinor: number,\n  authority: OnlineOrderPublishedCheckoutAuthority,\n): Response | null {`,
            `function publishedCheckoutPolicyError(\n  request: OnlineOrderRequestV1,\n  itemsSubtotalMinor: number,\n  normalizedPhone: string | null,\n  authority: OnlineOrderPublishedCheckoutAuthority,\n): Response | null {`,
          );
          replaceOnce(
            intake,
            `  if (authority.onlineOrdersPaused) return errorResponse(409, 'online_orders_paused');\n\n  const requiredBehavior =`,
            `  if (authority.onlineOrdersPaused) return errorResponse(409, 'online_orders_paused');\n  if (authority.requireCustomerPhone === true && normalizedPhone === null) {\n    return errorResponse(409, 'customer_phone_required');\n  }\n\n  const requiredBehavior =`,
          );
          replaceOnce(
            intake,
            `    const policyError = publishedCheckoutPolicyError(\n      parsed,\n      trusted.itemsSubtotalMinor,\n      checkoutAuthority,\n    );`,
            `    const policyError = publishedCheckoutPolicyError(\n      parsed,\n      trusted.itemsSubtotalMinor,\n      normalizedPhone,\n      checkoutAuthority,\n    );`,
          );

          const cartDrawer = 'apps/menu/src/components/cart/CartDrawer.tsx';
          replaceOnce(
            cartDrawer,
            `  const isDelivery = orderType === 'Delivery';\n  const isDeliveryMixedPayment =`,
            `  const isDelivery = orderType === 'Delivery';\n  const phoneRequiredForCheckout = checkoutPolicy\n    ? isDelivery || checkoutPolicy.requireCustomerPhone\n    : isDelivery;\n  const isDeliveryMixedPayment =`,
          );
          replaceOnce(
            cartDrawer,
            `    (isDelivery && (!customerPhone.trim() || !deliveryAddress.trim()));`,
            `    (phoneRequiredForCheckout && !customerPhone.trim()) ||\n    (isDelivery && !deliveryAddress.trim());`,
          );
          replaceOnce(
            cartDrawer,
            `        phone: isDelivery ? customerPhone.trim() : null,`,
            `        phone: phoneRequiredForCheckout ? customerPhone.trim() : null,`,
          );
          replaceOnce(
            cartDrawer,
            `    if (isDelivery && !customerPhone.trim()) {`,
            `    if (phoneRequiredForCheckout && !customerPhone.trim()) {`,
          );
          replaceOnce(
            cartDrawer,
            `            {isDelivery && (\n              <>\n                <div className="space-y-1">\n                  <label className="text-sm text-gray-400 font-semibold">\n                    Phone Number`,
            `            {phoneRequiredForCheckout && (\n              <>\n                <div className="space-y-1">\n                  <label className="text-sm text-gray-400 font-semibold">\n                    Phone Number`,
          );
          replaceRegexOnce(
            cartDrawer,
            /\n                <div className="space-y-1">\n                  <label className="text-sm text-gray-400 font-semibold">\n                    Delivery Address <span className="text-red-400">\*<\/span>[\s\S]*?\n                <\/div>/,
            (match) => `\n                {isDelivery && (${match}\n                )}`,
          );

          const ordersCart = 'apps/operations/src/app/OrdersCart.tsx';
          replaceOnce(
            ordersCart,
            `  const delivery = selectedOrderType?.behavior === 'DELIVERY';\n  const allowDeliveryFeeOverride =`,
            `  const delivery = selectedOrderType?.behavior === 'DELIVERY';\n  const requireCustomerPhone =\n    configuration.settings?.values['checkout.requireCustomerPhone'] === true;\n  const allowDeliveryFeeOverride =`,
          );
          replaceOnce(
            ordersCart,
            `        {delivery ? (\n          <section\n            className="cart-section delivery-section"\n            aria-labelledby={controlId('delivery-title')}\n          >\n            <h2 id={controlId('delivery-title')}>Delivery</h2>`,
            `        {delivery || requireCustomerPhone ? (\n          <section\n            className="cart-section delivery-section"\n            aria-labelledby={controlId('delivery-title')}\n          >\n            <h2 id={controlId('delivery-title')}>{delivery ? 'Delivery' : 'Customer'}</h2>`,
          );
          replaceRegexOnce(
            ordersCart,
            /(\n            <DraftTextField\n              id=\{controlId\('delivery-name'\)\}[\s\S]*?)(\n            <SectionIssues\n              issues=\{issues\})/,
            (_match, fields, sectionIssues) =>
              `\n            {delivery ? (\n              <>${fields}\n              </>\n            ) : null}${sectionIssues}`,
          );

          const useSettingsTest = 'apps/admin/src/settings/useSettings.test.ts';
          replaceOnce(
            useSettingsTest,
            `        settingKey: 'receipt.orderPrefix',\n        value: 'MAADI-',\n      }),`,
            `        settingKey: 'receipt.orderPrefix',\n        value: 'MAADI-',\n        expectedVersion: 4,\n      }),`,
          );
          replaceOnce(
            useSettingsTest,
            `        settingKey: 'checkout.taxBps',\n        value: 1200,\n      }),`,
            `        settingKey: 'checkout.taxBps',\n        value: 1200,\n        expectedVersion: null,\n      }),`,
          );

          const publishedOrderingTest = 'supabase/functions/catalog-public/published-ordering.test.ts';
          replaceOnce(
            publishedOrderingTest,
            `                'checkout.allowDiscountStacking': true,`,
            `                'checkout.allowDiscountStacking': true,\n                'checkout.requireCustomerPhone': true,`,
          );
          replaceOnce(
            publishedOrderingTest,
            `        allowDiscountStacking: true,\n        fulfillmentPreferences:`,
            `        allowDiscountStacking: true,\n        requireCustomerPhone: true,\n        fulfillmentPreferences:`,
          );

          const menuPolicyTest = 'apps/menu/src/lib/published-checkout-policy.test.ts';
          replaceOnce(
            menuPolicyTest,
            `          taxBps: 1400,\n          fulfillmentPreferences:`,
            `          taxBps: 1400,\n          requireCustomerPhone: true,\n          fulfillmentPreferences:`,
          );
          replaceOnce(
            menuPolicyTest,
            `      taxBps: 1400,\n      orderTypes:`,
            `      taxBps: 1400,\n      requireCustomerPhone: true,\n      orderTypes:`,
          );

          const permanentWorkflow = '.github/workflows/admin-catalog-settings-tdd.yml';
          replaceOnce(
            permanentWorkflow,
            `          apps/admin/src/settings/SettingsPage.test.tsx\n          apps/admin/src/settings/useSettings.test.ts`,
            `          apps/admin/src/settings/SettingsPage.test.tsx\n          apps/admin/src/settings/SettingOverrideEditor.test.tsx\n          apps/admin/src/settings/useSettings.test.ts`,
          );
          NODE
      - name: Format changed files
        run: >-
          npx prettier --write
          packages/catalog-contracts/src/index.ts
          supabase/functions/order-intake/order-intake.ts
          apps/menu/src/components/cart/CartDrawer.tsx
          apps/operations/src/app/OrdersCart.tsx
          apps/admin/src/settings/useSettings.test.ts
          supabase/functions/catalog-public/published-ordering.test.ts
          apps/menu/src/lib/published-checkout-policy.test.ts
          .github/workflows/admin-catalog-settings-tdd.yml
      - name: Focused GREEN tests
        run: >-
          npx vitest run
          packages/domain/src/checkoutPolicyStacking.test.ts
          supabase/functions/order-intake/order-intakePublishedSettingsAuthority.test.ts
          supabase/functions/catalog-public/published-ordering.test.ts
          apps/menu/src/lib/published-checkout-policy.test.ts
          apps/menu/src/components/cart/CartDrawerPublishedCheckout.source.test.ts
          apps/operations/src/app/deliveryFeePolicyUi.test.ts
          apps/admin/src/settings/SettingOverrideEditor.test.tsx
          apps/admin/src/settings/useSettings.test.ts
      - name: Public projection invariant
        run: node scripts/test-catalog-public-ordering-projection.mjs
      - name: Focused typechecks
        run: |
          npm run typecheck -w @tux/domain
          npm run typecheck -w @tux/admin
          npm run typecheck -w @tux/operations
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/catalog-contracts/src/index.ts \
            supabase/functions/order-intake/order-intake.ts \
            apps/menu/src/components/cart/CartDrawer.tsx \
            apps/operations/src/app/OrdersCart.tsx \
            apps/admin/src/settings/useSettings.test.ts \
            supabase/functions/catalog-public/published-ordering.test.ts \
            apps/menu/src/lib/published-checkout-policy.test.ts \
            .github/workflows/admin-catalog-settings-tdd.yml
          git commit -m "fix(plan2): close fresh checkout review findings"
          git push origin HEAD:feat/admin-02-catalog-settings
