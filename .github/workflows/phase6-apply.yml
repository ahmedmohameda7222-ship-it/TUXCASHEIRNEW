name: Phase 6 Apply

on:
  push:
    branches:
      - feat/ops-06-expenses
    paths:
      - '.phase6-run.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ops-06-expenses
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Apply staged implementation
        run: |
          cat .phase6_parts/*.txt > /tmp/phase6_apply.py
          python /tmp/phase6_apply.py
      - name: Install locked dependencies
        run: npm ci
      - name: Format implementation
        run: npm run format
      - name: Remove one-shot helpers
        run: |
          rm -rf .phase6_parts
          rm -f .phase6-run.trigger
          rm -f .github/workflows/phase6-apply.yml
      - name: Commit implementation only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Phase 6: Expenses operational ledger'
          git push origin HEAD:feat/ops-06-expenses
