name: Admin Lockfile Generator

on:
  pull_request:
    paths:
      - 'apps/admin/package.json'
      - '.github/workflows/admin-lockfile-generator.yml'

permissions:
  contents: write

concurrency:
  group: admin-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Regenerate workspace lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        shell: bash
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(admin): synchronize workspace lockfile'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
