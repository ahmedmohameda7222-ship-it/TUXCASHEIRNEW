name: Admin Lockfile Generator

on:
  pull_request:
    paths:
      - packages/admin-contracts/package.json
      - .github/workflows/admin-lockfile-generator.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already synchronized"
          else
            git commit -m "chore(admin): synchronize workspace lockfile"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
