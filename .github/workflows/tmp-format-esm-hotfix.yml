name: Temporary ESM Hotfix Formatter

on:
  push:
    branches:
      - fix/vercel-runtime-esm-package-boundary

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Format changed API runtime TypeScript
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD | grep -E '^(api|server)/.*\.(ts|tsx)$' || true)
          if [ "${#files[@]}" -gt 0 ]; then
            npx prettier --write "${files[@]}"
          fi
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api server
          git commit -m "style(vercel): format ESM runtime imports"
          git push
