name: Temporary Orders O3 formatter diagnostic

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/orders-o3-prettier-diagnostic.yml']
permissions:
  contents: read
jobs:
  exact-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Print exact Prettier changes
        run: |
          npx prettier --write apps/admin/src/orders/OrderDetailPage.tsx apps/admin/src/orders/OrderDetailPage.test.tsx
          git diff --no-ext-diff --unified=2 -- apps/admin/src/orders/OrderDetailPage.tsx apps/admin/src/orders/OrderDetailPage.test.tsx
          echo EXACT_O3_PRETTIER_COMPLETE
