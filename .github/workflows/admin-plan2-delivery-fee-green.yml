name: Admin Plan 2 Delivery Fee GREEN

on:
  push:
    branches:
      - feat/admin-02-catalog-settings
    paths:
      - .github/workflows/admin-plan2-delivery-fee-green.yml

permissions:
  contents: write

jobs:
  delivery-fee-green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/admin-02-catalog-settings
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax-check source patch
        run: python3 -m py_compile scripts/admin-plan2-delivery-fee-green-v2.py
      - name: Apply reviewed GREEN source patch
        run: python3 scripts/admin-plan2-delivery-fee-green-v2.py
      - name: Format changed implementation and tests
        run: |
          npx prettier --write \
            packages/domain/src/checkoutPolicy.ts \
            packages/domain/src/orderValidation.ts \
            packages/domain/src/models.ts \
            packages/domain/src/syncContract.ts \
            packages/domain/src/order.ts \
            packages/domain/src/deliveryFeePolicy.test.ts \
            packages/domain/src/checkoutSnapshotSync.test.ts \
            packages/application/src/orders.ts \
            packages/application/src/onlineOrderAcceptance.ts \
            packages/application/src/onlineOrderAcceptance.test.ts \
            apps/admin/api/admin/settings.ts \
            apps/admin/api/admin/settings.test.ts \
            apps/admin/src/settings/CheckoutPage.tsx \
            apps/operations/src/app/OrdersCart.tsx \
            apps/operations/src/app/OnlineOrderInboxPanel.tsx \
            apps/operations/src/app/deliveryFeePolicyUi.test.ts \
            scripts/test-admin-settings-schema-hardening.mjs \
            .github/workflows/admin-catalog-settings-tdd.yml
      - name: GREEN focused delivery fee policy tests
        run: >-
          npx vitest run
          packages/domain/src/deliveryFeePolicy.test.ts
          packages/domain/src/checkoutSnapshotSync.test.ts
          packages/application/src/onlineOrderAcceptance.test.ts
          apps/admin/api/admin/settings.test.ts
          apps/operations/src/app/deliveryFeePolicyUi.test.ts
      - name: Static settings migration invariant
        run: node scripts/test-admin-settings-schema-hardening.mjs
      - name: Domain typecheck
        run: npm run typecheck -w @tux/domain
      - name: Application typecheck
        run: npm run typecheck -w @tux/application
      - name: Operations typecheck
        run: npm run typecheck -w @tux/operations
      - name: Admin UI typecheck
        run: npm run typecheck -w @tux/admin
      - name: Admin API typecheck
        run: npx tsc --noEmit -p tsconfig.api.json
      - name: Commit verified GREEN implementation
        run: |
          git rm .github/workflows/admin-plan2-delivery-fee-red.yml
          git rm scripts/admin-plan2-delivery-fee-green.py
          git rm scripts/admin-plan2-delivery-fee-green-v2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(admin): enforce published delivery fee override policy"
          git push origin HEAD:feat/admin-02-catalog-settings
