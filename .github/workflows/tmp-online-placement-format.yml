name: Temporary online placement formatter

on:
  push:
    branches:
      - work/menu-online-orders-integration
    paths:
      - .github/workflows/tmp-online-placement-format.yml

permissions:
  contents: write

jobs:
  format-online-placement-red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply exact formatter to RED test only
        run: |
          npx prettier --write packages/application/src/ordersOnlineSource.sqlite.test.ts
          git diff --check
      - name: Commit generated formatting fix
        shell: bash
        run: |
          git config user.name 'tux-ci'
          git config user.email 'tux-ci@users.noreply.github.com'
          git add packages/application/src/ordersOnlineSource.sqlite.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'style(test): apply exact online placement formatting'
          git push origin HEAD:work/menu-online-orders-integration
