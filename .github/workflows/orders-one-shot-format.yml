name: Orders One-Shot Formatting
on:
  push:
    paths:
      - '.github/workflows/orders-one-shot-format.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/fix/orders-production-remediation-20261025'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Format changed Orders files only
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z 639f2a61fdc1272646156db50cea71a9da5d22e5 HEAD -- '*.ts' '*.tsx' '*.mjs' '*.css')
          if (( ${#files[@]} == 0 )); then exit 0; fi
          npx prettier --write "${files[@]}"
          git add -- "${files[@]}"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(orders): format changed source against repo Prettier policy'
          git fetch origin fix/orders-production-remediation-20261025
          git rebase origin/fix/orders-production-remediation-20261025
          git push origin HEAD:refs/heads/fix/orders-production-remediation-20261025
