name: Fix stale mobile E2E close selector

on:
  push:
    branches:
      - ui/tux-input-alignment-fixes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/tux-input-alignment-fixes
          fetch-depth: 0
      - name: Replace stale close selector with existing helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('e2e/operations.e2e.ts')
          source = path.read_text()
          old = "  await page.getByRole('button', { name: 'Close order' }).click();\n"
          new = "  await closeMobileCartIfOpen(page, testInfo);\n"
          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one stale Close order selector, found {source.count(old)}.')
          source = source.replace(old, new, 1)
          path.write_text(source)
          PY
      - name: Verify bounded patch
        run: |
          npx prettier --check e2e/operations.e2e.ts
          git diff --check
          test "$(git diff --name-only)" = "e2e/operations.e2e.ts"
      - name: Commit E2E harness fix
        run: |
          git config user.name "TUX POS Verification"
          git config user.email "actions@users.noreply.github.com"
          git add e2e/operations.e2e.ts
          git commit -m "test: use mobile cart close helper"
          git push origin HEAD:ui/tux-input-alignment-fixes
