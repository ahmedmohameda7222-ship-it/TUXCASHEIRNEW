name: Format TUX UI alignment E2E

on:
  push:
    branches:
      - ui/tux-input-alignment-fixes

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/tux-input-alignment-fixes
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format rendered regression file
        run: npx prettier --write e2e/operations.e2e.ts
      - name: Verify bounded diff
        run: |
          git diff --check
          test "$(git diff --name-only)" = "e2e/operations.e2e.ts"
      - name: Commit formatting
        run: |
          git config user.name "TUX POS Verification"
          git config user.email "actions@users.noreply.github.com"
          git add e2e/operations.e2e.ts
          git commit -m "test: format rendered UI alignment coverage"
          git push origin HEAD:ui/tux-input-alignment-fixes
