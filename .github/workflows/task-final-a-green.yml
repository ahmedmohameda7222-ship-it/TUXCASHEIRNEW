name: Task Final A Green

on:
  push:
    branches:
      - work/menu-online-orders-integration

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/menu-online-orders-integration
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Align same-device acceptance fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/application/src/onlineOrderAcceptance.sqlite.test.ts')
          text = path.read_text()
          needle = "    processingExpiresAt: instant('2026-09-08T22:00:00.000Z'),\n"
          replacement = needle + "    processingDeviceId: 'dddddddd-dddd-4ddd-8ddd-dddddddddddd',\n    reservationOriginDeviceId: 'dddddddd-dddd-4ddd-8ddd-dddddddddddd',\n"
          if 'reservationOriginDeviceId' not in text:
              if needle not in text:
                  raise SystemExit('sqlite fixture anchor missing')
              text = text.replace(needle, replacement, 1)
              path.write_text(text)

          path = Path('packages/application/src/menuOperationsWhatsAppJourney.test.ts')
          text = path.read_text()
          needle = "      processingExpiresAt: instant('2026-09-08T23:30:00.000Z'),\n"
          replacement = needle + "      processingDeviceId: DEVICE_ID,\n      reservationOriginDeviceId: DEVICE_ID,\n"
          if 'reservationOriginDeviceId: DEVICE_ID' not in text:
              if needle not in text:
                  raise SystemExit('journey fixture anchor missing')
              text = text.replace(needle, replacement, 1)
              path.write_text(text)
          PY
      - name: Format A changes
        run: npx prettier --write packages/persistence/src/onlineOrderInboxStore.ts packages/application/src/onlineOrderAcceptance.sqlite.test.ts packages/application/src/menuOperationsWhatsAppJourney.test.ts
      - name: Targeted A GREEN
        run: >-
          npx vitest run
          packages/application/src/onlineOrderAcceptanceTakeover.test.ts
          packages/application/src/onlineOrderAcceptance.test.ts
          packages/application/src/onlineOrderAcceptance.sqlite.test.ts
          packages/application/src/menuOperationsWhatsAppJourney.test.ts
          packages/application/src/onlineOrderInbox.test.ts
          packages/application/src/onlineOrderRejectionFence.source.test.ts
          packages/application/src/onlineOrderAcceptanceRecovery.source.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit verified fixture/format corrections
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/persistence/src/onlineOrderInboxStore.ts packages/application/src/onlineOrderAcceptance.sqlite.test.ts packages/application/src/menuOperationsWhatsAppJourney.test.ts
          git commit -m "test(online-orders): verify takeover fence regressions"
          git push origin HEAD:work/menu-online-orders-integration
