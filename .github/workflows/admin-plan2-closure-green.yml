name: Admin Plan 2 Closure GREEN

on:
  push:
    branches:
      - feat/admin-02-catalog-settings
    paths:
      - '.github/workflows/admin-plan2-closure-green.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  closure-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Add permanent cancellation rollout regression
        run: python scripts/admin-plan2-cancellation-red.py
      - name: Apply guarded closure fixes
        run: python scripts/admin-plan2-closure-green.py
      - name: Format touched TypeScript
        run: npx prettier --write apps/admin/server/settings/settingsService.ts apps/admin/server/authorization.ts apps/admin/server/settings/businessDefaultAuthority.test.ts packages/application/src/ordersBoard.ts packages/application/src/ordersBoard.reasonCodes.sqlite.test.ts
      - name: Business-wide authority behavior
        run: npx vitest run apps/admin/server/settings/businessDefaultAuthority.test.ts
      - name: Cancellation reason rollout behavior
        run: npx vitest run packages/application/src/ordersBoard.reasonCodes.sqlite.test.ts
      - name: Admin API typecheck
        run: npx tsc --noEmit -p tsconfig.api.json
      - name: Application typecheck
        run: npm run typecheck -w @tux/application
      - name: Closure migration invariants
        run: |
          grep -q "assert_admin_business_settings_permission_v1" supabase/migrations/20260910120800_admin_plan2_closure_hardening.sql
          grep -q "checkout.allowDiscountStacking" supabase/migrations/20260910120800_admin_plan2_closure_hardening.sql
      - name: Commit verified closure fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/server/settings/settingsService.ts packages/application/src/ordersBoard.ts packages/application/src/ordersBoard.reasonCodes.sqlite.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(admin): close settings authority and reason rollout gaps"
          git push origin HEAD:feat/admin-02-catalog-settings
