name: Apply TUX UI alignment long-term hardening

on:
  push:
    branches:
      - ui/tux-input-alignment-fixes

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/tux-input-alignment-fixes
          fetch-depth: 0

      - name: Apply bounded long-term CSS hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one baseline match, found {count}.')
              path.write_text(text.replace(old, new, 1))

          board = Path('apps/operations/src/styles/orders-board.css')
          replace_once(
              board,
              '  justify-content: center;\n  gap: var(--tux-space-2);\n  overflow-x: auto;',
              '  justify-content: safe center;\n  gap: var(--tux-space-2);\n  overflow-x: auto;',
              'Orders Board safe centering',
          )
          replace_once(
              board,
              '  .board-search {\n    min-width: 0;\n  }\n  .board-tabs {\n    justify-content: flex-start;\n  }\n  .active-order-grid {',
              '  .board-search {\n    min-width: 0;\n  }\n  .active-order-grid {',
              'Orders Board mobile override removal',
          )

          orders = Path('apps/operations/src/styles/orders.css')
          replace_once(
              orders,
              '.product-search input,\n.field-stack input,\n.field-stack select,\n.field-stack textarea,\n.money-input-wrap input,\n.customizer-section textarea {',
              '.product-search input,\n.field-stack input,\n.field-stack select,\n.field-stack textarea,\n.customizer-section textarea {',
              'MoneyInput generic input selector removal',
          )
          replace_once(
              orders,
              '.field-stack input,\n.field-stack select,\n.money-input-wrap input {\n  padding: 0 var(--tux-space-3);\n}',
              '.field-stack input,\n.field-stack select {\n  padding: 0 var(--tux-space-3);\n}',
              'MoneyInput generic padding selector removal',
          )
          replace_once(
              orders,
              '.money-input-wrap input {\n  border: 0;\n  background: transparent;\n  text-align: right;\n}',
              '.money-input-wrap > input {\n  width: 100%;\n  min-height: var(--tux-control-height-md);\n  border: 0;\n  border-radius: 0;\n  background: transparent;\n  color: var(--tux-text-primary);\n  box-shadow: none;\n  padding: 0 var(--tux-space-3);\n  font-size: var(--tux-font-size-sm);\n  text-align: right;\n}\n\n.money-input-wrap > input:focus-visible {\n  outline: none;\n}\n\n.money-input-wrap:focus-within {\n  border-color: color-mix(in srgb, var(--tux-focus-ring) 55%, var(--tux-border-subtle));\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--tux-focus-ring) 36%, transparent);\n}',
              'Canonical MoneyInput rule',
          )

          corrections = Path('apps/operations/src/styles/final-pos-corrections.css')
          replace_once(
              corrections,
              '/* Currency prefix and value render as one composed money control across Operations. */\n.money-input-wrap > input {\n  border: 0;\n  border-radius: 0;\n  background: transparent;\n  box-shadow: none;\n}\n\n.money-input-wrap > input:focus-visible {\n  outline: none;\n}\n\n.money-input-wrap:focus-within {\n  border-color: color-mix(in srgb, var(--tux-focus-ring) 55%, var(--tux-border-subtle));\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--tux-focus-ring) 36%, transparent);\n}\n\n',
              '',
              'Late MoneyInput override removal',
          )

          expenses = Path('apps/operations/src/styles/expenses.css')
          replace_once(
              expenses,
              '.expense-dialog {\n  width: min(100%, 42rem);\n  padding: var(--tux-space-6);\n}',
              '.expense-dialog {\n  width: min(100%, 54rem);\n  padding: var(--tux-space-6);\n}',
              'Edit Expense dialog width',
          )
          replace_once(
              expenses,
              '.expense-dialog .expense-fields {\n  grid-template-columns: 1fr 1fr;\n}\n.expense-dialog .expense-description-field,\n.expense-dialog .expense-note-field {\n  grid-column: 1 / -1;\n}',
              '.expense-dialog .expense-note-field {\n  grid-column: 1 / -1;\n}',
              'Edit Expense desktop grid',
          )
          PY

      - name: Verify bounded CSS diff
        run: |
          git diff --check
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          echo "$changed"
          test "$changed" = "apps/operations/src/styles/expenses.css apps/operations/src/styles/final-pos-corrections.css apps/operations/src/styles/orders-board.css apps/operations/src/styles/orders.css "

      - name: Commit GREEN implementation
        run: |
          git config user.name "TUX POS Verification"
          git config user.email "actions@users.noreply.github.com"
          git add apps/operations/src/styles/expenses.css apps/operations/src/styles/final-pos-corrections.css apps/operations/src/styles/orders-board.css apps/operations/src/styles/orders.css
          git commit -m "fix: harden UI alignment contracts"
          git push origin HEAD:ui/tux-input-alignment-fixes
