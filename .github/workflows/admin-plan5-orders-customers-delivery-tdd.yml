name: Admin Plan 5 Orders Customers Delivery TDD

concurrency:
  group: admin-plan5-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - feat/admin-05-orders-customers-delivery
    paths:
      - 'supabase/migrations/**'
      - 'apps/admin/server/orders/**'
      - 'apps/admin/api/admin/orders.ts'
      - 'apps/admin/src/orders/**'
      - 'apps/admin/server/customers/**'
      - 'apps/admin/api/admin/customers.ts'
      - 'apps/admin/src/customers/**'
      - 'apps/admin/src/promotions/**'
      - 'apps/admin/server/delivery/**'
      - 'apps/admin/api/admin/delivery.ts'
      - 'apps/admin/src/delivery/**'
      - 'packages/admin-contracts/src/orders.ts'
      - 'packages/admin-contracts/src/customers.ts'
      - 'packages/admin-contracts/src/loyalty.ts'
      - 'packages/admin-contracts/src/delivery.ts'
      - 'packages/admin-contracts/src/index.ts'
      - 'packages/application/src/orders.ts'
      - 'packages/application/src/ordersBoard.ts'
      - 'packages/application/src/onlineOrderAcceptance.ts'
      - 'packages/sync/src/**'
      - 'packages/persistence/src/**'
      - 'packages/domain/src/**'
      - 'apps/menu/src/**'
      - 'apps/operations/src/**'
      - 'apps/operations-desktop/src/**'
      - 'api/**'
      - 'server/**'
      - 'e2e/admin-orders.spec.ts'
      - 'e2e/admin-customers-promotions.spec.ts'
      - 'e2e/admin-delivery.spec.ts'
      - 'scripts/test-admin-order-controls-migration.mjs'
      - 'scripts/test-admin-customers-migration.mjs'
      - 'scripts/test-admin-loyalty-promotions-migration.mjs'
      - 'scripts/test-admin-delivery-migration.mjs'
      - '.github/workflows/admin-plan5-orders-customers-delivery-tdd.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'apps/admin/server/orders/**'
      - 'apps/admin/api/admin/orders.ts'
      - 'apps/admin/src/orders/**'
      - 'apps/admin/server/customers/**'
      - 'apps/admin/api/admin/customers.ts'
      - 'apps/admin/src/customers/**'
      - 'apps/admin/src/promotions/**'
      - 'apps/admin/server/delivery/**'
      - 'apps/admin/api/admin/delivery.ts'
      - 'apps/admin/src/delivery/**'
      - 'packages/admin-contracts/src/orders.ts'
      - 'packages/admin-contracts/src/customers.ts'
      - 'packages/admin-contracts/src/loyalty.ts'
      - 'packages/admin-contracts/src/delivery.ts'
      - 'packages/admin-contracts/src/index.ts'
      - 'packages/application/src/orders.ts'
      - 'packages/application/src/ordersBoard.ts'
      - 'packages/application/src/onlineOrderAcceptance.ts'
      - 'packages/sync/src/**'
      - 'packages/persistence/src/**'
      - 'packages/domain/src/**'
      - 'apps/menu/src/**'
      - 'apps/operations/src/**'
      - 'apps/operations-desktop/src/**'
      - 'api/**'
      - 'server/**'
      - 'e2e/admin-orders.spec.ts'
      - 'e2e/admin-customers-promotions.spec.ts'
      - 'e2e/admin-delivery.spec.ts'
      - 'scripts/test-admin-order-controls-migration.mjs'
      - 'scripts/test-admin-customers-migration.mjs'
      - 'scripts/test-admin-loyalty-promotions-migration.mjs'
      - 'scripts/test-admin-delivery-migration.mjs'
      - '.github/workflows/admin-plan5-orders-customers-delivery-tdd.yml'

jobs:
  task1-order-controls-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Plan 5 order controls migration invariant
        run: node scripts/test-admin-order-controls-migration.mjs

  task1-order-controls:
    needs: task1-order-controls-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Plan 5 order service behavior
        run: npx vitest run apps/admin/server/orders/orderService.test.ts
      - name: Plan 5 lifecycle/sync compatibility
        run: >-
          npx vitest run
          packages/application/src/orders.test.ts
          packages/application/src/ordersBoard.reasonCodes.sqlite.test.ts
          packages/sync/src/remoteMaterializer.test.ts
          packages/sync/src/remoteReceipt.test.ts
          packages/sync/src/httpTransport.test.ts
          packages/sync/src/orderLifecycleConvergence.test.ts
      - name: Plan 5 typecheck
        run: npm run typecheck

  regression:
    needs: task1-order-controls
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Full migration regression
        run: npm run test:migrations
      - name: Full unit and integration regression
        run: npm test
