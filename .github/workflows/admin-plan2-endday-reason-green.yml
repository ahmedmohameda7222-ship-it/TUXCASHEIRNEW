name: Admin Plan 2 End Day Reason GREEN

on:
  push:
    branches:
      - feat/admin-02-catalog-settings
    paths:
      - '.github/workflows/admin-plan2-endday-reason-green.yml'
      - 'scripts/admin-plan2-endday-reason-green.py'
      - 'scripts/admin-plan2-endday-reason-green-v2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  end-day-reason-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply guarded End Day reason authority patch
        run: python scripts/admin-plan2-endday-reason-green-v2.py
      - name: Format touched sources
        run: >-
          npx prettier --write
          packages/domain/src/models.ts
          packages/domain/src/syncContract.ts
          packages/domain/src/endDayReasonSync.test.ts
          packages/application/src/endDay.ts
          packages/application/src/index.ts
          packages/application/src/endDay.reasonCodes.test.ts
          apps/operations/src/app/EndDayFlow.tsx
          apps/operations/src/app/EndDayFlow.reasonCodes.test.ts
      - name: End Day configured reason authority
        run: npx vitest run packages/application/src/endDay.reasonCodes.test.ts
      - name: Reconciliation reason snapshot sync
        run: npx vitest run packages/domain/src/endDayReasonSync.test.ts
      - name: End Day configured reason UI
        run: npx vitest run apps/operations/src/app/EndDayFlow.reasonCodes.test.ts
      - name: Existing End Day application regression
        run: npx vitest run packages/application/src/endDay.test.ts
      - name: Existing End Day UI regression
        run: npx vitest run apps/operations/src/app/EndDayFlow.parked.test.ts
      - name: Domain typecheck
        run: npm run typecheck -w @tux/domain
      - name: Application typecheck
        run: npm run typecheck -w @tux/application
      - name: Operations typecheck
        run: npm run typecheck -w @tux/operations
      - name: Commit verified End Day reason authority
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/domain/src/models.ts \
            packages/domain/src/syncContract.ts \
            packages/domain/src/endDayReasonSync.test.ts \
            packages/application/src/endDay.ts \
            packages/application/src/index.ts \
            packages/application/src/endDay.reasonCodes.test.ts \
            apps/operations/src/app/EndDayFlow.tsx \
            apps/operations/src/app/EndDayFlow.reasonCodes.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(operations): enforce End Day variance reason authority"
          git push origin HEAD:feat/admin-02-catalog-settings
