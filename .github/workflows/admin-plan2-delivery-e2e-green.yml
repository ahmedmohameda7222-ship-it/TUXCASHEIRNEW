name: Admin Plan 2 Delivery E2E GREEN

on:
  push:
    branches:
      - feat/admin-02-catalog-settings
    paths:
      - .github/workflows/admin-plan2-delivery-e2e-green.yml

permissions:
  contents: write

jobs:
  delivery-e2e-green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/admin-02-catalog-settings
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply visual evidence alignment
        run: python3 scripts/admin-plan2-delivery-e2e-green.py
      - name: Format check changed E2E
        run: npx prettier --check e2e/operations.e2e.ts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify delivery visual evidence
        run: npx playwright test e2e/operations.e2e.ts --project=desktop-browser-fallback --grep "follow-up desktop approval evidence"
      - name: Commit verified E2E alignment
        run: |
          git rm scripts/admin-plan2-delivery-e2e-green.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/operations.e2e.ts
          git diff --cached --check
          git commit -m "test(admin): align delivery visual evidence with published fee policy"
          git push origin HEAD:feat/admin-02-catalog-settings
