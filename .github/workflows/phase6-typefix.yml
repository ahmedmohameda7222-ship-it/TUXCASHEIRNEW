name: Phase 6 Type Narrowing Repair

on:
  push:
    branches:
      - feat/ops-06-expenses
    paths:
      - '.phase6-typefix.trigger'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ops-06-expenses
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Tighten Delivery Failed fixture type
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/operations-desktop/src/main/expenses.integration.test.ts')
          text = path.read_text()
          old = 'function systemExpense(id: string): Expense {'
          new = "function systemExpense(id: string): Extract<Expense, { kind: 'DELIVERY_FAILED' }> {"
          if old not in text:
              raise SystemExit('systemExpense signature not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install locked dependencies
        run: npm ci
      - name: Format repair
        run: npm run format
      - name: Remove temporary validation helpers
        run: |
          rm -f .phase6-typefix.trigger
          rm -f .phase6-ci3.trigger
          rm -f .github/workflows/phase6-typefix.yml
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Phase 6 Delivery Failed fixture typing'
          git push origin HEAD:feat/ops-06-expenses
