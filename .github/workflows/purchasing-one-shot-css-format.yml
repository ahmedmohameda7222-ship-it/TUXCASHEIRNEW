name: Purchasing one-shot CSS formatter
on:
  push:
    branches:
      - fix/purchasing-approved-ui-production-20261025
    paths:
      - '.github/workflows/purchasing-one-shot-css-format.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Format Purchasing-only CSS
        run: npx prettier --write apps/admin/src/purchasing/purchasing.css
      - name: Push Purchasing-only formatting
        run: |
          if git diff --quiet -- apps/admin/src/purchasing/purchasing.css; then exit 0; fi
          test "$(git branch --show-current)" = 'fix/purchasing-approved-ui-production-20261025'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/admin/src/purchasing/purchasing.css
          git commit -m 'style(purchasing): apply Prettier to mobile sheet layout'
          git push origin HEAD:fix/purchasing-approved-ui-production-20261025
