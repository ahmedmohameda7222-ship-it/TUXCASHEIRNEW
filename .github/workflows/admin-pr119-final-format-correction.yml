name: PR 119 Scoped Format Correction

on:
  push:
    branches:
      - fix/admin-plans1-7-functional-completeness
    paths:
      - '.github/workflows/admin-pr119-final-format-correction.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Run canonical Prettier on reported files
        run: npx prettier --write "apps/admin/api/admin/shop-create.ts" "apps/admin/server/api-contracts/shopCreate.test.ts" "apps/admin/src/settings/CreateShopPanel.tsx" "apps/admin/src/settings/SettingsPage.test.tsx" "apps/admin/src/settings/SettingsPage.tsx" "apps/admin/api/admin/approval-rules.ts" "apps/admin/server/approvals/approvalRulePermissions.ts" "apps/admin/server/api-contracts/approvalRulesManagement.test.ts"
      - name: Commit source formatting
        run: |
          git add -u -- apps/admin/api/admin/shop-create.ts apps/admin/server/api-contracts/shopCreate.test.ts apps/admin/src/settings/CreateShopPanel.tsx apps/admin/src/settings/SettingsPage.test.tsx apps/admin/src/settings/SettingsPage.tsx apps/admin/api/admin/approval-rules.ts apps/admin/server/approvals/approvalRulePermissions.ts apps/admin/server/api-contracts/approvalRulesManagement.test.ts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(admin): format exact quality-gate findings'
            for attempt in 1 2 3; do
              git fetch origin fix/admin-plans1-7-functional-completeness
              git rebase origin/fix/admin-plans1-7-functional-completeness
              if git push origin HEAD:refs/heads/fix/admin-plans1-7-functional-completeness; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
            done
          fi
