name: Phase 4 Orders print service patch

on:
  push:
    branches:
      - feat/ops-04-orders

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ops-04-orders
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: python .phase4-orders-print-service.py
      - run: npx prettier --write packages/application/src/orders.ts packages/application/src/index.ts packages/application/src/orderPrinter.ts
      - name: Commit service patch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/application/src/orders.ts packages/application/src/index.ts packages/application/src/orderPrinter.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add post-commit receipt printing contract"
          git push origin HEAD:feat/ops-04-orders
