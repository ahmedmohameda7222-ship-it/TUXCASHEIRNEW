name: Temporary Menu Editor DragOver Fix

on:
  push:
    branches:
      - refactor/menu-layout-editor-long-term
    paths:
      - '.github/workflows/_temp_menu_editor_dragover_fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/menu-layout-editor-long-term
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply bounded drag-over wiring and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/operations/src/app/OrdersWorkspace.tsx')
          text = path.read_text()
          replacements = {
              'type DragMoveEvent,': 'type DragOverEvent,',
              'function handleMenuEditDragMove(event: DragMoveEvent): void {': 'function handleMenuEditDragOver(event: DragOverEvent): void {',
              'onDragMove={handleMenuEditDragMove}': 'onDragOver={handleMenuEditDragOver}',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected source: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          npx prettier --write apps/operations/src/app/OrdersWorkspace.tsx apps/operations/src/app/unifiedMenuEditMode.source.test.ts
          rm .github/workflows/_temp_menu_editor_dragover_fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/operations/src/app/OrdersWorkspace.tsx apps/operations/src/app/unifiedMenuEditMode.source.test.ts .github/workflows/_temp_menu_editor_dragover_fix.yml
          git diff --cached --check
          git commit -m 'fix(menu-editor): apply sortable drag-over updates'
          git push origin HEAD:refactor/menu-layout-editor-long-term
