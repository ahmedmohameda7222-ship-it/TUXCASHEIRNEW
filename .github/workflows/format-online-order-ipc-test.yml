name: Format Online Order IPC Test

on:
  push:
    branches:
      - work/menu-online-orders-integration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/menu-online-orders-integration
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/operations-desktop/src/main/onlineOrderInboxIpc.test.ts
      - name: Commit formatter result
        shell: bash
        run: |
          if git diff --quiet -- apps/operations-desktop/src/main/onlineOrderInboxIpc.test.ts; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/operations-desktop/src/main/onlineOrderInboxIpc.test.ts
          git commit -m 'style(online-orders): format ipc acceptance test'
          git push origin HEAD:work/menu-online-orders-integration
