name: Phase 11 Board State Fix

on:
  pull_request:
    branches:
      - test/ops-11-rendered-qa

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test/ops-11-rendered-qa
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Close details drawer when Mark Done succeeds
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/operations/src/app/OrdersBoardWorkspace.tsx')
          text = path.read_text()
          old = "    if (changed) setUndo({ orderId: order.id, expiresAt: Date.now() + 7_000 });\n"
          new = "\n".join([
              "    if (changed) {",
              "      setSelected(null);",
              "      setUndo({ orderId: order.id, expiresAt: Date.now() + 7_000 });",
              "    }",
          ]) + "\n"
          if old not in text:
              raise SystemExit('Mark Done state target not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write apps/operations/src/app/OrdersBoardWorkspace.tsx
          rm .github/workflows/phase11-board-state-fix.yml
      - name: Commit Board state fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/operations/src/app/OrdersBoardWorkspace.tsx .github/workflows/phase11-board-state-fix.yml
          git commit -m "fix(operations): close Board drawer after Done"
          git push origin HEAD:test/ops-11-rendered-qa
