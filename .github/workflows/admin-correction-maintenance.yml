name: Admin Correction Maintenance
on:
  push:
    branches:
      - fix/admin-production-runtime-performance
    paths:
      - '.github/workflows/admin-correction-maintenance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install existing lockfile
        run: npm ci
      - name: Update compatible Vitest and Electron security patches
        run: npm install --package-lock-only --ignore-scripts --save-dev --save-exact vitest@4.1.11 electron@43.7.9
      - name: Format Inventory regression
        run: npx prettier --write apps/admin/src/inventory/InventoryRoute.source.test.ts
      - name: Commit patch releases and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps/admin/src/inventory/InventoryRoute.source.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): adopt compatible Vitest and Electron security patches"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
