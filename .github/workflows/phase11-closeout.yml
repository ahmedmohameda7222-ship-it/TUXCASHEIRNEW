name: Phase 11 Closeout

on:
  pull_request:
    branches:
      - test/ops-11-rendered-qa

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test/ops-11-rendered-qa
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Synchronize compliance and QA documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          matrix_path = Path('docs/OPERATIONS_COMPLIANCE_MATRIX.md')
          lines = matrix_path.read_text().splitlines()
          pass_ids = {
              'OPS-002','OPS-003','OPS-004','OPS-005','OPS-006','OPS-007',
              'START-002','START-003','START-004','START-005','START-006',
              'ORD-001','ORD-002','ORD-003','ORD-004','ORD-005','ORD-006','ORD-007','ORD-009','ORD-010','ORD-011','ORD-012','ORD-034',
              'BOARD-004','BOARD-005','BOARD-006','BOARD-007','BOARD-008','BOARD-010','BOARD-011','BOARD-012','BOARD-013','BOARD-016','BOARD-017','BOARD-018','BOARD-019',
              'EXP-006','EXP-008','EXP-009','BULK-001','END-002','END-013','END-014','END-025',
          }
          shell_ids = {'OPS-002','OPS-003','OPS-004','OPS-005','OPS-006','OPS-007'}
          start_ids = {'START-002','START-003','START-004','START-005','START-006'}
          output = []
          seen = set()
          for line in lines:
              if not line.startswith('|'):
                  output.append(line)
                  continue
              cells = line.split('|')
              if len(cells) < 10:
                  output.append(line)
                  continue
              row_id = cells[1].strip()
              if row_id in pass_ids:
                  seen.add(row_id)
                  if row_id in shell_ids:
                      cells[4] = ' `apps/operations/src/app/App.tsx` '
                  elif row_id in start_ids:
                      cells[4] = ' `packages/application/src/session.ts`; `apps/operations/src/app/App.tsx` '
                  existing_tests = cells[6].strip()
                  phase11 = 'Phase 11 Playwright run `32188417130`'
                  cells[6] = f' {existing_tests}; {phase11} ' if existing_tests not in ('', '—') else f' {phase11} '
                  cells[7] = ' PASS '
                  cells[8] = ' Rendered desktop/mobile interaction evidence passed in the final Board-fixed Phase 11 run; console/page-error guard and horizontal-overflow assertions were clean. '
                  line = '|'.join(cells)
              elif row_id == 'START-001':
                  seen.add(row_id)
                  cells[4] = ' `apps/operations/src/app/App.tsx` '
                  cells[6] = ' Phase 11 Playwright run `32188417130` '
                  cells[7] = ' BLOCKED '
                  cells[8] = ' Approved locked-screen copy/layout renders correctly, but the approved graphic TUX logo asset is not present in the V2 repository; current UI uses a typographic `TUX` fallback. '
                  line = '|'.join(cells)
              elif row_id == 'OPS-001':
                  seen.add(row_id)
                  cells[8] = ' Operations is isolated and exposes no Admin UI. The separate TUX Admin browser application is intentionally a later separately-designed scope under canonical §1.2 and is not implemented in this Operations phase. '
                  line = '|'.join(cells)
              output.append(line)
          missing = (pass_ids | {'START-001','OPS-001'}) - seen
          if missing:
              raise SystemExit(f'Compliance rows not found: {sorted(missing)}')
          matrix_path.write_text('\n'.join(output) + '\n')

          log_lines = [
              '',
              '## 2026-08-18 — Phase 11 rendered Operations QA completed',
              '',
              '- Browser plugin was unavailable in this session, so rendered validation used the approved Playwright fallback against the production-built React renderer with the typed desktop API boundary injected before boot.',
              '- Final authoritative run `32188417130` passed all five scenarios: Start/PIN/greeting + exact shell navigation, desktop Orders, Orders Board + Expenses + Bulk Stock, End Day through post-close lock, and 390×844 mobile Orders/cart.',
              '- The final suite also asserted no relevant console/page errors, no horizontal overflow, direct product `+ / −`, Sold Out disablement, image fallback, Quick Info/modifiers, separate notes, Delivery validation/autofill, Board search/orderings/dialogs/Done Undo, Expenses dialogs, Bulk Stock actions, blind reconciliation, and post-close locked state.',
              '- Rendered QA found and fixed three real product issues before the passing run: Quick Info remained mounted over Product Customizer; Board Done Undo was obscured by the details drawer flow; desktop product cards compressed names too aggressively at wide desktop widths.',
              '- The final screenshots show legible desktop product names, preserved two-panel Orders/cart composition, responsive mobile cart, clean Board/Expenses/Bulk Stock views, Final Closing Summary, and the locked No Active Business Day state.',
              '- `START-001` remains `BLOCKED` only for the missing approved graphic TUX logo asset; the approved copy and screen behavior are rendered and validated with the existing typographic fallback.',
              '- `OPS-001` remains outside the completed Operations implementation because the canonical plan explicitly defers detailed TUX Admin information architecture to a separate design phase after Operations is frozen.',
              '- No Supabase project was linked and no remote migration was applied.',
              '',
          ]
          log = Path('docs/IMPLEMENTATION_LOG.md')
          current = log.read_text()
          if '## 2026-08-18 — Phase 11 rendered Operations QA completed' not in current:
              log.write_text(current.rstrip() + '\n' + '\n'.join(log_lines))

          strategy_lines = [
              '',
              '## Phase 11 rendered Operations QA',
              '',
              '- Renderer validation uses Playwright only because the Browser plugin was not available in the implementation session.',
              '- Business/domain correctness remains proven by the existing domain and SQLite integration suites; the Playwright fixture injects only the typed desktop capability boundary and exercises the real React components/CSS.',
              '- Authoritative rendered run: `32188417130` — five scenarios passed on the final Board-fixed product tree.',
              '- Desktop evidence covers Start/locked shell, Orders, Orders Board, Expenses, Bulk Stock and End Day; mobile evidence covers the 390×844 Orders/cart-sheet flow.',
              '- Every rendered scenario guards relevant console warnings/errors and page errors; desktop/mobile flows assert no document-level horizontal overflow.',
              '- Phase 11 deliberately leaves the missing approved graphic TUX logo asset visible as `START-001 = BLOCKED` rather than treating the typographic fallback as equivalent evidence.',
              '',
          ]
          strategy = Path('docs/TEST_STRATEGY.md')
          current = strategy.read_text()
          if '## Phase 11 rendered Operations QA' not in current:
              strategy.write_text(current.rstrip() + '\n' + '\n'.join(strategy_lines))
          PY
      - name: Remove temporary Phase 11 QA infrastructure
        run: |
          rm -f \
            .github/workflows/phase11-product-polish.yml \
            .github/workflows/phase11-refine-selectors.yml \
            .github/workflows/phase11-rendered-qa.yml \
            .github/workflows/phase11-targeted-qa.yml \
            .github/workflows/phase11-closeout.yml \
            .phase11-refine.trigger \
            .phase11-targeted.trigger
      - name: Format and commit closeout
        run: |
          npx prettier --write apps/operations/src/app/OrdersWorkspace.tsx apps/operations/src/app/OrdersBoardWorkspace.tsx apps/operations/src/main.tsx apps/operations/src/styles/phase11-fixes.css
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs(operations): close Phase 11 rendered QA"
          git push origin HEAD:test/ops-11-rendered-qa
