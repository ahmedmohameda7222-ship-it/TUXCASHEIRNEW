name: Task 5C WhatsApp IndexedDB TDD

on:
  push:
    branches:
      - feat/ops-whatsapp-task5c-red

jobs:
  tdd:
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Task 5C RED
        run: npm test -- packages/persistence/src/browser/IndexedDbWhatsAppStore.test.ts
