name: Verify TUX UI alignment targeted

on:
  push:
    branches:
      - ui/tux-input-alignment-fixes

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    env:
      VERIFIED_SHA: d925b77a46754399367ae3fbca5ae2e4200ff7bc
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.VERIFIED_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Alignment source contracts
        run: npx vitest run apps/operations/src/styles/ui-alignment.test.ts
      - name: E2E typecheck
        run: npm run typecheck:e2e
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Rendered alignment regression
        run: npx playwright test e2e/operations.e2e.ts --project=desktop-browser-fallback --grep "long-term UI alignment contracts render correctly"
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tux-ui-alignment-targeted-${{ env.VERIFIED_SHA }}
          path: test-results/**
          if-no-files-found: warn
