name: Task 3B WhatsApp Server Verification

on:
  push:
    branches:
      - 'feat/ops-whatsapp-task3b-red'

permissions:
  contents: read

jobs:
  task3b-green:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Task 3B focused tests
        run: >-
          npm test --
          server/whatsappServerConfig.test.ts
          server/whatsappChannelResolver.test.ts
          server/whatsappProviderGateway.test.ts
      - name: Typecheck
        run: npm run typecheck
