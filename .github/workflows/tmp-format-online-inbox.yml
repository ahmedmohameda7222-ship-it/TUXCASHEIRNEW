name: Temporary online inbox formatter

on:
  push:
    branches:
      - work/menu-online-orders-integration

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, 'chore(ci): add one-shot online inbox formatter')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/menu-online-orders-integration
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write packages/persistence/src/onlineOrderInboxStore.contract.test.ts
      - name: Commit exact Prettier output
        run: |
          git config user.name "ahmedmohameda7222-ship-it"
          git config user.email "ahmed.mohameda7222@gmail.com"
          git add packages/persistence/src/onlineOrderInboxStore.contract.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required"
          else
            git commit -m "test(persistence): format online-order inbox contract"
            git push origin HEAD:work/menu-online-orders-integration
          fi
