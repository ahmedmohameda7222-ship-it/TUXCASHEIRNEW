name: Admin Plan 2 Format Fix

on:
  push:
    branches:
      - feat/admin-02-catalog-settings
    paths:
      - '.github/workflows/admin-plan2-format-fix.yml'
      - 'apps/admin/src/settings/SettingsPage.tsx'
      - 'apps/admin/src/settings/SettingsPage.test.tsx'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/admin-02-catalog-settings
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format settings routing files
        run: npx prettier --write apps/admin/src/settings/SettingsPage.tsx apps/admin/src/settings/SettingsPage.test.tsx
      - name: Commit formatting only when needed
        run: |
          if git diff --quiet -- apps/admin/src/settings/SettingsPage.tsx apps/admin/src/settings/SettingsPage.test.tsx; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/admin/src/settings/SettingsPage.tsx apps/admin/src/settings/SettingsPage.test.tsx
          git commit -m 'style(admin): format settings routing fix'
          git push origin HEAD:feat/admin-02-catalog-settings
