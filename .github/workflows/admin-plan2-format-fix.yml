name: Plan 2 Format Fix

on:
  push:
    branches:
      - feat/admin-02-catalog-settings
    paths:
      - '.github/workflows/admin-plan2-format-fix.yml'

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply repository Prettier to CAS editor
        run: npx prettier --write apps/admin/src/settings/SettingOverrideEditor.tsx
      - name: Verify exact formatting
        run: npx prettier --check apps/admin/src/settings/SettingOverrideEditor.tsx
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/settings/SettingOverrideEditor.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes were necessary."
            exit 0
          fi
          git diff --cached --check
          git commit -m "style(admin): apply repository Prettier to CAS editor"
          git push origin HEAD:feat/admin-02-catalog-settings
