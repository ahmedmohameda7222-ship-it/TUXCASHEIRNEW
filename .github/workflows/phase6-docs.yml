          "| EXP-005 | Other expense does not change drawer Expected Cash. | Expenses | — | — | — | NOT_STARTED | Appendix B approved decision register |": "| EXP-005 | Other expense does not change drawer Expected Cash. | Expenses | `calculateExpenseTotals`; `OperationsExpensesService.loadLedger` | Exact Cash-only projection separate from Total Expenses | Domain + Expenses SQLite integration tests | PASS | Other contributes to Total Expenses but not `cashExpensesMinor`, proven with mixed Cash/Other fixtures. |",
