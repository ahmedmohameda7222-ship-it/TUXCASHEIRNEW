          text = matrix.read_text()
          replacements = {
          "| EXP-001 | Current Business Day operational ledger. | Expenses | — | — | — | NOT_STARTED | Appendix B approved decision register |": "| EXP-001 | Current Business Day operational ledger. | Expenses | `OperationsExpensesService.loadLedger`; `ExpensesWorkspace.tsx` | `ExpenseLedgerStore.listByBusinessDay(businessDayId)` | Expenses SQLite integration test | PASS | Service resolves the immutable currently OPEN Business Day and the integration test proves a closed historical day is excluded independent of calendar date. |",
