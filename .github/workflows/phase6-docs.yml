          "| EXP-003 | Paid From = Cash / Other. | Expenses | — | — | — | NOT_STARTED | Appendix B approved decision register |": "| EXP-003 | Paid From = Cash / Other. | Expenses | `expense.ts`; `ExpensesWorkspace.tsx` | `paidFrom = CASH | OTHER` | Domain + Expenses SQLite integration tests | PASS | Only Cash/Other are accepted and both durable paths are covered. |",
