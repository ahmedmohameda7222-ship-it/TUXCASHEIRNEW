name: Phase 6 Documentation Sync

on:
  push:
    branches:
      - feat/ops-06-expenses
    paths:
      - '.phase6-docs.trigger'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ops-06-expenses
          fetch-depth: 0
      - name: Synchronize Phase 6 documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Architecture
          replace(
              'docs/ARCHITECTURE.md',
              '  Orders/Orders Board/session services and native capability ports',
              '  Orders/Orders Board/Expenses/session services and native capability ports',
          )
          replace(
              'docs/ARCHITECTURE.md',
              '''The Orders Board renderer uses the same typed application boundary in browser fallback and narrow validated Electron IPC on desktop. It never receives raw storage/native access.

## Receipt printing boundary''',
              '''The Orders Board renderer uses the same typed application boundary in browser fallback and narrow validated Electron IPC on desktop. It never receives raw storage/native access.

## Expenses command boundary

`OperationsExpensesService` owns the current-Business-Day operational Expenses ledger. Manual create/edit/delete commands require the currently open Business Day and Current Operator, use exact `MoneyMinor`, and serialize through the shared application coordinator.

Manual removal is an audited soft-delete: the entry leaves the operational ledger and totals but its durable record remains historical. `CASH` and `OTHER` both contribute to Total Expenses; only `CASH` contributes to the separate `cashExpensesMinor` projection consumed later by End Day reconciliation. System `DELIVERY_FAILED` records are read-only, keep `amount = null`, and never contribute to either total.

Expense mutations use a dedicated `ExpenseLedgerStore`, analogous to the separate draft store. SQLite and IndexedDB adapters atomically persist the manual expense state, audit event, and durable outbox event while re-validating Business Day/operator context and optimistic expense revision. Electron exposes only typed Expenses IPC; the renderer receives no SQLite handle.

## Receipt printing boundary''',
          )
          replace(
              'docs/ARCHITECTURE.md',
              '''Durable Orders drafts deliberately live behind a separate `OrderDraftStore` contract because draft editing is not a placed-business transaction. Both SQLite and IndexedDB adapters provide revision-aware draft persistence; checkout business effects still occur only inside `OperationsDatabase.transaction()`.
''',
              '''Durable Orders drafts deliberately live behind a separate `OrderDraftStore` contract because draft editing is not a placed-business transaction. Both SQLite and IndexedDB adapters provide revision-aware draft persistence; checkout business effects still occur only inside `OperationsDatabase.transaction()`.

Current-day manual Expenses use the separate `ExpenseLedgerStore` contract. It shares the same physical SQLite/IndexedDB data with Operations but narrows the mutation surface to revision-checked manual expense changes plus their audit/outbox effects in one durable transaction. Existing `DELIVERY_FAILED` records remain readable through the ledger without becoming editable.
''',
          )

          # Data model Expenses section
          replace(
              'docs/DATA_MODEL.md',
              '''`null` is intentional and means there is no financial expense amount. It is not equivalent to zero.

A DONE Delivery marked Delivery Failed keeps its historical order total/payment snapshot for audit/receipt history, while the return audit/outbox facts explicitly state zero recognized revenue, zero collected payment, reconciliation exclusion, and no inventory restoration. The linked `DELIVERY_FAILED` Expense remains non-financial.
''',
              '''`null` is intentional and means there is no financial expense amount. It is not equivalent to zero.

Phase 6 projects manual Expenses through `ExpenseLedgerRecord`. Manual rows carry operational lifecycle metadata (`revision`, last edit attribution/time, soft-delete attribution/time). Legacy manual rows without lifecycle metadata are upgraded in memory to revision zero. Editing preserves immutable identity and original creation time. Delete is a soft-delete: it removes the row from the current operational ledger/totals while preserving the durable database fact and audit history.

`calculateExpenseTotals()` returns two exact projections: `totalExpensesMinor` includes every active manual Cash/Other expense, while `cashExpensesMinor` includes only active manual Cash expenses for later Expected Cash calculation. `DELIVERY_FAILED` and soft-deleted manual rows contribute to neither projection.

A DONE Delivery marked Delivery Failed keeps its historical order total/payment snapshot for audit/receipt history, while the return audit/outbox facts explicitly state zero recognized revenue, zero collected payment, reconciliation exclusion, and no inventory restoration. The linked `DELIVERY_FAILED` Expense remains non-financial and locked from manual edit/delete.
''',
          )
          replace(
              'docs/DATA_MODEL.md',
              '''Placed Orders append `ORDER_PLACED` audit/outbox records inside the same transaction as Order/inventory/customer facts. Phase 5 Board transitions similarly append `ORDER_MARKED_DONE`, `ORDER_DONE_UNDONE`, `ORDER_CANCELLED`, or `DELIVERY_RETURNED` audit/outbox work in the same local transaction as the corresponding lifecycle, compensation, or Delivery Failed expense facts. Operational outbox idempotency keys include order lifecycle revision so retries do not ambiguously identify different corrections.
''',
              '''Placed Orders append `ORDER_PLACED` audit/outbox records inside the same transaction as Order/inventory/customer facts. Phase 5 Board transitions similarly append `ORDER_MARKED_DONE`, `ORDER_DONE_UNDONE`, `ORDER_CANCELLED`, or `DELIVERY_RETURNED` audit/outbox work in the same local transaction as the corresponding lifecycle, compensation, or Delivery Failed expense facts. Operational outbox idempotency keys include order lifecycle revision so retries do not ambiguously identify different corrections.

Phase 6 manual Expense create/edit/delete also commits its audit and outbox intent atomically with the revision-checked expense mutation. Expense outbox identity includes immutable Expense ID, lifecycle revision, and event type so separate corrections cannot collapse into one sync identity.
''',
          )

          # Offline / sync
          replace(
              'docs/OFFLINE_AND_SYNC.md',
              '''The historical order items/fulfillment/total/payment snapshot is never rewritten by these corrections. If any local write in a correction fails, the transaction rolls back as a unit. Cloud availability is not part of success.

## Printing after local commit''',
              '''The historical order items/fulfillment/total/payment snapshot is never rewritten by these corrections. If any local write in a correction fails, the transaction rolls back as a unit. Cloud availability is not part of success.

## Expenses local ledger mutations

Manual Expense create/edit/delete is also local-first. The application first resolves the current open Business Day and Current Operator, then the `ExpenseLedgerStore` re-validates both inside the durable mutation boundary before writing.

```text
manual expense create/edit/soft-delete
→ revision/context check
→ write manual expense state
→ append audit event
→ append durable outbox event
→ one local commit
```

If audit/outbox persistence fails, the manual expense mutation rolls back with it. SQLite integration explicitly injects an outbox primary-key collision and proves that neither the Expense nor its audit row partially survives. `DELIVERY_FAILED` records remain read-only/non-financial. Soft-deleted manual rows remain stored but are excluded from the operational list and exact Cash/Total projections.

## Printing after local commit''',
          )
          replace(
              'docs/OFFLINE_AND_SYNC.md',
              '''Phase 4 checkout writes `ORDER_PLACED` outbox work inside the same transaction as the order/inventory/audit mutation. Phase 5 Board transitions likewise write their audit/outbox work atomically with status/lifecycle and any cancellation-restock or Delivery Failed expense effects. No remote network call is needed for checkout or Board-transition success.
''',
              '''Phase 4 checkout writes `ORDER_PLACED` outbox work inside the same transaction as the order/inventory/audit mutation. Phase 5 Board transitions likewise write their audit/outbox work atomically with status/lifecycle and any cancellation-restock or Delivery Failed expense effects. Phase 6 manual Expense create/edit/delete writes the corresponding expense revision plus audit/outbox work atomically. No remote network call is needed for checkout, Board-transition, or Expense-ledger success.
''',
          )

