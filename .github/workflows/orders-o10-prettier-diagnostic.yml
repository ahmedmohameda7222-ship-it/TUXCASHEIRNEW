name: Temporary Orders O10 Prettier exact diff
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/orders-o10-prettier-diagnostic.yml']
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Print exact formatter diff
        run: |
          npx prettier --write e2e/admin-orders.spec.ts
          git diff --no-ext-diff --unified=3 -- e2e/admin-orders.spec.ts
          echo ORDERS_O10_FORMAT_END
