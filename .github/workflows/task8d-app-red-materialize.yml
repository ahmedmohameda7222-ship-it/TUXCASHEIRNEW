name: Task 8D App RED Materializer

on:
  push:
    branches:
      - work/operations-whatsapp-inbox-live

permissions:
  contents: write

jobs:
  materialize:
    if: contains(github.event.head_commit.message, 'seed Task 8D app RED materializer')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact Task 8D app RED tree
        shell: bash
        run: |
          set -euo pipefail
          cp .tux-live/task8d-app-red.patch /tmp/task8d-app-red.patch
          test "$(sha256sum /tmp/task8d-app-red.patch | cut -d' ' -f1)" = "9343314adb604f7b8770c28027e938b9aab3a46ea2cf2bfca4b23d4f601afbdf"
          git rm .tux-live/task8d-app-red.patch
          git rm .github/workflows/task8d-app-red-materialize.yml
          git apply --index /tmp/task8d-app-red.patch
          test "$(git write-tree)" = "f16fb749d7f7011010720b691236416b72bf762d"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "wip(task8d): red application messaging target"
          test "$(git rev-parse HEAD^{tree})" = "f16fb749d7f7011010720b691236416b72bf762d"
          git push origin HEAD:refs/heads/work/operations-whatsapp-inbox-live
