name: Reports PDF parser smoke
on:
  pull_request:
    paths:
      - apps/admin/server/reports/**
      - .github/workflows/reports-pdf-parser-smoke.yml
permissions:
  contents: read
jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Render synthetic 120-record PDF through production renderer
        run: |
          cat > apps/admin/server/reports/__temp_pdf_parser_smoke.test.ts <<'TS'
          import { writeFileSync } from 'node:fs';
          import { test } from 'vitest';
          import { renderAuthorizedReportPdf } from './reportPdfRenderer';
          test('render parsed PDF sample', () => {
            const count = 120;
            const section = {
              area: 'refunds' as const,
              summary: {
                eventCount: count, orderCount: count, totalAmountMinor: -12000,
                totalQuantity: count, incompleteCostEvents: 2,
                coverageNote: 'Two recorded costs are incomplete',
              },
              rows: Array.from({ length: count }, (_, i) => ({
                id: 'record-' + (i + 1), shopId: '11111111-1111-4111-8111-111111111111',
                occurredAt: '2026-10-29T09:00:00.000Z',
                label: i === count - 1 ? 'LAST AUTHORIZED RECORD SENTINEL' : 'Refund',
                sourceKind: 'refund', amountMinor: -100, quantity: 1, costMissing: i < 2,
              })),
            };
            const buffer = renderAuthorizedReportPdf({
              fromDate: '2026-10-01', toDate: '2026-10-29',
              selectedShops: ['11111111-1111-4111-8111-111111111111'],
              requestedAreaCount: 22, sections: [section],
            }, {
              generatedAt: '2026-10-29T10:00:00Z',
              shopNames: { '11111111-1111-4111-8111-111111111111': 'TUX Maadi' },
            });
            writeFileSync('/tmp/tux-report-parser-smoke.pdf', buffer);
          });
          TS
          npx vitest run apps/admin/server/reports/__temp_pdf_parser_smoke.test.ts
      - name: Parse PDF pages with pypdf and verify final source row
        run: |
          python3 -m venv /tmp/tux-pdf-venv
          /tmp/tux-pdf-venv/bin/pip -q install pypdf==5.9.0
          /tmp/tux-pdf-venv/bin/python - <<'PY'
          from pypdf import PdfReader
          p=PdfReader('/tmp/tux-report-parser-smoke.pdf')
          texts=[page.extract_text() or '' for page in p.pages]
          all_text='\n'.join(texts)
          assert len(p.pages)>=2, len(p.pages)
          assert 'LAST AUTHORIZED RECORD SENTINEL' in all_text
          assert 'record-120' in all_text
          assert 'Cost data incomplete' in all_text
          assert '-120.00 EGP' in all_text
          print('PARSED_PDF_OK',len(p.pages),'pages, last authorized record present')
          PY
