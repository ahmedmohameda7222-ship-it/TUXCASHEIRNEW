name: Admin Plan 7 Finance & Reports TDD

concurrency:
  group: admin-plan7-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [feat/admin-07-finance-reports]
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/test-admin-plan7-**'
      - 'apps/admin/**'
      - 'packages/admin-contracts/**'
      - '.github/workflows/admin-plan7-finance-reports-tdd.yml'

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Capture deterministic formatter output
        run: |
          for file in apps/admin/server/finance/calculations.ts apps/admin/server/finance/calculations.test.ts apps/admin/server/finance/financeApi.ts apps/admin/src/finance/useFinance.ts apps/admin/src/finance/money.ts apps/admin/src/finance/money.test.ts apps/admin/src/finance/FinancePage.tsx packages/admin-contracts/src/finance.ts packages/admin-contracts/src/endDay.ts packages/admin-contracts/src/reports.ts; do
            echo "FORMAT_BEGIN_${file}"
            npx prettier "$file" | base64 -w0
            echo
            echo "FORMAT_END_${file}"
          done

  schema-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: node scripts/test-admin-plan7-migration.mjs
      - run: node scripts/test-admin-plan7-materialization-migration.mjs
      - run: node scripts/test-admin-plan7-finance-setup-migration.mjs
      - run: node scripts/test-admin-plan7-workspace-migration.mjs

  schema-postgres:
    needs: schema-invariants
    runs-on: ubuntu-latest
    env: { TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres }
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - run: node scripts/test-admin-plan7-postgres.mjs
      - run: node scripts/test-admin-plan7-materialization-postgres.mjs
      - run: node scripts/test-admin-plan7-setup-postgres.mjs

  regression:
    needs: schema-postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Preview Plan 7 Prettier formatting
        run: |
          echo PRETTIER_CALCULATIONS_BEGIN
          npx prettier apps/admin/server/finance/calculations.ts | base64 -w0
          echo
          echo PRETTIER_CALCULATIONS_END
          echo PRETTIER_TEST_BEGIN
          npx prettier apps/admin/server/finance/calculations.test.ts | base64 -w0
          echo
          echo PRETTIER_TEST_END
      - run: npm run format:check
      - run: npm run lint
      - run: npx vitest run apps/admin/server/finance/calculations.test.ts apps/admin/src/finance/money.test.ts
      - run: npm run typecheck
      - run: npm run test:admin-security
      - run: npm run test:admin-deployment
      - run: npm run test:migrations
