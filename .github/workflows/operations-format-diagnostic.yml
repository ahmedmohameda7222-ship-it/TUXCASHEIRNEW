name: Operations formatting diagnostic
on:
  pull_request:
    paths:
      - 'apps/operations/src/app/**'
      - '.github/workflows/operations-format-diagnostic.yml'
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Print required formatting delta
        run: |
          npx prettier --write apps/operations/src/app/browserRemote.ts apps/operations/src/app/businessDayPreflight.test.ts apps/operations/src/app/businessDayPreflight.ts apps/operations/src/app/sessionClient.ts
          git diff --unified=0 -- apps/operations/src/app/browserRemote.ts apps/operations/src/app/businessDayPreflight.test.ts apps/operations/src/app/businessDayPreflight.ts apps/operations/src/app/sessionClient.ts
