name: Plan 5 Format Artifact

on:
  push:
    branches:
      - feat/admin-05-orders-customers-delivery-v2
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository formatter
        run: |
          npx prettier --write "api/**/*.{ts,tsx}" "server/**/*.{ts,tsx}" "apps/**/*.{ts,tsx,css,html,json}" "packages/**/*.{ts,tsx,css,json}" "e2e/**/*.{ts,tsx,mjs}" "*.{json,mjs,ts}" ".github/**/*.yml"

      - name: Emit formatted payload
        shell: bash
        run: |
          git diff --check
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');

          const changed = execFileSync('git', ['diff', '--name-only', '-z'])
            .toString('utf8')
            .split('\0')
            .filter(Boolean);

          for (const path of changed) {
            const encodedPath = Buffer.from(path, 'utf8').toString('base64');
            const encodedContent = fs.readFileSync(path).toString('base64');
            console.log(`FORMAT_BEGIN ${encodedPath}`);
            for (let offset = 0; offset < encodedContent.length; offset += 30000) {
              console.log(`FORMAT_CHUNK ${encodedContent.slice(offset, offset + 30000)}`);
            }
            console.log('FORMAT_END');
          }
          NODE
