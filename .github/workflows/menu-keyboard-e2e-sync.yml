name: Menu Keyboard E2E Sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.number == 44 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Synchronize keyboard acceptance and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          helpers = Path('e2e/menu-layout-editor-test-helpers.ts')
          text = helpers.read_text()
          old = "  return page.getByLabel('Menu categories').locator('.category-tab');"
          new = "  return page.getByLabel('Menu categories').locator('.category-tab:not(.menu-edit-drag-overlay)');"
          if text.count(old) != 1:
              raise SystemExit('category helper source changed')
          helpers.write_text(text.replace(old, new, 1))

          spec = Path('e2e/menu-layout-editor.e2e.ts')
          text = spec.read_text()
          old = "\n".join([
              "async function keyboardMove(locator: Locator, key: 'ArrowLeft' | 'ArrowRight' | 'ArrowDown') {",
              "  await locator.focus();",
              "  await locator.press('Space');",
              "  await locator.press(key);",
              "  await locator.press('Space');",
              "}",
          ])
          new = "\n".join([
              "async function keyboardMove(",
              "  page: Parameters<typeof menuCategoryTabs>[0],",
              "  locator: Locator,",
              "  key: 'ArrowLeft' | 'ArrowRight' | 'ArrowDown',",
              ") {",
              "  await locator.focus();",
              "  await page.keyboard.press('Space');",
              "  await expect(page.locator('.category-tab-grabbed, .menu-edit-product-card-grabbed')).toHaveCount(1);",
              "  await page.keyboard.press(key);",
              "  await expect(page.locator('.menu-pane .sr-only')).toContainText('moved to position');",
              "  await page.keyboard.press('Space');",
              "  await expect(page.locator('.category-tab-grabbed, .menu-edit-product-card-grabbed')).toHaveCount(0);",
              "}",
          ])
          if text.count(old) != 1:
              raise SystemExit('keyboard helper source changed')
          text = text.replace(old, new, 1)
          text = text.replace("await keyboardMove(cards.nth(1), 'ArrowDown');", "await keyboardMove(page, cards.nth(1), 'ArrowDown');")
          text = text.replace("await keyboardMove(cards.nth(1), 'ArrowLeft');", "await keyboardMove(page, cards.nth(1), 'ArrowLeft');")
          text = text.replace("await keyboardMove(categories.nth(0), 'ArrowRight');", "await keyboardMove(page, categories.nth(0), 'ArrowRight');")
          old = "\n".join([
              "  await cards.nth(1).focus();",
              "  await cards.nth(1).press('Space');",
              "  await cards.nth(1).press('ArrowLeft');",
              "  await expect(cards.nth(0)).toContainText('Double Smashed Patty');",
          ])
          new = "\n".join([
              "  await cards.nth(1).focus();",
              "  await page.keyboard.press('Space');",
              "  await expect(page.locator('.menu-edit-product-card-grabbed')).toHaveCount(1);",
              "  await page.keyboard.press('ArrowLeft');",
              "  await expect(page.locator('.menu-pane .sr-only')).toContainText('moved to position');",
              "  await expect(cards.nth(0)).toContainText('Double Smashed Patty');",
          ])
          if text.count(old) != 1:
              raise SystemExit('pickup rollback source changed')
          spec.write_text(text.replace(old, new, 1))
          PY
          npx prettier e2e/menu-layout-editor-test-helpers.ts e2e/menu-layout-editor.e2e.ts --write
          rm .github/workflows/menu-keyboard-e2e-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/menu-layout-editor-test-helpers.ts e2e/menu-layout-editor.e2e.ts .github/workflows/menu-keyboard-e2e-sync.yml
          git diff --cached --check
          git commit -m 'test(menu-editor): synchronize keyboard drag acceptance'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
