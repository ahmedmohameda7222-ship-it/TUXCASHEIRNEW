name: TUX Admin Recurring Expenses Due

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tux-admin-recurring-expenses
  cancel-in-progress: false

jobs:
  generate-due-only:
    runs-on: ubuntu-latest
    steps:
      - name: Generate due expense reminders through authenticated Admin API
        env:
          ADMIN_BASE_URL: ${{ vars.TUX_ADMIN_RECURRING_BASE_URL }}
          RECURRING_SECRET: ${{ secrets.TUX_ADMIN_RECURRING_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${ADMIN_BASE_URL}" || -z "${RECURRING_SECRET}" ]]; then
            echo "Recurring scheduler URL or secret missing; configure repository Actions variables/secrets" >&2
            exit 1
          fi
          case "${ADMIN_BASE_URL}" in
            https://*) ;;
            *) echo "Recurring scheduler requires a secure HTTPS Admin origin" >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error --retry 2 --max-time 45 \
            --header "Authorization: Bearer ${RECURRING_SECRET}" \
            "${ADMIN_BASE_URL%/}/api/cron/admin-recurring-expenses"
