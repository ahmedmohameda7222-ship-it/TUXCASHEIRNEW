name: Format Diagnostic

on:
  push:
    branches:
      - feat/apple-product-card-reorder

permissions:
  contents: write

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/apple-product-card-reorder
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Apply Prettier to current implementation files
        run: |
          npx prettier --write apps/operations/src/app/OrdersWorkspace.tsx apps/operations/src/app/ProductPositionEditor.tsx
          if test -n "$(git status --porcelain -- apps/operations/src/app/OrdersWorkspace.tsx apps/operations/src/app/ProductPositionEditor.tsx)"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/operations/src/app/OrdersWorkspace.tsx apps/operations/src/app/ProductPositionEditor.tsx
            git commit -m "style: format product reorder implementation"
            git push origin HEAD:feat/apple-product-card-reorder
          fi
