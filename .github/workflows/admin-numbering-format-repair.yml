name: Admin Numbering Format Repair

on:
  pull_request:
    paths:
      - '.github/workflows/admin-numbering-format-repair.yml'

permissions:
  contents: write

jobs:
  format-repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format numbering slice only
        run: npx prettier --write packages/domain/src/businessDay.ts packages/domain/src/businessDay.receiptNumbering.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/domain/src/businessDay.ts packages/domain/src/businessDay.receiptNumbering.test.ts
          git commit -m 'style(settings): format receipt numbering slice'
          git push origin HEAD:${GITHUB_HEAD_REF}
