name: Phase B planner fixes

on:
  push:
    branches:
      - feat/menu-layout-persistence-phase-b
    paths:
      - .github/workflows/phase-b-planner-fixes.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/menu-layout-persistence-phase-b
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply bounded Phase B planner fixes
        run: |
          sed -i "s/'preferencesClient', 'menuLayoutClient', 5/'preferencesClient', 'menuLayoutClient', 4/" .github/scripts/phase_b_planner_fixes.py
          python3 .github/scripts/phase_b_planner_fixes.py
      - name: Format affected files
        run: >-
          npx prettier --write
          packages/application/src/workerMenuLayout.ts
          packages/application/src/workerMenuLayout.test.ts
          apps/operations/src/app/sessionClient.ts
          apps/operations/src/app/menuLayoutEditorSession.ts
          apps/operations/src/app/menuLayoutEditorSession.test.ts
          apps/operations/src/app/menuProductOrder.ts
          apps/operations/src/app/OrdersWorkspace.tsx
          apps/operations/src/app/OrdersWorkspace.test.ts
          apps/operations/src/app/unifiedMenuEditMode.source.test.ts
      - name: Focused affected tests
        run: >-
          npx vitest run
          packages/application/src/workerMenuLayout.test.ts
          apps/operations/src/app/menuLayoutEditorSession.test.ts
          apps/operations/src/app/OrdersWorkspace.test.ts
          apps/operations/src/app/menuProductOrder.test.ts
          apps/operations/src/app/unifiedMenuEditMode.source.test.ts
          apps/operations/src/app/menuLayoutEditorWorkspaceIntegration.source.test.ts
      - name: Focused typecheck
        run: |
          npm run typecheck -w @tux/application
          npm run typecheck -w @tux/operations
      - name: Commit verified fixes to existing branch
        run: |
          git rm .github/workflows/phase-b-planner-fixes.yml .github/scripts/phase_b_planner_fixes.py
          git add \
            packages/application/src/workerMenuLayout.ts \
            packages/application/src/workerMenuLayout.test.ts \
            apps/operations/src/app/sessionClient.ts \
            apps/operations/src/app/menuLayoutEditorSession.ts \
            apps/operations/src/app/menuLayoutEditorSession.test.ts \
            apps/operations/src/app/menuProductOrder.ts \
            apps/operations/src/app/OrdersWorkspace.tsx \
            apps/operations/src/app/OrdersWorkspace.test.ts \
            apps/operations/src/app/unifiedMenuEditMode.source.test.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: address Phase B planner findings'
          git push origin HEAD:feat/menu-layout-persistence-phase-b
