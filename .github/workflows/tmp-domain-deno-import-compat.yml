name: Temporary Apply Domain Deno Import Repair

on:
  push:
    branches:
      - feat/admin-02-catalog-settings
    paths:
      - '.github/workflows/tmp-domain-deno-import-compat.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-proven-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/admin-02-catalog-settings
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.46.3
      - name: Install locked dependencies
        run: npm ci
      - name: Apply proven Deno-resolvable Domain graph
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          targets = [
              'packages/domain/src/configurationBundle.ts',
              'packages/domain/src/catalog.ts',
              'packages/domain/src/ids.ts',
              'packages/domain/src/json.ts',
              'packages/domain/src/money.ts',
              'packages/domain/src/models.ts',
              'packages/domain/src/quantity.ts',
              'packages/domain/src/settings.ts',
              'packages/domain/src/time.ts',
              'packages/domain/src/businessDay.ts',
              'packages/domain/src/brand.ts',
              'packages/domain/src/errors.ts',
          ]
          pattern = re.compile(r"(?P<prefix>\bfrom\s+|\bimport\s+)(?P<quote>['\"])(?P<spec>\.\.?/[^'\"]+)(?P=quote)")
          changed = []

          for raw in targets:
              path = Path(raw)
              text = path.read_text()

              def replace(match):
                  spec = match.group('spec')
                  if spec.endswith(('.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs', '.json')):
                      return match.group(0)
                  candidate = path.parent / spec
                  if Path(str(candidate) + '.ts').is_file():
                      resolved = spec + '.ts'
                  elif (candidate / 'index.ts').is_file():
                      resolved = spec.rstrip('/') + '/index.ts'
                  else:
                      return match.group(0)
                  return f"{match.group('prefix')}{match.group('quote')}{resolved}{match.group('quote')}"

              updated = pattern.sub(replace, text)
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))

          tsconfig_path = Path('packages/domain/tsconfig.json')
          tsconfig = json.loads(tsconfig_path.read_text())
          tsconfig['compilerOptions']['allowImportingTsExtensions'] = True
          tsconfig_path.write_text(json.dumps(tsconfig, indent=2) + '\n')

          if 'packages/domain/src/configurationBundle.ts' not in changed:
              raise SystemExit('configurationBundle.ts was not rewritten; refusing source commit.')
          print('Changed Domain files:')
          print('\n'.join(changed))
          PY
          git diff --check
      - name: Domain formatting check
        run: npx prettier --check packages/domain/src/configurationBundle.ts packages/domain/src/catalog.ts packages/domain/src/ids.ts packages/domain/src/json.ts packages/domain/src/money.ts packages/domain/src/models.ts packages/domain/src/quantity.ts packages/domain/src/settings.ts packages/domain/src/time.ts packages/domain/src/businessDay.ts packages/domain/src/brand.ts packages/domain/src/errors.ts packages/domain/tsconfig.json
      - name: Domain typecheck
        run: npm run typecheck -w @tux/domain
      - name: Domain regression tests
        run: npx vitest run packages/domain/src
      - name: Exact root Edge Function typechecks
        run: |
          deno check --config supabase/functions/device-enroll/deno.json supabase/functions/device-enroll/index.ts
          deno check --config supabase/functions/device-bootstrap/deno.json supabase/functions/device-bootstrap/index.ts
          deno check --config supabase/functions/operations-config/deno.json supabase/functions/operations-config/index.ts
          deno check --config supabase/functions/operations-sync/deno.json supabase/functions/operations-sync/index.ts
          deno check --config supabase/functions/worker-auth/deno.json supabase/functions/worker-auth/index.ts
          deno check --config supabase/functions/catalog-public/deno.json supabase/functions/catalog-public/index.ts
          deno check --config supabase/functions/catalog-admin/deno.json supabase/functions/catalog-admin/index.ts
          deno check --config supabase/functions/order-intake/deno.json supabase/functions/order-intake/index.ts
          deno check --config supabase/functions/online-order-operations/deno.json supabase/functions/online-order-operations/index.ts
      - name: Commit verified repair and remove temporary workflow
        run: |
          rm .github/workflows/tmp-domain-deno-import-compat.yml
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/tmp-domain-deno-import-compat.yml',
              'packages/domain/tsconfig.json',
              'packages/domain/src/configurationBundle.ts',
              'packages/domain/src/catalog.ts',
              'packages/domain/src/ids.ts',
              'packages/domain/src/json.ts',
              'packages/domain/src/money.ts',
              'packages/domain/src/models.ts',
              'packages/domain/src/quantity.ts',
              'packages/domain/src/settings.ts',
              'packages/domain/src/time.ts',
              'packages/domain/src/businessDay.ts',
              'packages/domain/src/brand.ts',
              'packages/domain/src/errors.ts',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'Unexpected changed paths: {sorted(unexpected)}')
          if 'packages/domain/src/configurationBundle.ts' not in changed:
              raise SystemExit('Expected Domain repair is absent.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/domain/src packages/domain/tsconfig.json .github/workflows/tmp-domain-deno-import-compat.yml
          git commit -m 'fix(domain): make config parser Deno-resolvable'
          git push origin HEAD:feat/admin-02-catalog-settings
