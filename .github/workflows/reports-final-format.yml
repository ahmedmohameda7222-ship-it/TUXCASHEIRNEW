name: Reports final code format
on:
  push:
    branches:
      - feat/admin-reports-r1-r5-report-first-20261029
    paths:
      - .github/workflows/reports-final-format.yml

permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx prettier --write apps/admin/server/reports/reportPdfExport.test.ts apps/admin/src/reports/ReportView.tsx apps/admin/src/reports/reportFirstLayout.test.tsx
      - name: Commit formatting on the isolated Reports branch
        run: |
          if ! git diff --quiet -- apps/admin/server/reports/reportPdfExport.test.ts apps/admin/src/reports/ReportView.tsx apps/admin/src/reports/reportFirstLayout.test.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/admin/server/reports/reportPdfExport.test.ts apps/admin/src/reports/ReportView.tsx apps/admin/src/reports/reportFirstLayout.test.tsx
            git commit -m "style(reports): align remaining source and tests to Prettier"
            git push
          fi
