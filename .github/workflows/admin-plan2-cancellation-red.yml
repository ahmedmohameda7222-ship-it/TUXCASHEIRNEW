name: Admin Plan 2 Cancellation Fallback RED

on:
  push:
    branches:
      - feat/admin-02-catalog-settings
    paths:
      - '.github/workflows/admin-plan2-cancellation-red.yml'
  workflow_dispatch:

jobs:
  cancellation-fallback-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Add rollout fallback behavior case in runner
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/application/src/ordersBoard.reasonCodes.sqlite.test.ts')
          s = p.read_text()
          marker = "  it('keeps free-text cancellation only for a genuinely pre-feature configuration snapshot', async () => {"
          if s.count(marker) != 1:
            raise SystemExit('cancellation RED insertion guard failed')
          case = r'''  it('keeps free-text cancellation during rollout when settings exist but no active cancellation vocabulary is published', async () => {
    const test = await fixture();
    try {
      await test.database.transaction((transaction) =>
        transaction.configuration.put({
          shopId,
          version: 12,
          updatedAt: createdAt,
          categories: [],
          products: [],
          modifiers: [],
          productModifierLinks: [],
          comboBeverageOptions: [],
          recipeLines: [],
          orderTypes: [],
          paymentMethods: [],
          deliveryZones: [],
          settings: {
            version: 7,
            values: {},
            shopIdentity: {
              shopId,
              displayName: 'TUX Maadi',
              address: null,
              phone: null,
              latitude: null,
              longitude: null,
              timezone: 'Africa/Cairo',
              lifecycleState: 'ACTIVE',
              temporaryClosed: false,
              onlineOrdersPaused: false,
            },
            weeklyHours: [],
            specialHours: [],
            paymentMethodZoneRules: [],
          },
          reasonCodes: [],
        }),
      );

      const board = await test.service.loadBoard();
      expect(board.ok).toBe(true);
      if (!board.ok) throw new Error(board.error.message);
      expect(board.value.cancellationReasonMode).toBe('LEGACY');

      const result = await test.service.cancelOrder({
        orderId,
        foodPrepared: true,
        reason: 'Rollout free-text reason',
      });
      expect(result.ok).toBe(true);
    } finally {
      await test.readModel.close();
    }
  });

'''
          p.write_text(s.replace(marker, case + marker, 1))
          PY
      - name: Prove empty cancellation vocabulary fallback is RED
        run: npx vitest run packages/application/src/ordersBoard.reasonCodes.sqlite.test.ts
