name: Task 8B Tree Materializer

on:
  push:
    branches:
      - tmp/task8b-materialize-recovery

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify exact Task 8B tree
        shell: bash
        run: |
          set -euo pipefail
          cat .recovery/task8b/chunk0.txt .recovery/task8b/s*.txt | base64 -d > /tmp/task8b.patch
          git apply --index /tmp/task8b.patch
          rm -rf .recovery
          rm .github/workflows/task8b-materialize.yml
          git add -A
          actual="$(git write-tree)"
          test "$actual" = "8690ab7d65dcea7fd34c63768a83acece8a43626"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: materialize exact Task 8B tree"
          git push origin HEAD:tmp/task8b-materialize-recovery
