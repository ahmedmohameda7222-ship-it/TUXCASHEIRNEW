name: Task 4C WhatsApp Browser GREEN

on:
  push:
    branches:
      - feat/ops-whatsapp-task4c-red

jobs:
  green:
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Task 4C browser GREEN
        run: npm test -- apps/operations/src/app/browserWhatsAppRemote.test.ts
      - name: Task 4C operations typecheck
        run: npm run typecheck -w @tux/operations
