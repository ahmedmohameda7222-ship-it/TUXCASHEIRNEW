name: Phase 7 Repair And Validate

on:
  push:
    branches:
      - feat/ops-07-bulk-stock
    paths:
      - '.phase7-repair.trigger'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ops-07-bulk-stock
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Apply reviewed hygiene repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/application/src/bulkStock.ts')
          text = p.read_text()
          text = text.replace('  stockQuantityMicros,\n', '')
          p.write_text(text)
          PY
      - name: Install and format
        run: |
          npm ci
          npm run format
      - name: Validate and capture
        shell: bash
        run: |
          set +e
          : > /tmp/phase7.log
          failed=0
          for command in 'npm run format:check' 'npm run lint' 'npm run typecheck' 'npm run test' 'npm run build'
          do
            echo "===== $command =====" >> /tmp/phase7.log
            bash -lc "$command" >> /tmp/phase7.log 2>&1
            status=$?
            echo "exit=$status" >> /tmp/phase7.log
            if [ "$status" -ne 0 ]; then
              failed=1
              break
            fi
          done
          if [ "$failed" -eq 0 ]; then
            printf 'PASS\n' > .phase7-validation-passed
            rm -f .phase7-validation-failed.txt
          else
            { echo 'FAIL'; echo; tail -n 240 /tmp/phase7.log; } > .phase7-validation-failed.txt
            rm -f .phase7-validation-passed
          fi
      - name: Remove temporary helpers
        run: |
          rm -f .phase7-repair.trigger
          rm -f .phase7-validate.trigger
          rm -f .github/workflows/phase7-repair.yml
          rm -f .github/workflows/phase7-validate.yml
      - name: Commit repair and validation result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair and validate Phase 7 Bulk Stock'
          git push origin HEAD:feat/ops-07-bulk-stock
