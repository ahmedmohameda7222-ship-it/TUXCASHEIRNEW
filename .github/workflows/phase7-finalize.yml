name: Phase 7 Finalize

on:
  push:
    branches:
      - feat/ops-07-bulk-stock
    paths:
      - '.phase7-finalize.trigger'

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ops-07-bulk-stock
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install and normalize code formatting
        run: |
          npm ci
          npm run format
      - name: Synchronize Phase 7 documentation and compliance
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          def insert_before(path, marker, addition, sentinel):
              p = Path(path)
              text = p.read_text()
              if sentinel in text:
                  return
              if marker not in text:
                  raise SystemExit(f'marker missing in {path}: {marker!r}')
              p.write_text(text.replace(marker, addition.rstrip() + '\n\n' + marker, 1))

          insert_before(
              'docs/ARCHITECTURE.md',
              '## Receipt printing boundary',
              '''## Bulk Stock command boundary

`OperationsBulkStockService` owns the worker-facing physical whole-unit ledger for active `BULK_MANUAL` items. It exposes only load, `Finished 1`, positive whole-unit `Add Stock`, and short compensating Undo commands. There is no worker Reset, direct balance setter, price/cost entry, purchase workflow, or inventory analytics API.

The current balance is a projection over append-only `InventoryMovement` history across Business Days. `BULK_UNIT_FINISHED` decrements one physical whole unit, `BULK_STOCK_RECEIVED` increments the entered whole-unit quantity, and Undo appends `UNDO_BULK_UNIT_FINISHED` / `UNDO_BULK_STOCK_RECEIVED` with `compensatesMovementId`; it never deletes or rewrites the original movement.

A dedicated `BulkStockLedgerStore` provides SQLite and IndexedDB adapters. Each worker movement re-validates the current open Business Day, Current Operator, active `BULK_MANUAL` item, whole-unit delta, command idempotency, and one-compensation rule before atomically appending movement + audit + outbox. Electron exposes only typed Bulk Stock IPC.''',
              '## Bulk Stock command boundary',
          )
          insert_before(
              'docs/DATA_MODEL.md',
              '## Receipt projection',
              '''## Bulk Stock movement projection

Bulk Stock does not own a mutable count column. Current stock is derived by summing the full append-only movement history for each active `BULK_MANUAL` inventory item, including movements from earlier closed Business Days. Worker-originated bulk deltas are exact multiples of `STOCK_QUANTITY_SCALE`, so the Operations projection resolves to whole physical units.

Approved worker movement types are `BULK_UNIT_FINISHED`, `BULK_STOCK_RECEIVED`, `UNDO_BULK_UNIT_FINISHED`, and `UNDO_BULK_STOCK_RECEIVED`. Undo is compensating history: the original movement remains durable and the opposite movement points to it through `compensatesMovementId`. SQLite migration v4 adds a partial unique index so one original movement cannot receive multiple compensations.

`Add Stock` is inventory-only. It stores no cost and creates no Expense/Purchase financial record. Every worker movement keeps immutable worker, Business Day, timestamp, idempotency key, and outbox/audit attribution.''',
              '## Bulk Stock movement projection',
          )
          insert_before(
              'docs/OFFLINE_AND_SYNC.md',
              '## Printing after local commit',
              '''## Bulk Stock local ledger mutations

Bulk Stock remains fully local-first. `Finished 1`, `Add Stock`, and short Undo do not depend on cloud availability.

```text
validate current Business Day/operator/item/whole units
→ check command idempotency / Undo eligibility
→ append inventory movement
→ append audit event
→ append durable outbox event
→ one local commit
```

Balance is recomputed from durable movement history rather than reset at End Day. A retry with the same command intent returns the existing movement instead of creating another one. Undo appends the exact opposite movement and the persistence boundary rejects a second compensation. If audit/outbox persistence fails, the inventory movement rolls back with it.''',
              '## Bulk Stock local ledger mutations',
          )
          insert_before(
              'docs/TEST_STRATEGY.md',
              '## Migration validation',
              '''## Phase 7 Bulk Stock coverage

Phase 7 adds domain and SQLite integration coverage for the worker-facing whole-unit ledger.

Automated tests protect:

- positive whole-unit `Add Stock` validation and exact scaled quantities;
- current balance derived across closed and open Business Days;
- active `BULK_MANUAL` item filtering so recipe-tracked inventory is not exposed on the page;
- `Finished 1` exact `-1` movement and stable command idempotency replay;
- `Add Stock` exact positive movement without creating an Expense/Purchase financial record;
- short Undo eligibility and exact opposite compensation while preserving original history;
- duplicate/expired Undo rejection;
- SQLite one-compensation migration invariant;
- atomic rollback when outbox persistence is forced to fail after movement/audit work starts.

Strict TypeScript and production builds cover the typed browser/Electron Bulk Stock client, validated preload/native IPC and renderer wiring. Card layout, direct `Finished 1`, Add Stock dialog and visible short Undo interaction remain `IMPLEMENTED_NOT_VALIDATED` until rendered browser/Electron QA or dedicated E2E evidence exists.''',
              '## Phase 7 Bulk Stock coverage',
          )

          log = Path('docs/IMPLEMENTATION_LOG.md')
          text = log.read_text().rstrip()
          if '## 2026-08-18 — Phase 7 Bulk Stock implementation' not in text:
              text += f'''

## 2026-08-18 — Phase 7 Bulk Stock implementation

- Created `feat/ops-07-bulk-stock` from the clean Phase 6 Expenses head and kept the change stacked; `main` and remote Supabase remain untouched.
- Added the approved active-`BULK_MANUAL` whole-unit worker ledger with Current Stock, `Finished 1`, positive-whole-unit `Add Stock`, and short compensating Undo only.
- Current Stock is derived from append-only inventory movements across Business Days; End Day does not reset physical balance.
- Added exact worker movement semantics for `BULK_UNIT_FINISHED`, `BULK_STOCK_RECEIVED`, and their compensating Undo movement types. Originals remain historical and compensation is linked rather than destructive.
- Added command intent idempotency/replay protection plus SQLite migration v4 enforcing at most one compensation per original inventory movement.
- Added a dedicated `BulkStockLedgerStore` with SQLite and IndexedDB adapters. Movement, audit, and durable outbox intent commit atomically after Business Day/operator/item/whole-unit checks.
- `Add Stock` records inventory quantity only: no price, cost, Paid From, Expense or Purchase financial record is created.
- Added typed browser client, validated Electron preload IPC, isolated Electron-main Bulk Stock runtime, and responsive worker cards. No Reset/direct overwrite or analytics/history management UI exists.
- Added domain and SQLite integration coverage for cross-Business-Day balance, exact Finish/Add movements, idempotent replay, compensating Undo, expired/duplicate Undo rejection, non-financial Add Stock, and injected outbox-failure rollback.
- Finalizer GitHub Actions run `{os.environ.get('GITHUB_RUN_ID', 'unknown')}` reran locked install, Prettier, ESLint, strict TypeScript, all unit/integration tests, browser production build, and Electron main/preload builds on the clean Phase 7 tree before commit.
- Renderer-only visual/interaction requirements remain `IMPLEMENTED_NOT_VALIDATED`; Bulk Stock reports/history remain future TUX Admin work.
'''
          log.write_text(text + '\n')

          rows = {
              'BULK-001': '| BULK-001 | Bulk Stock uses compact repeated item card/grid. | Bulk Stock | `BulkStockWorkspace.tsx`; `styles/bulk-stock.css` | — | Production build | IMPLEMENTED_NOT_VALIDATED | Responsive 3-column desktop / 2-column intermediate / 1-column mobile worker cards are implemented; rendered visual QA remains pending. |',
              'BULK-002': '| BULK-002 | One box = one physical whole unit. | Bulk Stock | `packages/domain/src/bulkStock.ts`; `OperationsBulkStockService` | Integer micros constrained to whole-unit scale | Domain + SQLite Bulk Stock integration tests | PASS | Worker movements must be exact multiples of `STOCK_QUANTITY_SCALE`; Operations projects integer physical units. |',
              'BULK-003': '| BULK-003 | Finished 1 decrements one whole unit. | Bulk Stock | `OperationsBulkStockService.finishOne`; `BulkStockWorkspace.tsx` | `BULK_UNIT_FINISHED` movement | Domain + SQLite Bulk Stock integration tests | PASS | Integration proves an exact `-1` whole-unit append and idempotent retry without balance overwrite. |',
              'BULK-004': '| BULK-004 | Add Stock increments whole-unit quantity. | Bulk Stock | `OperationsBulkStockService.addStock`; Add Stock dialog | `BULK_STOCK_RECEIVED` movement | Domain + SQLite Bulk Stock integration tests | PASS | Positive safe integer units only; integration proves exact increment. |',
              'BULK-005': '| BULK-005 | Add Stock does not ask price/cost/Paid From. | Bulk Stock | `BulkStockWorkspace.tsx`; `OperationsBulkStockService.addStock` | Inventory movement only | SQLite Bulk Stock integration test; production build | PASS | API/UI accept item + whole units only and integration proves no Expense row is created. |',
              'BULK-006': '| BULK-006 | No worker-facing Reset. | Bulk Stock | `TuxBulkStockApi`; `OperationsBulkStockService`; `BulkStockWorkspace.tsx` | Append-only ledger | Typecheck / production build | PASS | Worker API exposes only load, Finished 1, Add Stock and Undo; no balance setter/reset/direct overwrite path exists. |',
              'BULK-007': '| BULK-007 | Short Undo appends compensating movement. | Bulk Stock | `canUndoBulkMovement`; `compensatingBulkMovement`; `undoMovement`; Undo toast | `UNDO_BULK_*` movement linked by `compensatesMovementId` | Domain + SQLite Bulk Stock integration tests | PASS | Undo is time-bounded and appends the exact opposite movement; expired/duplicate attempts are rejected. |',
              'BULK-008': '| BULK-008 | Inventory history stores original and compensation. | Bulk Stock | Bulk Stock domain/store | Append-only original + compensating movement; migration v4 one-compensation invariant | Domain + SQLite Bulk Stock integration tests | PASS | Integration proves the original and compensation both remain durable and balance is restored by summation. |',
              'BULK-009': '| BULK-009 | Stock persists across Business Days / End Day. | Bulk Stock | `OperationsBulkStockService.loadBoard`; ledger stores | Balance sums movement history across Business Days | SQLite Bulk Stock integration test | PASS | Fixture carries stock from a closed Business Day into the current open day; no End Day reset participates. |',
              'BULK-010': '| BULK-010 | History/reports move to Admin later. | Bulk Stock | — | — | — | NOT_STARTED | Worker page intentionally contains no analytics/history management. The future Admin Reports destination is not implemented in Operations Phase 7. |',
              'BULK-011': '| BULK-011 | Offline local movement with sync later. | Bulk Stock | `OperationsBulkStockService`; `BulkStockLedgerStore` | Atomic movement + audit + durable outbox | SQLite rollback/idempotency integration tests | PASS | No remote dependency participates in success; outbox is written atomically and injected outbox failure rolls the movement/audit back. |',
              'BULK-012': '| BULK-012 | No worker-facing manual sync button. | Bulk Stock | `BulkStockWorkspace.tsx`; Operations shell | — | Production build | PASS | Bulk Stock exposes no sync action; cloud responsibility remains outside the worker workflow. |',
              'BULK-013': '| BULK-013 | Distinguish `Bulk Stock` worker page vs `Bulk Inventory` admin concept. | Bulk Stock | `App.tsx`; `BulkStockWorkspace.tsx` | — | Production build | PASS | Final Operations navigation and page label use `Bulk Stock`; no worker-facing `Bulk Inventory` page is introduced. |',
          }
          matrix = Path('docs/OPERATIONS_COMPLIANCE_MATRIX.md')
          out = []
          seen = set()
          for line in matrix.read_text().splitlines():
              replacement = None
              for key, value in rows.items():
                  if line.startswith(f'| {key} |'):
                      replacement = value
                      seen.add(key)
                      break
              out.append(replacement or line)
          missing = set(rows) - seen
          if missing:
              raise SystemExit(f'missing Bulk Stock compliance rows: {sorted(missing)}')
          matrix.write_text('\n'.join(out) + '\n')
          PY
      - name: Remove every temporary Phase 7 helper/marker
        shell: bash
        run: |
          rm -f .phase7-*.trigger .phase7-validation-passed .phase7-validation-failed.txt .phase7-finalize-failed.txt
          rm -f .github/workflows/phase7-format.yml .github/workflows/phase7-validate.yml .github/workflows/phase7-repair.yml .github/workflows/phase7-finalize.yml
      - name: Run all permanent gates on final clean tree
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Commit final Phase 7 tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Phase 7 Bulk Stock'
          git push origin HEAD:feat/ops-07-bulk-stock
          git push --force origin HEAD:refs/heads/gate/ops-07-bulk-stock-passed
          final_sha=$(git rev-parse HEAD)
          gh pr edit 10 --repo '${{ github.repository }}' --body "## Phase
7 — Bulk Stock worker ledger

## Status
Implementation complete and finalizer-green. PR remains **draft / unmerged** as a stacked Phase 7 change on top of Phase 6.

## Implemented
- active BULK_MANUAL physical whole-unit cards only
- continuous Current Stock derived from append-only movement history across Business Days
- Finished 1 exact whole-unit decrement
- Add Stock positive whole units only; no price/cost/Paid From/Expense/Purchase record
- short Undo as exact compensating movement; original history preserved
- one-compensation SQLite invariant + command idempotency/retry protection
- atomic movement + audit + durable outbox with Business Day/operator/item revalidation
- typed IndexedDB/browser and secure Electron-main/preload boundaries
- responsive Bulk Stock worker page with no Reset/direct overwrite/manual sync/analytics UI
- synchronized architecture/data/offline/test/log/compliance documentation

## Automated evidence
Finalizer run $GITHUB_RUN_ID validated the clean tree before commit. Final Phase 7 SHA: $final_sha.

## Compliance posture
BULK-002–009 and BULK-011–013 are PASS with automated/structural evidence. BULK-001 remains IMPLEMENTED_NOT_VALIDATED pending rendered visual QA. BULK-010 remains NOT_STARTED because historical reporting belongs to future TUX Admin.

## Safety
- stacked base: feat/ops-06-expenses
- main untouched
- Supabase unlinked; no remote migration
- no destructive worker stock reset path
- no temporary Phase 7 helpers remain in final diff
"
