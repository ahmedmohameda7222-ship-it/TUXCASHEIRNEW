name: Prettier diagnostic

on:
  push:
    branches:
      - 'work/menu-online-orders-integration'

permissions:
  contents: write

jobs:
  prettier-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply canonical Prettier output
        shell: bash
        run: |
          npx prettier --write apps/operations/src/app/menuLayoutEditorSession.ts
          git diff --exit-code --quiet -- apps/operations/src/app/menuLayoutEditorSession.ts && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/operations/src/app/menuLayoutEditorSession.ts
          git commit -m 'style(menu): apply canonical prettier output'
          git push origin HEAD:work/menu-online-orders-integration
