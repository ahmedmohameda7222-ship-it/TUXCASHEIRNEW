name: TUX V2 CI

on:
  pull_request:
    branches: [main, integration/tux-operations-v2]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tux-v2-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      static: ${{ steps.scope.outputs.static }}
      unit: ${{ steps.scope.outputs.unit }}
      types: ${{ steps.scope.outputs.types }}
      shared: ${{ steps.scope.outputs.shared }}
      admin: ${{ steps.scope.outputs.admin }}
      operations: ${{ steps.scope.outputs.operations }}
      desktop: ${{ steps.scope.outputs.desktop }}
      menu: ${{ steps.scope.outputs.menu }}
      api: ${{ steps.scope.outputs.api }}
      e2e: ${{ steps.scope.outputs.e2e }}
      migration: ${{ steps.scope.outputs.migration }}
      edge: ${{ steps.scope.outputs.edge }}
      security: ${{ steps.scope.outputs.security }}
      whatsapp: ${{ steps.scope.outputs.whatsapp }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify change-selector regressions
        run: node --test scripts/ci-fast-scope.test.mjs
      - name: Select affected checks
        id: scope
        env:
          TUX_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TUX_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-fast-scope.mjs

  style:
    name: Changed-file format and lint
    needs: changes
    if: needs.changes.outputs.static == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check only changed source files
        shell: bash
        env:
          TUX_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TUX_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base="$TUX_BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base="$(git rev-parse HEAD^)"; fi
          mapfile -d '' files < <(git diff --diff-filter=ACMR --name-only -z "$base" "$TUX_HEAD_SHA")
          format=()
          lint=()
          for file in "${files[@]}"; do
            [[ -f "$file" ]] || continue
            if [[ "$file" =~ ^(api|server|apps|packages|e2e)/.*\.(ts|tsx|mjs|css|html|json)$ || "$file" =~ ^\.github/workflows/.*\.yml$ || "$file" =~ ^scripts/ci-fast-.*\.mjs$ || "$file" =~ ^(package(-lock)?\.json|playwright.*\.ts)$ ]]; then
              format+=("$file")
            fi
            if [[ "$file" =~ ^(api|server|apps|packages|e2e)/.*\.(ts|tsx|mjs)$ || "$file" =~ ^playwright.*\.ts$ ]]; then
              lint+=("$file")
            fi
          done
          if (( ${#format[@]} )); then npx prettier --check "${format[@]}"; fi
          if (( ${#lint[@]} )); then npx eslint "${lint[@]}" --max-warnings 0; fi

  unit:
    name: Related unit and integration tests
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test the modules changed by this PR
        shell: bash
        env:
          TUX_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TUX_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base="$TUX_BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base="$(git rev-parse HEAD^)"; fi
          mapfile -d '' files < <(git diff --diff-filter=ACMR --name-only -z "$base" "$TUX_HEAD_SHA")
          related=()
          for file in "${files[@]}"; do
            if [[ -f "$file" && "$file" =~ ^(api|server|apps|packages)/.*\.(ts|tsx|js|jsx|mjs|cjs)$ ]]; then
              related+=("$file")
            fi
          done
          if (( ${#related[@]} )); then
            npx vitest related --run --exclude 'e2e/**' --exclude 'scripts/monorepo-architecture-guard.test.mjs' --exclude 'scripts/catalog-architecture-guard.test.mjs' "${related[@]}"
          fi

  types:
    name: Affected workspace typechecks
    needs: changes
    if: needs.changes.outputs.types == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      SHARED: ${{ needs.changes.outputs.shared }}
      ADMIN: ${{ needs.changes.outputs.admin }}
      OPERATIONS: ${{ needs.changes.outputs.operations }}
      DESKTOP: ${{ needs.changes.outputs.desktop }}
      MENU: ${{ needs.changes.outputs.menu }}
      API: ${{ needs.changes.outputs.api }}
      E2E: ${{ needs.changes.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check impacted TypeScript workspaces
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SHARED" == true ]]; then
            npm run typecheck
          else
            if [[ "$ADMIN" == true ]]; then npm run typecheck -w @tux/admin; fi
            if [[ "$OPERATIONS" == true ]]; then npm run typecheck -w @tux/operations; fi
            if [[ "$DESKTOP" == true ]]; then npm run typecheck -w @tux/operations-desktop; fi
            if [[ "$MENU" == true ]]; then npm run typecheck -w @tux/menu; fi
            if [[ "$API" == true ]]; then npx tsc --noEmit -p tsconfig.api.json; fi
            if [[ "$E2E" == true ]]; then npm run typecheck:e2e; fi
          fi

  security:
    name: Relevant security contracts
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      WHATSAPP: ${{ needs.changes.outputs.whatsapp }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Relevant authorization and messaging guards
        shell: bash
        run: |
          set -euo pipefail
          npm run test:admin-security
          if [[ "$WHATSAPP" == true ]]; then
            npm run test:whatsapp-security
            npm run test:whatsapp-architecture
          fi

  migrations:
    name: Database migration chain
    needs: changes
    if: needs.changes.outputs.migration == 'true'
    runs-on: ubuntu-latest
    # Full validated migration chain can outlast three minutes even when SQL succeeds.
    # Avoid marking the completed PostgreSQL test cancelled during job teardown.
    timeout-minutes: 12
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install local PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Verify migration chain only when schema changes
        run: node scripts/test-migrations.mjs

  edge:
    name: Changed Edge Function typechecks
    needs: changes
    if: needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck updated Supabase Functions
        shell: bash
        env:
          TUX_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TUX_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base="$TUX_BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base="$(git rev-parse HEAD^)"; fi
          mapfile -d '' files < <(git diff --name-only -z "$base" "$TUX_HEAD_SHA")
          declare -A functions=()
          for file in "${files[@]}"; do
            if [[ "$file" =~ ^supabase/functions/([^/]+)/ ]]; then functions["${BASH_REMATCH[1]}"]=1; fi
          done
          for function in "${!functions[@]}"; do
            if [[ -f "supabase/functions/$function/index.ts" ]]; then
              deno check --config "supabase/functions/$function/deno.json" "supabase/functions/$function/index.ts"
            fi
          done

  required-quality-gate:
    name: Required quality gate
    if: always()
    needs: [changes, style, unit, types, security, migrations, edge]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DETECT: ${{ needs.changes.result }}
      STYLE: ${{ needs.style.result }}
      UNIT: ${{ needs.unit.result }}
      TYPES: ${{ needs.types.result }}
      SECURITY: ${{ needs.security.result }}
      MIGRATIONS: ${{ needs.migrations.result }}
      EDGE: ${{ needs.edge.result }}
    steps:
      - name: Reject failures but accept intentionally skipped checks
        shell: bash
        run: |
          test "$DETECT" = success
          for outcome in "$STYLE" "$UNIT" "$TYPES" "$SECURITY" "$MIGRATIONS" "$EDGE"; do
            [[ "$outcome" == success || "$outcome" == skipped ]] || exit 1
          done
