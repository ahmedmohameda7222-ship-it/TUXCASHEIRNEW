name: Temporary System Color E2E Fix

on:
  push:
    branches:
      - feat/worker-system-color-theme

permissions:
  contents: write

jobs:
  fix-worker-switch-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/worker-system-color-theme
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply and verify worker-switch synchronization fix
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('e2e/worker-system-color.e2e.ts'); s=p.read_text(); anchor=s.index('async function switchWorker'); start=s.index('  await page.waitForFunction(', anchor); end=s.index('\\n}\\n\\ntest(', start); new='  const nextOperator = page.getByRole(\\'button\\', { name: new RegExp(nextWorker) });\\n  const nextGreeting = page.getByRole(\\'heading\\', { name: new RegExp(nextWorker) });\\n  await expect\\n    .poll(\\n      async () =>\\n        (await nextGreeting.isVisible().catch(() => false)) ||\\n        (await nextOperator.isVisible().catch(() => false)),\\n    )\\n    .toBe(true);\\n  if (await nextGreeting.isVisible().catch(() => false)) {\\n    const welcomeAction = page.locator(\\'.welcome-action\\');\\n    await expect(welcomeAction).toBeVisible();\\n    await welcomeAction.click();\\n  }\\n  await waitForActiveShell(page);\\n  await expect(nextOperator).toBeVisible();'; p.write_text(s[:start]+new+s[end:])"
          npx prettier --write e2e/worker-system-color.e2e.ts
          npm run typecheck:e2e
          npx playwright install --with-deps chromium
          npx playwright test e2e/worker-system-color.e2e.ts --project=desktop-browser-fallback --grep "worker system color is isolated"
      - name: Restore permanent CI and commit verified fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git add e2e/worker-system-color.e2e.ts .github/workflows/ci.yml
          git diff --cached --check
          git commit -m 'test: synchronize worker switch E2E'
          git push origin HEAD:feat/worker-system-color-theme
