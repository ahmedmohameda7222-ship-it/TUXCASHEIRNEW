name: Task 11 E2E patch

on:
  push:
    branches:
      - feat/worker-system-color-theme

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/worker-system-color-theme
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Append and format approved Task 11 acceptance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('e2e/operations.e2e.ts')
          source = path.read_text()
          marker = "test('worker system color is isolated, persistent, and responsive'"
          if marker not in source:
              block = r'''
          async function renderedSystemAccent(page: Page): Promise<string> {
            return page.locator('html').evaluate((node) =>
              getComputedStyle(node).getPropertyValue('--tux-accent').trim().toLowerCase(),
            );
          }

          async function openWorkerSystemColorDialog(page: Page, workerName: string): Promise<Locator> {
            await page.getByRole('button', { name: new RegExp(workerName) }).click();
            await page.getByRole('button', { name: 'Choose system color', exact: true }).click();
            const dialog = page.getByRole('dialog', { name: 'Choose system color' });
            await expect(dialog).toBeVisible();
            return dialog;
          }

          async function chooseNativeSystemColor(dialog: Locator, color: string): Promise<void> {
            const picker = dialog.locator("input[type='color']");
            await picker.evaluate((node, nextColor) => {
              const input = node as HTMLInputElement;
              input.value = nextColor;
              input.dispatchEvent(new Event('input', { bubbles: true }));
              input.dispatchEvent(new Event('change', { bubbles: true }));
            }, color);
            await expect(picker).toHaveValue(color);
          }

          async function setWorkerAppearance(
            page: Page,
            workerName: string,
            theme: 'Light' | 'Dark' | 'System',
          ): Promise<void> {
            const operator = page.getByRole('button', { name: new RegExp(workerName) });
            await operator.click();
            await page.getByRole('button', { name: 'System', exact: true }).waitFor({ state: 'visible' });
            await page.getByRole('button', { name: theme, exact: true }).click();
            await operator.click();
            if (theme === 'System') {
              await expect.poll(() => page.locator('html').getAttribute('data-theme')).toBeNull();
            } else {
              await expect(page.locator('html')).toHaveAttribute('data-theme', theme.toLowerCase());
            }
          }

          async function assertSystemColorDialogGeometry(page: Page, dialog: Locator): Promise<void> {
            await expect(dialog.getByText('System Color', { exact: true })).toBeVisible();
            await expect(dialog.getByText('Default', { exact: true })).toBeVisible();
            await expect(dialog.locator("input[type='color']")).toHaveCount(1);
            await expect(dialog.locator("input[type='checkbox']")).toHaveCount(1);
            await expect(dialog.locator("input[type='text']")).toHaveCount(0);
            await expect(dialog.locator('.system-color-row')).toHaveCount(2);

            const viewport = page.viewportSize();
            const dialogBox = await dialog.boundingBox();
            expect(viewport).not.toBeNull();
            expect(dialogBox).not.toBeNull();
            expect(dialogBox!.x).toBeGreaterThanOrEqual(0);
            expect(dialogBox!.y).toBeGreaterThanOrEqual(0);
            expect(dialogBox!.x + dialogBox!.width).toBeLessThanOrEqual(viewport!.width + 1);
            expect(dialogBox!.y + dialogBox!.height).toBeLessThanOrEqual(viewport!.height + 1);

            const rows = dialog.locator('.system-color-row');
            for (let index = 0; index < 2; index += 1) {
              const rowBox = await rows.nth(index).boundingBox();
              expect(rowBox).not.toBeNull();
              expect(rowBox!.x).toBeGreaterThanOrEqual(dialogBox!.x - 1);
              expect(rowBox!.x + rowBox!.width).toBeLessThanOrEqual(
                dialogBox!.x + dialogBox!.width + 1,
              );
              expect(rowBox!.y).toBeGreaterThanOrEqual(dialogBox!.y - 1);
              expect(rowBox!.y + rowBox!.height).toBeLessThanOrEqual(
                dialogBox!.y + dialogBox!.height + 1,
              );
            }
            await expect(dialog.getByRole('button', { name: 'Save', exact: true })).toBeVisible();
            await expect(dialog.getByRole('button', { name: 'Cancel', exact: true })).toBeVisible();
          }

          async function switchWorkerForSystemColor(
            page: Page,
            currentWorker: string,
            pin: string,
            nextWorker: string,
            outgoingAccent: string,
          ): Promise<void> {
            await page.getByRole('button', { name: new RegExp(currentWorker) }).click();
            await page.getByRole('menuitem', { name: 'Switch / Sign in worker' }).click();
            await page.getByLabel('Enter PIN to Sign In').fill(pin);
            await page.getByRole('button', { name: 'Sign In', exact: true }).click();
            await expect(page.locator('.greeting-shell')).toBeVisible();
            await expect.poll(() => renderedSystemAccent(page)).not.toBe(outgoingAccent);
            const welcomeAction = page.locator('.welcome-action');
            await expect(welcomeAction).toBeVisible();
            await welcomeAction.click();
            await waitForActiveShell(page);
            await expect(page.getByRole('button', { name: new RegExp(nextWorker) })).toBeVisible();
          }

          test('worker system color is isolated, persistent, and responsive', async ({
            page,
          }, testInfo) => {
            test.skip(testInfo.project.name !== 'desktop-browser-fallback');
            await page.setViewportSize({ width: 1366, height: 768 });
            await enterActiveOrdersForCategoryTests(page);
            await setWorkerAppearance(page, 'Demo Worker One', 'Light');
            await expectNoHorizontalOverflow(page);

            await page.getByRole('button', { name: 'Edit menu' }).click();
            await page.getByRole('button', { name: 'Right', exact: true }).click();
            await page.getByRole('button', { name: 'Save', exact: true }).click();
            await expect(page.getByLabel('Menu categories')).toHaveAttribute('data-alignment', 'right');

            const defaultLightAccent = await renderedSystemAccent(page);
            let dialog = await openWorkerSystemColorDialog(page, 'Demo Worker One');
            await assertSystemColorDialogGeometry(page, dialog);
            await chooseNativeSystemColor(dialog, '#1e3a8a');
            await expect.poll(() => renderedSystemAccent(page)).not.toBe(defaultLightAccent);
            const workerOneLightAccent = await renderedSystemAccent(page);
            await dialog.getByRole('button', { name: 'Cancel', exact: true }).click();
            await expect.poll(() => renderedSystemAccent(page)).toBe(defaultLightAccent);

            dialog = await openWorkerSystemColorDialog(page, 'Demo Worker One');
            await chooseNativeSystemColor(dialog, '#1e3a8a');
            await dialog.getByRole('button', { name: 'Save', exact: true }).click();
            await expect(dialog).toBeHidden();
            await expect.poll(() => renderedSystemAccent(page)).toBe(workerOneLightAccent);
            await expect(page.getByLabel('Menu categories')).toHaveAttribute('data-alignment', 'right');
            await expectNoHorizontalOverflow(page);
            await page.screenshot({
              path: testInfo.outputPath('system-color-worker-one-1366x768-light.png'),
              animations: 'disabled',
              caret: 'hide',
              fullPage: false,
            });

            await page.reload();
            await waitForActiveShell(page);
            await expect.poll(() => renderedSystemAccent(page)).toBe(workerOneLightAccent);
            await expect(page.getByLabel('Menu categories')).toHaveAttribute('data-alignment', 'right');
            dialog = await openWorkerSystemColorDialog(page, 'Demo Worker One');
            await expect(dialog.locator("input[type='color']")).toHaveValue('#1e3a8a');
            await dialog.getByRole('button', { name: 'Cancel', exact: true }).click();

            await setWorkerAppearance(page, 'Demo Worker One', 'Dark');
            const workerOneDarkAccent = await renderedSystemAccent(page);
            expect(workerOneDarkAccent).not.toBe(workerOneLightAccent);
            dialog = await openWorkerSystemColorDialog(page, 'Demo Worker One');
            await expect(dialog.locator("input[type='color']")).toHaveValue('#1e3a8a');
            await dialog.getByRole('button', { name: 'Cancel', exact: true }).click();
            await page.screenshot({
              path: testInfo.outputPath('system-color-worker-one-1366x768-dark.png'),
              animations: 'disabled',
              caret: 'hide',
              fullPage: false,
            });

            await page.emulateMedia({ colorScheme: 'dark' });
            await setWorkerAppearance(page, 'Demo Worker One', 'System');
            await expect.poll(() => renderedSystemAccent(page)).toBe(workerOneDarkAccent);
            await page.emulateMedia({ colorScheme: 'light' });
            await expect.poll(() => renderedSystemAccent(page)).toBe(workerOneLightAccent);
            dialog = await openWorkerSystemColorDialog(page, 'Demo Worker One');
            await expect(dialog.locator("input[type='color']")).toHaveValue('#1e3a8a');
            await dialog.getByRole('button', { name: 'Cancel', exact: true }).click();
            await setWorkerAppearance(page, 'Demo Worker One', 'Light');

            await switchWorkerForSystemColor(
              page,
              'Demo Worker One',
              '5678',
              'Demo Worker Two',
              workerOneLightAccent,
            );
            await expect.poll(() => renderedSystemAccent(page)).toBe(defaultLightAccent);
            dialog = await openWorkerSystemColorDialog(page, 'Demo Worker Two');
            await expect(dialog.locator("input[type='checkbox']")).toBeChecked();
            await chooseNativeSystemColor(dialog, '#7e22ce');
            await dialog.getByRole('button', { name: 'Save', exact: true }).click();
            const workerTwoLightAccent = await renderedSystemAccent(page);
            expect(workerTwoLightAccent).not.toBe(workerOneLightAccent);
            expect(workerTwoLightAccent).not.toBe(defaultLightAccent);

            await switchWorkerForSystemColor(
              page,
              'Demo Worker Two',
              '1234',
              'Demo Worker One',
              workerTwoLightAccent,
            );
            await expect.poll(() => renderedSystemAccent(page)).toBe(workerOneLightAccent);
            await switchWorkerForSystemColor(
              page,
              'Demo Worker One',
              '5678',
              'Demo Worker Two',
              workerOneLightAccent,
            );
            await expect.poll(() => renderedSystemAccent(page)).toBe(workerTwoLightAccent);

            dialog = await openWorkerSystemColorDialog(page, 'Demo Worker Two');
            const defaultCheckbox = dialog.locator("input[type='checkbox']");
            await defaultCheckbox.check();
            await expect.poll(() => renderedSystemAccent(page)).toBe(defaultLightAccent);
            await dialog.getByRole('button', { name: 'Save', exact: true }).click();
            await page.reload();
            await waitForActiveShell(page);
            await expect.poll(() => renderedSystemAccent(page)).toBe(defaultLightAccent);

            await switchWorkerForSystemColor(
              page,
              'Demo Worker Two',
              '1234',
              'Demo Worker One',
              defaultLightAccent,
            );
            await expect.poll(() => renderedSystemAccent(page)).toBe(workerOneLightAccent);

            await page.setViewportSize({ width: 1280, height: 720 });
            await setWorkerAppearance(page, 'Demo Worker One', 'Light');
            await expectNoHorizontalOverflow(page);
            dialog = await openWorkerSystemColorDialog(page, 'Demo Worker One');
            await assertSystemColorDialogGeometry(page, dialog);
            await expect(dialog.locator("input[type='color']")).toHaveValue('#1e3a8a');
            await page.screenshot({
              path: testInfo.outputPath('system-color-dialog-1280x720-light.png'),
              animations: 'disabled',
              caret: 'hide',
              fullPage: false,
            });
            await dialog.getByRole('button', { name: 'Cancel', exact: true }).click();

            await setWorkerAppearance(page, 'Demo Worker One', 'Dark');
            await expect.poll(() => renderedSystemAccent(page)).toBe(workerOneDarkAccent);
            await expectNoHorizontalOverflow(page);
            await page.screenshot({
              path: testInfo.outputPath('system-color-worker-one-1280x720-dark.png'),
              animations: 'disabled',
              caret: 'hide',
              fullPage: false,
            });
          });
          '''
              path.write_text(source.rstrip() + '\n\n' + block.strip() + '\n')
          PY
          npx prettier --write e2e/operations.e2e.ts
          if git diff --quiet -- e2e/operations.e2e.ts; then
            echo 'Task 11 E2E already present.'
            exit 0
          fi
          git config user.name "TUX implementation bot"
          git config user.email "actions@users.noreply.github.com"
          git add e2e/operations.e2e.ts
          git commit -m "test: add rendered worker accent acceptance"
          git push origin HEAD:feat/worker-system-color-theme
