name: Task 11 picker correction
on:
  push:
    branches:
      - feat/worker-system-color-theme
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/worker-system-color-theme
          fetch-depth: 0
      - name: Patch test helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/operations.e2e.ts')
          source = path.read_text()
          needle = "  const picker = dialog.locator(\"input[type='color']\");\n  await picker.evaluate((node, nextColor) => {"
          replacement = "  const defaultCheckbox = dialog.locator(\"input[type='checkbox']\");\n  if (await defaultCheckbox.isChecked()) await defaultCheckbox.uncheck();\n  const picker = dialog.locator(\"input[type='color']\");\n  await expect(picker).toBeEnabled();\n  await picker.evaluate((node, nextColor) => {"
          if needle not in source:
              raise SystemExit('picker helper marker not found')
          path.write_text(source.replace(needle, replacement, 1))
          PY
          git config user.name "TUX implementation bot"
          git config user.email "actions@users.noreply.github.com"
          git add e2e/operations.e2e.ts
          git commit -m "test: model default picker interaction correctly"
          git push origin HEAD:feat/worker-system-color-theme
