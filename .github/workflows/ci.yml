name: TUX V2 CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile-approved-system-color-docs:
    name: reconcile approved System Color docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/worker-system-color-theme
      - name: Reconcile superseded dialog authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          spec_path = Path('docs/superpowers/specs/2026-08-28-tux-worker-system-color-design.md')
          spec = spec_path.read_text()
          spec = spec.replace(
              'Approved in chat on 2026-08-28. This document is the binding Product, UX, Visual, Accessibility, Persistence, and Runtime Theme authority for this bounded refinement.',
              'Approved in chat on 2026-08-28 and amended by the later direct dialog approval on the same date. This document is the binding Product, UX, Visual, Accessibility, Persistence, and Runtime Theme authority for this bounded refinement. The later direct approval replaces the earlier HEX/RGB/EyeDropper dialog concept with the exact two-row native picker + Default checkbox surface documented below.'
          )
          spec = spec.replace(
              'Allow each worker to choose one personal TUX system accent color from the profile menu using a visual color picker, HEX, RGB, or an eyedropper when supported. The chosen base color must sync with that worker across devices and automatically produce a coherent, accessible Light and Dark accent palette while preserving all non-brand semantic colors.',
              'Allow each worker to choose one personal TUX system accent color from the profile menu using the native color picker, or restore the exact TUX default with a Default checkbox. The chosen base color must sync with that worker across devices and automatically produce a coherent, accessible Light and Dark accent palette while preserving all non-brand semantic colors.'
          )
          spec = spec.replace(
              '- three-digit shorthand may be accepted by UI parsing only if it is normalized to six-digit form before preview/persistence;',
              '- internal color parsing helpers may normalize alternate valid draft forms, but the approved dialog exposes no raw HEX or RGB entry fields;'
          )
          spec = spec.replace(
              '`Reset` in Menu Edit remains a menu-layout action only. `Reset to TUX default` in the color dialog changes only `accentColor`.',
              '`Reset` in Menu Edit remains a menu-layout action only. The color dialog’s `Default` checkbox changes only `accentColor` and represents `null`.'
          )

          replacement = '''## 5. Profile-menu UX

Keep the current Appearance selector in the operator profile menu. Add a second section immediately below it:

```text
System color
[ current swatch ] Choose system color
```

The current swatch reflects the saved worker base color, or the TUX default when the worker has no override.

Activating `Choose system color` closes the profile menu and opens a modal dialog titled:

```text
Choose system color
```

### Dialog controls — exact approved surface

The dialog contains exactly two setting rows:

1. `System Color` + one native square `input[type=color]`;
2. `Default` + one checkbox.

The footer contains `Cancel` and `Save`.

The dialog must **not** expose a raw HEX text input, RGB fields, EyeDropper action, or a separate reset button. `Default` is the reset/default mechanism and maps to `accentColor: null`.

### Input behavior

- Selecting a native color immediately makes the draft custom, unchecks Default, and previews that custom accent throughout Operations.
- Checking Default sets the draft persistence value to `null` and previews the exact default TUX palette by removing runtime overrides.
- Unchecking Default without choosing a different color uses the currently visible native picker color as the custom draft.
- The native picker value is normalized through `parseSystemAccentColor` before it becomes application state.

### Live preview transaction

Opening the dialog creates a draft from the worker's saved `accentColor`.

- Valid native-picker changes apply immediately to the entire Operations UI.
- `Cancel`, Escape, or modal dismissal restores the previously saved worker accent exactly and persists nothing.
- Checking `Default` previews the exact default TUX palette; it does not persist until Save.
- `Save` persists only the accent preference.
- While Save is in flight, all color-mutating controls are disabled.
- If Save fails, keep the dialog open, keep the draft preview visible, show an inline error, and allow retry or Cancel.
- After successful Save, the dialog closes and the saved color remains active.

### Accessibility

- Modal is labelled by `Choose system color`.
- Both inputs have programmatic labels matching `System Color` and `Default`.
- The native picker, effective checkbox hit area, and action buttons provide cashier-appropriate touch/click targets; primary interactive controls remain at least 44px effective size.
- Escape cancels and restores the saved theme when not saving.
- Focus enters the dialog on open and remains contained while the modal is active.
- Save errors use an appropriate alert/live region.

---

## 6. Worker switching and lifecycle'''
          spec, count = re.subn(
              r'## 5\. Profile-menu UX.*?---\n\n## 6\. Worker switching and lifecycle',
              replacement,
              spec,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'spec dialog section replacement count={count}')
          spec_path.write_text(spec)

          plan_path = Path('docs/superpowers/plans/2026-08-28-tux-worker-system-color.md')
          plan = plan_path.read_text()
          plan = plan.replace(
              '**Goal:** Add one worker-specific, synced base system accent color with native picker, HEX, RGB, optional eyedropper, live preview, and automatically generated accessible Light/Dark palettes without changing semantic business-state colors.',
              '**Goal:** Add one worker-specific, synced base system accent color with the exact approved two-row native System Color picker + Default checkbox transaction, live preview, and automatically generated accessible Light/Dark palettes without changing semantic business-state colors.'
          )
          plan = plan.replace(
              '- Runtime color controls are native picker + HEX + RGB + EyeDropper when available; no third-party picker dependency.',
              '- Runtime color controls are exactly `System Color` + native `input[type=color]` and `Default` + checkbox, followed by Cancel/Save; no raw HEX input, RGB fields, EyeDropper, separate reset action, or third-party picker dependency.'
          )
          plan = plan.replace(
              '- `apps/operations/src/app/SystemColorPickerDialog.tsx` — modal draft transaction, native picker, HEX/RGB, progressive EyeDropper, Reset/Cancel/Save UI.',
              '- `apps/operations/src/app/SystemColorPickerDialog.tsx` — exact two-row modal draft transaction: native System Color picker, Default checkbox, Cancel/Save.'
          )
          plan = plan.replace(
              '- `apps/operations/src/app/SystemColorPickerDialog.test.tsx` — static contract/accessibility tests for the dialog surface.',
              '- `apps/operations/src/app/SystemColorPickerDialog.test.tsx` — static contract/accessibility tests enforcing exactly two setting rows and forbidding raw HEX/RGB/EyeDropper controls.'
          )
          plan = plan.replace(
              '- `e2e/operations.e2e.ts` — live preview, Cancel/Save, reload, worker isolation, Light/Dark/System, responsive checks.',
              '- `e2e/worker-system-color.e2e.ts` — live preview, Cancel/Save/Default, reload, worker isolation, Light/Dark/System, responsive checks.'
          )

          task8 = '''### Task 8: Build the approved two-row color dialog as a draft transaction

**Files:**
- Create: `apps/operations/src/app/SystemColorPickerDialog.tsx`
- Create: `apps/operations/src/app/SystemColorPickerDialog.test.tsx`
- Create: `apps/operations/src/styles/system-color-picker.css`
- Modify: `apps/operations/src/main.tsx`

**Interfaces:**

```ts
interface SystemColorPickerDialogProps {
  readonly savedAccentColor: SystemAccentColor | null;
  readonly defaultPreviewColor: SystemAccentColor;
  readonly saving: boolean;
  readonly saveError: string | null;
  readonly onPreview: (accentColor: SystemAccentColor | null) => void;
  readonly onSave: (accentColor: SystemAccentColor | null) => Promise<void>;
  readonly onCancel: () => void;
}
```

- [ ] **Step 1: Write RED static contract tests**

Require exactly:

```text
Choose system color
System Color + one input[type=color]
Default + one checkbox
Cancel
Save
```

Also assert there is no `input[type=text]`, no RGB/number fields, no EyeDropper/`Pick from screen`, and no separate `Reset to TUX default` control.

- [ ] **Step 2: Run dialog test RED**

```bash
npx vitest run apps/operations/src/app/SystemColorPickerDialog.test.tsx
```

- [ ] **Step 3: Implement the two-row draft state**

Rules in code:

- initialize draft from `savedAccentColor`; `null` means Default checked;
- native picker shows `savedAccentColor ?? defaultPreviewColor`;
- changing the native picker parses/normalizes through `parseSystemAccentColor`, sets a custom draft, unchecks Default, and calls `onPreview(custom)`;
- checking Default sets draft to `null` and calls `onPreview(null)`;
- unchecking Default uses the current native picker color as a custom draft;
- no raw HEX/RGB/EyeDropper UI is permitted.

- [ ] **Step 4: Implement modal transaction/accessibility**

Focus the native color input on open. Trap Tab/Shift+Tab within the modal. Escape, Cancel, or backdrop dismissal restores the saved preview when not saving. Disable all mutating controls while saving. Keep save error inline with `role="alert"`.

- [ ] **Step 5: Implement responsive styling**

Use existing tokens only. Keep the native picker at least 44x44, give the checkbox an effective 44x44 hit target, keep buttons at least 44px high, and prevent horizontal clipping on supported mobile widths.

- [ ] **Step 6: Import stylesheet and run tests GREEN**

```bash
npx vitest run apps/operations/src/app/SystemColorPickerDialog.test.tsx
npm run typecheck -w @tux/operations
```

- [ ] **Step 7: Commit**

```bash
git add apps/operations/src/app/SystemColorPickerDialog.tsx apps/operations/src/app/SystemColorPickerDialog.test.tsx apps/operations/src/styles/system-color-picker.css apps/operations/src/main.tsx
git commit -m "feat: add system color picker dialog"
```

---

### Task 9: Integrate worker accent lifecycle into the Operations shell'''
          plan, count = re.subn(
              r'### Task 8:.*?---\n\n### Task 9: Integrate worker accent lifecycle into the Operations shell',
              task8,
              plan,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'plan Task 8 replacement count={count}')
          plan = plan.replace(
              'Immediately below Appearance render current swatch + canonical base/default HEX and a `Choose system color` button. Close the operator menu before opening the dialog.',
              'Immediately below Appearance render the current swatch and a `Choose system color` button. Do not expose a raw HEX value in the profile surface. Close the operator menu before opening the dialog.'
          )

          task11 = '''### Task 11: Add rendered worker-isolation and Light/Dark E2E coverage

**Files:**
- Create: `e2e/worker-system-color.e2e.ts`
- Create/Modify: `apps/operations/src/app/workerSystemColorRenderedQa.source.test.ts`

**Interfaces:**
- Exercises the feature through visible UI and deterministic browser-fallback fixtures.

- [ ] **Step 1: Add desktop live-preview/Cancel coverage**

At exact `1366x768`, sign in Worker A, open `Choose system color`, assert exactly two `.system-color-row` entries and exactly one native color input + one Default checkbox, with zero text/number inputs. Change the native picker to `#1E3A8A`, verify the live accent changes and action foreground contrast remains >= 4.5, then Cancel and verify the saved/default accent is restored.

- [ ] **Step 2: Add Save/reload and menu-preservation coverage**

Arrange a non-default menu layout first, save it, then save blue from the native picker. Reload and assert both the worker color and layout remain. Wait for the dialog to close before reload so persistence completion is observed rather than raced.

- [ ] **Step 3: Add worker isolation + Default coverage**

Worker A saves blue. Switch to Worker B and verify B starts at its own default. Worker B saves purple. Switch both directions and verify colors remain isolated. For Worker B, check Default and verify live preview, Cancel rollback, then check Default + Save and verify `null`/default survives reload. Switching workers must not change device Appearance.

- [ ] **Step 4: Add Light/Dark/System coverage**

For Worker A base `#1E3A8A`, verify Light and Dark derive different accessible effective accents and both meet action foreground contrast >= 4.5. Under System, emulate `prefers-color-scheme: dark` then light and verify the palette flips without reload.

- [ ] **Step 5: Keep exhaustive color robustness in palette unit tests**

Use Task 7 unit tests for TUX green, blue, purple, red, yellow, near-black, and near-white in both modes. Rendered integration uses representative blue plus the worker/default flows; do not add unsupported raw HEX/RGB controls merely to drive test colors.

- [ ] **Step 6: Add responsive tablet/mobile coverage**

Run the dialog on the configured tablet and mobile projects, assert no horizontal overflow, assert the modal remains inside the viewport, and verify native picker/Save/Cancel target sizing.

- [ ] **Step 7: Capture approval evidence**

Capture at least:

```text
system-color-light-blue-desktop.png
system-color-dark-blue-desktop.png
system-color-dialog-1280x720-light.png
system-color-picker-tablet.png
system-color-picker-mobile.png
```

- [ ] **Step 8: Run full rendered E2E GREEN**

```bash
npm run test:e2e
```

- [ ] **Step 9: Commit**

```bash
git add e2e/worker-system-color.e2e.ts apps/operations/src/app/workerSystemColorRenderedQa.source.test.ts
git commit -m "test: cover worker system color rendering"
```

---

### Task 12: Full verification, documentation review, and pre-merge gate'''
          plan, count = re.subn(
              r'### Task 11:.*?---\n\n### Task 12: Full verification, documentation review, and pre-merge gate',
              task11,
              plan,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'plan Task 11 replacement count={count}')

          plan_path.write_text(plan)

          # Guard the approved UI authority in the committed docs.
          final_spec = spec_path.read_text()
          final_plan = plan_path.read_text()
          required = ['System Color', 'Default', 'input[type=color]', 'no raw HEX', 'EyeDropper']
          if not all(token in final_spec for token in required):
              raise SystemExit('spec authority guard failed')
          if 'native picker + HEX + RGB + EyeDropper' in final_plan:
              raise SystemExit('superseded plan global constraint remains')
          if 'enter `#1E3A8A` in HEX' in final_plan:
              raise SystemExit('superseded rendered HEX step remains')
          PY
      - name: Commit authority reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/superpowers/specs/2026-08-28-tux-worker-system-color-design.md docs/superpowers/plans/2026-08-28-tux-worker-system-color.md
          git diff --cached --check
          git commit -m 'docs: reconcile approved System Color dialog authority'
          git push origin HEAD:feat/worker-system-color-theme
      - name: Stop temporary workflow
        run: |
          echo 'Temporary docs workflow completed; permanent CI must now be restored.' >&2
          exit 1
