name: TUX V2 CI

on:
  pull_request:
    branches:
      - main
      - integration/tux-operations-v2
  push:
    branches:
      - main
      - integration/tux-operations-v2
      - 'feat/ops-*'
      - 'fix/operations-*'

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm run test
      - name: Production builds
        run: npm run build
      - name: Development provisioning safety smoke
        shell: bash
        run: |
          if NODE_ENV=production npm run dev:provision -- --database .tmp/provision-production.sqlite3; then
            echo 'Production provisioning unexpectedly succeeded.' >&2
            exit 1
          fi
          npm run dev:provision -- --database .tmp/provision.sqlite3 --pin 2468 --secondary-pin 1357
          test -f apps/operations-desktop/.tmp/provision.sqlite3
          rm -rf apps/operations-desktop/.tmp
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Migration-chain smoke
        run: npm run test:migrations
      - uses: denoland/setup-deno@v2
        with:
          # Supabase Edge Runtime currently tracks the Deno 1.46 family. Keep CI on the
          # same resolver semantics so remote import-graph failures are caught before deploy.
          deno-version: v1.46.3
      - name: Edge Function typecheck
        run: |
          deno check --config supabase/functions/device-enroll/deno.json supabase/functions/device-enroll/index.ts
          deno check --config supabase/functions/device-bootstrap/deno.json supabase/functions/device-bootstrap/index.ts
          deno check --config supabase/functions/operations-config/deno.json supabase/functions/operations-config/index.ts
          deno check --config supabase/functions/operations-sync/deno.json supabase/functions/operations-sync/index.ts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Rendered browser E2E
        run: npm run test:e2e
      - name: Upload rendered QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-rendered-e2e
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

  windows-package:
    name: windows-package
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build unsigned Windows x64 package
        run: npm run package:win
      - name: Upload unsigned Windows package
        uses: actions/upload-artifact@v4
        with:
          name: tux-operations-windows-x64-unsigned
          path: release/windows/*.exe
          if-no-files-found: error
          retention-days: 14

  required-quality-gate:
    name: Required quality gate
    if: always()
    needs:
      - quality
      - windows-package
    runs-on: ubuntu-latest
    steps:
      - name: Require every permanent gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          WINDOWS_RESULT: ${{ needs.windows-package.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$WINDOWS_RESULT" = "success"
