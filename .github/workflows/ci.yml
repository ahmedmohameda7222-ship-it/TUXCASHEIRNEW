name: TUX V2 CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-system-color-qa:
    name: format approved system color QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/worker-system-color-theme
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format and verify corrective QA
        run: |
          npx prettier --write e2e/worker-system-color.e2e.ts apps/operations/src/app/workerSystemColorRenderedQa.source.test.ts
          npm run typecheck:e2e
          npx vitest run apps/operations/src/app/workerSystemColorRenderedQa.source.test.ts apps/operations/src/app/SystemColorPickerDialog.test.tsx apps/operations/src/app/systemAccentTheme.test.ts
      - name: Commit formatting-only changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/worker-system-color.e2e.ts apps/operations/src/app/workerSystemColorRenderedQa.source.test.ts
          test -n "$(git status --porcelain)"
          git commit -m 'style: format approved system color QA'
          git push origin HEAD:feat/worker-system-color-theme
      - name: Stop temporary workflow
        run: |
          echo 'Formatting-only workflow completed; permanent CI must now be restored.' >&2
          exit 1
