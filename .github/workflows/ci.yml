name: TUX V2 CI

on:
  pull_request:
    branches:
      - integration/tux-operations-v2
      - main
  push:
    branches:
      - integration/tux-operations-v2
      - 'feat/ops-*'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production builds
        run: npm run build
