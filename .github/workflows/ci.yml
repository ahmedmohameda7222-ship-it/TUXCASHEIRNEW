name: Temporary System Color E2E Fix

on:
  push:
    branches:
      - feat/worker-system-color-theme

permissions:
  contents: write

jobs:
  fix-worker-switch-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/worker-system-color-theme
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply guarded worker-switch synchronization fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('e2e/worker-system-color.e2e.ts')
          source = path.read_text()
          old = '''  await page.waitForFunction(
    () =>
      document.querySelector('.welcome-action') !== null ||
      document.querySelector('[aria-label="Operations"]') !== null,
  );
  const welcomeAction = page.locator('.welcome-action');
  if (await welcomeAction.isVisible().catch(() => false)) await welcomeAction.click();
  await waitForActiveShell(page);
  await expect(page.getByRole('button', { name: new RegExp(nextWorker) })).toBeVisible();
'''
          new = '''  const nextOperator = page.getByRole('button', { name: new RegExp(nextWorker) });
  const nextGreeting = page.getByRole('heading', { name: new RegExp(nextWorker) });
  await expect
    .poll(
      async () =>
        (await nextGreeting.isVisible().catch(() => false)) ||
        (await nextOperator.isVisible().catch(() => false)),
    )
    .toBe(true);
  if (await nextGreeting.isVisible().catch(() => false)) {
    const welcomeAction = page.locator('.welcome-action');
    await expect(welcomeAction).toBeVisible();
    await welcomeAction.click();
  }
  await waitForActiveShell(page);
  await expect(nextOperator).toBeVisible();
'''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one switchWorker synchronization block, found {count}')
          path.write_text(source.replace(old, new, 1))
          PY
          npx prettier --write e2e/worker-system-color.e2e.ts
          npm run typecheck:e2e
          npx playwright install --with-deps chromium
          npx playwright test e2e/worker-system-color.e2e.ts --project=desktop-browser-fallback --grep "worker system color is isolated"
      - name: Restore permanent CI and commit the verified test fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git add e2e/worker-system-color.e2e.ts .github/workflows/ci.yml
          git diff --cached --check
          git commit -m 'test: synchronize worker switch E2E'
          git push origin HEAD:feat/worker-system-color-theme
