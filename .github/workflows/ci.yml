name: TUX V2 CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  e2e-sync-fix:
    name: guarded E2E save synchronization fix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/worker-system-color-theme
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply guarded wait-for-save-success fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('e2e/operations.e2e.ts')
          source = path.read_text()
          old = """  await dialog.getByRole('button', { name: 'Reset to TUX default', exact: true }).click();
  await expect.poll(() => renderedSystemAccent(page)).toBe(defaultLightAccent);
  await dialog.getByRole('button', { name: 'Save', exact: true }).click();
  await page.reload();
"""
          new = """  await dialog.getByRole('button', { name: 'Reset to TUX default', exact: true }).click();
  await expect.poll(() => renderedSystemAccent(page)).toBe(defaultLightAccent);
  await dialog.getByRole('button', { name: 'Save', exact: true }).click();
  await expect(dialog).toBeHidden();
  await page.reload();
"""
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one reset/save/reload anchor, found {count}')
          path.write_text(source.replace(old, new, 1))
          PY
          npx prettier --check e2e/operations.e2e.ts
          npm run typecheck:e2e
      - name: Commit synchronization fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/operations.e2e.ts
          test -n "$(git status --porcelain e2e/operations.e2e.ts)"
          git commit -m 'test: await system color reset persistence'
          git push origin HEAD:feat/worker-system-color-theme
      - name: Stop temporary workflow
        run: |
          echo 'Temporary branch-only codemod completed; permanent CI must now be restored.' >&2
          exit 1
