name: Task 11 assertion correction

on:
  push:
    branches:
      - feat/worker-system-color-theme

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/worker-system-color-theme
          fetch-depth: 0
      - name: Correct post-reset flash comparison
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/operations.e2e.ts')
          source = path.read_text()
          old = """  await switchWorkerForSystemColor(\n    page,\n    'Demo Worker Two',\n    '1234',\n    'Demo Worker One',\n    defaultLightAccent,\n  );\n  await expect.poll(() => renderedSystemAccent(page)).toBe(workerOneLightAccent);\n\n  await page.setViewportSize({ width: 1280, height: 720 });"""
          new = """  await switchWorkerForSystemColor(\n    page,\n    'Demo Worker Two',\n    '1234',\n    'Demo Worker One',\n    workerTwoLightAccent,\n  );\n  await expect.poll(() => renderedSystemAccent(page)).toBe(workerOneLightAccent);\n\n  await page.setViewportSize({ width: 1280, height: 720 });"""
          if old not in source:
              raise SystemExit('Expected Task 11 switch block not found')
          path.write_text(source.replace(old, new, 1))
          PY
          git config user.name "TUX implementation bot"
          git config user.email "actions@users.noreply.github.com"
          git add e2e/operations.e2e.ts
          git commit -m "test: correct post-reset worker flash assertion"
          git push origin HEAD:feat/worker-system-color-theme
