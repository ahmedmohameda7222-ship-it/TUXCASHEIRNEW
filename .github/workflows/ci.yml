name: TUX V2 CI

on:
  pull_request:
    branches:
      - main
      - integration/tux-operations-v2
  push:
    branches:
      - main
      - integration/tux-operations-v2
      - 'feat/ops-*'
      - 'fix/operations-*'
      - 'ui/tux-pos-refinement'

permissions:
  contents: write

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply Task 3 shared-card wiring and restore CI
        env:
          BRANCH_NAME: refactor/menu-layout-editor-long-term
        run: |
          git fetch origin main "$BRANCH_NAME"
          git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
          python - <<'PY'
          from pathlib import Path

          workspace_path = Path('apps/operations/src/app/OrdersWorkspace.tsx')
          source = workspace_path.read_text()
          old_import = "import { MenuProductCard } from './MenuProductCard';"
          if "import { MenuEditProductCard } from './MenuEditProductCard';" not in source:
              if old_import not in source:
                  raise SystemExit('MenuProductCard import marker missing')
              source = source.replace(
                  old_import,
                  "import { MenuEditProductCard } from './MenuEditProductCard';\n" + old_import,
                  1,
              )

          start_marker = '                menuEditProducts.map((product) => (\n                  <article'
          end_marker = '                  </article>\n                ))'
          start = source.index(start_marker)
          end = source.index(end_marker, start) + len(end_marker)
          replacement = '''                menuEditProducts.map((product, index) => (
                  <MenuEditProductCard
                    key={product.id}
                    product={product}
                    position={index + 1}
                    total={menuEditProducts.length}
                    className={[
                      'product-card',
                      'menu-edit-product-card',
                      draggedProductId === product.id ? 'menu-edit-product-card-dragging' : '',
                      grabbedProductId === product.id ? 'menu-edit-product-card-grabbed' : '',
                    ]
                      .filter(Boolean)
                      .join(' ')}
                    articleProps={{
                      draggable:
                        menuEditActive && !menuEditSaving && draggedProductId !== product.id,
                      tabIndex: 0,
                      'aria-label': `Reorder ${product.name}`,
                      onDragStart: (event) => {
                        if (menuEditSaving) return;
                        setDraggedProductId(product.id);
                        event.dataTransfer.effectAllowed = 'move';
                        event.dataTransfer.setData('text/plain', product.id);
                      },
                      onDragEnter: (event) => {
                        if (menuEditSaving) return;
                        if (draggedProductId === null) return;
                        event.preventDefault();
                        moveDraggedProduct(product.id);
                      },
                      onDragOver: (event) => {
                        if (menuEditSaving) return;
                        if (draggedProductId !== null) event.preventDefault();
                      },
                      onDragEnd: () => setDraggedProductId(null),
                      onDrop: (event) => {
                        event.preventDefault();
                        setDraggedProductId(null);
                      },
                      onKeyDown: (event) => {
                        if (menuEditSaving) return;
                        if (event.key === 'Enter' || event.key === ' ') {
                          event.preventDefault();
                          toggleProductPickup(product.id);
                          return;
                        }
                        if (event.key === 'Escape' && grabbedProductId === product.id) {
                          event.preventDefault();
                          cancelProductPickup();
                          return;
                        }
                        if (grabbedProductId !== product.id) return;
                        if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
                          event.preventDefault();
                          moveProductByOffset(product.id, -1);
                        } else if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
                          event.preventDefault();
                          moveProductByOffset(product.id, 1);
                        }
                      },
                    }}
                  />
                ))'''
          workspace_path.write_text(source[:start] + replacement + source[end:])

          css_path = Path('apps/operations/src/styles/final-pos-corrections.css')
          css = css_path.read_text()
          legacy_start = css.index(
              '/* Legacy ProductPositionEditor styles remain for its isolated component tests. */'
          )
          unified_marker = '/* Unified Menu Edit Mode: one in-place worker-specific reorder surface. */'
          legacy_end = css.index(unified_marker, legacy_start)
          preserved = '''.sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
            padding: 0;
          }

          /* Shared Product Card presentation keeps the approved product-main grid geometry. */
          .product-card-presentation {
            display: contents;
          }

          '''
          css_path.write_text(css[:legacy_start] + preserved + css[legacy_end:])
          PY
          npx prettier --write \
            apps/operations/src/app/OrdersWorkspace.tsx \
            apps/operations/src/app/ProductCardPresentation.tsx \
            apps/operations/src/app/MenuEditProductCard.tsx \
            apps/operations/src/app/MenuEditProductCard.test.tsx \
            apps/operations/src/app/MenuProductCard.tsx \
            apps/operations/src/styles/final-pos-corrections.css
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/operations/src/app/OrdersWorkspace.tsx \
            apps/operations/src/app/ProductCardPresentation.tsx \
            apps/operations/src/app/MenuEditProductCard.tsx \
            apps/operations/src/app/MenuEditProductCard.test.tsx \
            apps/operations/src/app/MenuProductCard.tsx \
            apps/operations/src/styles/final-pos-corrections.css \
            .github/workflows/ci.yml
          git commit -m "refactor: share menu product card presentation"
          git push origin HEAD:"$BRANCH_NAME"
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm run test
      - name: Typecheck
        run: npm run typecheck
      - name: Production builds
        run: npm run build
      - name: Development provisioning safety smoke
        shell: bash
        run: |
          if NODE_ENV=production npm run dev:provision -- --database .tmp/provision-production.sqlite3; then
            echo 'Production provisioning unexpectedly succeeded.' >&2
            exit 1
          fi
          npm run dev:provision -- --database .tmp/provision.sqlite3 --pin 2468 --secondary-pin 1357
          test -f apps/operations-desktop/.tmp/provision.sqlite3
          rm -rf apps/operations-desktop/.tmp
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Migration-chain smoke
        run: npm run test:migrations
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.46.3
      - name: Edge Function typecheck
        run: |
          deno check --config supabase/functions/device-enroll/deno.json supabase/functions/device-enroll/index.ts
          deno check --config supabase/functions/device-bootstrap/deno.json supabase/functions/device-bootstrap/index.ts
          deno check --config supabase/functions/operations-config/deno.json supabase/functions/operations-config/index.ts
          deno check --config supabase/functions/operations-sync/deno.json supabase/functions/operations-sync/index.ts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Rendered browser E2E
        run: npm run test:e2e
      - name: Upload rendered QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-rendered-e2e
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

  windows-package:
    name: windows-package
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build unsigned Windows x64 package
        run: npm run package:win -- --publish never
      - name: Upload unsigned Windows package
        uses: actions/upload-artifact@v4
        with:
          name: tux-operations-windows-x64-unsigned
          path: release/windows/*.exe
          if-no-files-found: error
          retention-days: 14

  required-quality-gate:
    name: Required quality gate
    if: always()
    needs:
      - quality
      - windows-package
    runs-on: ubuntu-latest
    steps:
      - name: Require every permanent gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          WINDOWS_RESULT: ${{ needs.windows-package.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$WINDOWS_RESULT" = "success"
