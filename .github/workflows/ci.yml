name: TUX V2 CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  task11-codemod:
    name: guarded Task 11 E2E codemod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/worker-system-color-theme
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply guarded Task 11 rendered QA additions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('e2e/operations.e2e.ts')
          source = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              source = source.replace(old, new, 1)

          if 'async function renderedActionContrast' in source:
              raise SystemExit('renderedActionContrast already exists; refusing duplicate codemod')
          if "test('worker system color picker is usable on tablet and mobile'" in source:
              raise SystemExit('mobile/tablet system-color test already exists; refusing duplicate codemod')

          helper = r'''
          async function renderedActionContrast(page: Page): Promise<number> {
            return page.locator('html').evaluate((node) => {
              const style = getComputedStyle(node);
              const parseHex = (value: string): [number, number, number] => {
                const match = /^#([0-9a-f]{6})$/i.exec(value.trim());
                if (match === null) throw new Error(`Expected canonical HEX color, got ${value}`);
                const hex = match[1]!;
                return [
                  Number.parseInt(hex.slice(0, 2), 16),
                  Number.parseInt(hex.slice(2, 4), 16),
                  Number.parseInt(hex.slice(4, 6), 16),
                ];
              };
              const linearChannel = (channel: number): number => {
                const value = channel / 255;
                return value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4;
              };
              const luminance = ([r, g, b]: [number, number, number]): number =>
                0.2126 * linearChannel(r) + 0.7152 * linearChannel(g) + 0.0722 * linearChannel(b);
              const accent = luminance(parseHex(style.getPropertyValue('--tux-accent')));
              const foreground = luminance(
                parseHex(style.getPropertyValue('--tux-action-foreground')),
              );
              return (Math.max(accent, foreground) + 0.05) / (Math.min(accent, foreground) + 0.05);
            });
          }
          '''.strip('\n')

          replace_once(
              '\nasync function openWorkerSystemColorDialog',
              '\n' + helper + '\n\nasync function openWorkerSystemColorDialog',
              'contrast helper insertion',
          )
          replace_once(
              "'system-color-worker-one-1366x768-light.png'",
              "'system-color-light-blue-desktop.png'",
              'light screenshot name',
          )
          replace_once(
              "'system-color-worker-one-1366x768-dark.png'",
              "'system-color-dark-blue-desktop.png'",
              'dark screenshot name',
          )
          replace_once(
              'const workerOneLightAccent = await renderedSystemAccent(page);',
              'const workerOneLightAccent = await renderedSystemAccent(page);\n  expect(await renderedActionContrast(page)).toBeGreaterThanOrEqual(4.5);',
              'light contrast assertion',
          )
          replace_once(
              'const workerOneDarkAccent = await renderedSystemAccent(page);',
              'const workerOneDarkAccent = await renderedSystemAccent(page);\n  expect(await renderedActionContrast(page)).toBeGreaterThanOrEqual(4.5);',
              'dark contrast assertion',
          )

          mobile_test = r'''

          test('worker system color picker is usable on tablet and mobile', async ({ page }, testInfo) => {
            test.skip(testInfo.project.name === 'desktop-browser-fallback');
            await installDeterministicEyeDropper(page);
            await enterActiveOrdersForCategoryTests(page);
            await setWorkerAppearance(page, 'Demo Worker One', 'Light');
            await expectNoHorizontalOverflow(page);

            const savedAccent = await renderedSystemAccent(page);
            const dialog = await openWorkerSystemColorDialog(page, 'Demo Worker One');
            await assertSystemColorDialogGeometry(page, dialog);
            await chooseHexSystemColor(dialog, '#1e3a8a');
            await expect.poll(() => renderedSystemAccent(page)).not.toBe(savedAccent);
            expect(await renderedActionContrast(page)).toBeGreaterThanOrEqual(4.5);

            await page.screenshot({
              path: testInfo.outputPath(
                testInfo.project.name === 'mobile-browser-fallback'
                  ? 'system-color-picker-mobile.png'
                  : 'system-color-picker-tablet.png',
              ),
              animations: 'disabled',
              caret: 'hide',
              fullPage: false,
            });

            await dialog.getByRole('button', { name: 'Cancel', exact: true }).click();
            await expect.poll(() => renderedSystemAccent(page)).toBe(savedAccent);
            await expectNoHorizontalOverflow(page);
          });
          '''

          if not source.rstrip().endswith('});'):
              raise SystemExit('unexpected E2E file suffix; refusing append')
          source = source.rstrip() + mobile_test + '\n'
          path.write_text(source)
          PY
          npx prettier --write e2e/operations.e2e.ts
          npm run typecheck:e2e
          npx vitest run apps/operations/src/app/workerSystemColorRenderedQa.source.test.ts
      - name: Commit rendered QA additions
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/operations.e2e.ts
          test -n "$(git status --porcelain e2e/operations.e2e.ts)"
          git commit -m 'test: complete worker system color rendered QA'
          git push origin HEAD:feat/worker-system-color-theme
      - name: Stop temporary workflow
        run: |
          echo 'Temporary branch-only codemod completed; permanent CI must now be restored.' >&2
          exit 1
