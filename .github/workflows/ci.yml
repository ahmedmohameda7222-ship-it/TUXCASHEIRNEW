name: TUX V2 CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  remove-unused-e2e-import:
    name: remove unused System Color E2E import
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/worker-system-color-theme
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Remove unused import and verify
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('e2e/worker-system-color.e2e.ts')
          source = path.read_text()
          old = "import { expect, test, type Locator, type Page, type TestInfo } from '@playwright/test';"
          new = "import { expect, test, type Locator, type Page } from '@playwright/test';"
          if source.count(old) != 1:
              raise SystemExit('unused TestInfo import anchor mismatch')
          path.write_text(source.replace(old, new, 1))
          PY
          npx prettier --write e2e/worker-system-color.e2e.ts
          npx eslint e2e/worker-system-color.e2e.ts --max-warnings 0
          npm run typecheck:e2e
          npx vitest run apps/operations/src/app/workerSystemColorRenderedQa.source.test.ts
      - name: Commit lint correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/worker-system-color.e2e.ts
          git commit -m 'test: remove unused system color E2E import'
          git push origin HEAD:feat/worker-system-color-theme
      - name: Stop temporary workflow
        run: |
          echo 'Temporary lint workflow completed; permanent CI must now be restored.' >&2
          exit 1
