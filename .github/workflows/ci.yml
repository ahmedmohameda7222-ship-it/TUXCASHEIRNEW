name: TUX V2 CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/worker-system-color-theme
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format Task 7 production exactly
        shell: bash
        run: |
          npx prettier --write apps/operations/src/app/systemAccentTheme.ts
          if git diff --quiet -- apps/operations/src/app/systemAccentTheme.ts; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/operations/src/app/systemAccentTheme.ts
          git commit -m "feat: format system accent palette engine"
          git push origin HEAD:feat/worker-system-color-theme
          exit 1
