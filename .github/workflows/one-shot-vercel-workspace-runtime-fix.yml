name: One-shot Vercel workspace runtime fixer

on:
  push:
    branches:
      - fix/vercel-runtime-workspace-package-tracing
    paths:
      - '.github/workflows/one-shot-vercel-workspace-runtime-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/vercel-runtime-workspace-package-tracing
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Rewrite source-only workspace runtime imports
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const serverDomainFiles = [
            'server/operationsDeviceAuthority.ts',
            'server/whatsappChannelResolver.ts',
            'server/whatsappOperationsGateway.ts',
            'server/whatsappOperationsRepository.ts',
            'server/whatsappOutboundActions.ts',
            'server/whatsappOutboundProviderGateway.ts',
            'server/whatsappProviderGateway.ts',
            'server/whatsappWebhook.ts',
          ];

          function splitNamedImport(file, packageName, runtimeModule) {
            let source = fs.readFileSync(file, 'utf8');
            const escaped = packageName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const pattern = new RegExp(`import\\s*\\{([\\s\\S]*?)\\}\\s*from\\s*['\"]${escaped}['\"];`);
            const match = source.match(pattern);
            if (!match) throw new Error(`Expected named import from ${packageName} in ${file}`);
            const entries = match[1]
              .split(',')
              .map((entry) => entry.trim())
              .filter(Boolean);
            const typeEntries = entries.filter((entry) => entry.startsWith('type ')).map((entry) => entry.slice(5).trim());
            const runtimeEntries = entries.filter((entry) => !entry.startsWith('type '));
            if (runtimeEntries.length === 0) throw new Error(`Expected runtime imports from ${packageName} in ${file}`);
            const replacement = [
              typeEntries.length > 0 ? `import type { ${typeEntries.join(', ')} } from '${packageName}';` : '',
              `import { ${runtimeEntries.join(', ')} } from '${runtimeModule}';`,
            ].filter(Boolean).join('\n');
            source = source.replace(pattern, replacement);
            fs.writeFileSync(file, source);
          }

          for (const file of serverDomainFiles) {
            splitNamedImport(file, '@tux/domain', './workspaceRuntime.js');
          }

          {
            const file = 'server/whatsappOutboundRepository.ts';
            let source = fs.readFileSync(file, 'utf8');
            const before = "import { parseWhatsAppMessage } from '@tux/application';";
            if (!source.includes(before)) throw new Error(`Expected @tux/application runtime import in ${file}`);
            source = source.replace(before, "import { parseWhatsAppMessage } from './workspaceRuntime.js';");
            fs.writeFileSync(file, source);
          }

          fs.writeFileSync(
            'server/workspaceRuntime.ts',
            [
              "export { parseEntityId } from '../packages/domain/src/ids.js';",
              "export { normalizeEgyptianPhone } from '../packages/domain/src/phone.js';",
              "export { instant } from '../packages/domain/src/time.js';",
              "export { assertWhatsAppMessageInvariant } from '../packages/domain/src/whatsapp.js';",
              "export { parseWhatsAppMessage } from '../packages/application/src/whatsappWire.js';",
              '',
            ].join('\n'),
          );

          {
            const file = 'packages/application/src/whatsappWire.ts';
            let source = fs.readFileSync(file, 'utf8');
            const pattern = /import\s*\{([\s\S]*?)\}\s*from\s*['\"]@tux\/domain['\"];/;
            const match = source.match(pattern);
            if (!match) throw new Error(`Expected @tux/domain import in ${file}`);
            const entries = match[1].split(',').map((entry) => entry.trim()).filter(Boolean);
            const runtimeNames = new Set(['assertWhatsAppMessageInvariant', 'instant', 'parseEntityId']);
            const typeEntries = entries
              .filter((entry) => entry.startsWith('type '))
              .map((entry) => entry.slice(5).trim());
            const runtimeEntries = entries.filter((entry) => !entry.startsWith('type '));
            for (const name of runtimeEntries) {
              if (!runtimeNames.has(name)) throw new Error(`Unexpected runtime @tux/domain import ${name} in ${file}`);
            }
            source = source.replace(
              pattern,
              [
                `import type { ${typeEntries.join(', ')} } from '@tux/domain';`,
                "import { parseEntityId } from '../../domain/src/ids.js';",
                "import { instant } from '../../domain/src/time.js';",
                "import { assertWhatsAppMessageInvariant } from '../../domain/src/whatsapp.js';",
              ].join('\n'),
            );
            const remoteBefore = "from './whatsappRemote';";
            if (!source.includes(remoteBefore)) throw new Error(`Expected relative whatsappRemote import in ${file}`);
            source = source.replace(remoteBefore, "from './whatsappRemote.js';");
            fs.writeFileSync(file, source);
          }

          const relativeSpecifierFixes = new Map([
            ['packages/domain/src/ids.ts', [
              ["from './brand.ts';", "from './brand.js';"],
              ["from './errors.ts';", "from './errors.js';"],
            ]],
            ['packages/domain/src/time.ts', [
              ["from './brand.ts';", "from './brand.js';"],
              ["from './errors.ts';", "from './errors.js';"],
            ]],
            ['packages/domain/src/whatsapp.ts', [
              ["from './errors';", "from './errors.js';"],
              ["from './ids';", "from './ids.js';"],
              ["from './time';", "from './time.js';"],
            ]],
          ]);

          for (const [file, replacements] of relativeSpecifierFixes) {
            let source = fs.readFileSync(file, 'utf8');
            for (const [before, after] of replacements) {
              if (!source.includes(before)) throw new Error(`Expected ${before} in ${file}`);
              source = source.replace(before, after);
            }
            fs.writeFileSync(file, source);
          }
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Format touched files
        run: >-
          npx prettier --write
          server/operationsDeviceAuthority.ts
          server/whatsappChannelResolver.ts
          server/whatsappOperationsGateway.ts
          server/whatsappOperationsRepository.ts
          server/whatsappOutboundActions.ts
          server/whatsappOutboundProviderGateway.ts
          server/whatsappProviderGateway.ts
          server/whatsappWebhook.ts
          server/whatsappOutboundRepository.ts
          server/workspaceRuntime.ts
          packages/application/src/whatsappWire.ts
          packages/domain/src/ids.ts
          packages/domain/src/time.ts
          packages/domain/src/whatsapp.ts
      - name: Verify runtime graph guard
        run: node scripts/test-operations-vercel-esm-imports.mjs
      - name: Verify API typecheck
        run: npx tsc --noEmit -p tsconfig.api.json
      - name: Verify WhatsApp server tests
        shell: bash
        run: npx vitest run server/whatsapp*.test.ts server/operationsDeviceAuthority.test.ts
      - name: Commit verified correction and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-vercel-workspace-runtime-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'fix(vercel): trace workspace runtime source explicitly'
          git push origin HEAD:fix/vercel-runtime-workspace-package-tracing
