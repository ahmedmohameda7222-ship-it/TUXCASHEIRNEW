name: P0 Business Day PostgreSQL Acceptance
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/operations-business-day-sync-postgres.sql'
      - 'scripts/test-operations-business-day-sync-postgres.mjs'
      - '.github/workflows/business-day-sync-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    name: Real PostgreSQL RPC
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Real RPC regression
        run: node scripts/test-operations-business-day-sync-postgres.mjs

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install formatter for exact formatting diagnostics
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Temporary targeted formatter diff diagnostic (remove before closeout)
        run: |
          npx prettier --write \
            apps/operations/src/app/businessDayPreflight.test.ts \
            packages/sync/src/httpTransport.test.ts \
            packages/sync/src/httpTransport.ts \
            server/operationsSyncGateway.test.ts
          git diff -- \
            apps/operations/src/app/businessDayPreflight.test.ts \
            packages/sync/src/httpTransport.test.ts \
            packages/sync/src/httpTransport.ts \
            server/operationsSyncGateway.test.ts
