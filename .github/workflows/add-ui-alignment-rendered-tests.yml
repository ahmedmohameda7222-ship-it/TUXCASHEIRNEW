name: Add TUX UI alignment rendered regressions

on:
  push:
    branches:
      - ui/tux-input-alignment-fixes

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/tux-input-alignment-fixes
          fetch-depth: 0

      - name: Insert rendered alignment coverage
        run: |
          python - <<'PY'
          from base64 import b64decode
          from pathlib import Path

          path = Path('e2e/operations.e2e.ts')
          text = path.read_text()
          anchor = "\ntest('follow-up desktop approval evidence is captured from the committed tree'"
          marker = "test('long-term UI alignment contracts render correctly'"
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected one rendered-evidence anchor, found {text.count(anchor)}.')
          if marker in text:
              raise SystemExit('Rendered alignment test already exists unexpectedly.')
          payload = ''
          insert = b64decode(payload).decode()
          path.write_text(text.replace(anchor, insert + anchor, 1))
          PY

      - name: Verify bounded test diff
        run: |
          git diff --check
          test "$(git diff --name-only)" = "e2e/operations.e2e.ts"

      - name: Commit rendered regression coverage
        run: |
          git config user.name "TUX POS Verification"
          git config user.email "actions@users.noreply.github.com"
          git add e2e/operations.e2e.ts
          git commit -m "test: cover rendered UI alignment contracts"
          git push origin HEAD:ui/tux-input-alignment-fixes
