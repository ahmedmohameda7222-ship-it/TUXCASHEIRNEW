name: Phase B lost-ack correction

on:
  push:
    branches:
      - feat/menu-layout-persistence-phase-b
    paths:
      - .github/workflows/phase-b-lost-ack-fix.yml

permissions:
  contents: write

jobs:
  focused-verify-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/menu-layout-persistence-phase-b
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply bounded lost-ack correction
        run: python3 .github/scripts/phase_b_lost_ack_fix.py
      - name: Format affected files
        run: >-
          npx prettier --write
          packages/application/src/workerMenuLayout.ts
          packages/application/src/workerMenuLayout.test.ts
      - name: Focused WorkerMenuLayout tests
        run: npx vitest run packages/application/src/workerMenuLayout.test.ts
      - name: Focused application typecheck
        run: npm run typecheck -w @tux/application
      - name: Commit verified correction to existing branch
        run: |
          git rm -f .github/workflows/phase-b-lost-ack-fix.yml .github/scripts/phase_b_lost_ack_fix.py
          git add packages/application/src/workerMenuLayout.ts packages/application/src/workerMenuLayout.test.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: recover Worker Menu Layout lost acknowledgements'
          git push origin HEAD:feat/menu-layout-persistence-phase-b
