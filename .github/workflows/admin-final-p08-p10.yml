name: Admin Final P08-P10

on:
  pull_request:
    branches:
      - main

concurrency:
  group: admin-final-p08-p10-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  exact-head-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      P08_P10_CAPTURE: '1'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert exact pull request head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Root tests and typecheck
        run: |
          npm test
          npm run typecheck

      - name: Local migration and event idempotency tests
        run: npm run test:migrations

      - name: Security, architecture, deployment and Vercel budget gates
        run: |
          npm run test:whatsapp-security
          npm run test:whatsapp-architecture
          npm run test:admin-security
          npm run test:admin-deployment
          npx vitest run apps/admin/server/api-contracts/vercelFunctionBudget.test.ts

      - name: Cross-application unit journey
        run: npx vitest run packages/application/src/menuOperationsWhatsAppJourney.test.ts server/whatsappEventMessaging.test.ts

      - name: Menu integration
        run: npx playwright test --config playwright.menu.config.ts e2e/menu/menu.e2e.ts

      - name: Admin integration and visual evidence
        run: npx playwright test --config playwright.admin.config.ts e2e/admin-final-integration.spec.ts

      - name: Verify screenshot inventory, PNG headers, dimensions and SHA256
        run: node scripts/verify-admin-final-screenshots.mjs

      - name: Reassert exact head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Package original screenshot evidence
        run: zip -r tux-admin-final-screenshots.zip artifacts/tux-final

      - name: Upload screenshot evidence
        uses: actions/upload-artifact@v6
        with:
          name: tux-admin-final-screenshots-${{ github.event.pull_request.head.sha }}
          path: |
            tux-admin-final-screenshots.zip
            artifacts/tux-final/SCREENSHOT_MANIFEST.json
            artifacts/tux-final/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
