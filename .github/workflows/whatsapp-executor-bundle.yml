name: Build WhatsApp executor bundle

on:
  push:
    branches:
      - infra/whatsapp-executor-bundle-20260904

permissions:
  contents: read

concurrency:
  group: whatsapp-executor-bundle-20260904
  cancel-in-progress: true

jobs:
  bundle:
    name: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASELINE_SHA: 0684c49f3988545ea68efdfa1d0a1ce4de9e0cdc
      IMPLEMENTATION_BRANCH: feat/operations-whatsapp-inbox
    steps:
      - name: Checkout exact baseline history
        uses: actions/checkout@v7
        with:
          ref: 0684c49f3988545ea68efdfa1d0a1ce4de9e0cdc
          fetch-depth: 0

      - name: Materialize and verify exact implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git switch -C "$IMPLEMENTATION_BRANCH" "$BASELINE_SHA"
          test "$(git rev-parse --abbrev-ref HEAD)" = "$IMPLEMENTATION_BRANCH"
          test "$(git rev-parse HEAD)" = "$BASELINE_SHA"
          test -z "$(git status --short)"

      - name: Build exact clean checkout archive
        shell: bash
        run: |
          set -euo pipefail
          cd ..
          tar -czf "$RUNNER_TEMP/TUXCASHEIRNEW-whatsapp-executor-bundle.tar.gz" TUXCASHEIRNEW
          sha256sum "$RUNNER_TEMP/TUXCASHEIRNEW-whatsapp-executor-bundle.tar.gz" > "$RUNNER_TEMP/TUXCASHEIRNEW-whatsapp-executor-bundle.sha256"
          cd TUXCASHEIRNEW
          mkdir -p .executor-artifacts
          cp "$RUNNER_TEMP/TUXCASHEIRNEW-whatsapp-executor-bundle.tar.gz" .executor-artifacts/
          cp "$RUNNER_TEMP/TUXCASHEIRNEW-whatsapp-executor-bundle.sha256" .executor-artifacts/

      - name: Upload executor bundle
        uses: actions/upload-artifact@v4
        with:
          name: TUXCASHEIRNEW-whatsapp-executor-bundle
          path: .executor-artifacts/*
          if-no-files-found: error
          retention-days: 7
