name: Temporary System Color Format

on:
  push:
    branches:
      - feat/worker-system-color-theme

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/worker-system-color-theme
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run write-mode formatter
        run: npm run format
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Formatter made no changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'chore: format rendered system color matrix'
          git push origin HEAD:feat/worker-system-color-theme
