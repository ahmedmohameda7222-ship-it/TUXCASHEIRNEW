name: Task 7A GREEN

on:
  push:
    branches:
      - feat/ops-whatsapp-task7a-green
    paths:
      - apps/operations/src/app/whatsappView.ts
      - apps/operations/src/app/whatsappView.test.ts
      - .github/workflows/task7a-green.yml

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Required Task 7A GREEN
        run: npm test -- apps/operations/src/app/whatsappView.test.ts
      - name: Required operations typecheck
        run: npm run typecheck -w @tux/operations
      - name: Targeted lint
        run: npx eslint apps/operations/src/app/whatsappView.ts apps/operations/src/app/whatsappView.test.ts --max-warnings 0
      - name: Formatting diagnostic
        run: |
          npx prettier --write apps/operations/src/app/whatsappView.test.ts
          git diff -- apps/operations/src/app/whatsappView.test.ts
          exit 1
