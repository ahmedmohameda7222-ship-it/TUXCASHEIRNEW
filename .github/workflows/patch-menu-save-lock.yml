name: Patch menu save lock

on:
  push:
    branches:
      - ui/unified-menu-edit-mode
    paths:
      - .github/workflows/patch-menu-save-lock.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/unified-menu-edit-mode
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply save-lock patch
        run: node scripts/patch-menu-save-lock.mjs
      - name: Format production change
        run: npx prettier --write apps/operations/src/app/OrdersWorkspace.tsx
      - name: Verify targeted regression
        run: npx vitest run apps/operations/src/app/unifiedMenuEditMode.source.test.ts
      - name: Remove temporary patch scaffolding
        run: rm .github/workflows/patch-menu-save-lock.yml scripts/patch-menu-save-lock.mjs
      - name: Commit clean production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: freeze menu edits while saving"
          git push origin HEAD:ui/unified-menu-edit-mode
