name: Temporary online-order preload test formatter

on:
  push:
    branches:
      - work/menu-online-orders-integration
    paths:
      - .github/workflows/tmp-format-online-order-preload-test.yml

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Print canonical formatter diff
        run: |
          npx prettier --write apps/operations-desktop/src/preload/onlineOrderInboxBridge.test.ts
          git diff -- apps/operations-desktop/src/preload/onlineOrderInboxBridge.test.ts
