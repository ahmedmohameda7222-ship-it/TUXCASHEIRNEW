name: Phase 9 Wire Automatic Sync

on:
  push:
    branches:
      - feat/ops-09-sync
    paths:
      - '.phase9-wire.trigger'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ops-09-sync
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Apply runtime wiring
        run: python scripts/phase9_wire.py
      - name: Refresh workspace lock and format
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run format
      - name: Remove temporary wiring helpers
        run: |
          rm -f .phase9-wire.trigger .github/workflows/phase9-wire.yml scripts/phase9_wire.py
      - name: Commit Phase 9 wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Wire Phase 9 automatic outbox sync'
          git push origin HEAD:feat/ops-09-sync
