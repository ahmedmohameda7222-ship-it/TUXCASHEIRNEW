name: Phase 4 compliance patch

on:
  push:
    branches:
      - feat/ops-04-orders

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ops-04-orders
      - run: python .phase4-compliance-patch.py
      - name: Commit compliance matrix only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/OPERATIONS_COMPLIANCE_MATRIX.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Phase 4 Orders compliance evidence"
          git push origin HEAD:feat/ops-04-orders
