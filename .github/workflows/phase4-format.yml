name: Phase 4 one-time formatter

on:
  push:
    branches:
      - feat/ops-04-orders

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ops-04-orders
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Format Phase 4 source
        run: >-
          npx prettier --write
          packages/application/src/**/*.{ts,tsx}
          packages/domain/src/**/*.{ts,tsx}
          packages/persistence/src/**/*.{ts,tsx}
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/application/src packages/domain/src packages/persistence/src
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format Phase 4 source"
          git push origin HEAD:feat/ops-04-orders
