name: Phase 4 one-time formatter

on:
  push:
    branches:
      - feat/ops-04-orders
    paths:
      - .github/workflows/phase4-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ops-04-orders
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Format Phase 4 files
        run: >-
          npx prettier --write
          packages/application/src/index.ts
          packages/application/src/orders.ts
          packages/domain/src/index.ts
          packages/domain/src/orderValidation.ts
          packages/domain/src/payment.test.ts
          packages/domain/src/tender.ts
          packages/persistence/src/sqlite/SqliteOrderDraftStore.ts
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/application/src/index.ts packages/application/src/orders.ts packages/domain/src/index.ts packages/domain/src/orderValidation.ts packages/domain/src/payment.test.ts packages/domain/src/tender.ts packages/persistence/src/sqlite/SqliteOrderDraftStore.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format Phase 4 Orders foundation"
          git push origin HEAD:feat/ops-04-orders
