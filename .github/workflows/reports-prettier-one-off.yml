name: Reports Prettier one-off
on:
  push:
    branches:
      - feat/reports-r1-r5-report-first-pdf-20261029
    paths:
      - .github/workflows/reports-prettier-one-off.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write apps/admin/server/reports/reportPdfExport.test.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet -- apps/admin/server/reports/reportPdfExport.test.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/admin/server/reports/reportPdfExport.test.ts
            git commit -m "style(reports): format scale test per Prettier"
            git push
          fi
