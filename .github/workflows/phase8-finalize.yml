name: Phase 8 Finalize

on:
  push:
    branches:
      - feat/ops-08-end-day
    paths:
      - '.phase8-finalize.trigger'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ops-08-end-day
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Apply final evidence and strengthen variance test
        run: python scripts/phase8_finalize.py
      - name: Install and normalize formatting
        run: |
          npm ci
          npm run format
      - name: Remove temporary Phase 8 helpers
        run: |
          rm -f .phase8-ci2.trigger .phase8-finalize.trigger
          rm -f scripts/phase8_finalize.py .github/workflows/phase8-finalize.yml
      - name: Run all permanent gates on clean final tree
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Commit final Phase 8 tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close Phase 8 End Day evidence'
          git push origin HEAD:feat/ops-08-end-day
