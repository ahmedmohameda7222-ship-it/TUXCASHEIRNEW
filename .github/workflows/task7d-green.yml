name: Task 7D GREEN

on:
  push:
    branches:
      - feat/ops-whatsapp-task7d-green

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply minimal Task 7D App integration
        shell: bash
        run: |
          if ! git diff --quiet c11d9412793e13ae8d6a9210bf460f1db107a888 -- apps/operations/src/app/App.tsx; then
            echo 'App.tsx already changed on this diagnostic branch; skipping patch.'
          else
            python scripts/tmp-task7d-green.py
          fi
          npx prettier --write apps/operations/src/app/App.tsx apps/operations/src/app/App.whatsapp.test.tsx
      - name: Task 7D focused tests
        run: npm test -- apps/operations/src/app/App.whatsapp.test.tsx apps/operations/src/app/WhatsAppWorkspace.test.tsx apps/operations/src/app/whatsappInboxController.test.ts apps/operations/src/app/whatsappView.test.ts
      - name: Operations typecheck
        run: npm run typecheck -w @tux/operations
      - name: Task 7D targeted lint
        run: npx eslint apps/operations/src/app/App.tsx apps/operations/src/app/App.whatsapp.test.tsx --max-warnings 0
      - name: Task 7D targeted format
        run: npx prettier --check apps/operations/src/app/App.tsx apps/operations/src/app/App.whatsapp.test.tsx
      - name: Task 7D security and architecture fence
        shell: bash
        run: |
          test "$(grep -o 'createOperationsWhatsAppClient()' apps/operations/src/app/App.tsx | wc -l)" -eq 1
          test "$(grep -o 'new WhatsAppInboxController(' apps/operations/src/app/App.tsx | wc -l)" -eq 1
          if git grep -n -E 'sendMedia|graph\.facebook\.com|TUX_WHATSAPP_ACCESS_TOKEN|TUX_WHATSAPP_APP_SECRET|TUX_WHATSAPP_WEBHOOK_VERIFY_TOKEN|SUPABASE_SERVICE_ROLE_KEY|TUX_SUPABASE_SERVICE_ROLE_KEY|providerPhoneNumberId' -- apps/operations/src/app/App.tsx; then
            echo 'Forbidden provider/privileged integration found in App.tsx.' >&2
            exit 1
          fi
      - name: Task 7D migration and package immutability
        run: |
          git diff --exit-code 2a39d9bfaf8622907646294fba8515854d4c3834 -- supabase/migrations packages/persistence/src/sqlite/migrations.ts packages/persistence/src/browser/indexedDbMigrations.ts
          git diff --exit-code 2a39d9bfaf8622907646294fba8515854d4c3834 -- package-lock.json apps/operations/package.json apps/operations-desktop/package.json
      - name: Persist verified diagnostic source
        shell: bash
        run: |
          if ! git diff --quiet -- apps/operations/src/app/App.tsx apps/operations/src/app/App.whatsapp.test.tsx; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add apps/operations/src/app/App.tsx apps/operations/src/app/App.whatsapp.test.tsx
            git commit -m 'test: persist Task 7D GREEN candidate'
            git push
          fi
      - name: Clean checkout
        run: test -z "$(git status --short)"
