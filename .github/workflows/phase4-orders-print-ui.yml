name: Phase 4 Orders print notice patch

on:
  push:
    branches:
      - feat/ops-04-orders

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ops-04-orders
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: python .phase4-orders-print-ui.py
      - run: npx prettier --write apps/operations/src/app/OrdersWorkspace.tsx apps/operations/src/styles/orders.css
      - name: Commit print notice patch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/operations/src/app/OrdersWorkspace.tsx apps/operations/src/styles/orders.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add retryable receipt print status UI"
          git push origin HEAD:feat/ops-04-orders
