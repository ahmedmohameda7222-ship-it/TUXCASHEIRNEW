name: Temporary Plan 2 Prettier Diagnostic

on:
  push:
    branches:
      - tmp/admin-plan2-final-review-3-fixes

permissions:
  contents: write

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply exact Prettier output
        run: |
          npx prettier --write apps/operations-desktop/src/main/endDayIpc.ts apps/operations-desktop/src/main/index.ts
          if git diff --quiet -- apps/operations-desktop/src/main/endDayIpc.ts apps/operations-desktop/src/main/index.ts; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/operations-desktop/src/main/endDayIpc.ts apps/operations-desktop/src/main/index.ts
          git commit -m "style(plan2): apply exact prettier output"
          git push origin HEAD:tmp/admin-plan2-final-review-3-fixes
