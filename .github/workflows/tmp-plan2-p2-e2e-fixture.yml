name: Temporary Plan 2 P2 E2E Fixture Patch

on:
  push:
    branches:
      - tmp/admin-plan2-final-review-3-fixes

permissions:
  contents: write

jobs:
  patch-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch fixture and verify catalog publishing E2E
        run: |
          python3 -c "from pathlib import Path; p=Path('e2e/admin-catalog-publish.spec.ts'); s=p.read_text(); old=\"              priceChangedProductIds: ['11111111-1111-4111-8111-111111111111'],\\n\"; new=old+\"              changedRelationCounts: {\\n                productModifierLinks: 0,\\n                comboBeverageOptions: 0,\\n                recipeLines: 0,\\n              },\\n\"; assert old in s or new in s; p.write_text(s if new in s else s.replace(old,new,1))"
          npx prettier --write e2e/admin-catalog-publish.spec.ts
          npx playwright install chromium
          npx playwright test e2e/admin-catalog-publish.spec.ts --config playwright.admin.config.ts
          if git diff --quiet -- e2e/admin-catalog-publish.spec.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/admin-catalog-publish.spec.ts
          git commit -m "test(plan2): align publish E2E fixture with preview contract"
          git push origin HEAD:tmp/admin-plan2-final-review-3-fixes
