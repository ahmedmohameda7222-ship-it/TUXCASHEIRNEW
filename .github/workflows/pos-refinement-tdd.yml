name: POS Requested UI Visual QA Evidence

on:
  push:
    branches:
      - 'ui/tux-pos-refinement'

permissions:
  contents: read

concurrency:
  group: pos-requested-ui-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: requested-ui-visual-qa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply approved candidate transiently
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          workspace_path = Path('apps/operations/src/app/OrdersWorkspace.tsx')
          workspace = workspace_path.read_text()
          start = workspace.find('  const activeFamilies = useMemo(')
          end = workspace.find('\n\n  useEffect(() => {', start)
          if start < 0 or end < 0:
              raise SystemExit('activeFamilies anchors not found')
          new_families = '''  const activeFamilies = useMemo(() => {
            const selectedCategory = activeCategories.find(
              (category) => category.id === selectedCategoryId,
            );
            if (selectedCategory?.name.trim().toLocaleLowerCase() !== 'burgers') return [];
            return productFamiliesForCategory(configuration?.products ?? [], selectedCategoryId);
          }, [activeCategories, configuration, selectedCategoryId]);'''
          workspace = workspace[:start] + new_families + workspace[end:]
          workspace_path.write_text(workspace)

          card_path = Path('apps/operations/src/app/MenuProductCard.tsx')
          card = card_path.read_text()
          card, count = re.subn(
              r"\n\s*const description = product\.description\?\.trim\(\) \?\? '';",
              '',
              card,
              count=1,
          )
          if count != 1:
              raise SystemExit('product-card description declaration not found')
          card, count = re.subn(
              r"\n\s*\{description\.length > 0 \? <p>\{description\}</p> : null\}",
              '',
              card,
              count=1,
          )
          if count != 1:
              raise SystemExit('product-card description render not found')
          card_path.write_text(card)

          css_path = Path('apps/operations/src/styles/final-pos-corrections.css')
          css = css_path.read_text()
          css += '''

          /* User-approved Burger subcategory row. */
          .menu-toolbar:not(.category-mode-edit):has(.product-family-filter) {
            height: auto;
            min-height: 56px;
            padding: 5px 8px 8px;
          }

          .menu-toolbar:not(.category-mode-edit)
            > .category-navigation-stack:has(.product-family-filter) {
            flex-direction: column;
            align-items: stretch;
          }

          .menu-toolbar:not(.category-mode-edit)
            > .category-navigation-stack:has(.product-family-filter)
            .category-navigation {
            width: 100%;
            min-height: 44px;
            flex: 0 0 44px;
          }

          .menu-toolbar:not(.category-mode-edit)
            > .category-navigation-stack:has(.product-family-filter)
            .product-family-filter {
            width: fit-content;
            align-self: flex-start;
            flex: 0 0 44px;
          }
          '''
          css_path.write_text(css)

          e2e_path = Path('e2e/operations.e2e.ts')
          e2e = e2e_path.read_text()
          e2e += r'''

          test('requested UI visual QA desktop states', async ({ page }, testInfo) => {
            test.skip(testInfo.project.name !== 'desktop-browser-fallback');
            await enterActiveOrdersForCategoryTests(page);
            const primary = page.getByLabel('Menu categories');
            await primary.getByRole('button', { name: 'Burgers', exact: true }).click();
            const families = page.getByLabel('Product families');
            await expect(families.getByRole('button')).toHaveText(['All', 'TUX', 'TUXIFY']);
            await expect(page.locator('.product-card').first().locator('.product-copy p')).toHaveCount(0);
            await page.screenshot({ path: testInfo.outputPath('01-desktop-burgers-subrow-no-descriptions.png'), fullPage: false, animations: 'disabled', caret: 'hide' });

            const card = page.locator('.product-card').filter({ hasText: 'Single Smashed Patty' }).first();
            await card.getByRole('button', { name: 'Quick Info for Single Smashed Patty' }).click();
            const dialog = page.getByRole('dialog', { name: 'Single Smashed Patty' });
            await expect(dialog.locator('.quick-info-body p')).toContainText('1 smashed patty');
            await page.screenshot({ path: testInfo.outputPath('02-desktop-quick-info-description.png'), fullPage: false, animations: 'disabled', caret: 'hide' });
            await page.keyboard.press('Escape');

            await primary.getByRole('button', { name: 'Fries', exact: true }).click();
            await expect(page.getByLabel('Product families')).toHaveCount(0);
            await page.screenshot({ path: testInfo.outputPath('03-desktop-fries-no-subrow.png'), fullPage: false, animations: 'disabled', caret: 'hide' });
          });

          test('requested UI visual QA mobile state', async ({ page }, testInfo) => {
            test.skip(testInfo.project.name !== 'mobile-browser-fallback');
            await enterActiveOrdersForCategoryTests(page);
            await page.getByLabel('Menu categories').getByRole('button', { name: 'Burgers', exact: true }).click();
            await expect(page.getByLabel('Product families').getByRole('button')).toHaveText(['All', 'TUX', 'TUXIFY']);
            await page.screenshot({ path: testInfo.outputPath('04-mobile-375-burgers-subrow.png'), fullPage: false, animations: 'disabled', caret: 'hide' });
          });
          '''
          e2e_path.write_text(e2e)
          PY
          npx prettier --write \
            apps/operations/src/app/OrdersWorkspace.tsx \
            apps/operations/src/app/MenuProductCard.tsx \
            apps/operations/src/styles/final-pos-corrections.css \
            e2e/operations.e2e.ts
      - name: Typecheck visual harness
        run: npm run typecheck:e2e
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture desktop and mobile visual QA
        run: >-
          npx playwright test e2e/operations.e2e.ts
          --project=desktop-browser-fallback
          --project=mobile-browser-fallback
          --grep "requested UI visual QA"
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p visual-qa
          find test-results -type f -name '*.png' -exec cp {} visual-qa/ \;
          ls -lah visual-qa
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requested-ui-visual-qa
          path: visual-qa/
          if-no-files-found: error
          retention-days: 7
