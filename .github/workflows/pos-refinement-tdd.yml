name: POS Refinement TDD

on:
  push:
    branches:
      - 'ui/tux-pos-refinement'

permissions:
  contents: read

concurrency:
  group: pos-refinement-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tdd:
    name: mobile-hit-diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply correction and diagnostic
        run: |
          python scripts/final_correction_apply.py
          python scripts/final_correction_test_expectations.py
          python scripts/final_correction_geometry_fix.py
          python scripts/final_correction_brand_fix.py
          python scripts/final_correction_mobile_diagnostic.py
      - name: Format diagnostic source
        run: npx prettier --write e2e/operations.e2e.ts apps/operations/src/styles/premium.css
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Diagnose mobile combo hit target
        run: npm run test:e2e -- --project=mobile-browser-fallback --grep "diagnostic combo mobile hit target"
