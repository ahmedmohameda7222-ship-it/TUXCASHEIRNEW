name: POS Adaptive Card RED

on:
  push:
    branches:
      - ui/tux-pos-refinement

permissions:
  contents: read

jobs:
  red:
    name: adaptive-product-grid-red
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout pre-fix source
        uses: actions/checkout@v7
        with:
          ref: 6329410c17326088d1ec616040ddcc5b35f9da3f
      - name: Prove pre-fix source
        run: test "$(git rev-parse HEAD)" = "6329410c17326088d1ec616040ddcc5b35f9da3f"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Add RED regression contract
        run: |
          cat >> e2e/operations.e2e.ts <<'EOF'

          test('product names stay fully readable while Current Order rail resizes', async ({ page }, testInfo) => {
            await enterActiveOrdersForCategoryTests(page);
            if (!testInfo.project.name.startsWith('desktop')) return;

            const separator = page.getByRole('separator', { name: 'Resize Current Order' });
            const cart = page.locator('.desktop-cart-wrap');
            const menu = page.locator('.menu-pane');
            const grid = page.locator('.product-grid');

            async function expectReadableTitles(state: string): Promise<void> {
              const [cartBox, menuBox, firstCardBox, columns, titles] = await Promise.all([
                cart.boundingBox(),
                menu.boundingBox(),
                page.locator('.product-card').first().boundingBox(),
                grid.evaluate((node) => getComputedStyle(node).gridTemplateColumns),
                page.locator('.product-copy strong').evaluateAll((nodes) =>
                  nodes.map((node) => {
                    const element = node as HTMLElement;
                    const range = document.createRange();
                    range.selectNodeContents(element);
                    const textRect = range.getBoundingClientRect();
                    const box = element.getBoundingClientRect();
                    return {
                      text: element.textContent ?? '',
                      clientHeight: element.clientHeight,
                      scrollHeight: element.scrollHeight,
                      textBottom: textRect.bottom,
                      boxBottom: box.bottom,
                    };
                  }),
                ),
              ]);

              console.log(
                JSON.stringify({
                  state,
                  cartWidth: cartBox?.width ?? null,
                  menuWidth: menuBox?.width ?? null,
                  cardWidth: firstCardBox?.width ?? null,
                  columns,
                  clipped: titles.filter(
                    (title) =>
                      title.scrollHeight > title.clientHeight + 1 || title.textBottom > title.boxBottom + 1,
                  ),
                }),
              );

              for (const title of titles) {
                expect(
                  title.scrollHeight,
                  `${state}: ${title.text} must not be line-clamped`,
                ).toBeLessThanOrEqual(title.clientHeight + 1);
                expect(title.textBottom, `${state}: ${title.text} must stay inside its title box`).toBeLessThanOrEqual(
                  title.boxBottom + 1,
                );
              }
            }

            await separator.focus();
            await page.keyboard.press('Home');
            await expect.poll(async () => (await cart.boundingBox())?.width ?? 0).toBeLessThanOrEqual(362);
            await expectReadableTitles('cart-min-360');

            await page.keyboard.press('ArrowLeft');
            await page.keyboard.press('ArrowLeft');
            await page.keyboard.press('ArrowLeft');
            await expect.poll(async () => (await cart.boundingBox())?.width ?? 0).toBeGreaterThanOrEqual(430);
            await expectReadableTitles('cart-default-432');

            await separator.focus();
            await page.keyboard.press('End');
            await expect.poll(async () => (await cart.boundingBox())?.width ?? 0).toBeGreaterThanOrEqual(598);
            await expectReadableTitles('cart-max-600');
          });
          EOF
          npx prettier --write e2e/operations.e2e.ts
      - name: Verify RED harness compiles
        run: npm run typecheck:e2e
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Observe expected RED
        run: npx playwright test e2e/operations.e2e.ts --project=desktop-browser-fallback --grep "product names stay fully readable while Current Order rail resizes"
