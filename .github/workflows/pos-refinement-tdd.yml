name: POS Refinement TDD

on:
  push:
    branches:
      - 'ui/tux-pos-refinement'

permissions:
  contents: write

concurrency:
  group: pos-refinement-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tdd:
    name: fast-tdd
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply Task 11 current order implementation
        if: github.actor != 'github-actions[bot]'
        run: |
          python scripts/task11_apply.py
          python scripts/task11_css_fix.py
      - name: Format Task 11 touched files
        if: github.actor != 'github-actions[bot]'
        run: npx prettier --write apps/operations/src/app/OrdersWorkspace.tsx apps/operations/src/app/OrdersCart.tsx apps/operations/src/styles/orders.css
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        if: github.actor != 'github-actions[bot]'
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm run test
      - name: E2E typecheck
        if: github.actor != 'github-actions[bot]'
        run: npm run typecheck:e2e
      - name: Install Playwright Chromium
        if: github.actor != 'github-actions[bot]'
        run: npx playwright install --with-deps chromium
      - name: Verify current order cashier workflow
        if: github.actor != 'github-actions[bot]'
        run: npm run test:e2e -- --grep "Current Order keeps cashier|Extra shortcuts"
      - name: Commit verified Task 11 implementation
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/operations/src/app/OrdersWorkspace.tsx apps/operations/src/app/OrdersCart.tsx apps/operations/src/styles/orders.css
          git diff --cached --quiet && exit 0
          git commit -m "feat: align current order with cashier workflow"
          git push origin HEAD:ui/tux-pos-refinement
