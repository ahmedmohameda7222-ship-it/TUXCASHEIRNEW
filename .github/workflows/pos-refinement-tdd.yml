name: POS Refinement TDD

on:
  push:
    branches:
      - 'ui/tux-pos-refinement'

permissions:
  contents: write

concurrency:
  group: pos-refinement-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tdd:
    name: fast-tdd
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Add focused Task 10 rendered contract
        if: github.actor != 'github-actions[bot]'
        run: python scripts/task10_red_test.py
      - name: Format focused Task 10 contract
        if: github.actor != 'github-actions[bot]'
        run: npx prettier --write e2e/operations.e2e.ts
      - name: Typecheck focused rendered contract
        if: github.actor != 'github-actions[bot]'
        run: npm run typecheck:e2e
      - name: Install Playwright Chromium
        if: github.actor != 'github-actions[bot]'
        run: npx playwright install --with-deps chromium
      - name: Confirm focused Task 10 RED and commit tests
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set +e
          npm run test:e2e -- --project=desktop-browser-fallback --retries=0 --timeout=30000 --grep "Extra shortcuts" 2>&1 | tee /tmp/task10-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -Eq "Extra|toBeVisible|element\(s\) not found" /tmp/task10-red.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/operations.e2e.ts
          git commit -m "test: define Extras shortcuts behavior"
          git push origin HEAD:ui/tux-pos-refinement
      - name: Format check
        if: github.actor == 'github-actions[bot]'
        run: npm run format:check
      - name: Lint
        if: github.actor == 'github-actions[bot]'
        run: npm run lint
      - name: Unit and integration tests
        if: github.actor == 'github-actions[bot]'
        run: npm run test
