name: POS Final Requested UI GREEN

on:
  push:
    branches:
      - 'ui/tux-pos-refinement'

permissions:
  contents: write

concurrency:
  group: pos-final-requested-ui-green-${{ github.ref }}
  cancel-in-progress: true

jobs:
  green:
    if: "${{ github.event.head_commit.message != 'fix: refine Burger filters and product card actions' }}"
    name: final-requested-ui-green
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/tux-pos-refinement
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply only approved UI changes
        run: |
          python scripts/apply_final_requested_ui.py
          npx prettier --write \
            apps/operations/src/app/OrdersWorkspace.tsx \
            apps/operations/src/app/MenuProductCard.tsx \
            apps/operations/src/styles/final-pos-corrections.css \
            e2e/operations.e2e.ts
      - name: Static verification
        run: |
          npm run typecheck:e2e
          npm run typecheck
          npm run lint
          npx prettier --check \
            apps/operations/src/app/OrdersWorkspace.tsx \
            apps/operations/src/app/MenuProductCard.tsx \
            apps/operations/src/styles/final-pos-corrections.css \
            e2e/operations.e2e.ts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify all user-requested behaviors GREEN
        run: >-
          npx playwright test e2e/operations.e2e.ts --grep
          "Burger family filter appears below main categories only for Burgers|product description appears only after opening the product card|Quick Info is informational only|Extra is centered between price and quantity controls|requested compact product card controls do not overlap"
      - name: Verify affected existing UI contracts
        run: >-
          npx playwright test e2e/operations.e2e.ts --grep
          "approved category hierarchy stays two-level|search keeps both category levels visible|premium POS visual hierarchy matches approved sizing|final correction keeps header and categories visible during compact search|final correction keeps Extra and product controls fully contained|final correction keeps product controls cashier-sized"
      - name: Full Operations E2E regression
        run: npx playwright test e2e/operations.e2e.ts
      - name: Commit only approved source and regression-test changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/operations/src/app/OrdersWorkspace.tsx \
            apps/operations/src/app/MenuProductCard.tsx \
            apps/operations/src/styles/final-pos-corrections.css \
            e2e/operations.e2e.ts
          git rm scripts/apply_final_requested_ui.py
          git diff --cached --quiet && { echo "Expected approved changes were not generated"; exit 1; }
          git commit -m "fix: refine Burger filters and product card actions"
          git push origin HEAD:ui/tux-pos-refinement
