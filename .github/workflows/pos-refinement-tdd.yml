name: POS Refinement Final Quality Gate

on:
  push:
    branches:
      - 'ui/tux-pos-refinement'

permissions:
  contents: read

concurrency:
  group: pos-refinement-final-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: task-eight-full-quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      SOURCE_SHA: 22409d8024764932bf615c8c9bf8b122dfb64889
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 22409d8024764932bf615c8c9bf8b122dfb64889
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Prove exact clean corrected tree
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --short)"
          git log -1 --oneline
      - name: Install locked dependencies
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Migration tests
        run: npm run test:migrations
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Full end-to-end suite
        run: npm run test:e2e
      - name: Final source cleanliness proof
        run: |
          test -z "$(git status --short)"
          git diff --exit-code
