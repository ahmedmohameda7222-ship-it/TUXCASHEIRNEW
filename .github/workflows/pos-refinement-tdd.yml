name: POS Final Evidence

on:
  push:
    branches:
      - ui/tux-pos-refinement

permissions:
  contents: read

jobs:
  evidence:
    name: committed-source-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 8f5a8b01778f1b2894f5e431f518010ec9252723
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify evidence test typechecks
        run: npm run typecheck:e2e
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture committed visual evidence
        run: npx playwright test e2e/operations.e2e.ts --grep "visual approval evidence covers approved POS states"
      - name: Upload committed visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: pos-final-evidence-8f5a8b0
          path: test-results/**/*.png
          if-no-files-found: error
          retention-days: 14
