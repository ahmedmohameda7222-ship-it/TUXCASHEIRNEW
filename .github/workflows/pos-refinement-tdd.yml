name: POS Refinement TDD

on:
  push:
    branches:
      - 'ui/tux-pos-refinement'

permissions:
  contents: write

concurrency:
  group: pos-refinement-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tdd:
    name: fast-tdd
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply Task 13 resizable rail implementation
        if: github.actor != 'github-actions[bot]'
        run: python scripts/task13_green.py
      - name: Format Task 13 implementation
        if: github.actor != 'github-actions[bot]'
        run: npx prettier --write apps/operations/src/app/OrdersWorkspace.tsx apps/operations/src/styles/orders.css
      - name: Full typecheck
        if: github.actor != 'github-actions[bot]'
        run: npm run typecheck
      - name: E2E typecheck
        if: github.actor != 'github-actions[bot]'
        run: npm run typecheck:e2e
      - name: Lint staged implementation
        if: github.actor != 'github-actions[bot]'
        run: npm run lint
      - name: Unit and integration tests for staged implementation
        if: github.actor != 'github-actions[bot]'
        run: npm run test
      - name: Install Playwright Chromium
        if: github.actor != 'github-actions[bot]'
        run: npx playwright install --with-deps chromium
      - name: Rendered Current Order resize contract
        if: github.actor != 'github-actions[bot]'
        run: npm run test:e2e -- --retries=0 --grep "resize Current Order rail"
      - name: Commit Task 13 product implementation
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/operations/src/app/OrdersWorkspace.tsx apps/operations/src/styles/orders.css
          git diff --cached --quiet && { echo "Task 13 implementation produced no product diff"; exit 1; }
          git commit -m "feat: add resizable current order rail"
          git push origin HEAD:ui/tux-pos-refinement
      - name: Format check
        if: github.actor == 'github-actions[bot]'
        run: npm run format:check
      - name: Lint
        if: github.actor == 'github-actions[bot]'
        run: npm run lint
      - name: Unit and integration tests
        if: github.actor == 'github-actions[bot]'
        run: npm run test
