name: POS Refinement TDD

on:
  push:
    branches:
      - 'ui/tux-pos-refinement'

permissions:
  contents: write

concurrency:
  group: pos-refinement-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tdd:
    if: github.event.head_commit.message != 'fix: let product cards follow content'
    name: task-four-card-containment-green
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/tux-pos-refinement
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply Task 4 rendered contract and minimal CSS correction
        run: |
          python - <<'PY'
          from pathlib import Path

          e2e_path = Path('e2e/operations.e2e.ts')
          e2e = e2e_path.read_text()
          marker = "test('final correction lets product card height follow content without overflow'"
          test_block = r'''

          test('final correction lets product card height follow content without overflow', async ({ page }) => {
            await enterActiveOrdersForCategoryTests(page);
            await page.getByRole('button', { name: 'Fries', exact: true }).click();

            const grid = page.locator('.product-grid');
            const gridStyle = await grid.evaluate((node) => getComputedStyle(node));
            expect(gridStyle.rowGap).toBe('8px');
            expect(gridStyle.columnGap).toBe('8px');
            expect(gridStyle.alignItems).toBe('start');

            const plain = grid.locator('.product-card').filter({ hasText: 'Classic Fries' }).first();
            const described = grid.locator('.product-card').filter({ hasText: 'Chili Fries' }).first();
            await expect(plain.locator('.product-copy p')).toHaveCount(0);
            await expect(described.locator('.product-copy p')).toHaveCount(1);

            const plainStyle = await plain.evaluate((node) => getComputedStyle(node));
            const describedStyle = await described.evaluate((node) => getComputedStyle(node));
            expect(plainStyle.minHeight).toBe('0px');
            expect(describedStyle.minHeight).toBe('0px');

            for (const card of [plain, described]) {
              const media = await card.locator('.product-media').boundingBox();
              expect(media).not.toBeNull();
              expect(Math.round(media!.width)).toBe(68);
              expect(Math.round(media!.height)).toBe(68);
            }

            const plainBox = await plain.boundingBox();
            expect(plainBox).not.toBeNull();
            expect(Math.round(plainBox!.height)).toBeLessThanOrEqual(154);

            const overflow = await page.evaluate(() => ({
              viewport: window.innerWidth,
              scroll: document.documentElement.scrollWidth,
            }));
            expect(overflow.scroll).toBeLessThanOrEqual(overflow.viewport);
          });
          '''
          if marker not in e2e:
              e2e_path.write_text(e2e + test_block)

          css_path = Path('apps/operations/src/styles/premium.css')
          css = css_path.read_text()

          described_minimum = '''.product-card:has(.product-copy p) {
            min-height: 152px;
          }

          '''
          if described_minimum not in css:
              raise SystemExit('Expected described-card minimum block was not found')
          css = css.replace(described_minimum, '', 1)

          mobile_minimums = '''/* Mobile card containment fix. */
          .product-card {
            min-height: 146px;
          }

          .product-card:has(.product-copy p) {
            min-height: 152px;
          }
          '''
          replacement = '''/* Final card containment: content determines height without row stretching. */
          .product-grid {
            align-items: start;
          }
          '''
          if mobile_minimums not in css:
              raise SystemExit('Expected forced mobile card minimums were not found')
          css = css.replace(mobile_minimums, replacement, 1)
          css_path.write_text(css)
          PY
          npx prettier --write e2e/operations.e2e.ts apps/operations/src/styles/premium.css
      - name: Static checks
        run: |
          npm run typecheck:e2e
          npm run lint
          npm run typecheck
          npx prettier --check e2e/operations.e2e.ts apps/operations/src/styles/premium.css
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Task 4 targeted contract GREEN
        run: >-
          npx playwright test e2e/operations.e2e.ts --grep
          "final correction lets product card height follow content without overflow"
      - name: Run complete Operations E2E file
        run: npx playwright test e2e/operations.e2e.ts
      - name: Commit Task 4 GREEN state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/operations.e2e.ts apps/operations/src/styles/premium.css
          git diff --cached --quiet && { echo "Expected Task 4 changes were not generated"; exit 1; }
          git commit -m "fix: let product cards follow content"
          git push origin HEAD:ui/tux-pos-refinement
