name: POS Refinement TDD

on:
  push:
    branches:
      - 'ui/tux-pos-refinement'

permissions:
  contents: write

concurrency:
  group: pos-refinement-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tdd:
    name: fast-tdd
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Add Task 14 visual hierarchy contract
        if: github.actor != 'github-actions[bot]'
        run: python scripts/task14_red_e2e.py
      - name: Format Task 14 rendered contract
        if: github.actor != 'github-actions[bot]'
        run: npx prettier --write e2e/operations.e2e.ts
      - name: E2E typecheck
        if: github.actor != 'github-actions[bot]'
        run: npm run typecheck:e2e
      - name: Install Playwright Chromium
        if: github.actor != 'github-actions[bot]'
        run: npx playwright install --with-deps chromium
      - name: Confirm Task 14 rendered RED and commit test
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set +e
          npm run test:e2e -- --project=desktop-browser-fallback --retries=0 --timeout=30000 --grep "premium POS visual hierarchy" 2>&1 | tee /tmp/task14-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -Eq "premium POS visual hierarchy|Expected:|Received:" /tmp/task14-red.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/operations.e2e.ts
          git commit -m "test: define premium POS visual hierarchy"
          git push origin HEAD:ui/tux-pos-refinement
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm run test
