name: POS Product Card Evidence

on:
  push:
    branches:
      - ui/tux-pos-refinement

permissions:
  contents: read

jobs:
  evidence:
    name: committed-product-card-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout verified product source
        uses: actions/checkout@v7
        with:
          ref: 302348d0d73b6b571af7446a9347fa1a809c38bd
      - name: Prove exact evidence source
        run: test "$(git rev-parse HEAD)" = "302348d0d73b6b571af7446a9347fa1a809c38bd"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Verify approved card geometry
        run: npx playwright test e2e/operations.e2e.ts --grep "approved cards put 14px price top right and Extra bottom left on every product"
      - name: Capture visual approval evidence
        run: npx playwright test e2e/operations.e2e.ts --grep "visual approval evidence covers approved POS states"
      - name: Upload committed-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-product-card-evidence-302348d
          path: test-results/
          if-no-files-found: error
          retention-days: 14
