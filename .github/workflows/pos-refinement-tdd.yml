name: POS Final Evidence

on:
  push:
    branches:
      - 'ui/tux-pos-refinement'

permissions:
  contents: read

concurrency:
  group: pos-final-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: committed-source-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 8f5a8b01778f1b2894f5e431f518010ec9252723
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Add evidence-only screenshot checkpoints
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/operations.e2e.ts')
          text = path.read_text()
          desktop_anchor = """    await screenshot('02-default-orders.png');\n    await captureVisualEvidence(page, testInfo);"""
          desktop_replacement = """    await screenshot('02-default-orders.png');
    const evidenceCard = page
      .locator('.product-card')
      .filter({ hasText: 'Single Smashed Patty' })
      .first();
    await evidenceCard
      .getByRole('button', { name: 'Quick Info for Single Smashed Patty' })
      .click();
    await screenshot('02b-quick-info.png');
    await page
      .getByRole('dialog', { name: 'Single Smashed Patty' })
      .getByRole('button', { name: 'Close', exact: true })
      .click();
    await captureVisualEvidence(page, testInfo);"""
          if desktop_anchor not in text:
              raise SystemExit('desktop evidence anchor not found')
          text = text.replace(desktop_anchor, desktop_replacement, 1)

          mobile_anchor = """  await page.getByRole('button', { name: 'Add one Single Smashed Patty' }).click();\n  await openCartIfMobile(page, testInfo);"""
          mobile_replacement = """  if (testInfo.project.name === 'mobile-browser-fallback') {
    await screenshot('08-mobile-menu.png');
  }
  await page.getByRole('button', { name: 'Add one Single Smashed Patty' }).click();
  await openCartIfMobile(page, testInfo);"""
          if mobile_anchor not in text:
              raise SystemExit('mobile evidence anchor not found')
          path.write_text(text.replace(mobile_anchor, mobile_replacement, 1))
          PY
          npx prettier --write e2e/operations.e2e.ts
      - name: Verify evidence test typechecks
        run: npm run typecheck:e2e
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture committed visual evidence
        run: npx playwright test e2e/operations.e2e.ts --grep "visual approval evidence covers approved POS states"
      - name: Upload committed visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: pos-final-evidence-8f5a8b0
          path: test-results/**/*.png
          if-no-files-found: error
          retention-days: 14
