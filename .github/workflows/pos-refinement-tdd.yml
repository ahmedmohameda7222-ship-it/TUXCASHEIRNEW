name: POS Adaptive Card GREEN

on:
  push:
    branches:
      - ui/tux-pos-refinement

permissions:
  contents: write

jobs:
  green:
    if: "!contains(github.event.head_commit.message, 'fix: adapt product grid to order rail')"
    name: adaptive-product-grid-green
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply minimum-safe-width grid breakpoints and regression contract
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('apps/operations/src/styles/premium.css')
          text = css.read_text()
          replacements = {
              '@container tux-menu (min-width: 568px)': '@container tux-menu (min-width: 722px)',
              '@container tux-menu (min-width: 856px)': '@container tux-menu (min-width: 1071px)',
              '@container tux-menu (min-width: 1144px)': '@container tux-menu (min-width: 1420px)',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected breakpoint: {old}')
              text = text.replace(old, new, 1)
          css.write_text(text)

          e2e = Path('e2e/operations.e2e.ts')
          test_text = e2e.read_text()
          marker = "test('product names stay fully readable while Current Order rail resizes'"
          if marker not in test_text:
              test_text += r'''

          test('product names stay fully readable while Current Order rail resizes', async ({ page }, testInfo) => {
            await enterActiveOrdersForCategoryTests(page);
            if (!testInfo.project.name.startsWith('desktop')) return;

            const separator = page.getByRole('separator', { name: 'Resize Current Order' });
            const cart = page.locator('.desktop-cart-wrap');
            const menu = page.locator('.menu-pane');
            const grid = page.locator('.product-grid');

            async function expectReadableTitles(state: string): Promise<void> {
              const [cartBox, menuBox, firstCardBox, columns, titles] = await Promise.all([
                cart.boundingBox(),
                menu.boundingBox(),
                page.locator('.product-card').first().boundingBox(),
                grid.evaluate((node) => getComputedStyle(node).gridTemplateColumns),
                page.locator('.product-copy strong').evaluateAll((nodes) =>
                  nodes.map((node) => {
                    const element = node as HTMLElement;
                    const range = document.createRange();
                    range.selectNodeContents(element);
                    const textRect = range.getBoundingClientRect();
                    const box = element.getBoundingClientRect();
                    return {
                      text: element.textContent ?? '',
                      clientHeight: element.clientHeight,
                      scrollHeight: element.scrollHeight,
                      textBottom: textRect.bottom,
                      boxBottom: box.bottom,
                    };
                  }),
                ),
              ]);

              console.log(
                JSON.stringify({
                  state,
                  cartWidth: cartBox?.width ?? null,
                  menuWidth: menuBox?.width ?? null,
                  cardWidth: firstCardBox?.width ?? null,
                  columns,
                }),
              );

              for (const title of titles) {
                expect(
                  title.scrollHeight,
                  `${state}: ${title.text} must not be line-clamped`,
                ).toBeLessThanOrEqual(title.clientHeight + 1);
                expect(
                  title.textBottom,
                  `${state}: ${title.text} must stay inside its title box`,
                ).toBeLessThanOrEqual(title.boxBottom + 1);
              }
            }

            await separator.focus();
            await page.keyboard.press('Home');
            await expect
              .poll(async () => (await cart.boundingBox())?.width ?? 0)
              .toBeLessThanOrEqual(362);
            await expectReadableTitles('cart-min-360');

            await page.keyboard.press('ArrowLeft');
            await page.keyboard.press('ArrowLeft');
            await page.keyboard.press('ArrowLeft');
            await expect
              .poll(async () => (await cart.boundingBox())?.width ?? 0)
              .toBeGreaterThanOrEqual(430);
            await expectReadableTitles('cart-default-432');

            await separator.focus();
            await page.keyboard.press('End');
            await expect
              .poll(async () => (await cart.boundingBox())?.width ?? 0)
              .toBeGreaterThanOrEqual(598);
            await expectReadableTitles('cart-max-600');
          });
          '''
          e2e.write_text(test_text)
          PY
          npx prettier --write apps/operations/src/styles/premium.css e2e/operations.e2e.ts
      - name: Static verification
        run: |
          npm run typecheck:e2e
          npm run typecheck
          npm run lint
          npm run format:check
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Verify adaptive rail GREEN
        run: npx playwright test e2e/operations.e2e.ts --project=desktop-browser-fallback --grep "product names stay fully readable while Current Order rail resizes"
      - name: Verify affected product and rail regressions
        run: npx playwright test e2e/operations.e2e.ts --grep "resize Current Order rail persists|approved cards put 14px price top right|final correction keeps Extra and product controls fully contained|requested compact product card controls"
      - name: Verify full Operations E2E
        run: npx playwright test e2e/operations.e2e.ts
      - name: Commit verified adaptive grid source
        run: |
          git config user.name "TUX POS Verification"
          git config user.email "actions@users.noreply.github.com"
          git add apps/operations/src/styles/premium.css e2e/operations.e2e.ts
          git commit -m "fix: adapt product grid to order rail"
          git push origin HEAD:ui/tux-pos-refinement
