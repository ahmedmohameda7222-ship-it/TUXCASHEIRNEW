name: POS Refinement TDD

on:
  push:
    branches:
      - 'ui/tux-pos-refinement'

permissions:
  contents: write

concurrency:
  group: pos-refinement-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tdd:
    name: fast-tdd
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply viewport-aware Task 10 test fix
        if: github.actor != 'github-actions[bot]'
        run: python scripts/task10_testfix.py
      - name: Apply Task 10 Extras implementation
        if: github.actor != 'github-actions[bot]'
        run: python scripts/task10_apply.py
      - name: Format Task 10 touched files
        if: github.actor != 'github-actions[bot]'
        run: npx prettier --write e2e/operations.e2e.ts apps/operations/src/app/ProductCustomizer.tsx apps/operations/src/app/MenuProductCard.tsx apps/operations/src/app/OrdersWorkspace.tsx apps/operations/src/app/OrdersCart.tsx apps/operations/src/styles/orders.css
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        if: github.actor != 'github-actions[bot]'
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm run test
      - name: Install Playwright Chromium
        if: github.actor != 'github-actions[bot]'
        run: npx playwright install --with-deps chromium
      - name: Verify Extras and modifier flows
        if: github.actor != 'github-actions[bot]'
        run: npm run test:e2e -- --grep "Extra|modifier"
      - name: Commit verified Task 10 test and implementation
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/operations.e2e.ts
          if ! git diff --cached --quiet; then
            git commit -m "test: make Extras flow viewport aware"
          fi
          git add apps/operations/src/app/ProductCustomizer.tsx apps/operations/src/app/MenuProductCard.tsx apps/operations/src/app/OrdersWorkspace.tsx apps/operations/src/app/OrdersCart.tsx apps/operations/src/styles/orders.css
          if ! git diff --cached --quiet; then
            git commit -m "feat: surface product extras in POS flow"
          fi
          git push origin HEAD:ui/tux-pos-refinement
