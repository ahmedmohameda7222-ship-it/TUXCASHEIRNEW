name: POS Refinement TDD

on:
  push:
    branches:
      - 'ui/tux-pos-refinement'

permissions:
  contents: read

concurrency:
  group: pos-refinement-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tdd:
    name: task-six-single-separator-red
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Add Task 6 rendered RED contract
        run: |
          cat >> e2e/operations.e2e.ts <<'EOF'

          test('final correction uses one Current Order separator', async ({ page }, testInfo) => {
            test.skip(testInfo.project.name !== 'desktop-browser-fallback');
            await enterActiveOrdersForCategoryTests(page);

            const separator = page.getByRole('separator', { name: 'Resize Current Order' });
            await expect(separator).toBeVisible();
            await expect(separator).toHaveAttribute('aria-orientation', 'vertical');

            const separatorLineWidth = await separator.evaluate((node) =>
              getComputedStyle(node, '::before').width,
            );
            expect(separatorLineWidth).toBe('1px');

            const cart = page.locator('.desktop-cart-wrap');
            const borderLeftWidth = await cart.evaluate((node) => getComputedStyle(node).borderLeftWidth);
            expect(borderLeftWidth).toBe('0px');

            const initial = await cart.boundingBox();
            expect(initial).not.toBeNull();
            await separator.focus();
            await page.keyboard.press('ArrowLeft');
            const resized = await cart.boundingBox();
            expect(resized).not.toBeNull();
            expect(Math.round(resized!.width - initial!.width)).toBe(24);
          });
          EOF
          npx prettier --write e2e/operations.e2e.ts
      - name: E2E typecheck
        run: npm run typecheck:e2e
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Task 6 contract is RED before implementation
        run: >-
          npx playwright test e2e/operations.e2e.ts --project=desktop-browser-fallback --grep
          "final correction uses one Current Order separator"
