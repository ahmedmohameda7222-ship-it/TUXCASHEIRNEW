name: POS Refinement TDD

on:
  push:
    branches:
      - 'ui/tux-pos-refinement'

permissions:
  contents: write

concurrency:
  group: pos-refinement-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tdd:
    name: task-three-fixture-debug
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/tux-pos-refinement
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply approved menu fixture
        run: |
          python scripts/apply_task3_fixture.py
          python scripts/fix_task3_generated_names.py
          python scripts/fix_task3_combo_navigation.py
          python scripts/fix_task3_search_query.py
      - name: Format E2E source
        run: npx prettier --write e2e/operations.e2e.ts
      - name: E2E typecheck
        run: npm run typecheck:e2e
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Find first Operations E2E incompatibility
        run: npx playwright test e2e/operations.e2e.ts --max-failures=1
