name: POS Refinement Welcome Evidence

on:
  push:
    branches:
      - 'ui/tux-pos-refinement'

permissions:
  contents: read

concurrency:
  group: pos-refinement-welcome-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: task-seven-welcome-exact-tree-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      SOURCE_SHA: 22409d8024764932bf615c8c9bf8b122dfb64889
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 22409d8024764932bf615c8c9bf8b122dfb64889
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Prove exact clean source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --short)"
          mkdir -p evidence
          printf 'source_sha=%s\nsource_status=clean\nevidence_transform=none\n' "$SOURCE_SHA" > evidence/WELCOME_MANIFEST.txt
      - name: Install locked dependencies
        run: npm ci
      - name: Create temporary welcome evidence harness
        run: |
          cp e2e/operations.e2e.ts e2e/evidence-welcome.e2e.ts
          cat >> e2e/evidence-welcome.e2e.ts <<'EOF'

          test('evidence welcome persists until CTA using visible content', async ({ page }, testInfo) => {
            test.skip(testInfo.project.name !== 'desktop-browser-fallback');
            await seedBrowserFallback(page);
            await page.goto('/');
            await page.getByLabel('Enter PIN to Start Day').fill('1234');
            await page.getByRole('button', { name: 'Start Day' }).click();

            const greeting = page.getByText('Glad you made it in safely.', { exact: true });
            const action = page.locator('.welcome-action');
            await expect(greeting).toBeVisible({ timeout: 15_000 });
            await expect(action).toBeVisible();

            await page.waitForTimeout(2000);
            await expect(greeting).toBeVisible();
            await expect(action).toBeVisible();
            await expectNoHorizontalOverflow(page);
            await page.screenshot({
              path: 'evidence/00-1440-welcome-persistent.png',
              animations: 'disabled',
              caret: 'hide',
            });
          });
          EOF
      - name: Typecheck temporary harness
        run: npx tsc --noEmit -p tsconfig.e2e.json
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture welcome evidence
        run: >-
          npx playwright test e2e/evidence-welcome.e2e.ts --project=desktop-browser-fallback --grep
          "evidence welcome persists until CTA using visible content"
      - name: Prove committed source untouched
        if: always()
        run: |
          rm -f e2e/evidence-welcome.e2e.ts
          git diff --exit-code -- e2e/operations.e2e.ts apps/operations packages
          printf 'post_capture_source_diff=clean\n' >> evidence/WELCOME_MANIFEST.txt
      - name: Upload welcome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tux-pos-welcome-evidence-22409d8
          path: |
            evidence/
            test-results/
          if-no-files-found: error
          retention-days: 30
