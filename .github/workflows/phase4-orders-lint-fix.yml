name: Phase 4 Orders lint fix

on:
  push:
    branches:
      - feat/ops-04-orders

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ops-04-orders
      - name: Remove unused OrdersCart import
        run: sed -i '/^  normalizeEgyptianPhone,$/d' apps/operations/src/app/OrdersCart.tsx
      - name: Commit lint fix only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/operations/src/app/OrdersCart.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix Orders cart lint"
          git push origin HEAD:feat/ops-04-orders
