name: Apply TUX UI alignment fixes

on:
  push:
    branches:
      - ui/tux-input-alignment-fixes

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/tux-input-alignment-fixes
          fetch-depth: 0
      - name: Apply bounded CSS fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          board = Path('apps/operations/src/styles/orders-board.css')
          board_text = board.read_text()
          old_tabs = '.board-tabs {\n  display: flex;\n  gap: var(--tux-space-2);\n'
          new_tabs = '.board-tabs {\n  display: flex;\n  justify-content: center;\n  gap: var(--tux-space-2);\n'
          if board_text.count(old_tabs) != 1:
              raise SystemExit(f'Expected one desktop tabs baseline, found {board_text.count(old_tabs)}.')
          board_text = board_text.replace(old_tabs, new_tabs, 1)

          old_mobile = '  .board-search {\n    min-width: 0;\n  }\n  .active-order-grid {'
          new_mobile = '  .board-search {\n    min-width: 0;\n  }\n  .board-tabs {\n    justify-content: flex-start;\n  }\n  .active-order-grid {'
          if board_text.count(old_mobile) != 1:
              raise SystemExit(f'Expected one Orders Board mobile baseline, found {board_text.count(old_mobile)}.')
          board_text = board_text.replace(old_mobile, new_mobile, 1)
          board.write_text(board_text)

          expenses = Path('apps/operations/src/styles/expenses.css')
          expense_text = expenses.read_text()
          old_control_rule = '.expense-fields input,\n.expense-fields textarea'
          new_control_rule = '.expense-fields > label > input,\n.expense-fields > label > textarea'
          if expense_text.count(old_control_rule) != 2:
              raise SystemExit(f'Expected two broad expense input selector prefixes, found {expense_text.count(old_control_rule)}.')
          expense_text = expense_text.replace(old_control_rule, new_control_rule)

          anchor = '.expense-fields label,\n.expense-paid-from {\n  display: grid;\n  gap: var(--tux-space-2);\n  margin: 0;\n  color: var(--tux-text-primary);\n  font-size: var(--tux-font-size-sm);\n  font-weight: 700;\n}\n'
          addition = anchor + '.expense-fields > .money-field {\n  gap: var(--tux-space-2);\n}\n.expense-fields > .money-field > label {\n  color: var(--tux-text-primary);\n  font-size: var(--tux-font-size-sm);\n  font-weight: 700;\n  letter-spacing: 0;\n}\n'
          if expense_text.count(anchor) != 1:
              raise SystemExit(f'Expected one Expense label baseline, found {expense_text.count(anchor)}.')
          expense_text = expense_text.replace(anchor, addition, 1)
          expenses.write_text(expense_text)

          final_css = Path('apps/operations/src/styles/final-pos-corrections.css')
          final_text = final_css.read_text()
          header = '/* Final approved POS correction authority. Keep this last in the Operations style cascade. */\n'
          if not final_text.startswith(header):
              raise SystemExit('Final POS correction authority header was not found.')
          money_contract = '\n\n/* Currency prefix and value render as one composed money control across Operations. */\n.money-input-wrap > input {\n  border: 0;\n  border-radius: 0;\n  background: transparent;\n  box-shadow: none;\n}\n\n.money-input-wrap > input:focus-visible {\n  outline: none;\n}\n\n.money-input-wrap:focus-within {\n  border-color: color-mix(in srgb, var(--tux-focus-ring) 55%, var(--tux-border-subtle));\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--tux-focus-ring) 36%, transparent);\n}\n'
          if '.money-input-wrap > input:focus-visible' in final_text:
              raise SystemExit('Money input alignment contract already exists unexpectedly.')
          final_text = final_text.replace(header, header + money_contract, 1)
          final_css.write_text(final_text)
          PY
      - name: Format changed files
        run: npx prettier --write apps/operations/src/styles/orders-board.css apps/operations/src/styles/expenses.css apps/operations/src/styles/final-pos-corrections.css
      - name: Verify bounded diff
        run: |
          git diff --check
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          echo "$changed"
          test "$changed" = "apps/operations/src/styles/expenses.css apps/operations/src/styles/final-pos-corrections.css apps/operations/src/styles/orders-board.css "
      - name: Commit GREEN implementation
        run: |
          git config user.name "TUX POS Verification"
          git config user.email "actions@users.noreply.github.com"
          git add apps/operations/src/styles/orders-board.css apps/operations/src/styles/expenses.css apps/operations/src/styles/final-pos-corrections.css
          git commit -m "fix: align operational form controls"
          git push origin HEAD:ui/tux-input-alignment-fixes
