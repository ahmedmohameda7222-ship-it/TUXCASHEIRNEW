name: Superpowers Plan Formatter

on:
  push:
    branches: [ui/tux-pos-refinement]
    paths:
      - .github/workflows/superpowers-plan-format.yml

permissions:
  contents: write

jobs:
  format-task-one-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/tux-pos-refinement
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx prettier --write apps/operations/src/app/OrdersWorkspace.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/operations/src/app/OrdersWorkspace.test.ts
          git commit -m "test: format two-level navigation contract"
          git push origin HEAD:ui/tux-pos-refinement
