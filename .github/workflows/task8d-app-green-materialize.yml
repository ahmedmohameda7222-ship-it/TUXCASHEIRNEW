name: Task 8D App GREEN Materializer
on:
  push:
    branches:
      - work/operations-whatsapp-inbox-live
    paths:
      - '.tux-live/task8d-green/**'
      - '.github/workflows/task8d-app-green-materialize.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact Task 8D app GREEN tree
        shell: bash
        run: |
          set -euo pipefail
          cat .tux-live/task8d-green/c00 .tux-live/task8d-green/c01 .tux-live/task8d-green/c02 .tux-live/task8d-green/c03 .tux-live/task8d-green/c04 .tux-live/task8d-green/c05 .tux-live/task8d-green/c06 > /tmp/task8d-app-green.b64
          base64 -d /tmp/task8d-app-green.b64 > /tmp/task8d-app-green.patch
          test "$(sha256sum /tmp/task8d-app-green.patch | cut -d' ' -f1)" = "abc0bb6c152b2fbffefb66a770c050d7e9ae130fe711d3bd45ab75006da347b6"
          git rm -r .tux-live/task8d-green
          git rm .github/workflows/task8d-app-green-materialize.yml
          git apply --index /tmp/task8d-app-green.patch
          test "$(git write-tree)" = "15d757ed778054c32de81dc86364941dacd31fa4"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "wip(task8d): wire application messaging target"
          test "$(git rev-parse HEAD^{tree})" = "15d757ed778054c32de81dc86364941dacd31fa4"
          git push origin HEAD:refs/heads/work/operations-whatsapp-inbox-live
