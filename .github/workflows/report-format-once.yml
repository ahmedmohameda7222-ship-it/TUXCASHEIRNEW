name: Reports one-time format
on:
  push:
    branches:
      - feat/admin-reports-r1-r5-report-first-20261029
    paths:
      - .github/workflows/report-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx prettier --write apps/admin/server/reports/reportPdfExport.test.ts apps/admin/server/reports/reportPdfExport.ts apps/admin/src/reports/ReportFilters.tsx apps/admin/src/reports/ReportsPage.tsx apps/admin/src/reports/reportTargetPeriod.test.ts apps/admin/src/reports/reportTargetPeriod.ts
      - name: Commit formatted report files to the isolated branch
        run: |
          if ! git diff --quiet -- apps/admin/server/reports apps/admin/src/reports; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/admin/server/reports/reportPdfExport.test.ts apps/admin/server/reports/reportPdfExport.ts apps/admin/src/reports/ReportFilters.tsx apps/admin/src/reports/ReportsPage.tsx apps/admin/src/reports/reportTargetPeriod.test.ts apps/admin/src/reports/reportTargetPeriod.ts
            git commit -m "style(reports): apply repository Prettier"
            git push
          fi
