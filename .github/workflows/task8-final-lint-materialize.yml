name: Task 8 Final Lint Materializer

on:
  push:
    branches:
      - work/operations-whatsapp-inbox-live
    paths:
      - .github/workflows/task8-final-lint-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact final Task 8 GREEN tree
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .recovery/task8-final-lint.patch.gz.b64 | gzip -d > /tmp/task8-final-lint.patch
          test "$(sha256sum /tmp/task8-final-lint.patch | awk '{print $1}')" = "84bf010c50590ea66d258bf04dc0750521a2963f510dfffdb93ec7879bc34181"
          git rm .recovery/task8-final-lint.patch.gz.b64 .github/workflows/task8-final-lint-materialize.yml
          git apply --index /tmp/task8-final-lint.patch
          test "$(git write-tree)" = "de5a9df2f82f6d8f93e5eeed616c1a6eeaf96907"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(task8): complete WhatsApp order integration'
          git push origin HEAD:work/operations-whatsapp-inbox-live
