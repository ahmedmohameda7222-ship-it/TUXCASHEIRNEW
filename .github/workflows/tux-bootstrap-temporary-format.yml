name: TUX bootstrap temporary formatting evidence

on:
  push:
    branches:
      - fix/operations-multishop-device-bootstrap

permissions:
  contents: read

jobs:
  formatting-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Produce exact formatter changes
        run: |
          npx prettier --write server/workerPinBootstrap.multishop.test.ts server/workerPinBootstrap.ts apps/operations/src/app/BrowserBootstrapGate.tsx
          echo TUX_PRETTIER_DIFF_BEGIN
          git --no-pager diff -- server/workerPinBootstrap.multishop.test.ts server/workerPinBootstrap.ts apps/operations/src/app/BrowserBootstrapGate.tsx
          echo TUX_PRETTIER_DIFF_END
