name: Phase 5 Documentation Closeout

on:
  pull_request:
    branches:
      - feat/ops-04-orders
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 5 branch
        uses: actions/checkout@v4
        with:
          ref: feat/ops-05-orders-board
          fetch-depth: 0

      - name: Apply documentation closeout
        run: python .phase5_docs_patch.py

      - name: Verify Phase 5 evidence markers
        run: |
          grep -q 'BOARD-001.*PASS' docs/OPERATIONS_COMPLIANCE_MATRIX.md
          grep -q 'BOARD-009.*PASS' docs/OPERATIONS_COMPLIANCE_MATRIX.md
          grep -q 'BOARD-014.*PASS' docs/OPERATIONS_COMPLIANCE_MATRIX.md
          grep -q 'BOARD-015.*PASS' docs/OPERATIONS_COMPLIANCE_MATRIX.md
          grep -q 'ORD-037.*PASS' docs/OPERATIONS_COMPLIANCE_MATRIX.md
          grep -q 'Phase 5 Orders Board coverage' docs/TEST_STRATEGY.md
          grep -q 'Orders Board command boundary' docs/ARCHITECTURE.md
          grep -q 'Orders Board local corrections' docs/OFFLINE_AND_SYNC.md

      - name: Commit documentation closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "docs: close phase 5 orders board"
          git push origin HEAD:feat/ops-05-orders-board
