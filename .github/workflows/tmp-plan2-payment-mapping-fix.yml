name: Temp Plan 2 Payment Mapping Fix

on:
  push:
    branches:
      - feat/admin-02-catalog-settings

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/admin-02-catalog-settings
      - name: Fix prepared-to-snapshot confirmation mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/application/src/orders.ts')
          text = p.read_text()
          old = 'manuallyConfirmed: part.manuallyConfirmed,'
          if text.count(old) != 2:
              raise SystemExit(f'expected 2 mapping sites, found {text.count(old)}')
          p.write_text(text.replace(old, 'manuallyConfirmed: part.manualConfirmed,'))
          PY
      - name: Commit mapping fix
        run: |
          git rm .github/workflows/tmp-plan2-payment-mapping-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/application/src/orders.ts
          git commit -m "fix(plan2): map manual payment confirmation evidence"
          git push origin HEAD:feat/admin-02-catalog-settings
