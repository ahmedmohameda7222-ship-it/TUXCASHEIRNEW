name: Patch follow-up menu edit evidence

on:
  push:
    branches:
      - ui/unified-menu-edit-mode
    paths:
      - .github/workflows/patch-followup-menu-edit-evidence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/unified-menu-edit-mode
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply unified menu evidence patch
        run: node scripts/patch-followup-menu-edit-evidence.mjs
      - name: Format and typecheck E2E
        run: |
          npx prettier --write e2e/operations.e2e.ts
          npm run typecheck:e2e
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify desktop follow-up evidence
        run: npx playwright test e2e/operations.e2e.ts --project=desktop-browser-fallback --grep "follow-up desktop approval evidence is captured from the committed tree"
      - name: Remove temporary patch scaffolding
        run: rm .github/workflows/patch-followup-menu-edit-evidence.yml scripts/patch-followup-menu-edit-evidence.mjs
      - name: Commit clean E2E correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: update follow-up menu edit evidence"
          git push origin HEAD:ui/unified-menu-edit-mode
