name: Plan 4 Task 4 Exact Prettier

on:
  push:
    branches:
      - feat/admin-04-inventory-purchasing
    paths:
      - '.github/workflows/prettier-plan4-task4-exact.yml'

jobs:
  exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Render exact Task 4 formatting
        run: |
          npx prettier --write "apps/admin/server/inventory/intelligence.ts" "apps/admin/server/inventory/intelligenceService.ts" "apps/admin/src/inventory/ReorderSuggestionsPage.tsx" "apps/admin/src/inventory/VarianceReport.tsx" ".github/workflows/admin-plan4-inventory-purchasing-tdd.yml"
          echo "FILE_0_BEGIN"
          base64 -w0 "apps/admin/server/inventory/intelligence.ts"
          echo
          echo "FILE_0_END"
          echo "FILE_1_BEGIN"
          base64 -w0 "apps/admin/server/inventory/intelligenceService.ts"
          echo
          echo "FILE_1_END"
          echo "FILE_2_BEGIN"
          base64 -w0 "apps/admin/src/inventory/ReorderSuggestionsPage.tsx"
          echo
          echo "FILE_2_END"
          echo "FILE_3_BEGIN"
          base64 -w0 "apps/admin/src/inventory/VarianceReport.tsx"
          echo
          echo "FILE_3_END"
          echo "FILE_4_BEGIN"
          base64 -w0 ".github/workflows/admin-plan4-inventory-purchasing-tdd.yml"
          echo
          echo "FILE_4_END"
