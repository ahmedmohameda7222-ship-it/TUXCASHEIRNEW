name: Inventory I3 isolated PostgreSQL ledger acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/admin/src/inventory/AdjustStockSheet.tsx'
      - 'apps/admin/src/inventory/RecordWasteSheet.tsx'
      - 'apps/admin/src/inventory/inventoryQuantityInput.ts'
      - 'scripts/test-inventory-adjust-waste-replay-postgres.mjs'
      - 'scripts/test-inventory-purchasing-consumption-postgres.mjs'
      - 'supabase/migrations/20261025180000_purchasing_command_payload_replay_fence.sql'
      - 'scripts/test-inventory-isolated-postgres.mjs'
      - 'supabase/migrations/20261027183000_inventory_adjustment_waste_replay_integrity.sql'
      - '.github/workflows/inventory-i3-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    name: Inventory Adjust/Waste real PostgreSQL idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Run existing six-migration baseline and real I3 command replay acceptance
        run: node scripts/test-inventory-adjust-waste-replay-postgres.mjs
      - name: Run real Purchasing-to-Inventory receipt and return bridge
        run: node scripts/test-inventory-purchasing-consumption-postgres.mjs
