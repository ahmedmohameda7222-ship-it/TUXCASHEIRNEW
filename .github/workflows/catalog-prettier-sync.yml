name: Catalog Prettier Sync

on:
  push:
    branches:
      - work/catalog-authority-contracts

permissions:
  contents: write

jobs:
  format-catalog-contracts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format Phase B contract files
        run: npx prettier --write packages/catalog-contracts/src/index.ts packages/catalog-contracts/src/index.test.ts
      - name: Commit formatter output when changed
        shell: bash
        run: |
          if git diff --quiet -- packages/catalog-contracts/src/index.ts packages/catalog-contracts/src/index.test.ts; then
            echo 'Catalog contract files already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/catalog-contracts/src/index.ts packages/catalog-contracts/src/index.test.ts
          git commit -m 'style(catalog): format contract sources'
          git push origin HEAD:work/catalog-authority-contracts
