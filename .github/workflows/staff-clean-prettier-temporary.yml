name: Temporary Staff clean Prettier diff
on:
  pull_request:
    paths:
      - '.github/workflows/staff-clean-prettier-temporary.yml'
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Exact Prettier changes
        run: |
          for f in apps/admin/src/staff/EmployeeDetailPage.tsx apps/admin/src/staff/PermissionsEditor.tsx apps/admin/src/staff/StaffPage.tsx e2e/admin-workforce.spec.ts; do
            echo "=== $f ==="
            npx prettier "$f" | diff -u "$f" - || true
          done
