name: Temporary Staff S2 Prettier diff

on:
  pull_request:
    paths:
      - '.github/workflows/staff-s2-prettier-diagnostic-temporary.yml'

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Print expected exact Prettier changes
        shell: bash
        run: |
          for f in apps/admin/src/staff/StaffPage.tsx e2e/admin-workforce.spec.ts; do
            echo "=== $f ==="
            npx prettier "$f" | diff -u "$f" - || true
          done
