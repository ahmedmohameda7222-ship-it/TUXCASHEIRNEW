name: PR119 Temporary First Worker Test Formatter
on:
  push:
    branches:
      - fix/admin-plans1-7-functional-completeness
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-plans1-7-functional-completeness
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/admin/server/staff/staffService.test.ts
      - name: Commit canonical formatting
        shell: bash
        run: |
          if ! git diff --quiet -- apps/admin/server/staff/staffService.test.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/admin/server/staff/staffService.test.ts
            git commit -m "style(admin): canonical first-worker RED test formatting"
            git push
          fi
