name: Task 8E UI2 GREEN Materializer

on:
  push:
    branches:
      - work/operations-whatsapp-inbox-live
    paths:
      - '.github/workflows/task8e-ui2-green-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact GREEN tree
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .recovery/ui2-green.patch.gz.b64 | gzip -d > /tmp/ui2.patch
          git rm .recovery/ui2-green.patch.gz.b64 .github/workflows/task8e-ui2-green-materialize.yml
          git apply --index /tmp/ui2.patch
          tree="$(git write-tree)"
          test "$tree" = "b05120a80ddc737bdeff9b9ad51e76316f061893"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'wip(task8e): complete compact order context card'
          git push origin HEAD:work/operations-whatsapp-inbox-live
