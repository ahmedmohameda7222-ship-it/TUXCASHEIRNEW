name: Phase 7 Deterministic Validation

on:
  push:
    branches:
      - feat/ops-07-bulk-stock
    paths:
      - '.phase7-validate.trigger'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ops-07-bulk-stock
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run all permanent gates and capture result
        shell: bash
        run: |
          set +e
          : > /tmp/phase7-validation.log
          failed=0
          for command in \
            'npm run format:check' \
            'npm run lint' \
            'npm run typecheck' \
            'npm run test' \
            'npm run build'
          do
            echo "===== $command =====" | tee -a /tmp/phase7-validation.log
            bash -lc "$command" >> /tmp/phase7-validation.log 2>&1
            status=$?
            echo "exit=$status" | tee -a /tmp/phase7-validation.log
            if [ "$status" -ne 0 ]; then
              failed=1
              break
            fi
          done
          if [ "$failed" -eq 0 ]; then
            printf 'PASS\n' > .phase7-validation-passed
            rm -f .phase7-validation-failed.txt
          else
            {
              echo 'FAIL'
              echo
              tail -n 220 /tmp/phase7-validation.log
            } > .phase7-validation-failed.txt
            rm -f .phase7-validation-passed
          fi
      - name: Remove validation helpers
        run: |
          rm -f .phase7-validate.trigger
          rm -f .github/workflows/phase7-validate.yml
      - name: Commit validation result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record Phase 7 validation result'
          git push origin HEAD:feat/ops-07-bulk-stock
