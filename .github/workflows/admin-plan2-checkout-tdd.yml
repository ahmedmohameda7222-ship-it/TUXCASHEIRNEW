name: Admin Plan 2 Checkout RED-GREEN

on:
  push:
    branches:
      - feat/admin-02-catalog-settings
    paths:
      - 'packages/domain/**'
      - 'packages/application/**'
      - '.github/workflows/admin-plan2-checkout-tdd.yml'
  workflow_dispatch:

concurrency:
  group: admin-plan2-checkout-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  checkout-policy:
    if: "${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'feat(admin): enforce checkout execution authority') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply guarded Operations checkout authority patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/application/src/orders.ts')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'guarded replacement expected once, found {count}: {old[:100]!r}'
                  )
              text = text.replace(old, new, 1)

          replace_once(
              'const validation = validateOrderDraft(draft, context.configuration);',
              'const validation = validateOrderDraft(draft, context.configuration, placement.source);',
          )

          replace_once(
              'const preparedPayments = preparePaymentParts(\n'
              '            draft.payment,\n'
              '            context.configuration.paymentMethods,\n'
              '            validation.value.pricing.totalMinor,\n'
              '          );',
              'const preparedPayments = preparePaymentParts(\n'
              '            draft.payment,\n'
              '            context.configuration.paymentMethods,\n'
              '            validation.value.pricing.totalMinor,\n'
              '            {\n'
              '              channel: placement.source,\n'
              '              deliveryZoneId:\n'
              "                validation.value.orderType.behavior === 'DELIVERY'\n"
              '                  ? draft.delivery.zoneId\n'
              '                  : null,\n'
              '              paymentMethodZoneRules:\n'
              '                context.configuration.settings?.paymentMethodZoneRules,\n'
              '            },\n'
              '          );',
          )

          replace_once(
              'const payments = this.#buildPayments(preparedPayments);\n'
              '            const order: OrderSnapshot = {',
              'const payments = this.#buildPayments(preparedPayments);\n'
              '            const checkoutPaymentRules = preparedPayments.map((part) => ({\n'
              '              paymentMethodId: part.method.id,\n'
              "              channel: part.method.channel ?? 'BOTH',\n"
              '              deliveryZoneId:\n'
              "                validation.value.orderType.behavior === 'DELIVERY'\n"
              '                  ? draft.delivery.zoneId\n'
              '                  : null,\n'
              '              zoneAllowed: true,\n'
              '            }));\n'
              '            const order: OrderSnapshot = {',
          )

          replace_once(
              'discountMinor: validation.value.pricing.discountMinor,\n'
              '              deliveryFeeMinor: validation.value.pricing.deliveryFeeMinor,\n'
              '              totalMinor: validation.value.pricing.totalMinor,\n'
              '              payments,',
              'discountMinor: validation.value.pricing.discountMinor,\n'
              '              deliveryFeeMinor: validation.value.pricing.deliveryFeeMinor,\n'
              '              serviceChargeMinor: validation.value.pricing.serviceChargeMinor,\n'
              '              taxMinor: validation.value.pricing.taxMinor,\n'
              '              checkoutSnapshot: {\n'
              '                configurationVersion: currentConfiguration.version,\n'
              '                settingsVersion: validation.value.checkoutPolicy.settingsVersion,\n'
              '                channel: placement.source,\n'
              '                minimumOrderMinor: validation.value.checkoutPolicy.minimumOrderMinor,\n'
              '                minimumOrderSatisfied: true,\n'
              '                serviceChargeBps: validation.value.checkoutPolicy.serviceChargeBps,\n'
              '                serviceChargeMinor: validation.value.pricing.serviceChargeMinor,\n'
              '                taxBps: validation.value.checkoutPolicy.taxBps,\n'
              '                taxMinor: validation.value.pricing.taxMinor,\n'
              '                deliveryFeeMinor: validation.value.pricing.deliveryFeeMinor,\n'
              '                discountMinor: validation.value.pricing.discountMinor,\n'
              '                paymentRules: checkoutPaymentRules,\n'
              '              },\n'
              '              totalMinor: validation.value.pricing.totalMinor,\n'
              '              payments,',
          )

          path.write_text(text)
          PY
      - name: Format checkout authority files
        run: >-
          npx prettier --write
          packages/domain/src/checkoutPolicy.ts
          packages/domain/src/index.ts
          packages/domain/src/models.ts
          packages/domain/src/order.ts
          packages/domain/src/orderValidation.ts
          packages/domain/src/payment.ts
          packages/application/src/orders.ts
          packages/application/src/ordersOnlineSource.sqlite.test.ts
      - name: Trusted POS and ONLINE checkout policy
        run: npx vitest run packages/application/src/ordersOnlineSource.sqlite.test.ts
      - name: Domain typecheck
        run: npm run typecheck -w @tux/domain
      - name: Application typecheck
        run: npm run typecheck -w @tux/application
      - name: Commit verified checkout authority
        run: |
          if git diff --quiet; then
            echo 'No checkout authority changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/domain/src/checkoutPolicy.ts \
            packages/domain/src/index.ts \
            packages/domain/src/models.ts \
            packages/domain/src/order.ts \
            packages/domain/src/orderValidation.ts \
            packages/domain/src/payment.ts \
            packages/application/src/orders.ts \
            packages/application/src/ordersOnlineSource.sqlite.test.ts
          git commit -m 'feat(admin): enforce checkout execution authority'
          git push origin HEAD:feat/admin-02-catalog-settings
