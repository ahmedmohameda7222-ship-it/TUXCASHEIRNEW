name: Admin Plan 2 Checkout RED-GREEN

on:
  push:
    branches:
      - feat/admin-02-catalog-settings
    paths:
      - 'packages/domain/**'
      - 'packages/application/**'
      - '.github/workflows/admin-plan2-checkout-tdd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Trusted POS and ONLINE checkout policy
        run: npx vitest run packages/application/src/ordersOnlineSource.sqlite.test.ts
