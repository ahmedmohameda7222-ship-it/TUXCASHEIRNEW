name: Phase 6 Format

on:
  push:
    branches:
      - feat/ops-06-expenses
    paths:
      - '.phase6-format.trigger'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ops-06-expenses
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format Phase 6 code
        run: npm run format
      - name: Remove temporary validation helpers
        run: |
          rm -f .phase6-format.trigger
          rm -f .phase6-ci.trigger
          rm -f .github/workflows/phase6-format.yml
      - name: Commit formatted implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Format Phase 6 Expenses'
          git push origin HEAD:feat/ops-06-expenses
