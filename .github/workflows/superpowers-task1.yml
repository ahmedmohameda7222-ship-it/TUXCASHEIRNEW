name: Superpowers Task 1

on:
  push:
    branches: [ui/tux-pos-refinement]
    paths:
      - .github/workflows/superpowers-task1.yml
      - scripts/apply_task1_two_level_navigation.py

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/tux-pos-refinement
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Apply Task 1 production change
        run: python scripts/apply_task1_two_level_navigation.py
      - name: Format changed source
        run: npx prettier --write apps/operations/src/app/OrdersWorkspace.tsx
      - name: Run focused Orders workspace tests
        run: npm test -- apps/operations/src/app/OrdersWorkspace.test.ts
      - name: Run existing family parser tests
        run: npm test -- packages/domain/src/configurationBundle.family.test.ts
      - name: Commit verified production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/operations/src/app/OrdersWorkspace.tsx
          git commit -m "fix: restore two-level menu navigation"
          git push origin HEAD:ui/tux-pos-refinement
