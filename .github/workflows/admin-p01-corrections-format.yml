name: P01 Planner corrections formatting
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  format-corrections:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-premium-p01-dashboard-navigation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply canonical formatting to corrected P01 files
        run: |
          npx prettier --write apps/admin/src/dashboard/OwnerSummaryCard.tsx apps/admin/src/dashboard/TargetsPanel.tsx apps/admin/src/dashboard/homeDashboard.css apps/admin/src/dashboard/reportDates.ts apps/admin/src/dashboard/reportDates.test.ts apps/admin/src/dashboard/HomeDashboard.tsx e2e/admin-dashboard.spec.ts
      - name: Commit scoped formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/admin/src/dashboard/OwnerSummaryCard.tsx apps/admin/src/dashboard/TargetsPanel.tsx apps/admin/src/dashboard/homeDashboard.css apps/admin/src/dashboard/reportDates.ts apps/admin/src/dashboard/reportDates.test.ts apps/admin/src/dashboard/HomeDashboard.tsx e2e/admin-dashboard.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(admin-p01): format Planner correction files'
            git push origin HEAD:refs/heads/feat/admin-premium-p01-dashboard-navigation
          fi
