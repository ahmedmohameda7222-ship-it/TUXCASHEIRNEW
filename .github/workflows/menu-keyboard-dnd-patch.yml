name: Menu Keyboard DnD Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.number == 44 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply bounded keyboard DnD fix and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workspace = Path('apps/operations/src/app/OrdersWorkspace.tsx')
          text = workspace.read_text()

          text = text.replace(
              "  type DragEndEvent,\n  type DragOverEvent,\n  type DragStartEvent,",
              "  type DragEndEvent,\n  type DragMoveEvent,\n  type DragStartEvent,",
              1,
          )

          needle = "  const categoryTabRefs = useRef<Map<MenuCategoryId, HTMLButtonElement>>(new Map());\n"
          replacement = needle + "  const lastAppliedMenuDragTargetRef = useRef<string | null>(null);\n"
          if needle not in text:
              raise SystemExit('category refs insertion point missing')
          text = text.replace(needle, replacement, 1)

          needle = "    const activeId = String(event.active.id);\n    const activeCategory = categoryEditorCategories.find("
          replacement = "    const activeId = String(event.active.id);\n    lastAppliedMenuDragTargetRef.current = activeId;\n    const activeCategory = categoryEditorCategories.find("
          if needle not in text:
              raise SystemExit('drag start insertion point missing')
          text = text.replace(needle, replacement, 1)

          needle = "  function handleMenuEditDragCancel(): void {\n    if (menuEditSaving) return;\n    dispatchMenuLayoutEditor({ type: 'CANCEL_PICKUP' });\n    setActiveMenuDragId(null);\n  }"
          replacement = "  function handleMenuEditDragCancel(): void {\n    if (menuEditSaving) return;\n    dispatchMenuLayoutEditor({ type: 'CANCEL_PICKUP' });\n    setActiveMenuDragId(null);\n    lastAppliedMenuDragTargetRef.current = null;\n  }"
          if needle not in text:
              raise SystemExit('drag cancel block missing')
          text = text.replace(needle, replacement, 1)

          needle = "  function handleMenuEditDragOver(event: DragOverEvent): void {\n    if (menuEditSaving || !menuEditActive || event.over === null) return;\n    applyMenuEditDragOver(String(event.active.id), String(event.over.id));\n  }"
          replacement = "  function handleMenuEditDragMove(event: DragMoveEvent): void {\n    if (menuEditSaving || !menuEditActive || event.over === null) return;\n    const activeId = String(event.active.id);\n    const overId = String(event.over.id);\n    if (activeId === overId || lastAppliedMenuDragTargetRef.current === overId) return;\n    if (applyMenuEditDragOver(activeId, overId)) {\n      lastAppliedMenuDragTargetRef.current = overId;\n    }\n  }"
          if needle not in text:
              raise SystemExit('drag over block missing')
          text = text.replace(needle, replacement, 1)

          needle = "    if (!menuEditActive || overId === null) {\n      dispatchMenuLayoutEditor({ type: 'CANCEL_PICKUP' });\n      return;\n    }\n\n    const activeCategory = categoryEditorCategories.find("
          replacement = "    if (!menuEditActive || overId === null) {\n      dispatchMenuLayoutEditor({ type: 'CANCEL_PICKUP' });\n      lastAppliedMenuDragTargetRef.current = null;\n      return;\n    }\n\n    if (activeId !== overId && lastAppliedMenuDragTargetRef.current !== overId) {\n      applyMenuEditDragOver(activeId, overId);\n    }\n    lastAppliedMenuDragTargetRef.current = null;\n\n    const activeCategory = categoryEditorCategories.find("
          if needle not in text:
              raise SystemExit('drag end insertion point missing')
          text = text.replace(needle, replacement, 1)

          text = text.replace(
              "onDragOver={handleMenuEditDragOver}",
              "onDragMove={handleMenuEditDragMove}",
          )

          needle = '''                    <DragOverlay>\n                      {activeDraggedCategory === null ? null : (\n                        <button\n                          type="button"\n                          className="category-tab category-tab-dragging menu-edit-drag-overlay"\n                        >\n                          {activeDraggedCategory.name}\n                        </button>\n                      )}\n                    </DragOverlay>'''
          replacement = '''                    <DragOverlay>\n                      {activeDraggedCategory === null ? null : (\n                        <div\n                          aria-hidden="true"\n                          className="category-tab category-tab-dragging menu-edit-drag-overlay"\n                        >\n                          {activeDraggedCategory.name}\n                        </div>\n                      )}\n                    </DragOverlay>'''
          if needle not in text:
              raise SystemExit('category overlay block missing')
          text = text.replace(needle, replacement, 1)

          needle = '<article className="product-card menu-edit-product-card-dragging menu-edit-drag-overlay">'
          replacement = '<article aria-hidden="true" className="product-card menu-edit-product-card-dragging menu-edit-drag-overlay">'
          if needle not in text:
              raise SystemExit('product overlay opening tag missing')
          text = text.replace(needle, replacement, 1)

          workspace.write_text(text)

          contract = Path('apps/operations/src/app/unifiedMenuEditMode.source.test.ts')
          contract_text = contract.read_text()
          contract_text = contract_text.replace(
              "it('removes native HTML5 menu sorting while allowing reducer-owned dnd-kit drag-over updates', () => {",
              "it('removes native HTML5 menu sorting while allowing reducer-owned dnd-kit drag-move updates', () => {",
              1,
          )
          contract_text = contract_text.replace(
              "expect(ordersWorkspaceSource).toContain('onDragOver={handleMenuEditDragOver}');",
              "expect(ordersWorkspaceSource).toContain('onDragMove={handleMenuEditDragMove}');",
              1,
          )
          contract.write_text(contract_text)
          PY
          npx prettier apps/operations/src/app/OrdersWorkspace.tsx apps/operations/src/app/unifiedMenuEditMode.source.test.ts --write
          rm .github/workflows/menu-keyboard-dnd-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/operations/src/app/OrdersWorkspace.tsx apps/operations/src/app/unifiedMenuEditMode.source.test.ts .github/workflows/menu-keyboard-dnd-patch.yml
          git diff --cached --check
          git commit -m 'fix(menu-editor): commit keyboard movement from geometry targets'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
