name: Customers CRM3 isolated PostgreSQL acceptance

on:
  pull_request:
    paths:
      - 'apps/admin/server/customers/**'
      - 'apps/admin/src/customers/**'
      - 'e2e/admin-customers-promotions.spec.ts'
      - 'scripts/test-admin-loyalty-postgres.mjs'
      - 'supabase/migrations/**'
      - '.github/workflows/customers-crm-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loyalty-postgres:
    name: Customer merge and loyalty real PostgreSQL contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Assert loyalty and merge authorization, replay and ledger invariants
        run: node scripts/test-admin-loyalty-postgres.mjs
