            await expect(page.getByText('You have an unfinished order.', { exact: true })).toBeVisible();
            await expect(page.getByRole('button', { name: 'Return to Order' })).toBeVisible();
            await page.getByRole('button', { name: 'Discard Draft & Continue' }).click();
            await expect(page.getByText('Enter actual Cash', { exact: true })).toBeVisible();
            await expect(page.getByText('Expected', { exact: true })).toHaveCount(0);
            await page.getByLabel('Actual Cash').fill('100.00');
            await page.getByLabel('Actual Cash').blur();
            await page.getByRole('button', { name: 'Next' }).click();
            await page.getByLabel('Actual Instapay').fill('50.00');
            await page.getByLabel('Actual Instapay').blur();
            await page.getByRole('button', { name: 'Reveal Reconciliation' }).click();
            await expect(page.getByText('Final Closing Summary', { exact: true })).toBeVisible();
            await expect(page.getByText('Expected', { exact: true }).first()).toBeVisible();
            await expect(page.getByText('Recognized Sales', { exact: true })).toBeVisible();
            await expect(page.getByText('Profit', { exact: true })).toHaveCount(0);
            await expect(page.getByText('Margin', { exact: true })).toHaveCount(0);
            await expect(page.getByText('COGS', { exact: true })).toHaveCount(0);
            await page.screenshot({ path: 'qa-artifacts/end-day-summary.png', fullPage: false });
