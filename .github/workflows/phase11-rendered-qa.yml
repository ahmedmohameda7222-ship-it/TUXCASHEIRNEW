          cat > .qa-runtime/playwright.config.cjs <<'EOF'
          const { defineConfig } = require('@playwright/test');
          module.exports = defineConfig({
            testDir: '.',
            testMatch: /renderer\.spec\.cjs/,
            timeout: 30000,
            expect: { timeout: 7000 },
            retries: 0,
            workers: 1,
            reporter: [['line']],
            use: {
              browserName: 'chromium',
              headless: true,
              viewport: { width: 1440, height: 960 },
            },
          });
          EOF
      - name: Run rendered Playwright QA
        run: npx playwright test --config=.qa-runtime/playwright.config.cjs
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase11-rendered-qa
          path: qa-artifacts
          if-no-files-found: warn
