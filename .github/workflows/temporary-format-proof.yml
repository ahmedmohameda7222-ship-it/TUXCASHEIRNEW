name: Temporary Format Proof

on:
  push:
    branches:
      - feat/worker-system-color-theme

permissions:
  contents: read

jobs:
  format-proof:
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run write-mode formatter
        run: npm run format
      - name: Require formatter to be a no-op
        run: git diff --exit-code
