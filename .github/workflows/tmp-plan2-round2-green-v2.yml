name: Temporary Plan 2 Round 2 GREEN v2

on:
  push:
    branches:
      - tmp/admin-plan2-final-review-3-fixes
    paths:
      - .github/workflows/tmp-plan2-round2-green-v2.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/admin-plan2-final-review-3-fixes
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply deterministic GREEN patch
        run: |
          python .github/tmp-plan2-round2-green.py
          python .github/tmp-plan2-round2-green-fix.py
      - name: Format patched TypeScript
        run: >-
          npx prettier --write
          packages/sync/src/remoteMaterializer.ts
          packages/sync/src/remoteMaterializer.test.ts
          supabase/functions/order-intake/order-intake.ts
          supabase/functions/order-intake/published-checkout-authority.ts
          supabase/functions/order-intake/order-intakePublishedSettingsAuthority.test.ts
          apps/admin/src/catalog/CatalogPage.tsx
          apps/admin/src/catalog/finalReviewRound2Regressions.source.test.ts
      - name: Focused GREEN regressions
        run: >-
          npx vitest run
          apps/admin/src/catalog/finalReviewRound2Regressions.source.test.ts
          packages/sync/src/remoteMaterializer.test.ts
          supabase/functions/order-intake/order-intakePublishedSettingsAuthority.test.ts
          apps/admin/src/catalog/catalogProductSlug.test.ts
      - name: Root typecheck
        run: npm run typecheck
      - name: Format check
        run: npm run format:check
      - name: Commit verified GREEN patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/sync/src/remoteMaterializer.ts packages/sync/src/remoteMaterializer.test.ts supabase/functions/order-intake/order-intake.ts supabase/functions/order-intake/published-checkout-authority.ts supabase/functions/order-intake/order-intakePublishedSettingsAuthority.test.ts apps/admin/src/catalog/CatalogPage.tsx apps/admin/src/catalog/finalReviewRound2Regressions.source.test.ts supabase/migrations/20260910121500_admin_order_charge_sync_hardening.sql
          git diff --cached --check
          git commit -m 'fix(admin): close fresh final review gaps [round2-green]'
          git push origin HEAD:tmp/admin-plan2-final-review-3-fixes
