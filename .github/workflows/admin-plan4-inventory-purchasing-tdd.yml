name: Admin Plan 4 Inventory Purchasing TDD

concurrency:
  group: admin-plan4-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - feat/admin-04-inventory-purchasing
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/operations-inventory/**'
      - 'api/operations-inventory.ts'
      - 'apps/operations/api/operations-inventory.ts'
      - 'apps/operations/src/app/automaticSync.ts'
      - 'apps/operations/src/app/automaticSync.test.ts'
      - 'apps/operations/src/app/sessionClient.ts'
      - 'apps/operations-desktop/src/main/automaticSync.ts'
      - 'apps/operations-desktop/src/main/index.ts'
      - 'scripts/test-admin-inventory-ledger-migration.mjs'
      - 'scripts/test-admin-order-inventory-lifecycle.mjs'
      - 'scripts/test-admin-inventory-balance-authority.mjs'
      - 'scripts/test-admin-inventory-cost-snapshot.mjs'
      - 'scripts/test-admin-inventory-intelligence-migration.mjs'
      - 'scripts/test-admin-purchasing-migration.mjs'
      - 'scripts/test-admin-purchasing-postgres.mjs'
      - 'apps/admin/server/inventory/**'
      - 'apps/admin/server/purchasing/**'
      - 'apps/admin/api/admin/inventory.ts'
      - 'apps/admin/api/admin/purchasing.ts'
      - 'apps/admin/src/inventory/**'
      - 'apps/admin/src/purchasing/**'
      - 'packages/admin-contracts/src/inventory.ts'
      - 'packages/admin-contracts/src/purchasing.ts'
      - 'packages/application/src/orders.ts'
      - 'packages/application/src/ordersBoard.ts'
      - 'packages/sync/src/**'
      - 'packages/persistence/src/**'
      - 'e2e/admin-inventory.spec.ts'
      - 'e2e/admin-purchasing.spec.ts'
      - 'package.json'
      - '.github/workflows/admin-plan4-inventory-purchasing-tdd.yml'
  pull_request:
    paths:
      - 'scripts/test-admin-inventory-cost-snapshot.mjs'
      - 'scripts/test-admin-inventory-balance-authority.mjs'
      - 'supabase/migrations/**'
      - 'supabase/functions/operations-inventory/**'
      - 'api/operations-inventory.ts'
      - 'apps/operations/api/operations-inventory.ts'
      - 'apps/operations/src/app/automaticSync.ts'
      - 'apps/operations/src/app/automaticSync.test.ts'
      - 'apps/operations/src/app/sessionClient.ts'
      - 'apps/operations-desktop/src/main/automaticSync.ts'
      - 'apps/operations-desktop/src/main/index.ts'
      - 'scripts/test-admin-inventory-ledger-migration.mjs'
      - 'scripts/test-admin-order-inventory-lifecycle.mjs'
      - 'scripts/test-admin-inventory-intelligence-migration.mjs'
      - 'scripts/test-admin-purchasing-migration.mjs'
      - 'scripts/test-admin-purchasing-postgres.mjs'
      - 'apps/admin/server/inventory/**'
      - 'apps/admin/server/purchasing/**'
      - 'apps/admin/api/admin/inventory.ts'
      - 'apps/admin/api/admin/purchasing.ts'
      - 'apps/admin/src/inventory/**'
      - 'apps/admin/src/purchasing/**'
      - 'packages/admin-contracts/src/inventory.ts'
      - 'packages/admin-contracts/src/purchasing.ts'
      - 'packages/application/src/orders.ts'
      - 'packages/application/src/ordersBoard.ts'
      - 'packages/sync/src/**'
      - 'packages/persistence/src/**'
      - 'e2e/admin-inventory.spec.ts'
      - 'e2e/admin-purchasing.spec.ts'
      - 'package.json'
      - '.github/workflows/admin-plan4-inventory-purchasing-tdd.yml'

jobs:
  final-review-balances:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Plan 4 final review canonical full-ledger balances
        run: node scripts/test-admin-inventory-balance-authority.mjs

  final-review-cost-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Plan 4 final review immutable consumption cost snapshot
        run: node scripts/test-admin-inventory-cost-snapshot.mjs

  final-review-return-cost:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Plan 4 final review purchase-return revaluation
        run: node scripts/test-admin-purchasing-postgres.mjs

  final-review-stocktake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Plan 4 final review stable stocktake boundary
        run: node scripts/test-admin-inventory-ledger-migration.mjs

  final-review-purchase-units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Plan 4 final review purchase-unit conversion
        run: node scripts/test-admin-purchasing-migration.mjs

  final-review-convergence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Plan 4 final review Admin to Operations inventory convergence
        run: node scripts/test-admin-order-inventory-lifecycle.mjs

  ledger-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Plan 4 inventory ledger invariant
        run: node scripts/test-admin-inventory-ledger-migration.mjs

  ledger-postgres:
    needs: ledger-static
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Plan 4 inventory ledger PostgreSQL compatibility
        run: node scripts/test-admin-inventory-ledger-migration.mjs

  lifecycle-static:
    needs: ledger-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Plan 4 Operations inventory lifecycle behavior
        run: npx vitest run packages/application/src/orderInventoryLifecycle.sqlite.test.ts
      - name: Plan 4 IndexedDB inventory balance behavior
        run: npx vitest run packages/persistence/src/browser/IndexedDbOperationsDatabase.inventory.test.ts
      - name: Plan 4 SQLite canonical inventory convergence behavior
        run: npx vitest run packages/persistence/src/sqlite/inventoryConvergenceMigration.test.ts
      - name: Plan 4 costing tests
        run: npx vitest run apps/admin/server/inventory/costing.test.ts
      - name: Plan 4 order inventory lifecycle invariant
        run: node scripts/test-admin-order-inventory-lifecycle.mjs
      - name: Plan 4 lifecycle and sync regressions
        run: >-
          npx vitest run
          packages/application/src/orders.test.ts
          packages/application/src/ordersOnlineSource.sqlite.test.ts
          packages/application/src/onlineOrderAcceptance.test.ts
          packages/application/src/ordersBoard.reasonCodes.sqlite.test.ts
          packages/persistence/src/sqlite/SqliteOperationsDatabase.inventoryConvergence.test.ts
          apps/operations-desktop/src/main/ordersBoard.integration.test.ts
          packages/domain/src/syncContract.test.ts
          packages/sync/src/remoteMaterializer.test.ts
      - name: Plan 4 typecheck
        run: npm run typecheck

  task3-ui:
    needs: ledger-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Print exact Inventory Prettier diff
        run: |
          npx prettier --write apps/admin/src/inventory/InventoryPage.tsx apps/admin/src/inventory/InventoryRoute.source.test.ts
          git diff --no-ext-diff --no-color -- apps/admin/src/inventory/InventoryPage.tsx apps/admin/src/inventory/InventoryRoute.source.test.ts
          git diff --quiet -- apps/admin/src/inventory/InventoryPage.tsx apps/admin/src/inventory/InventoryRoute.source.test.ts
      - name: Verify Task 3 formatting
        run: >-
          npx prettier --check
          apps/admin/api/admin/inventory.ts
          apps/admin/src/inventory/AdjustStockSheet.tsx
          apps/admin/src/inventory/InventoryItemPage.tsx
          apps/admin/src/inventory/RecordWasteSheet.tsx
          apps/admin/src/inventory/TransferPage.tsx
      - name: Plan 4 Task 3 inventory unit/source UI
        run: >-
          npx vitest run
          apps/admin/src/inventory/InventoryItemPage.test.tsx
          apps/admin/src/inventory/InventoryRoute.source.test.ts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Plan 4 Task 3 inventory E2E
        run: npx playwright test --config playwright.admin.config.ts e2e/admin-inventory.spec.ts

  task4-intelligence:
    needs: ledger-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Plan 4 Task 4 inventory intelligence RED/behavior
        run: npx vitest run apps/admin/server/inventory/intelligence.test.ts
      - name: Plan 4 Task 4 migration invariant
        run: node scripts/test-admin-inventory-intelligence-migration.mjs
      - name: Plan 4 Task 4 intelligence UI RED/behavior
        run: >-
          npx vitest run
          apps/admin/src/inventory/ReorderSuggestionsPage.test.tsx
          apps/admin/src/inventory/VarianceReport.test.tsx

  task5-purchasing:
    needs: ledger-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Plan 4 Task 5 purchasing service RED/behavior
        run: npx vitest run apps/admin/server/purchasing/purchasingService.test.ts
      - name: Plan 4 Task 5 open-PO incoming intelligence RED/behavior
        run: npx vitest run apps/admin/server/inventory/intelligenceService.test.ts
      - name: Plan 4 Task 5 purchasing migration invariant
        run: node scripts/test-admin-purchasing-migration.mjs
      - name: Install Playwright Chromium for Task 5
        run: npx playwright install --with-deps chromium
      - name: Plan 4 Task 5 purchasing rendered E2E
        run: npx playwright test --config playwright.admin.config.ts e2e/admin-purchasing.spec.ts

  task5-postgres:
    needs: task5-purchasing
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Plan 4 Task 5 purchasing PostgreSQL behavior
        run: node scripts/test-admin-purchasing-postgres.mjs

  task1-regression:
    needs: ledger-postgres
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Full migration regression
        run: npm run test:migrations
      - name: Full unit and integration regression
        run: npm test
