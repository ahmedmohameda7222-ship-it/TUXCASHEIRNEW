name: Admin Plan 2 Reason Key GREEN

on:
  push:
    branches:
      - feat/admin-02-catalog-settings
    paths:
      - '.github/workflows/admin-plan2-reason-key-green.yml'

permissions:
  contents: write

jobs:
  green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/admin-02-catalog-settings
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply guarded reason-key compatibility patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'guard failed for {path}: expected source fragment not found')
              p.write_text(text.replace(old, new))

          replace_exact(
              'apps/admin/api/admin/settings.ts',
              ".regex(/^[a-z][a-z0-9_-]*$/)",
              ".regex(/^[A-Za-z][A-Za-z0-9_-]*$/)",
          )
          replace_exact(
              'supabase/migrations/20260910120600_admin_reason_code_edits.sql',
              "p_reason_key !~ '^[a-z][a-z0-9_-]*$'",
              "p_reason_key !~ '^[A-Za-z][A-Za-z0-9_-]*$'",
          )
          replace_exact(
              'apps/admin/src/settings/ReasonCodesPage.tsx',
              "key: key.trim().toLowerCase(),",
              "key: key.trim().toUpperCase(),",
          )
          replace_exact(
              'apps/admin/src/settings/ReasonCodesPage.tsx',
              'pattern="[a-z][a-z0-9_-]*"',
              'pattern="[A-Za-z][A-Za-z0-9_-]*"',
          )
          replace_exact(
              'apps/admin/src/settings/ReasonCodesPage.tsx',
              'placeholder="customer_changed_mind"',
              'placeholder="CUSTOMER_CHANGED_MIND"',
          )
          replace_exact(
              'apps/admin/src/settings/ReasonCodesPage.tsx',
              'onChange={(event) => setKey(event.target.value.toLowerCase())}',
              'onChange={(event) => setKey(event.target.value.toUpperCase())}',
          )
          replace_exact(
              'apps/admin/server/settings/reasonCodeManagement.test.ts',
              "key: 'customer_changed_mind',",
              "key: 'CUSTOMER_CHANGED_MIND',",
          )
          PY
      - name: Add permanent trusted RPC regression
        run: |
          cat > scripts/test-admin-reason-code-edits.mjs <<'EOF'
          import { spawnSync } from 'node:child_process';
          import fs from 'node:fs';

          const migrationPath = 'supabase/migrations/20260910120600_admin_reason_code_edits.sql';
          if (!fs.existsSync(migrationPath)) {
            throw new Error(`Admin reason-code edits migration is missing: ${migrationPath}`);
          }
          const sql = fs.readFileSync(migrationPath, 'utf8');
          for (const fragment of [
            'upsert_admin_reason_code_v1',
            "^[A-Za-z][A-Za-z0-9_-]*$",
            'reason_code_identity_immutable',
            'stale_reason_code_version',
          ]) {
            if (!sql.includes(fragment)) {
              throw new Error(`Admin reason-code edits migration missing ${fragment}`);
            }
          }
          if (sql.includes("^[a-z][a-z0-9_-]*$")) {
            throw new Error('Admin reason-code edit validation still rejects existing uppercase stable keys.');
          }

          const databaseUrl = process.env.TEST_DATABASE_URL;
          if (!databaseUrl) {
            console.log('Admin reason-code edits static invariant passed.');
            process.exit(0);
          }

          const url = new URL(databaseUrl);
          if (!new Set(['127.0.0.1', 'localhost', '::1']).has(url.hostname)) {
            throw new Error('Admin reason-code edits behavioral test refuses non-loopback PostgreSQL.');
          }

          const businessId = '00000000-0000-4000-8000-000000000001';
          const shopId = '17000000-0000-4000-8000-000000000093';
          const employeeId = '27000000-0000-4000-8000-000000000093';

          const behaviorSql = String.raw`
          begin;

          insert into public.shops(id, name, active)
          values ('${shopId}', 'Reason Key Fixture', true);
          insert into public.business_shops(business_id, shop_id)
          values ('${businessId}', '${shopId}');
          insert into public.business_employees(id, business_id, display_name, role, active)
          values ('${employeeId}', '${businessId}', 'Reason Key Fixture Owner', 'OWNER', true);

          do $$
          declare
            v_create jsonb;
            v_edit jsonb;
            v_stale jsonb;
            v_identity jsonb;
            v_reason_id uuid;
          begin
            v_create := public.upsert_admin_reason_code_v1(
              '${employeeId}', '${shopId}', null, 'KITCHEN_DELAY', 'CANCELLATION',
              'Kitchen delay', true, null
            );
            if coalesce((v_create ->> 'ok')::boolean, false) is not true
               or (v_create ->> 'version')::bigint <> 1 then
              raise exception 'uppercase reason create failed: %', v_create;
            end if;
            v_reason_id := (v_create ->> 'reasonCodeId')::uuid;

            v_edit := public.upsert_admin_reason_code_v1(
              '${employeeId}', '${shopId}', v_reason_id, 'KITCHEN_DELAY', 'CANCELLATION',
              'Kitchen delay updated', false, 1
            );
            if coalesce((v_edit ->> 'ok')::boolean, false) is not true
               or (v_edit ->> 'version')::bigint <> 2 then
              raise exception 'uppercase reason edit failed: %', v_edit;
            end if;

            v_stale := public.upsert_admin_reason_code_v1(
              '${employeeId}', '${shopId}', v_reason_id, 'KITCHEN_DELAY', 'CANCELLATION',
              'Stale label', true, 1
            );
            if v_stale ->> 'code' <> 'stale_reason_code_version'
               or (v_stale ->> 'currentVersion')::bigint <> 2 then
              raise exception 'stale reason edit was not fenced: %', v_stale;
            end if;

            v_identity := public.upsert_admin_reason_code_v1(
              '${employeeId}', '${shopId}', v_reason_id, 'KITCHEN_DELAY_CHANGED', 'CANCELLATION',
              'Identity mutation', false, 2
            );
            if v_identity ->> 'code' <> 'reason_code_identity_immutable' then
              raise exception 'reason identity mutation was not rejected: %', v_identity;
            end if;
          end $$;

          rollback;
          `;

          const result = spawnSync('psql', [databaseUrl, '-v', 'ON_ERROR_STOP=1', '-X', '-q'], {
            input: behaviorSql,
            encoding: 'utf8',
          });
          if (result.status !== 0) {
            process.stderr.write(result.stdout ?? '');
            process.stderr.write(result.stderr ?? '');
            process.exit(result.status ?? 1);
          }
          console.log('Admin reason-code edits PostgreSQL behavior passed.');
          EOF
      - name: Add permanent workflow coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/admin-catalog-settings-tdd.yml')
          text = p.read_text()
          path_anchor = "      - 'scripts/test-admin-shop-settings-migration.mjs'\n"
          path_insert = path_anchor + "      - 'scripts/test-admin-reason-code-edits.mjs'\n"
          if path_anchor not in text:
              raise SystemExit('workflow path anchor missing')
          text = text.replace(path_anchor, path_insert, 1)

          invariant_anchor = "      - name: Shop settings migration invariant\n        run: node scripts/test-admin-shop-settings-migration.mjs\n"
          invariant_insert = invariant_anchor + "      - name: Reason-code edits migration invariant\n        run: node scripts/test-admin-reason-code-edits.mjs\n"
          if invariant_anchor not in text:
              raise SystemExit('workflow invariant anchor missing')
          text = text.replace(invariant_anchor, invariant_insert, 1)

          pg_anchor = "      - name: Shop settings PostgreSQL behavior\n        run: node scripts/test-admin-shop-settings-migration.mjs\n"
          pg_insert = pg_anchor + "      - name: Reason-code edits PostgreSQL behavior\n        run: node scripts/test-admin-reason-code-edits.mjs\n"
          if pg_anchor not in text:
              raise SystemExit('workflow postgres anchor missing')
          text = text.replace(pg_anchor, pg_insert, 1)
          p.write_text(text)
          PY
      - name: GREEN targeted tests
        run: >-
          npx vitest run
          apps/admin/api/admin/reasonCodeCommand.test.ts
          apps/admin/server/settings/reasonCodeManagement.test.ts
          apps/admin/src/settings/SettingsPage.test.tsx
      - name: Static trusted RPC invariant
        run: node scripts/test-admin-reason-code-edits.mjs
      - name: Admin API and UI typechecks
        run: |
          npx tsc --noEmit -p tsconfig.api.json
          npm run typecheck -w @tux/admin
      - name: Format changed files
        run: >-
          npx prettier --write
          apps/admin/api/admin/settings.ts
          apps/admin/api/admin/reasonCodeCommand.test.ts
          apps/admin/server/settings/reasonCodeManagement.test.ts
          apps/admin/src/settings/ReasonCodesPage.tsx
          scripts/test-admin-reason-code-edits.mjs
          .github/workflows/admin-catalog-settings-tdd.yml
      - name: Verify targeted GREEN after formatting
        run: >-
          npx vitest run
          apps/admin/api/admin/reasonCodeCommand.test.ts
          apps/admin/server/settings/reasonCodeManagement.test.ts
      - name: Commit GREEN and remove temporary workflow
        run: |
          git rm .github/workflows/admin-plan2-reason-key-green.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/admin/api/admin/settings.ts \
                  apps/admin/api/admin/reasonCodeCommand.test.ts \
                  apps/admin/server/settings/reasonCodeManagement.test.ts \
                  apps/admin/src/settings/ReasonCodesPage.tsx \
                  supabase/migrations/20260910120600_admin_reason_code_edits.sql \
                  scripts/test-admin-reason-code-edits.mjs \
                  .github/workflows/admin-catalog-settings-tdd.yml
          git commit -m 'fix(admin): preserve existing reason-code identities'
          git push origin HEAD:feat/admin-02-catalog-settings
