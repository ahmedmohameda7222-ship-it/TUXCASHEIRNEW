name: Menu Editor Evidence Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-evidence:
    if: >-
      github.event.pull_request.number == 44 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Add desktop edit evidence and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/menu-layout-editor.e2e.ts')
          text = path.read_text()
          needle = "  expect(editMediaBox!.height).toBeCloseTo(normalMediaBox!.height, 0);\n\n  if (testInfo.project.name === 'mobile-browser-fallback') {"
          replacement = "  expect(editMediaBox!.height).toBeCloseTo(normalMediaBox!.height, 0);\n\n  if (testInfo.project.name === 'desktop-browser-fallback') {\n    await attachMenuLayoutScreenshot(page, testInfo, 'desktop-menu-edit');\n  }\n\n  if (testInfo.project.name === 'mobile-browser-fallback') {"
          if needle not in text:
              raise SystemExit('expected evidence insertion point not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          npx prettier e2e/menu-layout-editor.e2e.ts --write
          rm .github/workflows/e2e-evidence-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/menu-layout-editor.e2e.ts .github/workflows/e2e-evidence-patch.yml
          git diff --cached --check
          git commit -m 'test(e2e): capture desktop menu edit evidence'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
