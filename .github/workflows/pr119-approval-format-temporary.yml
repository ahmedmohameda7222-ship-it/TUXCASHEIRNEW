name: PR119 Temporary Scoped Approval Formatting

on:
  push:
    branches:
      - fix/admin-plans1-7-functional-completeness
    paths:
      - .github/workflows/pr119-approval-format-temporary.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-plans1-7-functional-completeness
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply repository Prettier to one test file
        run: npx prettier --write apps/admin/server/approvals/approvalService.test.ts
      - name: Commit only test formatting
        run: |
          if ! git diff --quiet -- apps/admin/server/approvals/approvalService.test.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- apps/admin/server/approvals/approvalService.test.ts
            git commit -m "style(admin): apply canonical Prettier to approval threshold tests"
            git push origin HEAD:fix/admin-plans1-7-functional-completeness
          fi
