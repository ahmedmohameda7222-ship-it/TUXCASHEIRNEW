name: Task 5B WhatsApp Cache Validation RED

on:
  push:
    branches:
      - feat/ops-whatsapp-task5b-validation-red

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Commit validation tests before RED
        run: |
          node scripts/task5b-add-validation-tests.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/sqlite/SqliteWhatsAppStore.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "test: add Task 5B cache validation RED"
            git push origin HEAD:feat/ops-whatsapp-task5b-validation-red
          fi
      - name: Task 5B validation RED
        run: npm test -- packages/persistence/src/sqlite/SqliteWhatsAppStore.test.ts
