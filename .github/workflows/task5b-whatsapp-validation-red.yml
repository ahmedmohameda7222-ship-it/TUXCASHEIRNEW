name: Task 5B WhatsApp Cache Validation GREEN

on:
  push:
    branches:
      - feat/ops-whatsapp-task5b-validation-red

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Task 5B WhatsApp SQLite tests
        run: npm test -- packages/persistence/src/sqlite/SqliteWhatsAppStore.test.ts
      - name: Existing SQLite Operations regression
        run: npm test -- packages/persistence/src/sqlite/SqliteOperationsDatabase.test.ts
      - name: Persistence typecheck
        run: npm run typecheck -w @tux/persistence
