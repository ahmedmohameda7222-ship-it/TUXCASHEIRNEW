name: Task 8E UI2 Workspace RED Materializer

on:
  push:
    branches:
      - work/operations-whatsapp-inbox-live
    paths:
      - '.recovery/task8e-ui2-workspace-red/**'
      - '.github/workflows/task8e-ui2-workspace-red-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact UI2 workspace RED tree
        shell: bash
        run: |
          set -euo pipefail
          cat .recovery/task8e-ui2-workspace-red/c{00..02} > /tmp/task8e-ui2-workspace-red.patch.b64
          base64 -d /tmp/task8e-ui2-workspace-red.patch.b64 > /tmp/task8e-ui2-workspace-red.patch
          echo '0469d5b38b8f0af50737641d9830593857871753dfdc655fa6f0526a803b4fb7  /tmp/task8e-ui2-workspace-red.patch' | sha256sum -c -
          rm -rf .recovery/task8e-ui2-workspace-red .github/workflows/task8e-ui2-workspace-red-materialize.yml
          git add -A
          git apply --index /tmp/task8e-ui2-workspace-red.patch
          actual="$(git write-tree)"
          test "$actual" = '098aec941efe9d42a988925dd7c1df2c875f2bf0'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'wip(task8e): red compact context card and header overflow'
          git push origin HEAD:work/operations-whatsapp-inbox-live
