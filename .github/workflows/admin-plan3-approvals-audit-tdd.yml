name: Admin Plan 3 Approvals Audit TDD

on:
  workflow_dispatch:
  push:
    branches:
      - feat/admin-03-approvals-audit
    paths:
      - 'supabase/migrations/**'
      - 'scripts/test-admin-approvals-audit-migration.mjs'
      - 'apps/admin/server/approvals/**'
      - 'apps/admin/server/audit/**'
      - 'apps/admin/api/cron/admin-approval-executor.ts'
      - 'apps/admin/vercel.json'
      - 'packages/admin-contracts/src/approvals.ts'
      - 'packages/admin-contracts/src/audit.ts'
      - 'packages/admin-contracts/src/index.ts'
      - '.github/workflows/admin-plan3-approvals-audit-tdd.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/test-admin-approvals-audit-migration.mjs'
      - 'apps/admin/server/approvals/**'
      - 'apps/admin/server/audit/**'
      - 'apps/admin/api/cron/admin-approval-executor.ts'
      - 'apps/admin/vercel.json'
      - 'packages/admin-contracts/src/approvals.ts'
      - 'packages/admin-contracts/src/audit.ts'
      - 'packages/admin-contracts/src/index.ts'
      - '.github/workflows/admin-plan3-approvals-audit-tdd.yml'

jobs:
  static-invariant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Plan 3 approvals and audit invariant
        run: node scripts/test-admin-approvals-audit-migration.mjs

  approval-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Plan 3 approval services and runner
        run: >-
          npx vitest run
          apps/admin/server/approvals/approvalService.test.ts
          apps/admin/server/approvals/approvalExecutionService.test.ts
          apps/admin/server/approvals/approvalExecutionRunner.test.ts

  postgres-behavior:
    needs: static-invariant
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Apply complete repository migration chain
        run: node scripts/test-migrations.mjs
      - name: Plan 3 approvals and audit PostgreSQL behavior
        run: node scripts/test-admin-approvals-audit-migration.mjs
