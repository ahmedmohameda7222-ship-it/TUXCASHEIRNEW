name: Prettier Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prettier-fix:
    if: >-
      github.event.pull_request.number == 44 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply canonical format and self-remove
        shell: bash
        run: |
          npx prettier apps/operations/src/app/OrdersWorkspace.tsx --write
          rm .github/workflows/prettier-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/operations/src/app/OrdersWorkspace.tsx .github/workflows/prettier-diagnostic.yml
          git diff --cached --check
          git commit -m 'style(operations): apply canonical prettier output'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
