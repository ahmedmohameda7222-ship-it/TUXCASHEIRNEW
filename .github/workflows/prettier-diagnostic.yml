name: Prettier diagnostic

on:
  push:
    branches:
      - work/menu-online-orders-integration

jobs:
  format-one-file:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print canonical Prettier output
        run: npx prettier apps/operations/src/app/onlineOrderInboxSync.test.ts
