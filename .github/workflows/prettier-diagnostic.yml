name: Prettier Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prettier-diff:
    if: github.event.pull_request.number == 44
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Print canonical OrdersWorkspace Prettier diff
        shell: bash
        run: |
          npx prettier apps/operations/src/app/OrdersWorkspace.tsx --write
          git diff -- apps/operations/src/app/OrdersWorkspace.tsx
