name: Admin Plan 3 Prettier Probe

on:
  push:
    branches:
      - tmp/admin-plan3-prettier-probe
    paths:
      - '.github/workflows/admin-plan3-prettier-probe.yml'

permissions:
  contents: write

jobs:
  prettier-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format exact Round 8 TypeScript files
        run: |
          npx prettier --write \
            apps/admin/server/approvals/approvalReadService.test.ts \
            apps/admin/server/approvals/approvalReadService.ts \
            apps/admin/server/audit/auditReadService.test.ts \
            apps/admin/server/audit/auditReadService.ts
      - name: Commit canonical formatter output on probe branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/admin/server/approvals/approvalReadService.test.ts \
            apps/admin/server/approvals/approvalReadService.ts \
            apps/admin/server/audit/auditReadService.test.ts \
            apps/admin/server/audit/auditReadService.ts
          git diff --cached --quiet || git commit -m 'chore: materialize Round 8 prettier output'
          git push origin HEAD:tmp/admin-plan3-prettier-probe