name: Format Admin E2E Once

on:
  push:
    branches:
      - feat/admin-pre-plan-7-ui-ux-hardening
    paths:
      - '.github/workflows/format-admin-e2e-once.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/admin-pre-plan-7-ui-ux-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write e2e/admin-purchasing.spec.ts e2e/admin-workforce.spec.ts
      - name: Commit formatted files and remove helper
        run: |
          rm .github/workflows/format-admin-e2e-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/admin-purchasing.spec.ts e2e/admin-workforce.spec.ts .github/workflows/format-admin-e2e-once.yml
          git commit -m 'style(admin): format hardened E2E flows'
          git push origin HEAD:feat/admin-pre-plan-7-ui-ux-hardening
