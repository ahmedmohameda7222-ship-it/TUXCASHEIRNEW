name: Temporary Menu Editor Source Formatter

on:
  push:
    branches:
      - refactor/menu-layout-editor-long-term
    paths:
      - '.github/workflows/_temp_menu_editor_source_formatter.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/menu-layout-editor-long-term
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply locked Prettier and self-remove
        shell: bash
        run: |
          npx prettier --write apps/operations/src/app/unifiedMenuEditMode.source.test.ts
          rm .github/workflows/_temp_menu_editor_source_formatter.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/operations/src/app/unifiedMenuEditMode.source.test.ts .github/workflows/_temp_menu_editor_source_formatter.yml
          git diff --cached --check
          git commit -m 'style(menu-editor): apply locked source-contract formatting'
          git push origin HEAD:refactor/menu-layout-editor-long-term
