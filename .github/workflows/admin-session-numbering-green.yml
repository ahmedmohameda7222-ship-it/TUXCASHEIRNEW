name: Admin Session Numbering Green

# One-shot executor retriggered after the test fixture was brought back into the read-model contract.
on:
  pull_request:
    paths:
      - '.github/workflows/admin-session-numbering-green.yml'

permissions:
  contents: write

jobs:
  apply-green:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply Business Day numbering boundary GREEN
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/application/src/session.ts')
          text = path.read_text()
          old = """      const currentDay = await transaction.businessDays.getOpenForShop(shop.id);\n      const day: OpenBusinessDay =\n        currentDay === null\n          ? createOpenBusinessDay({\n              id: this.#id<BusinessDayId>(),\n              shopId: shop.id,\n              startedAt: now,\n              startedByWorkerId: worker.id,\n            })\n          : currentDay.status === 'OPEN'\n            ? currentDay\n            : (() => {\n                throw new Error('Closed Business Day returned from open-day query.');\n              })();\n"""
          new = """      const currentDay = await transaction.businessDays.getOpenForShop(shop.id);\n      let day: OpenBusinessDay;\n      if (currentDay === null) {\n        const configuration = await transaction.configuration.getForShop(shop.id);\n        if (\n          configuration === null ||\n          configuration.shopId !== shop.id ||\n          !Number.isSafeInteger(configuration.version) ||\n          configuration.version <= 0\n        ) {\n          throw new Error('Activated Operations configuration is unavailable while opening the Business Day.');\n        }\n\n        const resetPolicy = configuration.settings?.values['receipt.sequenceResetPolicy'];\n        if (resetPolicy !== undefined && resetPolicy !== 'BUSINESS_DAY') {\n          throw new Error('Unsupported receipt sequence reset policy.');\n        }\n        const configuredSequenceStart = configuration.settings?.values['receipt.sequenceStart'];\n        const sequenceStart = configuredSequenceStart === undefined ? 1 : configuredSequenceStart;\n        if (\n          typeof sequenceStart !== 'number' ||\n          !Number.isSafeInteger(sequenceStart) ||\n          sequenceStart <= 0\n        ) {\n          throw new RangeError('Receipt sequence start must be a positive safe integer.');\n        }\n\n        day = createOpenBusinessDay(\n          {\n            id: this.#id<BusinessDayId>(),\n            shopId: shop.id,\n            startedAt: now,\n            startedByWorkerId: worker.id,\n          },\n          { sequenceStart },\n        );\n      } else if (currentDay.status === 'OPEN') {\n        day = currentDay;\n      } else {\n        throw new Error('Closed Business Day returned from open-day query.');\n      }\n"""
          if old not in text:
              raise SystemExit('Expected session Business Day creation block not found; refusing to patch.')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write packages/application/src/session.ts packages/application/src/session.receiptNumbering.test.ts
      - name: Verify focused GREEN
        run: |
          npx vitest run packages/application/src/session.receiptNumbering.test.ts packages/application/src/session.test.ts
          npm run typecheck -w @tux/application
          git diff --check
      - name: Commit GREEN
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/application/src/session.ts packages/application/src/session.receiptNumbering.test.ts
          git commit -m 'feat(settings): apply receipt sequence at Business Day boundary'
          git push origin HEAD:${GITHUB_HEAD_REF}
