name: Admin Plan 2 E2E Format

on:
  push:
    branches:
      - feat/admin-02-catalog-settings
    paths:
      - '.github/workflows/admin-plan2-e2e-format.yml'

permissions:
  contents: write

jobs:
  format-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/admin-02-catalog-settings
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format fixture and remove temporary workflow
        run: |
          npx prettier --write e2e/admin-settings.spec.ts
          git rm .github/workflows/admin-plan2-e2e-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/admin-settings.spec.ts
          git commit -m 'style(admin): format final Plan 2 E2E fixture'
          git push origin HEAD:feat/admin-02-catalog-settings
