name: Reports final changed-file formatting
on:
  push:
    branches:
      - feat/admin-reports-r1-r5-report-first-20261029
    paths:
      - .github/workflows/reports-format-final.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Format only PR-owned Reports source files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD | grep -E '^(apps/admin/(src|server)/reports/.*\.(ts|tsx|css)|e2e/admin-reports\.spec\.ts)$' || true)
          if (( ${#files[@]} > 0 )); then
            npx prettier --write "${files[@]}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${files[@]}"
            if ! git diff --cached --quiet; then
              git commit -m "style(reports): apply Prettier to changed Reports files"
              git push
            fi
          fi
