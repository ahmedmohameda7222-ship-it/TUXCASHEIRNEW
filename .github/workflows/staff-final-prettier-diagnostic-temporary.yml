name: Temporary Staff S4 exact formatter

on:
  pull_request:
    paths:
      - '.github/workflows/staff-final-prettier-diagnostic-temporary.yml'

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Show precise Prettier diff
        run: |
          for file in apps/admin/src/staff/SchedulePage.tsx apps/admin/src/staff/StaffPaymentPage.tsx e2e/admin-workforce.spec.ts .github/workflows/staff-workforce-postgres.yml; do
            echo "=== $file ==="
            npx prettier "$file" | diff -u "$file" - || true
          done
