name: Task 8E UI2 Controller Materializer

on:
  push:
    branches:
      - work/operations-whatsapp-inbox-live
    paths:
      - '.recovery/task8e-ui2-controller/**'
      - '.github/workflows/task8e-ui2-controller-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact UI2 controller tree
        shell: bash
        run: |
          set -euo pipefail
          cat .recovery/task8e-ui2-controller/c{00..06} > /tmp/task8e-ui2-controller.patch.b64
          base64 -d /tmp/task8e-ui2-controller.patch.b64 > /tmp/task8e-ui2-controller.patch
          echo 'a2f7d210911efb9be80af68c2abbc1484f42517eb27675152025d003aedbfe59  /tmp/task8e-ui2-controller.patch' | sha256sum -c -
          rm -rf .recovery/task8e-ui2-controller .github/workflows/task8e-ui2-controller-materialize.yml
          git add -A
          git apply --index /tmp/task8e-ui2-controller.patch
          actual="$(git write-tree)"
          test "$actual" = 'faafc4be5a615bc0ff8abd43f4f71f7a02615837'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'wip(task8e): implement order context controller'
          git push origin HEAD:work/operations-whatsapp-inbox-live
