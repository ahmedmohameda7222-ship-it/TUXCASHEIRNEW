name: Phase 4 receipt printing integration tests patch

on:
  push:
    branches:
      - feat/ops-04-orders

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ops-04-orders
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: python .phase4-print-tests.py
      - run: npx prettier --write apps/operations-desktop/src/main/orders.integration.test.ts
      - name: Commit print tests only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/operations-desktop/src/main/orders.integration.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Test receipt printing failure and retry semantics"
          git push origin HEAD:feat/ops-04-orders
