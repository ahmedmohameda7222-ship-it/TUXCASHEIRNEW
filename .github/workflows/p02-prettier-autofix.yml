name: P02 Branch Prettier Autofix
on:
  push:
    branches:
      - feat/admin-premium-p02-catalog-settings
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-premium-p02-catalog-settings
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format P02 changed files
        run: npx prettier --write "apps/admin/src/catalog/*.{ts,tsx,css}" "apps/admin/src/settings/*.{ts,tsx,css}"
      - name: Commit formatting only
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add apps/admin/src/catalog apps/admin/src/settings
          if ! git diff --cached --quiet; then
            git commit -m "style(admin): format P02 Catalog and Settings changes"
            git push
          fi
