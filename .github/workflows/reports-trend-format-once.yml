name: Reports save form format once
on:
  push:
    branches:
      - feat/admin-reports-r1-r5-report-first-20261029
    paths:
      - .github/workflows/reports-trend-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx prettier --write apps/admin/src/reports/SavedViews.tsx e2e/admin-reports.spec.ts
      - name: Commit formatted files
        run: |
          if ! git diff --quiet -- apps/admin/src/reports/SavedViews.tsx e2e/admin-reports.spec.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/admin/src/reports/SavedViews.tsx e2e/admin-reports.spec.ts
            git commit -m "style(reports): normalize saved-views and PDF browser tests"
            git push
          fi
