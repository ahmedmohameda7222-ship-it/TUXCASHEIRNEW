name: Reports trend format once
on:
  push:
    branches:
      - feat/admin-reports-r1-r5-report-first-20261029
    paths:
      - .github/workflows/reports-trend-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx prettier --write apps/admin/src/reports/ReportView.tsx apps/admin/src/reports/reportTrend.ts apps/admin/src/reports/reportTrend.test.ts apps/admin/src/reports/reports.css
      - name: Commit formatted files
        run: |
          if ! git diff --quiet -- apps/admin/src/reports; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/admin/src/reports/ReportView.tsx apps/admin/src/reports/reportTrend.ts apps/admin/src/reports/reportTrend.test.ts apps/admin/src/reports/reports.css
            git commit -m "style(reports): align trend and chart files with Prettier"
            git push
          fi
