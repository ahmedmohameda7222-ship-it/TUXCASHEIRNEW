name: Product Reorder E2E Coverage

on:
  push:
    branches:
      - feat/apple-product-card-reorder

jobs:
  add-coverage:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/apple-product-card-reorder
      - name: Add rendered product reorder coverage
        shell: bash
        run: |
          python3 -c "from pathlib import Path; import base64; p=Path('e2e/operations.e2e.ts'); s=p.read_text(); test=base64.b64decode('').decode(); anchor=\"test('Extra shortcuts preserve customized pricing and fresh adds'\"; assert test not in s, 'coverage already present'; assert s.count(anchor)==1, 'coverage anchor mismatch'; p.write_text(s.replace(anchor, test+anchor))"
          git diff --check
          git rm .github/workflows/product-reorder-e2e-coverage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/operations.e2e.ts
          git commit -m "test: cover rendered product reorder flow"
          git push origin HEAD:feat/apple-product-card-reorder
