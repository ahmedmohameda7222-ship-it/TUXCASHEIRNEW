name: Temporary E2E Patch

on:
  push:
    branches:
      - ui/current-order-rounded-section-cards
    paths:
      - '.github/workflows/temporary-e2e-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/current-order-rounded-section-cards
          fetch-depth: 0
      - name: Patch approved rendered QA contracts
        run: python scripts/temporary-patch-current-order-e2e.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit rendered QA alignment
        shell: bash
        run: |
          test -n "$(git status --porcelain -- e2e/operations.e2e.ts)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/operations.e2e.ts
          git commit -m 'test: align rendered payment controls with reference'
          git push origin HEAD:ui/current-order-rounded-section-cards
