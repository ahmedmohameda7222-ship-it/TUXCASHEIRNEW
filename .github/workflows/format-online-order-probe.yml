name: Exact Prettier probe

on:
  push:
    branches:
      - work/menu-online-orders-integration

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/menu-online-orders-integration
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier exactly
        run: npx prettier --write apps/operations/src/app/OnlineOrderInboxPanel.tsx
      - name: Commit exact formatter output
        run: |
          if git diff --quiet -- apps/operations/src/app/OnlineOrderInboxPanel.tsx; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/operations/src/app/OnlineOrderInboxPanel.tsx
          git commit -m "style(online-orders): apply exact repository Prettier"
          git push origin HEAD:work/menu-online-orders-integration
