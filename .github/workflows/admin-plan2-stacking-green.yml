name: Admin Plan 2 Discount Stacking GREEN

on:
  push:
    branches:
      - feat/admin-02-catalog-settings
    paths:
      - '.github/workflows/admin-plan2-stacking-green.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discount-stacking-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply guarded discount-stacking propagation patch
        run: python scripts/admin-plan2-stacking-green.py
      - name: Format touched files
        run: npx prettier --write packages/domain/src/models.ts packages/domain/src/checkoutPolicy.ts packages/application/src/orders.ts packages/domain/src/syncContract.ts packages/domain/src/checkoutSnapshotSync.test.ts apps/admin/src/settings/CheckoutPage.tsx apps/admin/src/settings/SettingsPage.test.tsx packages/catalog-contracts/src/index.ts packages/catalog-contracts/src/publicOrderingProjection.test.ts supabase/functions/catalog-public/published-ordering.ts supabase/functions/catalog-public/published-ordering.test.ts
      - name: Effective checkout stacking policy
        run: npx vitest run packages/domain/src/checkoutPolicyStacking.test.ts
      - name: Immutable checkout snapshot sync
        run: npx vitest run packages/domain/src/checkoutSnapshotSync.test.ts
      - name: Public ordering contract
        run: npx vitest run packages/catalog-contracts/src/publicOrderingProjection.test.ts supabase/functions/catalog-public/published-ordering.test.ts
      - name: Admin checkout editor
        run: npx vitest run apps/admin/src/settings/SettingsPage.test.tsx
      - name: Domain typecheck
        run: npm run typecheck -w @tux/domain
      - name: Application typecheck
        run: npm run typecheck -w @tux/application
      - name: Catalog contracts typecheck
        run: npm run typecheck -w @tux/catalog-contracts
      - name: Admin typecheck
        run: npm run typecheck -w @tux/admin
      - name: Commit verified propagation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/domain/src/models.ts packages/domain/src/checkoutPolicy.ts packages/application/src/orders.ts packages/domain/src/syncContract.ts packages/domain/src/checkoutSnapshotSync.test.ts apps/admin/src/settings/CheckoutPage.tsx apps/admin/src/settings/SettingsPage.test.tsx packages/catalog-contracts/src/index.ts packages/catalog-contracts/src/publicOrderingProjection.test.ts supabase/functions/catalog-public/published-ordering.ts supabase/functions/catalog-public/published-ordering.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(admin): propagate discount stacking policy"
          git push origin HEAD:feat/admin-02-catalog-settings
