name: Patch menu shortcut suppression

on:
  push:
    branches:
      - ui/unified-menu-edit-mode
    paths:
      - .github/workflows/patch-menu-shortcut-suppression.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/unified-menu-edit-mode
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Confirm shortcut regression is RED
        shell: bash
        run: |
          set +e
          npx vitest run apps/operations/src/app/unifiedMenuEditMode.source.test.ts > /tmp/menu-shortcut-red.log 2>&1
          status=$?
          set -e
          cat /tmp/menu-shortcut-red.log
          test "$status" -ne 0
          grep -q "suppresses search shortcuts during it" /tmp/menu-shortcut-red.log
      - name: Apply shortcut suppression patch
        run: node scripts/patch-menu-shortcut-suppression.mjs
      - name: Format production change
        run: npx prettier --write apps/operations/src/app/OrdersWorkspace.tsx
      - name: Confirm shortcut regression is GREEN
        run: npx vitest run apps/operations/src/app/unifiedMenuEditMode.source.test.ts
      - name: Remove temporary patch scaffolding
        run: rm .github/workflows/patch-menu-shortcut-suppression.yml scripts/patch-menu-shortcut-suppression.mjs
      - name: Commit clean shortcut fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: suppress search shortcuts while editing"
          git push origin HEAD:ui/unified-menu-edit-mode
