name: Temporary Plan 2 Final P2 GREEN Retry

on:
  push:
    branches:
      - tmp/admin-plan2-final-review-3-fixes

permissions:
  contents: write

jobs:
  apply-green-retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply verified patch and push
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/tmp-plan2-final-p2-green.yml').read_text()
          start = workflow.index("          python3 <<'PY'\n") + len("          python3 <<'PY'\n")
          end = workflow.index("\n          PY", start)
          patch_script = textwrap.dedent(workflow[start:end])
          exec(compile(patch_script, '<final-p2-green>', 'exec'), {})
          PY

          npx prettier --write \
            packages/admin-contracts/src/catalog.ts \
            apps/admin/src/catalog/ProductInspector.tsx \
            apps/admin/src/settings/ReasonCodesPage.tsx \
            apps/admin/src/catalog/PublishReviewPage.tsx \
            apps/admin/server/catalog/catalogService.ts

          npx vitest run apps/admin/src/catalog/finalReviewP2Regressions.source.test.ts apps/admin/server/catalog/catalogService.test.ts apps/admin/src/catalog/ProductEditor.test.tsx apps/admin/src/settings/SettingsPage.test.tsx
          npm run typecheck:admin

          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/admin-contracts/src/catalog.ts \
            apps/admin/src/catalog/ProductInspector.tsx \
            apps/admin/src/settings/ReasonCodesPage.tsx \
            apps/admin/src/catalog/PublishReviewPage.tsx \
            apps/admin/server/catalog/catalogService.ts
          git commit -m "fix(plan2): close final P2 review gaps"
          git push origin HEAD:tmp/admin-plan2-final-review-3-fixes
