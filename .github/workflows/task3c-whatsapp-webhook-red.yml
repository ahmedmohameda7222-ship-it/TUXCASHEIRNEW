name: Task 3C WhatsApp Webhook Verification

on:
  push:
    branches:
      - 'feat/ops-whatsapp-task3c-red'

permissions:
  contents: read

jobs:
  webhook-green:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Webhook GREEN
        run: npm test -- server/whatsappWebhook.test.ts
      - name: Task 3B and 3C focused tests
        run: >-
          npm test --
          server/whatsappServerConfig.test.ts
          server/whatsappChannelResolver.test.ts
          server/whatsappProviderGateway.test.ts
          server/whatsappWebhook.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Migration gate
        run: npm run test:migrations
