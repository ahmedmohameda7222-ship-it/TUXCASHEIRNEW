name: PR119 scoped withdrawal formatting (temporary)
on:
  push:
    branches:
      - fix/admin-plans1-7-functional-completeness
    paths:
      - '.github/workflows/pr119-scope-format-owner-withdrawal-once.yml'
permissions:
  contents: write
jobs:
  format-exact-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/admin-plans1-7-functional-completeness
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Normalize only seven new approval files
        run: |
          npx prettier --write \
            apps/admin/server/approvals/approvalRulesRoute.ts \
            apps/admin/server/approvals/financeOwnerWithdrawalApproval.test.ts \
            apps/admin/server/approvals/financeOwnerWithdrawalApproval.ts \
            apps/admin/server/finance/financeOwnerWithdrawalApprovalRoute.ts \
            apps/admin/src/finance/MoneyMovementSheet.tsx \
            apps/admin/src/finance/useFinanceOperations.ts \
            e2e/admin-finance.spec.ts
          git diff --check
      - name: Commit the minimal scoped format if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/admin/server/approvals/approvalRulesRoute.ts \
            apps/admin/server/approvals/financeOwnerWithdrawalApproval.test.ts \
            apps/admin/server/approvals/financeOwnerWithdrawalApproval.ts \
            apps/admin/server/finance/financeOwnerWithdrawalApprovalRoute.ts \
            apps/admin/src/finance/MoneyMovementSheet.tsx \
            apps/admin/src/finance/useFinanceOperations.ts \
            e2e/admin-finance.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(admin): canonical Prettier for Owner Withdrawal approval"
            git pull --rebase origin fix/admin-plans1-7-functional-completeness
            git push origin HEAD:fix/admin-plans1-7-functional-completeness
          fi
