name: Phase 11 Product Polish

on:
  pull_request:
    branches:
      - test/ops-11-rendered-qa

permissions:
  contents: read

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test/ops-11-rendered-qa
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Materialize Board Undo and desktop product-card fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          board = Path('apps/operations/src/app/OrdersBoardWorkspace.tsx')
          text = board.read_text()
          old = "    if (changed) setUndo({ orderId: order.id, expiresAt: Date.now() + 7_000 });\n"
          new = "\n".join([
              "    if (changed) {",
              "      setSelected(null);",
              "      setUndo({ orderId: order.id, expiresAt: Date.now() + 7_000 });",
              "    }",
          ]) + "\n"
          if old not in text:
              raise SystemExit('Mark Done success target not found')
          board.write_text(text.replace(old, new, 1))
          css = Path('apps/operations/src/styles/orders.css')
          text = css.read_text()
          old = '  grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));\n'
          new = '  grid-template-columns: repeat(auto-fill, minmax(21rem, 1fr));\n'
          if old not in text:
              raise SystemExit('Product-grid sizing target not found')
          css.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write apps/operations/src/app/OrdersBoardWorkspace.tsx apps/operations/src/styles/orders.css
      - name: Upload exact patched product files
        uses: actions/upload-artifact@v4
        with:
          name: phase11-product-polish-files
          path: |
            apps/operations/src/app/OrdersBoardWorkspace.tsx
            apps/operations/src/styles/orders.css
