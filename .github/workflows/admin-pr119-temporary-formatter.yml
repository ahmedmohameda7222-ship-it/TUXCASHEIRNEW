name: PR 119 Temporary Prettier Formatter

on:
  push:
    branches:
      - fix/admin-plans1-7-functional-completeness
    paths:
      - '.github/workflows/admin-pr119-temporary-formatter.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Apply canonical Prettier to affected code only
        run: npx prettier --write apps/admin/api/admin/settings.ts apps/admin/server/api-contracts/vercelFunctionBudget.test.ts apps/admin/server/approvals/approvalRulesRoute.ts apps/admin/server/settings/paymentZoneRulesRoute.ts apps/admin/server/settings/shopCopyPreviewRoute.ts apps/admin/server/settings/shopCreateRoute.ts
      - name: Commit formatted source (no quality gate bypass)
        run: |
          git add -u -- apps/admin/api/admin/settings.ts apps/admin/server/api-contracts/vercelFunctionBudget.test.ts apps/admin/server/approvals/approvalRulesRoute.ts apps/admin/server/settings/paymentZoneRulesRoute.ts apps/admin/server/settings/shopCopyPreviewRoute.ts apps/admin/server/settings/shopCreateRoute.ts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(admin): apply repository Prettier formatting'
            git push origin HEAD:refs/heads/fix/admin-plans1-7-functional-completeness
          fi
