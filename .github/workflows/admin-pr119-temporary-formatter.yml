name: PR 119 Temporary Shop Copy Formatter

on:
  push:
    branches:
      - fix/admin-plans1-7-functional-completeness
    paths:
      - '.github/workflows/admin-pr119-temporary-formatter.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Apply canonical Prettier to scoped changed files
        run: npx prettier --write "apps/admin/server/settings/shopCopyPreview.ts" "apps/admin/server/settings/shopCopyPreview.test.ts" "apps/admin/server/api-contracts/shopCopyPreview.test.ts" "apps/admin/api/admin/shop-copy-preview.ts" "apps/admin/src/settings/ShopCopyPreviewPanel.tsx" "apps/admin/src/settings/SettingsPage.tsx"
      - name: Commit and fast-forward with concurrent branch updates
        run: |
          git add -u -- "apps/admin/server/settings/shopCopyPreview.ts" "apps/admin/server/settings/shopCopyPreview.test.ts" "apps/admin/server/api-contracts/shopCopyPreview.test.ts" "apps/admin/api/admin/shop-copy-preview.ts" "apps/admin/src/settings/ShopCopyPreviewPanel.tsx" "apps/admin/src/settings/SettingsPage.tsx"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(admin): format shop copy preview correction'
            for attempt in 1 2 3 4 5; do
              git fetch origin fix/admin-plans1-7-functional-completeness
              git rebase FETCH_HEAD
              if git push origin HEAD:refs/heads/fix/admin-plans1-7-functional-completeness; then
                exit 0
              fi
            done
            exit 1
          fi
