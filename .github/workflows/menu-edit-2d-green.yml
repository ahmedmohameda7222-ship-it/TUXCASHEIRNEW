name: Menu Edit 2D live reorder GREEN

on:
  push:
    branches:
      - feat/menu-edit-2d-live-reorder

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/menu-edit-2d-live-reorder
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply bounded 2D live reorder correction
        run: python3 .github/scripts/apply_menu_edit_2d_reorder.py
      - name: Correct Product overlay acceptance selector
        run: >-
          sed -i
          's/\.menu-edit-product-card\.menu-edit-drag-overlay/\.menu-edit-product-card-dragging\.menu-edit-drag-overlay/g'
          e2e/menu-layout-editor.e2e.ts
      - name: Format affected files
        run: >-
          npx prettier --write
          apps/operations/src/app/OrdersWorkspace.tsx
          apps/operations/src/app/MenuEditProductCard.tsx
          apps/operations/src/styles/menu-edit-stability.css
          e2e/menu-layout-editor.e2e.ts
          e2e/operations.e2e.ts
      - name: Diff check
        run: git diff --check
      - name: Focused lint
        run: >-
          npx eslint
          apps/operations/src/app/OrdersWorkspace.tsx
          apps/operations/src/app/MenuEditProductCard.tsx
          e2e/menu-layout-editor.e2e.ts
          e2e/operations.e2e.ts
          --max-warnings 0
      - name: Typecheck
        run: |
          npm run typecheck -w @tux/operations
          npm run typecheck:e2e
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Menu Edit rendered acceptance
        run: >-
          npx playwright test e2e/menu-layout-editor.e2e.ts
          --project=desktop-browser-fallback
          --project=mobile-tablet-browser-fallback
          --project=mobile-browser-fallback
      - name: Unified persistence acceptance
        run: >-
          npx playwright test e2e/operations.e2e.ts
          --project=desktop-browser-fallback
          --project=mobile-tablet-browser-fallback
          --project=mobile-browser-fallback
          --grep='unified menu edit persists one combined worker layout with keyboard and rollback'
      - name: Real touch acceptance
        run: >-
          npx playwright test e2e/menu-layout-editor.touch.e2e.ts
          --project=touch-mobile-browser-fallback
      - name: Commit verified source and remove temporary verification files
        run: |
          git rm -f \
            .github/workflows/menu-edit-2d-red.yml \
            .github/workflows/menu-edit-2d-green.yml \
            .github/scripts/apply_menu_edit_2d_reorder.py \
            .github/menu-edit-2d-green-trigger.txt
          git add \
            apps/operations/src/app/OrdersWorkspace.tsx \
            apps/operations/src/app/MenuEditProductCard.tsx \
            apps/operations/src/styles/menu-edit-stability.css \
            e2e/menu-layout-editor.e2e.ts \
            e2e/operations.e2e.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add Apple-style 2D live menu reorder'
          git push origin HEAD:feat/menu-edit-2d-live-reorder
