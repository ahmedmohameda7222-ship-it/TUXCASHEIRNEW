name: Menu Edit 2D live reorder GREEN

on:
  push:
    branches:
      - feat/menu-edit-2d-live-reorder

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/menu-edit-2d-live-reorder
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply bounded 2D live reorder correction and regression coverage
        run: |
          cat > /tmp/apply_2d_reorder.py <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1))

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f'{path}: missing start marker {start!r}')
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f'{path}: missing end marker {end!r}')
              file.write_text(text[:start_index] + replacement + text[end_index:])

          orders = 'apps/operations/src/app/OrdersWorkspace.tsx'
          replace_once(
              orders,
              "  filterProductsForMenu as filterProductsForMenuWithPreference,\n  reconcileProductOrder,\n  swapProductWithinCategory,\n",
              "  filterProductsForMenu as filterProductsForMenuWithPreference,\n  moveProductWithinCategory,\n  reconcileProductOrder,\n",
          )

          keyboard_start = "  const menuEditKeyboardCoordinateGetter = useCallback<typeof sortableKeyboardCoordinates>(\n"
          sensors_start = "  const menuEditSensors = useSensors(\n"
          keyboard_block = '''  const menuEditKeyboardCoordinateGetter = useCallback<typeof sortableKeyboardCoordinates>(
            (event, args) => {
              const nextCoordinates = sortableKeyboardCoordinates(event, args);
              const active = args.context.active;
              const collisionRect = args.context.collisionRect;
              if (active === null || collisionRect === null) {
                pendingKeyboardDragTargetRef.current = null;
                return nextCoordinates;
              }

              const directionalDroppableContainers = args.context.droppableContainers
                .getEnabled()
                .filter((container) => {
                  if (container.id === active.id) return false;
                  const rect = args.context.droppableRects.get(container.id);
                  if (rect === undefined) return false;
                  if (event.code === 'ArrowDown') return collisionRect.top < rect.top;
                  if (event.code === 'ArrowUp') return collisionRect.top > rect.top;
                  if (event.code === 'ArrowLeft') return collisionRect.left > rect.left;
                  if (event.code === 'ArrowRight') return collisionRect.left < rect.left;
                  return false;
                });
              const projectedCollisions = closestCorners({
                active,
                collisionRect,
                droppableRects: args.context.droppableRects,
                droppableContainers: directionalDroppableContainers,
                pointerCoordinates: null,
              });
              const currentOverId = args.context.over?.id;
              const projectedCollision =
                projectedCollisions[0]?.id === currentOverId && projectedCollisions.length > 1
                  ? projectedCollisions[1]
                  : projectedCollisions[0];
              pendingKeyboardDragTargetRef.current =
                projectedCollision === undefined ? null : String(projectedCollision.id);
              return nextCoordinates;
            },
            [],
          );
'''
          replace_between(orders, keyboard_start, sensors_start, keyboard_block)

          old_product_over = '''    if (activeProduct.id === overProduct.id) return true;

            const targetIndex = menuEditProducts.findIndex((product) => product.id === overProduct.id);
            if (targetIndex < 0) return false;
            setMenuEditAnnouncement(
              `${activeProduct.name} targeting position ${targetIndex + 1} of ${menuEditProducts.length}.`,
            );
            return true;
          }
'''
          new_product_over = '''    if (activeProduct.id === overProduct.id) return true;

            const productCategoryById = new Map(
              (configuration?.products ?? []).map((product) => [product.id, product.categoryId]),
            );
            const categoryProductIds = menuEditProductOrder.filter(
              (productId) => productCategoryById.get(productId) === selectedCategoryId,
            );
            const next = moveProductWithinCategory(
              menuEditProductOrder,
              categoryProductIds,
              activeProduct.id,
              overProduct.id,
            );
            if (next === menuEditProductOrder) return true;
            dispatchMenuLayoutEditor({ type: 'SET_PRODUCT_ORDER', productOrder: next });
            const categoryOnly = next.filter(
              (productId) => productCategoryById.get(productId) === selectedCategoryId,
            );
            setMenuEditAnnouncement(
              `${activeProduct.name} moved to position ${categoryOnly.indexOf(activeProduct.id) + 1} of ${categoryOnly.length}.`,
            );
            return true;
          }
'''
          replace_once(orders, old_product_over, new_product_over)
          replace_once(orders, '      productOrder = swapProductWithinCategory(\n', '      productOrder = moveProductWithinCategory(\n')
          replace_once(orders, '                collisionDetection={menuEditProductCollisionDetection}\n', '                collisionDetection={closestCenter}\n')
          replace_once(
              orders,
              "                <DragOverlay modifiers={[({ transform }) => ({ ...transform, x: 0 })]}>\n",
              "                <DragOverlay>\n",
          )

          card = 'apps/operations/src/app/MenuEditProductCard.tsx'
          replace_once(card, "import { useSortable } from '@dnd-kit/sortable';\n", "import { useSortable } from '@dnd-kit/sortable';\nimport { CSS } from '@dnd-kit/utilities';\n")
          replace_once(
              card,
              '  const { attributes, listeners, setNodeRef, isDragging } = useSortable({\n',
              '  const { attributes, listeners, setNodeRef, transform, transition, isDragging } = useSortable({\n',
          )
          replace_once(
              card,
              "      aria-label={`${product.name}, position ${position} of ${total}`}\n",
              "      style={{ transform: CSS.Transform.toString(transform), transition }}\n      aria-label={`${product.name}, position ${position} of ${total}`}\n",
          )

          css = 'apps/operations/src/styles/menu-edit-stability.css'
          replace_once(
              css,
              '''/* Product drag keeps the source slot reserved while one overlay follows the gesture. */
          .menu-edit-product-card-dragging:not(.menu-edit-drag-overlay) {
            visibility: hidden;
          }
          ''',
              '''/* Drag sources become invisible placeholders while one lifted overlay follows the gesture. */
          .category-tab-dragging:not(.menu-edit-drag-overlay),
          .menu-edit-product-card-dragging:not(.menu-edit-drag-overlay) {
            visibility: hidden;
          }
          ''',
          )

          e2e = 'e2e/menu-layout-editor.e2e.ts'
          replace_once(
              e2e,
              "  key: 'ArrowLeft' | 'ArrowRight' | 'ArrowDown',\n",
              "  key: 'ArrowLeft' | 'ArrowRight' | 'ArrowUp' | 'ArrowDown',\n",
          )
          helper_start = 'function nearestSameColumnBelow(boxes: readonly ProductCardBox[], sourceIndex: number): number {'
          helper_end = 'async function continuePastGreetingForWorker('
          helper = '''function moveName(values: readonly string[], sourceIndex: number, targetIndex: number): string[] {
            const next = [...values];
            const [moved] = next.splice(sourceIndex, 1);
            if (moved === undefined) throw new Error('Invalid Product Card move');
            next.splice(targetIndex, 0, moved);
            return next;
          }

          '''
          replace_between(e2e, helper_start, helper_end, helper)

          test_start = "test('desktop fixed-slot Product drag swaps only same-column slots and persists after save'"
          test_end = "test('dirty shell exits keep or discard the exact editor transaction'"
          new_test = '''test('desktop Apple-style Menu Edit reflows categories and Product Cards live in 2D', async ({
            page,
          }, testInfo) => {
            test.skip(testInfo.project.name !== 'desktop-browser-fallback', 'desktop acceptance');
            await startMenuLayoutActiveOrders(page);
            await page.getByRole('button', { name: 'Edit menu' }).click();

            const categories = menuCategoryTabs(page);
            const burgers = categories.getByText('Burgers', { exact: true });
            await burgers.focus();
            await page.keyboard.press('Space');
            await expect(page.locator('.category-tab.menu-edit-drag-overlay')).toHaveCount(1);
            await expect(burgers).toHaveCSS('visibility', 'hidden');
            await waitForDndKeyboardSensor(page);
            await page.keyboard.press('ArrowRight');
            await expect(categories.nth(0)).toHaveText('Combo');
            await expect(categories.nth(1)).toHaveText('Burgers');
            await page.keyboard.press('Escape');
            await expect(categories.nth(0)).toHaveText('Burgers');
            await expect(categories.nth(1)).toHaveText('Combo');

            let cards = menuEditProductCards(page);
            const beforeKeyboard = await productCardNames(cards);
            let boxes = await productCardBoxes(cards);
            expect(boxes.length).toBeGreaterThan(4);
            expect(Math.abs(boxes[0]!.y - boxes[1]!.y)).toBeLessThanOrEqual(2);
            expect(boxes[1]!.x).toBeGreaterThan(boxes[0]!.x);

            await cards.nth(0).focus();
            await page.keyboard.press('Space');
            await expect(cards.nth(0)).toHaveCSS('visibility', 'hidden');
            await expect(page.locator('.menu-edit-product-card.menu-edit-drag-overlay')).toHaveCount(1);
            await waitForDndKeyboardSensor(page);
            await page.keyboard.press('ArrowRight');
            const afterHorizontal = moveName(beforeKeyboard, 0, 1);
            await expect.poll(() => productCardNames(menuEditProductCards(page))).toEqual(afterHorizontal);
            await expect(page.locator('.menu-pane .sr-only')).toContainText('moved to position');
            await page.keyboard.press('Space');
            await expect.poll(() => productCardNames(menuEditProductCards(page))).toEqual(afterHorizontal);

            cards = menuEditProductCards(page);
            const beforePointer = await productCardNames(cards);
            boxes = await productCardBoxes(cards);
            const pointerSourceIndex = 0;
            const sourceBox = boxes[pointerSourceIndex];
            expect(sourceBox).toBeDefined();
            const pointerTargetIndex = boxes.findIndex(
              (box, index) => index > pointerSourceIndex && box.y > sourceBox!.y + 2,
            );
            expect(pointerTargetIndex).toBeGreaterThan(1);
            const targetBox = boxes[pointerTargetIndex];
            expect(targetBox).toBeDefined();
            const expectedPointer = moveName(beforePointer, pointerSourceIndex, pointerTargetIndex);

            await page.mouse.move(
              sourceBox!.x + sourceBox!.width / 2,
              sourceBox!.y + sourceBox!.height / 2,
            );
            await page.mouse.down();
            await page.mouse.move(
              sourceBox!.x + sourceBox!.width / 2 + 8,
              sourceBox!.y + sourceBox!.height / 2 + 4,
              { steps: 2 },
            );
            await expect(page.locator('.menu-edit-product-card.menu-edit-drag-overlay')).toHaveCount(1);
            await expect(cards.nth(pointerSourceIndex)).toHaveCSS('visibility', 'hidden');
            await page.mouse.move(
              targetBox!.x + targetBox!.width / 2,
              targetBox!.y + targetBox!.height / 2,
              { steps: 8 },
            );
            await expect.poll(() => productCardNames(menuEditProductCards(page))).toEqual(expectedPointer);
            await attachMenuLayoutScreenshot(page, testInfo, 'desktop-menu-drag-live-2d');
            await page.mouse.up();
            await expect.poll(() => productCardNames(menuEditProductCards(page))).toEqual(expectedPointer);

            const expectedDraft = await menuLayoutDraftSnapshot(page);
            await page.getByRole('button', { name: 'Save', exact: true }).click();
            await expect(page.getByRole('status').filter({ hasText: 'Menu layout saved' })).toBeVisible();
            await page.reload();
            await expect(page.getByRole('navigation', { name: 'Operations' })).toBeVisible();
            await page.getByRole('button', { name: 'Edit menu' }).click();
            await expect.poll(() => menuLayoutDraftSnapshot(page)).toEqual(expectedDraft);
            await expectNoHorizontalOverflow(page);
          });
          '''
          replace_between(e2e, test_start, test_end, new_test)

          old_rollback = '''  await page.keyboard.press('ArrowDown');
            await expect(page.locator('.menu-pane .sr-only')).toContainText('targeting position');
            await expect.poll(() => menuLayoutDraftSnapshot(page)).toEqual(baseline);
            await menuCategoryTabs(page).getByText('Fries', { exact: true }).click();
          '''
          new_rollback = '''  await page.keyboard.press('ArrowDown');
            await expect(page.locator('.menu-pane .sr-only')).toContainText('moved to position');
            await expect.poll(() => menuLayoutDraftSnapshot(page)).not.toEqual(baseline);
            await menuCategoryTabs(page).getByText('Fries', { exact: true }).click();
          '''
          replace_once(e2e, old_rollback, new_rollback)

          operations = 'e2e/operations.e2e.ts'
          product_section_start = "  let reorderCards = page.locator('.menu-edit-product-card');\n"
          product_section_end = "  expect(\n    await categories.nth(0).evaluate((node) => getComputedStyle(node).animationName),\n"
          product_section = '''  let reorderCards = page.locator('.menu-edit-product-card');
            await expect(reorderCards).toHaveCount(9);
            await expect(reorderCards.nth(0)).toContainText('Single Smashed Patty');
            await expect(reorderCards.nth(1)).toContainText('Double Smashed Patty');
            const sourceProductIndex = 0;
            const targetProductIndex = 1;
            const productNamesBefore = await reorderCards.evaluateAll((nodes) =>
              nodes.map((node) =>
                (node.getAttribute('aria-label') ?? '').replace(/, position \\d+ of \\d+$/, ''),
              ),
            );
            const productBoxes = await reorderCards.evaluateAll((nodes) =>
              nodes.map((node) => {
                const rect = node.getBoundingClientRect();
                return { x: rect.x, y: rect.y, width: rect.width, height: rect.height };
              }),
            );
            const sourceProductName = productNamesBefore[sourceProductIndex]!;
            const targetProductName = productNamesBefore[targetProductIndex]!;
            const sameRow = Math.abs(productBoxes[0]!.y - productBoxes[1]!.y) <= 2;
            const productMoveKey: 'ArrowRight' | 'ArrowDown' = sameRow ? 'ArrowRight' : 'ArrowDown';

            await reorderCards.nth(sourceProductIndex).focus();
            await page.keyboard.press('Space');
            await expect(reorderCards.nth(sourceProductIndex)).toHaveClass(/menu-edit-product-card-grabbed/);
            await waitForDndKeyboardSensor(page);
            await page.keyboard.press(productMoveKey);
            await expect(reorderCards.nth(sourceProductIndex)).toContainText(targetProductName);
            await expect(reorderCards.nth(targetProductIndex)).toContainText(sourceProductName);
            await page.keyboard.press('Escape');
            reorderCards = page.locator('.menu-edit-product-card');
            await expect(reorderCards.nth(sourceProductIndex)).toContainText(sourceProductName);
            await expect(reorderCards.nth(targetProductIndex)).toContainText(targetProductName);

            await reorderCards.nth(sourceProductIndex).focus();
            await page.keyboard.press('Space');
            await expect(reorderCards.nth(sourceProductIndex)).toHaveClass(/menu-edit-product-card-grabbed/);
            await waitForDndKeyboardSensor(page);
            await page.keyboard.press(productMoveKey);
            await expect(reorderCards.nth(sourceProductIndex)).toContainText(targetProductName);
            await expect(reorderCards.nth(targetProductIndex)).toContainText(sourceProductName);
            await page.keyboard.press('Space');
            await expect(reorderCards.nth(sourceProductIndex)).toContainText(targetProductName);
            await expect(reorderCards.nth(targetProductIndex)).toContainText(sourceProductName);

          '''
          replace_between(operations, product_section_start, product_section_end, product_section)

          reverse_start = "  await page.getByRole('button', { name: 'Edit menu' }).click();\n  reorderCards = page.locator('.menu-edit-product-card');\n"
          reverse_end = "  await page.getByRole('button', { name: 'Cancel', exact: true }).click();\n"
          reverse_block = '''  await page.getByRole('button', { name: 'Edit menu' }).click();
            reorderCards = page.locator('.menu-edit-product-card');
            await reorderCards.nth(sourceProductIndex).focus();
            await page.keyboard.press('Space');
            await expect(reorderCards.nth(sourceProductIndex)).toHaveClass(/menu-edit-product-card-grabbed/);
            await waitForDndKeyboardSensor(page);
            await page.keyboard.press(productMoveKey);
            await expect(reorderCards.nth(sourceProductIndex)).toContainText(sourceProductName);
            await expect(reorderCards.nth(targetProductIndex)).toContainText(targetProductName);
            await page.keyboard.press('Space');
            await expect(reorderCards.nth(sourceProductIndex)).toContainText(sourceProductName);
            await expect(reorderCards.nth(targetProductIndex)).toContainText(targetProductName);
          '''
          replace_between(operations, reverse_start, reverse_end, reverse_block)

          Path('.github/workflows/menu-edit-2d-red.yml').unlink()
          PY
          python3 /tmp/apply_2d_reorder.py
      - name: Format affected files
        run: >-
          npx prettier --write
          apps/operations/src/app/OrdersWorkspace.tsx
          apps/operations/src/app/MenuEditProductCard.tsx
          apps/operations/src/styles/menu-edit-stability.css
          e2e/menu-layout-editor.e2e.ts
          e2e/operations.e2e.ts
      - name: Diff check
        run: git diff --check
      - name: Lint focused files
        run: >-
          npx eslint
          apps/operations/src/app/OrdersWorkspace.tsx
          apps/operations/src/app/MenuEditProductCard.tsx
          e2e/menu-layout-editor.e2e.ts
          e2e/operations.e2e.ts
          --max-warnings 0
      - name: Typecheck
        run: |
          npm run typecheck -w @tux/operations
          npm run typecheck:e2e
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Focused Menu Edit rendered acceptance
        run: >-
          npx playwright test e2e/menu-layout-editor.e2e.ts
          --project=desktop-browser-fallback
          --project=mobile-tablet-browser-fallback
          --project=mobile-browser-fallback
      - name: Focused unified persistence acceptance
        run: >-
          npx playwright test e2e/operations.e2e.ts
          --project=desktop-browser-fallback
          --project=mobile-tablet-browser-fallback
          --project=mobile-browser-fallback
          --grep='unified menu edit persists one combined worker layout with keyboard and rollback'
      - name: Real touch acceptance
        run: >-
          npx playwright test e2e/menu-layout-editor.touch.e2e.ts
          --project=touch-mobile-browser-fallback
      - name: Commit verified source and remove temporary workflow
        run: |
          git rm -f .github/workflows/menu-edit-2d-green.yml
          git add \
            apps/operations/src/app/OrdersWorkspace.tsx \
            apps/operations/src/app/MenuEditProductCard.tsx \
            apps/operations/src/styles/menu-edit-stability.css \
            e2e/menu-layout-editor.e2e.ts \
            e2e/operations.e2e.ts \
            .github/workflows/menu-edit-2d-red.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add Apple-style 2D live menu reorder'
          git push origin HEAD:feat/menu-edit-2d-live-reorder
