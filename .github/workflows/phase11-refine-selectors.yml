name: Phase 11 Refine Selectors

on:
  pull_request:
    branches:
      - feat/ops-09-sync

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test/ops-11-rendered-qa
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Refine only ambiguous Playwright locators
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/phase11-rendered-qa.yml')
          text = path.read_text()

          old_validation = """            await expect(page.getByText('Enter a valid Egyptian mobile number.', { exact: true })).toBeVisible();
            await expect(page.getByText('Customer Name is required.', { exact: true })).toBeVisible();
            await expect(page.getByText('Delivery Zone is required.', { exact: true })).toBeVisible();
            await expect(page.getByText('Full address is required.', { exact: true })).toBeVisible();
"""
          new_validation = """            const currentOrder = page.getByLabel('Current order');
            await expect(currentOrder.getByText('Enter a valid Egyptian mobile number.', { exact: true }).first()).toBeVisible();
            await expect(currentOrder.getByText('Customer Name is required.', { exact: true }).first()).toBeVisible();
            await expect(currentOrder.getByText('Delivery Zone is required.', { exact: true }).first()).toBeVisible();
            await expect(currentOrder.getByText('Full address is required.', { exact: true }).first()).toBeVisible();
"""
          if old_validation not in text:
              raise SystemExit('Delivery validation locator block not found')
          text = text.replace(old_validation, new_validation, 1)

          old_mark_done = """            await page.getByRole('button', { name: 'Mark Done' }).click();
            await expect(page.getByText('Order marked Done.', { exact: true })).toBeVisible();
"""
          new_mark_done = """            await orderDialog.getByRole('button', { name: 'Mark Done' }).click();
            await expect(page.getByText('Order marked Done.', { exact: true })).toBeVisible();
"""
          if old_mark_done not in text:
              raise SystemExit('Mark Done locator block not found')
          path.write_text(text.replace(old_mark_done, new_mark_done, 1))
          PY
          rm .github/workflows/phase11-refine-selectors.yml
      - name: Commit selector-only refinement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/phase11-rendered-qa.yml .github/workflows/phase11-refine-selectors.yml
          git commit -m "qa: scope Phase 11 rendered selectors"
          git push origin HEAD:test/ops-11-rendered-qa
