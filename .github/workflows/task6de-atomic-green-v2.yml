name: Task 6D-E Atomic GREEN V2

on:
  push:
    branches:
      - feat/ops-whatsapp-task6de-atomic
    paths:
      - .github/workflows/task6de-atomic-green-v2.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Recreate atomic candidate from verified source recipe
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/task6de-atomic-green.yml').read_text().splitlines()
          names = [
              'Materialize accepted RED contract and tests',
              'Implement WhatsApp IPC runtime',
              'Implement defensive WhatsApp preload result parser',
              'Patch Electron main composition and preload facade',
          ]

          def step_script(name: str) -> str:
              marker = f'      - name: {name}'
              start = source.index(marker)
              run_line = start + 1
              while run_line < len(source) and source[run_line].strip() != 'run: |':
                  run_line += 1
              if run_line >= len(source):
                  raise SystemExit(f'run block not found for {name}')
              lines = []
              i = run_line + 1
              while i < len(source):
                  line = source[i]
                  if line.startswith('      - '):
                      break
                  if line.startswith('          '):
                      lines.append(line[10:])
                  elif line.strip() == '':
                      lines.append('')
                  else:
                      raise SystemExit(f'unexpected indentation in {name}: {line!r}')
                  i += 1
              return '\n'.join(lines)

          for name in names:
              subprocess.run(['bash', '-c', 'set -euo pipefail\n' + step_script(name)], check=True)

          test = Path('apps/operations-desktop/src/preload/whatsappResult.test.ts')
          text = test.read_text()
          old = "    outboundIntentKey: null,\n    direction: 'OUTBOUND',"
          new = "    outboundIntentKey: 'intent-1',\n    direction: 'OUTBOUND',"
          if text.count(old) != 1:
              raise SystemExit(f'expected one invalid outbound fixture, found {text.count(old)}')
          test.write_text(text.replace(old, new))
          PY

      - name: Format atomic Task 6D/E files
        run: |
          npx prettier --write \
            packages/platform-contracts/index.d.ts \
            apps/operations-desktop/src/main/whatsappIpc.ts \
            apps/operations-desktop/src/main/whatsappIpc.test.ts \
            apps/operations-desktop/src/main/index.ts \
            apps/operations-desktop/src/preload/whatsappResult.ts \
            apps/operations-desktop/src/preload/whatsappResult.test.ts \
            apps/operations-desktop/src/preload/index.ts

      - name: Atomic Task 6D/E focused GREEN
        run: |
          npm test -- \
            apps/operations-desktop/src/main/whatsappIpc.test.ts \
            apps/operations-desktop/src/preload/whatsappResult.test.ts \
            apps/operations-desktop/src/main/security.test.ts \
            apps/operations-desktop/src/preload/sessionResult.test.ts

      - name: Desktop typecheck GREEN
        run: npm run typecheck -w @tux/operations-desktop

      - name: Immutability and secret fencing
        run: |
          git diff --exit-code HEAD -- \
            apps/operations-desktop/package.json \
            packages/persistence/src/sqlite/migrations.ts \
            packages/persistence/src/browser/indexedDbMigrations.ts \
            supabase/migrations
          if git grep -n "accessToken\|refreshToken\|SUPABASE_SERVICE_ROLE_KEY\|TUX_SUPABASE_SERVICE_ROLE_KEY\|TUX_WHATSAPP_ACCESS_TOKEN\|TUX_WHATSAPP_APP_SECRET\|TUX_WHATSAPP_WEBHOOK_VERIFY_TOKEN\|providerPhoneNumberId" -- \
            apps/operations-desktop/src/preload/index.ts \
            apps/operations-desktop/src/preload/whatsappResult.ts \
            apps/operations-desktop/src/main/whatsappIpc.ts; then
            echo 'Forbidden WhatsApp secret/authority token reference found in IPC/preload.' >&2
            exit 1
          fi
          if git grep -n "sendMedia" -- \
            packages/platform-contracts/index.d.ts \
            apps/operations-desktop/src/main/whatsappIpc.ts \
            apps/operations-desktop/src/preload/index.ts; then
            echo 'sendMedia must remain absent.' >&2
            exit 1
          fi

      - name: Commit verified atomic source only
        run: |
          git config user.name "ahmedmohameda7222-ship-it"
          git config user.email "ahmed.mohameda7222@gmail.com"
          git add \
            packages/platform-contracts/index.d.ts \
            apps/operations-desktop/src/main/whatsappIpc.ts \
            apps/operations-desktop/src/main/whatsappIpc.test.ts \
            apps/operations-desktop/src/main/index.ts \
            apps/operations-desktop/src/preload/whatsappResult.ts \
            apps/operations-desktop/src/preload/whatsappResult.test.ts \
            apps/operations-desktop/src/preload/index.ts
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git commit -m "feat: bridge WhatsApp through Electron IPC"
          git push origin HEAD:feat/ops-whatsapp-task6de-atomic
