name: Temporary E2E emphasis patch

on:
  push:
    branches:
      - ui/bold-order-payment-plus-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/bold-order-payment-plus-parity
          fetch-depth: 0
      - name: Apply exact E2E contract update
        shell: python
        run: |
          from pathlib import Path

          path = Path('e2e/operations.e2e.ts')
          source = path.read_text()

          old = """  for (const name of ['Take Away', 'Dine In', 'Delivery', 'Cash', 'Instapay']) {
              const control = cart.getByRole('button', { name, exact: true });
              await expect(control).toBeVisible();
              expect(await control.evaluate((node) => getComputedStyle(node).fontWeight)).toBe('600');
            }

            const line = cart.locator('.cart-line').filter({ hasText: 'Single Smashed Patty' }).first();
          """
          new = """  for (const name of ['Take Away', 'Dine In', 'Delivery', 'Cash', 'Instapay']) {
              const control = cart.getByRole('button', { name, exact: true });
              await expect(control).toBeVisible();
              expect(await control.evaluate((node) => getComputedStyle(node).fontWeight)).toBe('700');
            }

            const splitPayment = cart.getByRole('button', { name: 'Split payment', exact: true });
            await expect(splitPayment).toBeVisible();
            expect(await splitPayment.evaluate((node) => getComputedStyle(node).fontWeight)).toBe('700');

            const line = cart.locator('.cart-line').filter({ hasText: 'Single Smashed Patty' }).first();
          """
          if source.count(old) != 1:
              raise SystemExit(f'operational emphasis target count: {source.count(old)}')
          source = source.replace(old, new)

          old = """  expect(await productAdd.evaluate((node) => getComputedStyle(node).color)).not.toBe(
              await productRemove.evaluate((node) => getComputedStyle(node).color),
            );

            await openCartIfMobile(page, testInfo);
          """
          new = """  expect(await productAdd.evaluate((node) => getComputedStyle(node).color)).not.toBe(
              await productRemove.evaluate((node) => getComputedStyle(node).color),
            );
            const productAddStyle = await productAdd.evaluate((node) => getComputedStyle(node));
            expect(productAddStyle.borderLeftWidth).toBe('1px');
            expect(productAddStyle.borderLeftStyle).toBe('solid');

            await openCartIfMobile(page, testInfo);
          """
          if source.count(old) != 1:
              raise SystemExit(f'product increment target count: {source.count(old)}')
          source = source.replace(old, new)
          path.write_text(source)
      - name: Commit exact test update
        run: |
          git diff --check
          git diff -- e2e/operations.e2e.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add e2e/operations.e2e.ts
          git commit -m "test: update rendered operational emphasis contract"
          git push origin HEAD:ui/bold-order-payment-plus-parity
