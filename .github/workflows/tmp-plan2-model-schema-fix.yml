name: Temp Plan 2 Model Schema Fix

on:
  push:
    branches:
      - tmp/admin-plan2-final-review-2-fixes

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/admin-plan2-final-review-2-fixes
      - name: Add rollout-compatible immutable fields
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('packages/domain/src/models.ts')
          text = p.read_text()

          text, count = re.subn(
              r"(\/\*\* Present on new payments; omitted by legacy persisted snapshots\. \*\/\s+readonly reference\?: string \| null;)(\s+\};)",
              r"\1\n  /** Present on new payments; omitted by legacy persisted snapshots. */\n  readonly manuallyConfirmed?: boolean;\2",
              text,
          )
          if count != 2:
              raise SystemExit(f'payment evidence matcher expected 2, found {count}')

          text, count = re.subn(
              r"(readonly behavior: Exclude<OrderTypeBehavior, 'DELIVERY'>;)(\s+readonly delivery: null;)",
              r"\1\n      /** Present for new non-delivery orders when customer phone is required/captured. */\n      readonly customerPhone?: string;\2",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'customer phone matcher expected 1, found {count}')

          pattern = r"(export interface OrderReturnSnapshot \{\s+readonly at: Instant;\s+readonly workerId: WorkerId;\s+readonly workerName: string;\s+readonly reason: string;)(\s+\})"
          text, count = re.subn(
              pattern,
              r"\1\n  /** Present for configured future mutations; absent on legacy returns. */\n  readonly reasonCode?: OrderReasonCodeSnapshot;\n  /** Optional operator context; never the reason authority. */\n  readonly note?: string;\2",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'return evidence matcher expected 1, found {count}')

          p.write_text(text)
          PY
      - name: Commit model schema
        run: |
          git rm .github/workflows/tmp-plan2-model-schema-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/domain/src/models.ts
          git commit -m "fix(plan2): persist rollout order evidence types"
          git push origin HEAD:tmp/admin-plan2-final-review-2-fixes
