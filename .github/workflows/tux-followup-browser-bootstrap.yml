name: TUX Follow-up Browser Bootstrap

on:
  push:
    branches:
      - ui/tux-ops-followup-refinement

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: tar -czf /tmp/ms-playwright.tgz -C "$HOME/.cache" ms-playwright
      - uses: actions/upload-artifact@v4
        with:
          name: tux-followup-playwright-browser
          path: /tmp/ms-playwright.tgz
          if-no-files-found: error
          retention-days: 1
