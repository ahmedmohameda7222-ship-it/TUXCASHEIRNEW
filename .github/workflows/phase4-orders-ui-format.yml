name: Phase 4 Orders UI formatter

on:
  push:
    branches:
      - feat/ops-04-orders

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ops-04-orders
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Format Orders UI files
        run: >-
          npx prettier --write
          apps/operations/src/app/App.tsx
          apps/operations/src/app/OrdersCart.tsx
          apps/operations/src/app/ordersView.ts
          apps/operations/src/app/OrdersWorkspace.tsx
          apps/operations/src/app/ProductCustomizer.tsx
          apps/operations/src/styles/orders.css
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/operations/src/app/App.tsx apps/operations/src/app/OrdersCart.tsx apps/operations/src/app/ordersView.ts apps/operations/src/app/OrdersWorkspace.tsx apps/operations/src/app/ProductCustomizer.tsx apps/operations/src/styles/orders.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format Phase 4 Orders UI"
          git push origin HEAD:feat/ops-04-orders
