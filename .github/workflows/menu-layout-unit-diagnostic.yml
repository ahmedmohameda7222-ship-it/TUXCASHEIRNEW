name: Menu Layout Unit Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Capture unit and integration output
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee unit-test-output.txt
      - name: Upload unit diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-layout-unit-diagnostic
          path: unit-test-output.txt
          if-no-files-found: error
          retention-days: 1
