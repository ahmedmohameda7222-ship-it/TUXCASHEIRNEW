name: tmp Plan 2 final review 3 patch

on:
  push:
    branches:
      - tmp/admin-plan2-final-review-3-fixes
    paths:
      - .github/workflows/tmp-plan2-final-review-3-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(plan2): apply final desktop IPC patch'
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/admin-plan2-final-review-3-fixes
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply exact desktop policy IPC fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new))

          parser = 'packages/domain/src/orderDraftParser.ts'
          replace_exact(parser, """    const manuallyConfirmed = optionalBoolean(
                payment['manuallyConfirmed'],
                'OrderDraft.payment.manuallyConfirmed',
              );""", """    const manualConfirmed = optionalBoolean(
                payment['manualConfirmed'],
                'OrderDraft.payment.manualConfirmed',
              );""")
          replace_exact(parser, """      ...(manuallyConfirmed === undefined ? {} : { manuallyConfirmed }),""", """      ...(manualConfirmed === undefined ? {} : { manualConfirmed }),""")
          replace_exact(parser, """    const manuallyConfirmedA = optionalBoolean(
                payment['manuallyConfirmedA'],
                'OrderDraft.payment.manuallyConfirmedA',
              );
              const manuallyConfirmedB = optionalBoolean(
                payment['manuallyConfirmedB'],
                'OrderDraft.payment.manuallyConfirmedB',
              );""", """    const manualConfirmedA = optionalBoolean(
                payment['manualConfirmedA'],
                'OrderDraft.payment.manualConfirmedA',
              );
              const manualConfirmedB = optionalBoolean(
                payment['manualConfirmedB'],
                'OrderDraft.payment.manualConfirmedB',
              );""")
          replace_exact(parser, """      ...(manuallyConfirmedA === undefined ? {} : { manuallyConfirmedA }),
              ...(manuallyConfirmedB === undefined ? {} : { manuallyConfirmedB }),""", """      ...(manualConfirmedA === undefined ? {} : { manualConfirmedA }),
              ...(manualConfirmedB === undefined ? {} : { manualConfirmedB }),""")

          ipc = 'apps/operations-desktop/src/main/onlineOrderInboxIpc.ts'
          replace_exact(ipc, """function nullableMoney(value: unknown, label: string): MoneyMinor | null {
            if (value === null) return null;
            if (typeof value !== 'number' || !Number.isSafeInteger(value) || value < 0) {
              throw new TypeError(`${label} must be a non-negative integer minor-unit amount or null.`);
            }
            return moneyMinor(value);
          }
          """, """function nullableMoney(value: unknown, label: string): MoneyMinor | null {
            if (value === null) return null;
            if (typeof value !== 'number' || !Number.isSafeInteger(value) || value < 0) {
              throw new TypeError(`${label} must be a non-negative integer minor-unit amount or null.`);
            }
            return moneyMinor(value);
          }

          function requiredAndOptionalKeys(
            value: Record<string, unknown>,
            required: readonly string[],
            optional: readonly string[],
            label: string,
          ): void {
            const allowed = new Set([...required, ...optional]);
            const missingRequired = required.some(
              (key) => !Object.prototype.hasOwnProperty.call(value, key),
            );
            const hasUnexpected = Object.keys(value).some((key) => !allowed.has(key));
            if (missingRequired || hasUnexpected) {
              throw new TypeError(`${label} IPC payload contains unexpected fields.`);
            }
          }

          function optionalNullableString(value: unknown, label: string): string | null | undefined {
            if (value === undefined || value === null) return value;
            if (typeof value !== 'string') throw new TypeError(`${label} must be a string or null.`);
            return value;
          }

          function optionalBoolean(value: unknown, label: string): boolean | undefined {
            if (value === undefined) return undefined;
            if (typeof value !== 'boolean') throw new TypeError(`${label} must be boolean.`);
            return value;
          }
          """)
          replace_exact(ipc, """  if (mode === 'SINGLE') {
              exactKeys(
                payment,
                ['mode', 'methodId', 'cashReceivedMinor'],
                'Online-order payment confirmation',
              );
              return {
                mode: 'SINGLE',
                methodId: parseEntityId<PaymentMethodId>(
                  uuid(payment['methodId'], 'Online-order payment method ID'),
                ),
                cashReceivedMinor: nullableMoney(payment['cashReceivedMinor'], 'Online-order cash received'),
              };
            }""", """  if (mode === 'SINGLE') {
              requiredAndOptionalKeys(
                payment,
                ['mode', 'methodId', 'cashReceivedMinor'],
                ['reference', 'manualConfirmed'],
                'Online-order payment confirmation',
              );
              const reference = optionalNullableString(
                payment['reference'],
                'Online-order payment reference',
              );
              const manualConfirmed = optionalBoolean(
                payment['manualConfirmed'],
                'Online-order manual payment confirmation',
              );
              return {
                mode: 'SINGLE',
                methodId: parseEntityId<PaymentMethodId>(
                  uuid(payment['methodId'], 'Online-order payment method ID'),
                ),
                cashReceivedMinor: nullableMoney(payment['cashReceivedMinor'], 'Online-order cash received'),
                ...(reference === undefined ? {} : { reference }),
                ...(manualConfirmed === undefined ? {} : { manualConfirmed }),
              };
            }""")
          replace_exact(ipc, """  if (mode === 'SPLIT') {
              exactKeys(
                payment,
                ['mode', 'methodAId', 'amountAMinor', 'methodBId'],
                'Online-order payment confirmation',
              );
              const amountAMinor = nullableMoney(payment['amountAMinor'], 'Online-order split amount A');
              if (amountAMinor === null) {
                throw new TypeError('Online-order split amount A cannot be null.');
              }
              return {
                mode: 'SPLIT',
                methodAId: parseEntityId<PaymentMethodId>(
                  uuid(payment['methodAId'], 'Online-order payment method A ID'),
                ),
                amountAMinor,
                methodBId: parseEntityId<PaymentMethodId>(
                  uuid(payment['methodBId'], 'Online-order payment method B ID'),
                ),
              };
            }""", """  if (mode === 'SPLIT') {
              requiredAndOptionalKeys(
                payment,
                ['mode', 'methodAId', 'amountAMinor', 'methodBId'],
                ['referenceA', 'referenceB', 'manualConfirmedA', 'manualConfirmedB'],
                'Online-order payment confirmation',
              );
              const amountAMinor = nullableMoney(payment['amountAMinor'], 'Online-order split amount A');
              if (amountAMinor === null) {
                throw new TypeError('Online-order split amount A cannot be null.');
              }
              const referenceA = optionalNullableString(
                payment['referenceA'],
                'Online-order payment reference A',
              );
              const referenceB = optionalNullableString(
                payment['referenceB'],
                'Online-order payment reference B',
              );
              const manualConfirmedA = optionalBoolean(
                payment['manualConfirmedA'],
                'Online-order manual payment confirmation A',
              );
              const manualConfirmedB = optionalBoolean(
                payment['manualConfirmedB'],
                'Online-order manual payment confirmation B',
              );
              return {
                mode: 'SPLIT',
                methodAId: parseEntityId<PaymentMethodId>(
                  uuid(payment['methodAId'], 'Online-order payment method A ID'),
                ),
                amountAMinor,
                methodBId: parseEntityId<PaymentMethodId>(
                  uuid(payment['methodBId'], 'Online-order payment method B ID'),
                ),
                ...(referenceA === undefined ? {} : { referenceA }),
                ...(referenceB === undefined ? {} : { referenceB }),
                ...(manualConfirmedA === undefined ? {} : { manualConfirmedA }),
                ...(manualConfirmedB === undefined ? {} : { manualConfirmedB }),
              };
            }""")

          index = 'apps/operations-desktop/src/main/index.ts'
          replace_exact(index, """  ipcMain.handle(IPC_BOARD_CANCEL, async (event, input: unknown) => {
              assertTrustedIpcSender(event, window.webContents.id);
              assertObjectPayload(input, 'Cancel order');
              if (
                typeof input['orderId'] !== 'string' ||
                typeof input['foodPrepared'] !== 'boolean' ||
                typeof input['reason'] !== 'string'
              ) {
                throw new TypeError('Cancel order IPC payload is invalid.');
              }
              return currentOrdersBoardService().cancelOrder({
                orderId: parseEntityId<OrderId>(input['orderId']),
                foodPrepared: input['foodPrepared'],
                reason: input['reason'],
              });
            });""", """  ipcMain.handle(IPC_BOARD_CANCEL, async (event, input: unknown) => {
              assertTrustedIpcSender(event, window.webContents.id);
              assertObjectPayload(input, 'Cancel order');
              if (
                typeof input['orderId'] !== 'string' ||
                typeof input['foodPrepared'] !== 'boolean' ||
                typeof input['reason'] !== 'string' ||
                (input['reasonCodeId'] !== undefined && typeof input['reasonCodeId'] !== 'string') ||
                (input['note'] !== undefined && typeof input['note'] !== 'string')
              ) {
                throw new TypeError('Cancel order IPC payload is invalid.');
              }
              return currentOrdersBoardService().cancelOrder({
                orderId: parseEntityId<OrderId>(input['orderId']),
                foodPrepared: input['foodPrepared'],
                reason: input['reason'],
                ...(typeof input['reasonCodeId'] === 'string'
                  ? { reasonCodeId: input['reasonCodeId'] }
                  : {}),
                ...(typeof input['note'] === 'string' ? { note: input['note'] } : {}),
              });
            });""")
          replace_exact(index, """  ipcMain.handle(IPC_BOARD_RETURN, async (event, input: unknown) => {
              assertTrustedIpcSender(event, window.webContents.id);
              assertObjectPayload(input, 'Return Delivery');
              if (typeof input['orderId'] !== 'string' || typeof input['reason'] !== 'string') {
                throw new TypeError('Return Delivery IPC payload is invalid.');
              }
              return currentOrdersBoardService().returnDelivery({
                orderId: parseEntityId<OrderId>(input['orderId']),
                reason: input['reason'],
              });
            });""", """  ipcMain.handle(IPC_BOARD_RETURN, async (event, input: unknown) => {
              assertTrustedIpcSender(event, window.webContents.id);
              assertObjectPayload(input, 'Return Delivery');
              if (
                typeof input['orderId'] !== 'string' ||
                typeof input['reason'] !== 'string' ||
                (input['reasonCodeId'] !== undefined && typeof input['reasonCodeId'] !== 'string') ||
                (input['note'] !== undefined && typeof input['note'] !== 'string')
              ) {
                throw new TypeError('Return Delivery IPC payload is invalid.');
              }
              return currentOrdersBoardService().returnDelivery({
                orderId: parseEntityId<OrderId>(input['orderId']),
                reason: input['reason'],
                ...(typeof input['reasonCodeId'] === 'string'
                  ? { reasonCodeId: input['reasonCodeId'] }
                  : {}),
                ...(typeof input['note'] === 'string' ? { note: input['note'] } : {}),
              });
            });""")

          end_day = 'apps/operations-desktop/src/main/endDayIpc.ts'
          replace_exact(end_day, """    if (
                typeof entry['paymentMethodId'] !== 'string' ||
                (entry['reason'] !== null && typeof entry['reason'] !== 'string')
              ) {
                throw new TypeError(`End Day variance reason ${index + 1} is invalid.`);
              }
              return {
                paymentMethodId: parseEntityId<PaymentMethodId>(entry['paymentMethodId']),
                reason: entry['reason'] as string | null,
              };""", """    if (
                typeof entry['paymentMethodId'] !== 'string' ||
                (entry['reason'] !== null && typeof entry['reason'] !== 'string') ||
                (entry['reasonCodeId'] !== undefined && typeof entry['reasonCodeId'] !== 'string')
              ) {
                throw new TypeError(`End Day variance reason ${index + 1} is invalid.`);
              }
              return {
                paymentMethodId: parseEntityId<PaymentMethodId>(entry['paymentMethodId']),
                reason: entry['reason'] as string | null,
                ...(typeof entry['reasonCodeId'] === 'string'
                  ? { reasonCodeId: entry['reasonCodeId'] }
                  : {}),
              };""")
      - name: Format changed sources
        run: npx prettier --write packages/domain/src/orderDraftParser.ts apps/operations-desktop/src/main/onlineOrderInboxIpc.ts apps/operations-desktop/src/main/index.ts apps/operations-desktop/src/main/endDayIpc.ts
      - name: Focused GREEN tests
        run: npx vitest run packages/domain/src/orderDraftParser.manualConfirmation.test.ts apps/operations-desktop/src/main/onlineOrderInboxIpc.paymentPolicy.test.ts apps/operations-desktop/src/main/policyReasonIpc.source.test.ts packages/domain/src/paymentManualConfirmation.test.ts packages/application/src/endDay.reasonCodes.test.ts packages/application/src/ordersBoard.reasonCodes.sqlite.test.ts
      - name: Desktop typecheck
        run: npm run typecheck --workspace @tux/operations-desktop
      - name: Commit verified patch and remove temporary workflow
        run: |
          git rm .github/workflows/tmp-plan2-final-review-3-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/domain/src/orderDraftParser.ts apps/operations-desktop/src/main/onlineOrderInboxIpc.ts apps/operations-desktop/src/main/index.ts apps/operations-desktop/src/main/endDayIpc.ts
          git diff --cached --check
          git commit -m "fix(plan2): preserve desktop policy IPC fields"
          git push origin HEAD:tmp/admin-plan2-final-review-3-fixes
