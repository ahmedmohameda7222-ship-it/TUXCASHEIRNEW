name: Plan 2 Fresh Review Source Fix

on:
  push:
    branches:
      - feat/admin-02-catalog-settings
    paths:
      - '.github/workflows/admin-plan2-fresh-review-source-fix.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Extract and apply verified non-workflow patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/admin-plan2-fresh-review-fix.yml').read_text()
          start_marker = "          node <<'NODE'\n"
          end_marker = "\n          NODE"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = dedent(workflow[start:end])
          permanent_marker = "\nconst permanentWorkflow = '.github/workflows/admin-catalog-settings-tdd.yml';"
          if script.count(permanent_marker) != 1:
              raise SystemExit('expected exactly one permanent workflow patch marker')
          script = script.split(permanent_marker, 1)[0] + '\n'
          Path('/tmp/plan2-source-fix.js').write_text(script)
          PY
          node /tmp/plan2-source-fix.js
      - name: Format changed source files
        run: >-
          npx prettier --write
          packages/catalog-contracts/src/index.ts
          supabase/functions/order-intake/order-intake.ts
          apps/menu/src/components/cart/CartDrawer.tsx
          apps/operations/src/app/OrdersCart.tsx
          apps/admin/src/settings/useSettings.test.ts
          supabase/functions/catalog-public/published-ordering.test.ts
          apps/menu/src/lib/published-checkout-policy.test.ts
      - name: Focused GREEN tests
        run: >-
          npx vitest run
          packages/domain/src/checkoutPolicyStacking.test.ts
          supabase/functions/order-intake/order-intakePublishedSettingsAuthority.test.ts
          supabase/functions/catalog-public/published-ordering.test.ts
          apps/menu/src/lib/published-checkout-policy.test.ts
          apps/menu/src/components/cart/CartDrawerPublishedCheckout.source.test.ts
          apps/operations/src/app/deliveryFeePolicyUi.test.ts
          apps/admin/src/settings/SettingOverrideEditor.test.tsx
          apps/admin/src/settings/useSettings.test.ts
      - name: Public projection invariant
        run: node scripts/test-catalog-public-ordering-projection.mjs
      - name: Focused typechecks
        run: |
          npm run typecheck -w @tux/domain
          npm run typecheck -w @tux/admin
          npm run typecheck -w @tux/operations
      - name: Commit verified source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/catalog-contracts/src/index.ts \
            supabase/functions/order-intake/order-intake.ts \
            apps/menu/src/components/cart/CartDrawer.tsx \
            apps/operations/src/app/OrdersCart.tsx \
            apps/admin/src/settings/useSettings.test.ts \
            supabase/functions/catalog-public/published-ordering.test.ts \
            apps/menu/src/lib/published-checkout-policy.test.ts
          git commit -m "fix(plan2): close fresh checkout review findings"
          git push origin HEAD:feat/admin-02-catalog-settings
