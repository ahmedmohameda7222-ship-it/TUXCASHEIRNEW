name: Admin Pre-Plan-7 Orders E2E Fix

on:
  push:
    branches:
      - feat/admin-pre-plan-7-ui-ux-hardening
    paths:
      - .github/workflows/admin-pre-plan7-orders-e2e-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/admin-pre-plan-7-ui-ux-hardening
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Align Orders E2E with master-detail selection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('e2e/admin-orders.spec.ts')
          text = path.read_text()

          old = """  await expect(page.getByRole('heading', { name: 'Orders' })).toBeVisible();\n  await expect(page.getByRole('button', { name: 'Cancel order' })).toBeVisible();"""
          new = """  await expect(page.getByRole('heading', { name: 'Orders' })).toBeVisible();\n  await page.getByRole('button', { name: /#101/ }).click();\n  await expect(page.getByRole('button', { name: 'Cancel order' })).toBeVisible();"""
          if text.count(old) != 1:
              raise SystemExit(f'expected first Orders snippet once, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = """  const fixture = await mockOrders(page);\n  await page.goto('/orders');\n\n  await page.getByRole('button', { name: 'Cancel order' }).click();"""
          new = """  const fixture = await mockOrders(page);\n  await page.goto('/orders');\n  await page.getByRole('button', { name: /#101/ }).click();\n\n  await page.getByRole('button', { name: 'Cancel order' }).click();"""
          if text.count(old) != 1:
              raise SystemExit(f'expected active cancellation snippet once, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = """  await mockOrders(page, { staleCancellation: true });\n  await page.goto('/orders');\n\n  await page.getByRole('button', { name: 'Cancel order' }).click();"""
          new = """  await mockOrders(page, { staleCancellation: true });\n  await page.goto('/orders');\n  await page.getByRole('button', { name: /#101/ }).click();\n\n  await page.getByRole('button', { name: 'Cancel order' }).click();"""
          if text.count(old) != 1:
              raise SystemExit(f'expected stale cancellation snippet once, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          npx prettier --write e2e/admin-orders.spec.ts
      - name: Remove one-shot workflow
        run: rm .github/workflows/admin-pre-plan7-orders-e2e-fix.yml
      - name: Commit E2E-only fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/admin-orders.spec.ts .github/workflows/admin-pre-plan7-orders-e2e-fix.yml
          git diff --cached --check
          git commit -m 'test(admin): select order before contextual actions'
          git push origin HEAD:feat/admin-pre-plan-7-ui-ux-hardening
