name: Admin Pre-Plan-7 Format Fix

on:
  push:
    branches: [feat/admin-pre-plan-7-ui-ux-hardening]
    paths:
      - '.github/workflows/admin-pre-plan7-format-fix.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/admin-pre-plan-7-ui-ux-hardening
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format hardening files
        run: >-
          npx prettier --write
          apps/admin/api/admin/audit.ts
          apps/admin/src/app/routes.tsx
          apps/admin/src/approvals/ApprovalsPage.tsx
          apps/admin/src/approvals/RePinDialog.tsx
          apps/admin/src/audit/AuditPage.tsx
          apps/admin/src/components/hardeningPrimitives.test.tsx
          apps/admin/src/components/navigation/AdminTabs.tsx
          apps/admin/src/components/shell/AdminShell.test.tsx
          apps/admin/src/customers/CustomerDetailPage.tsx
          apps/admin/src/customers/CustomerMergeDialog.tsx
          apps/admin/src/customers/CustomersPage.tsx
          apps/admin/src/inventory/InventoryPage.tsx
          apps/admin/src/orders/CancelOrderSheet.tsx
          apps/admin/src/orders/OrdersPage.tsx
          apps/admin/src/orders/RefundReturnPage.tsx
          apps/admin/src/purchasing/PurchasingPage.tsx
          apps/admin/src/purchasing/ReceivePurchasePage.tsx
          apps/admin/src/purchasing/SuppliersPage.tsx
          apps/admin/src/settings/SettingsPage.tsx
          apps/admin/src/staff/EmployeeDetailPage.tsx
          apps/admin/src/staff/StaffPage.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/admin/api/admin/audit.ts \
            apps/admin/src/app/routes.tsx \
            apps/admin/src/approvals/ApprovalsPage.tsx \
            apps/admin/src/approvals/RePinDialog.tsx \
            apps/admin/src/audit/AuditPage.tsx \
            apps/admin/src/components/hardeningPrimitives.test.tsx \
            apps/admin/src/components/navigation/AdminTabs.tsx \
            apps/admin/src/components/shell/AdminShell.test.tsx \
            apps/admin/src/customers/CustomerDetailPage.tsx \
            apps/admin/src/customers/CustomerMergeDialog.tsx \
            apps/admin/src/customers/CustomersPage.tsx \
            apps/admin/src/inventory/InventoryPage.tsx \
            apps/admin/src/orders/CancelOrderSheet.tsx \
            apps/admin/src/orders/OrdersPage.tsx \
            apps/admin/src/orders/RefundReturnPage.tsx \
            apps/admin/src/purchasing/PurchasingPage.tsx \
            apps/admin/src/purchasing/ReceivePurchasePage.tsx \
            apps/admin/src/purchasing/SuppliersPage.tsx \
            apps/admin/src/settings/SettingsPage.tsx \
            apps/admin/src/staff/EmployeeDetailPage.tsx \
            apps/admin/src/staff/StaffPage.tsx
          git commit -m "style(admin): format pre-Plan-7 hardening"
          git push origin HEAD:feat/admin-pre-plan-7-ui-ux-hardening
