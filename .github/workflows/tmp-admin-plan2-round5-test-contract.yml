name: Temporary Admin Plan 2 Round 5 Test Contract

on:
  push:
    branches:
      - tmp/admin-plan2-final-review-3-fixes
    paths:
      - '.github/workflows/tmp-admin-plan2-round5-test-contract.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/admin-plan2-final-review-3-fixes
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Replace obsolete emergency publish acceptance block
        run: python scripts/tmp-admin-plan2-round5-test-contract.py
      - name: Format updated acceptance script
        run: npx prettier --write scripts/test-admin-plan2-round4-hardening.mjs
      - name: Commit test-only contract update
        shell: bash
        run: |
          git add scripts/test-admin-plan2-round4-hardening.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No test patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(admin): verify isolated emergency settings publish'
          git push origin HEAD:tmp/admin-plan2-final-review-3-fixes
