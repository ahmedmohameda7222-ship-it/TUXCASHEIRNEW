          serviceDate: '2026-01-05',\n          serviceKind: 'ONLINE',\n          timezone: 'Africa/Cairo',\n          closed: true,\n          opensLocal: null,\n          closesLocal: null,\n        },\n      ],\n    });\n    expect(\n      isPublishedOnlineOrderingOpenAt(specialClosed, new Date('2026-01-05T10:30:00.000Z')),\n    ).toBe(false);\n  });\n\n"""
          settings_test.write_text(text.replace(anchor, hours_tests + anchor, 1))

