name: Task 4 RED

on:
  push:
    branches:
      - 'work/menu-online-orders-integration'
    paths:
      - '.github/workflows/task4-red.yml'
      - 'packages/application/src/onlineOrderAcceptance.test.ts'
      - 'packages/application/src/onlineOrderAcceptance.review.test.ts'
      - 'packages/application/src/onlineOrderAcceptance.sqlite.test.ts'
      - 'packages/application/src/onlineOrderAcceptance.ts'
      - 'scripts/test-online-order-acceptance-lease.mjs'
      - 'package.json'
      - 'supabase/migrations/**'

permissions:
  contents: write

jobs:
  targeted-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format Task 4 RED spec
        run: >-
          npx prettier --write
          packages/application/src/onlineOrderAcceptance.test.ts
          packages/application/src/onlineOrderAcceptance.review.test.ts
          packages/application/src/onlineOrderAcceptance.sqlite.test.ts
          scripts/test-online-order-acceptance-lease.mjs
          package.json
      - name: Commit formatter-only correction
        shell: bash
        run: |
          if ! git diff --quiet -- packages/application/src/onlineOrderAcceptance.test.ts packages/application/src/onlineOrderAcceptance.review.test.ts packages/application/src/onlineOrderAcceptance.sqlite.test.ts scripts/test-online-order-acceptance-lease.mjs package.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add packages/application/src/onlineOrderAcceptance.test.ts packages/application/src/onlineOrderAcceptance.review.test.ts packages/application/src/onlineOrderAcceptance.sqlite.test.ts scripts/test-online-order-acceptance-lease.mjs package.json
            git commit -m 'test(orders): format complete online-order acceptance RED'
            git push origin HEAD:work/menu-online-orders-integration
          fi
      - name: Targeted Task 4 RED
        run: >-
          npx vitest run
          packages/application/src/onlineOrderAcceptance.test.ts
          packages/application/src/onlineOrderAcceptance.review.test.ts
          packages/application/src/onlineOrderAcceptance.sqlite.test.ts

  lease-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply repository migration chain
        run: node scripts/test-migrations.mjs
      - name: Targeted lease-expiry RED
        run: node scripts/test-online-order-acceptance-lease.mjs
