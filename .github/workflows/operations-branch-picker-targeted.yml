name: Operations Branch Picker Targeted Acceptance

on:
  push:
    branches:
      - feat/operations-branch-picker-pin-login
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Locked dependencies
        run: npm ci
      - name: Domain contract build
        run: npm run build:domain
      - name: Targeted branch picker, BFF signing and authentication regression
        run: npx vitest run server/operationsShopDirectory.test.ts apps/operations/src/app/browserBranchPicker.test.ts server/workerPinBootstrap.multishop.test.ts server/workerPinBootstrap.test.ts apps/operations/src/app/browserWorkerAuthentication.test.ts apps/operations/src/app/browserShopScope.test.ts apps/operations/src/app/browserSessionScope.test.ts apps/operations/src/app/automaticSync.test.ts packages/sync/src/outboxSync.test.ts
      - name: Operations Vercel function budget
        run: node scripts/test-operations-vercel-hobby-budget.mjs
      - name: Operations / API / Admin type safety
        run: |
          npx tsc --noEmit -p packages/sync/tsconfig.json
          npx tsc --noEmit -p packages/persistence/tsconfig.json
          npm run typecheck -w @tux/operations
          npx tsc --noEmit -p tsconfig.api.json
          npm run typecheck -w @tux/admin
      - name: Targeted ESLint for changed source and browser tests
        run: |
          npx eslint packages/persistence/src/contracts.ts packages/persistence/src/browser/IndexedDbOperationsDatabase.ts packages/persistence/src/sqlite/SqliteOperationsDatabase.ts packages/sync/src/outboxSync.ts apps/operations/src/app/automaticSync.ts apps/operations/api/device.ts api/operations-shops.ts server/operationsShopDirectory.ts server/operationsShopDirectory.test.ts apps/operations/src/app/App.tsx apps/operations/src/app/BrowserBootstrapGate.tsx apps/operations/src/app/browserRemote.ts apps/operations/src/app/browserBranchPicker.test.ts apps/operations/src/app/browserShopScope.ts apps/operations/src/app/browserShopScope.test.ts apps/operations/src/app/browserSessionScope.ts apps/operations/src/app/browserSessionScope.test.ts apps/operations/src/app/sessionClient.ts apps/admin/src/operations/DevicesPage.tsx e2e/operations-branch-login.e2e.ts playwright.config.ts --max-warnings 0
      - name: Capture and enforce exact formatting
        run: |
          npx prettier --write packages/persistence/src/contracts.ts packages/persistence/src/browser/IndexedDbOperationsDatabase.ts packages/persistence/src/sqlite/SqliteOperationsDatabase.ts packages/sync/src/outboxSync.ts apps/operations/src/app/automaticSync.ts apps/operations/api/device.ts apps/operations/vercel.json api/operations-shops.ts server/operationsShopDirectory.ts server/operationsShopDirectory.test.ts apps/operations/src/app/BrowserBootstrapGate.tsx apps/operations/src/app/browserRemote.ts apps/operations/src/app/browserBranchPicker.test.ts apps/operations/src/app/browserShopScope.ts apps/operations/src/app/browserShopScope.test.ts apps/operations/src/app/browserSessionScope.ts apps/operations/src/app/browserSessionScope.test.ts apps/operations/src/app/sessionClient.ts apps/operations/src/app/App.tsx apps/operations/src/styles/global.css apps/admin/src/operations/DevicesPage.tsx apps/admin/src/operations/operations.css e2e/operations-branch-login.e2e.ts
          echo TUX_BRANCH_FORMAT_DIFF_BEGIN
          git --no-pager diff -- packages/persistence/src/contracts.ts packages/persistence/src/browser/IndexedDbOperationsDatabase.ts packages/persistence/src/sqlite/SqliteOperationsDatabase.ts packages/sync/src/outboxSync.ts apps/operations/src/app/automaticSync.ts apps/operations/api/device.ts apps/operations/vercel.json api/operations-shops.ts server/operationsShopDirectory.ts server/operationsShopDirectory.test.ts apps/operations/src/app/BrowserBootstrapGate.tsx apps/operations/src/app/browserRemote.ts apps/operations/src/app/browserBranchPicker.test.ts apps/operations/src/app/browserShopScope.ts apps/operations/src/app/browserShopScope.test.ts apps/operations/src/app/browserSessionScope.ts apps/operations/src/app/browserSessionScope.test.ts apps/operations/src/app/sessionClient.ts apps/operations/src/app/App.tsx apps/operations/src/styles/global.css apps/admin/src/operations/DevicesPage.tsx apps/admin/src/operations/operations.css e2e/operations-branch-login.e2e.ts
          echo TUX_BRANCH_FORMAT_DIFF_END
          git diff --exit-code
      - name: Install Operations browser test
        run: |
          npm run build -w @tux/operations -- --mode e2e-operations
          npx playwright install chromium
      - name: Chromium branch picker Desktop + Mobile
        run: TUX_OPERATIONS_BRANCH_E2E=1 npx playwright test e2e/operations-branch-login.e2e.ts --project=desktop-browser-fallback --project=mobile-browser-fallback
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge directory signature and shop isolation
        run: deno test --allow-env --allow-net --allow-run --allow-read supabase/functions/device-bootstrap/security.deno.ts
      - name: Verify standard Operations production build
        run: npm run build -w @tux/operations
