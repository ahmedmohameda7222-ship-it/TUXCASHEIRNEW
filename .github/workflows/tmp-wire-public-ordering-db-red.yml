name: Temporary Wire Public Ordering DB RED

on:
  push:
    branches:
      - feat/admin-02-catalog-settings
    paths:
      - .github/workflows/tmp-wire-public-ordering-db-red.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/admin-02-catalog-settings
          fetch-depth: 0
      - name: Wire permanent invariant and PostgreSQL behavior gates
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/admin-catalog-settings-tdd.yml')
          text = path.read_text()
          script = "scripts/test-catalog-public-ordering-projection.mjs"
          if script in text:
              raise SystemExit('public ordering DB gate already wired')

          path_marker = "      - 'scripts/test-admin-shop-settings-migration.mjs'\n"
          text = text.replace(
              path_marker,
              path_marker + "      - 'scripts/test-catalog-public-ordering-projection.mjs'\n",
              1,
          )

          invariant_marker = "      - name: Shop settings migration invariant\n        run: node scripts/test-admin-shop-settings-migration.mjs\n"
          text = text.replace(
              invariant_marker,
              invariant_marker
              + "      - name: Public catalog ordering projection invariant\n"
              + "        run: node scripts/test-catalog-public-ordering-projection.mjs\n",
              1,
          )

          postgres_marker = "      - name: Shop settings PostgreSQL behavior\n        run: node scripts/test-admin-shop-settings-migration.mjs\n"
          text = text.replace(
              postgres_marker,
              postgres_marker
              + "      - name: Public catalog ordering projection PostgreSQL behavior\n"
              + "        run: node scripts/test-catalog-public-ordering-projection.mjs\n",
              1,
          )

          if text.count(script) != 3:
              raise SystemExit(f'expected exactly 3 permanent references, got {text.count(script)}')
          path.write_text(text)
      - name: Verify YAML formatting
        run: npx --yes prettier@3.6.2 --check .github/workflows/admin-catalog-settings-tdd.yml
      - name: Commit permanent test wiring and self-delete
        run: |
          rm .github/workflows/tmp-wire-public-ordering-db-red.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/admin-catalog-settings-tdd.yml .github/workflows/tmp-wire-public-ordering-db-red.yml
          git commit -m "test(catalog): gate public ordering SQL projection"
          git push origin HEAD:feat/admin-02-catalog-settings
