name: Temp Fix OrdersBoard Matchers

on:
  push:
    branches:
      - tmp/admin-plan2-final-review-2-fixes

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/admin-plan2-final-review-2-fixes
      - name: Repair patch matchers
        run: python scripts/tmp_fix_ordersboard_patch_matchers.py
      - name: Commit repaired patcher
        run: |
          git rm scripts/tmp_fix_ordersboard_patch_matchers.py
          git rm .github/workflows/tmp-fix-ordersboard-matchers.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/tmp_plan2_green_patch.py
          git commit -m "chore(plan2): make orders board patch structural"
          git push origin HEAD:tmp/admin-plan2-final-review-2-fixes
