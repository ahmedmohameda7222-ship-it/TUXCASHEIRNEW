name: Phase 7 Clean Format

on:
  push:
    branches:
      - feat/ops-07-bulk-stock
    paths:
      - '.phase7-clean-format.trigger'

permissions:
  contents: write

jobs:
  clean-format:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ops-07-bulk-stock
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Remove stale Phase 7 helpers
        run: |
          rm -f .phase7-ci.trigger .phase7-finalize.trigger .phase7-repair.trigger .phase7-validation-passed .phase7-validation-failed.txt
          rm -f .github/workflows/phase7-finalize.yml .github/workflows/phase7-repair.yml
      - name: Format real Phase 7 tree
        run: |
          npm ci
          npm run format
      - name: Remove this one-shot helper
        run: |
          rm -f .phase7-clean-format.trigger .github/workflows/phase7-clean-format.yml
      - name: Commit clean formatted tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean and format Phase 7 Bulk Stock'
          git push origin HEAD:feat/ops-07-bulk-stock
