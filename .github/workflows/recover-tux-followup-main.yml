name: Recover TUX Follow-up to Main

on:
  push:
    branches:
      - recover/tux-followup-main-deploy-worker4
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout recovery authority
        uses: actions/checkout@v7
        with:
          ref: recover/tux-followup-main-deploy-worker4
          path: recovery

      - name: Checkout production main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          path: repo

      - name: Require expected production base
        working-directory: repo
        run: |
          test "$(git rev-parse HEAD)" = "3e2f5e341c5bd9c2ac57f902da964b3e88a8a170"

      - name: Apply approved follow-up runtime patch
        working-directory: repo
        run: |
          python ../recovery/scripts/recover-tux-followup-core.py
          python ../recovery/scripts/recover-tux-followup-css.py

      - name: Verify bounded scope before tooling
        working-directory: repo
        shell: bash
        run: |
          git diff --exit-code -- apps/operations/src/app/OrdersBoardWorkspace.tsx apps/operations/src/styles/orders-board.css
          git diff --check
          git diff --name-only | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          apps/operations/src/app/App.tsx
          apps/operations/src/app/ExpensesWorkspace.tsx
          apps/operations/src/app/OrdersCart.tsx
          apps/operations/src/app/icons.tsx
          apps/operations/src/app/sessionClient.ts
          apps/operations/src/styles/brand.css
          apps/operations/src/styles/bulk-stock.css
          apps/operations/src/styles/expenses.css
          apps/operations/src/styles/final-pos-corrections.css
          apps/operations/src/styles/orders.css
          apps/operations/src/styles/premium.css
          EOF
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: repo/package-lock.json

      - name: Install locked dependencies
        working-directory: repo
        run: npm ci

      - name: Format recovered files
        working-directory: repo
        run: |
          npx prettier --write \
            apps/operations/src/app/App.tsx \
            apps/operations/src/app/ExpensesWorkspace.tsx \
            apps/operations/src/app/OrdersCart.tsx \
            apps/operations/src/app/icons.tsx \
            apps/operations/src/app/sessionClient.ts \
            apps/operations/src/styles/brand.css \
            apps/operations/src/styles/bulk-stock.css \
            apps/operations/src/styles/expenses.css \
            apps/operations/src/styles/final-pos-corrections.css \
            apps/operations/src/styles/orders.css \
            apps/operations/src/styles/premium.css

      - name: Reverify bounded scope
        working-directory: repo
        run: |
          git diff --exit-code -- apps/operations/src/app/OrdersBoardWorkspace.tsx apps/operations/src/styles/orders-board.css
          git diff --check

      - name: Format check
        working-directory: repo
        run: npm run format:check

      - name: Lint
        working-directory: repo
        run: npm run lint

      - name: Unit and integration tests
        working-directory: repo
        run: npm test

      - name: Typecheck
        working-directory: repo
        run: npm run typecheck

      - name: Production build
        working-directory: repo
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: repo
        run: npx playwright install --with-deps chromium

      - name: Full rendered browser E2E
        working-directory: repo
        run: npm run test:e2e

      - name: Fast-forward main with one squash commit
        working-directory: repo
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "3e2f5e341c5bd9c2ac57f902da964b3e88a8a170"
          git config user.name "ahmedmohameda7222-ship-it"
          git config user.email "ahmed.mohameda7222@gmail.com"
          git add \
            apps/operations/src/app/App.tsx \
            apps/operations/src/app/ExpensesWorkspace.tsx \
            apps/operations/src/app/OrdersCart.tsx \
            apps/operations/src/app/icons.tsx \
            apps/operations/src/app/sessionClient.ts \
            apps/operations/src/styles/brand.css \
            apps/operations/src/styles/bulk-stock.css \
            apps/operations/src/styles/expenses.css \
            apps/operations/src/styles/final-pos-corrections.css \
            apps/operations/src/styles/orders.css \
            apps/operations/src/styles/premium.css
          git commit -m "fix: refine TUX operations follow-up"
          test "$(git rev-list --count 3e2f5e341c5bd9c2ac57f902da964b3e88a8a170..HEAD)" = "1"
          git push origin HEAD:main
