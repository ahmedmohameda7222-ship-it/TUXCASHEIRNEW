name: Admin Plan 2 Payment Reference GREEN

on:
  push:
    branches:
      - feat/admin-02-catalog-settings
    paths:
      - '.github/workflows/admin-plan2-payment-reference-green.yml'
      - 'scripts/admin-plan2-payment-reference-green.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  payment-reference-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply guarded payment reference patch
        run: python scripts/admin-plan2-payment-reference-green.py
      - name: Format payment reference sources
        run: >-
          npx prettier --write
          packages/domain/src/orderDraft.ts
          packages/domain/src/payment.ts
          packages/domain/src/models.ts
          packages/domain/src/syncContract.ts
          packages/domain/src/order.ts
          packages/domain/src/paymentReference.test.ts
          packages/domain/src/checkoutSnapshotSync.test.ts
          packages/application/src/orders.ts
          packages/application/src/paymentReferencePersistence.test.ts
          apps/operations/src/app/OrdersCart.tsx
          apps/operations/src/app/OnlineOrderInboxPanel.tsx
          apps/operations/src/app/paymentReferenceUi.test.ts
      - name: Payment reference domain authority
        run: npx vitest run packages/domain/src/paymentReference.test.ts
      - name: Payment reference sync preservation
        run: npx vitest run packages/domain/src/checkoutSnapshotSync.test.ts
      - name: Payment reference application persistence
        run: npx vitest run packages/application/src/paymentReferencePersistence.test.ts
      - name: Payment reference UI authority
        run: npx vitest run apps/operations/src/app/paymentReferenceUi.test.ts
      - name: Existing payment domain regression
        run: npx vitest run packages/domain/src/payment.test.ts
      - name: Existing online acceptance regression
        run: npx vitest run packages/application/src/onlineOrderAcceptance.test.ts
      - name: Existing online inbox UI regression
        run: npx vitest run apps/operations/src/app/OnlineOrderInboxPanel.test.tsx
      - name: Domain typecheck
        run: npm run typecheck -w @tux/domain
      - name: Application typecheck
        run: npm run typecheck -w @tux/application
      - name: Operations typecheck
        run: npm run typecheck -w @tux/operations
      - name: Commit verified payment reference authority
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/domain/src/orderDraft.ts \
            packages/domain/src/payment.ts \
            packages/domain/src/models.ts \
            packages/domain/src/syncContract.ts \
            packages/domain/src/order.ts \
            packages/domain/src/paymentReference.test.ts \
            packages/domain/src/checkoutSnapshotSync.test.ts \
            packages/application/src/orders.ts \
            packages/application/src/paymentReferencePersistence.test.ts \
            apps/operations/src/app/OrdersCart.tsx \
            apps/operations/src/app/OnlineOrderInboxPanel.tsx \
            apps/operations/src/app/paymentReferenceUi.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(checkout): enforce payment reference authority"
          git push origin HEAD:feat/admin-02-catalog-settings
