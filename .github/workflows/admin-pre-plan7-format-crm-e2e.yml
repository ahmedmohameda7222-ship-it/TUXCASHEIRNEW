name: Admin Pre-Plan-7 CRM E2E Format Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format CRM browser test
        run: npx prettier --write e2e/admin-customers-promotions.spec.ts
      - name: Remove one-shot formatter workflow
        run: rm .github/workflows/admin-pre-plan7-format-crm-e2e.yml
      - name: Commit formatting-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(admin): format CRM tab acceptance"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
