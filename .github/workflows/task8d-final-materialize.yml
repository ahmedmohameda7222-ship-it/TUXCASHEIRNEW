name: Task 8D Final Gate Materializer
on:
  push:
    branches:
      - work/operations-whatsapp-inbox-live
    paths:
      - '.tux-live/task8d-final.patch'
      - '.github/workflows/task8d-final-materialize.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact Task 8D final tree
        shell: bash
        run: |
          set -euo pipefail
          cp .tux-live/task8d-final.patch /tmp/task8d-final.patch
          test "$(sha256sum /tmp/task8d-final.patch | cut -d' ' -f1)" = "8d2062cf59f10f867628b62ebcd62eb3aabfcc559626c0970783832b223a8603"
          git rm .tux-live/task8d-final.patch
          git rm .github/workflows/task8d-final-materialize.yml
          git apply --index /tmp/task8d-final.patch
          test "$(git write-tree)" = "e13cda0a72c01e5e8882187aaa38488097328c48"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(task8d): complete messaging policy boundary"
          test "$(git rev-parse HEAD^{tree})" = "e13cda0a72c01e5e8882187aaa38488097328c48"
          git push origin HEAD:refs/heads/work/operations-whatsapp-inbox-live
