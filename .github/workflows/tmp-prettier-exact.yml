name: tmp-prettier-exact

on:
  push:
    branches:
      - work/menu-online-orders-integration

permissions:
  contents: write

jobs:
  prettier:
    if: ${{ !contains(github.event.head_commit.message, 'style(auto): prettier exact output') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/menu-online-orders-integration
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier@3.9.6 --write apps/operations/src/app/OnlineOrderInboxPanel.tsx
      - name: Commit exact Prettier output
        shell: bash
        run: |
          if git diff --quiet -- apps/operations/src/app/OnlineOrderInboxPanel.tsx; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/operations/src/app/OnlineOrderInboxPanel.tsx
          git commit -m "style(auto): prettier exact output"
          git push origin HEAD:work/menu-online-orders-integration
