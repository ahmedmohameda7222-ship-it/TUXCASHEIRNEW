name: Operations Vercel Hobby Budget TDD

on:
  pull_request:
    paths:
      - '.github/workflows/operations-vercel-hobby-budget-tdd.yml'
      - 'api/**'
      - 'server/**'
      - 'apps/operations/api/**'
      - 'apps/operations/vercel.json'
      - 'scripts/test-operations-vercel-hobby-budget.mjs'
      - 'scripts/test-operations-vercel-route-rewrites.mjs'
      - 'scripts/test-operations-vercel-esm-imports.mjs'

permissions:
  contents: read

jobs:
  hobby-function-budget:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Operations Vercel Hobby function budget
        run: node scripts/test-operations-vercel-hobby-budget.mjs
      - name: Operations Vercel consolidated public route rewrites
        run: node scripts/test-operations-vercel-route-rewrites.mjs
      - name: Operations Vercel Node ESM import graph
        run: node scripts/test-operations-vercel-esm-imports.mjs
