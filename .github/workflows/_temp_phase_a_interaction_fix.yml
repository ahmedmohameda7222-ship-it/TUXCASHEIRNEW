name: Temporary Phase A Interaction Correction

on:
  push:
    branches:
      - refactor/menu-layout-editor-long-term
    paths:
      - '.github/workflows/_temp_phase_a_interaction_fix.yml'

permissions:
  contents: write

jobs:
  correct-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/menu-layout-editor-long-term
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply bounded spatial DnD and stable-hit-target correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          contract = Path('apps/operations/src/app/unifiedMenuEditMode.source.test.ts')
          contract_text = contract.read_text()
          contract_needle = 'strategy: MeasuringStrategy.Always'
          if contract_needle not in contract_text:
              raise SystemExit('measurement source contract insertion point missing')
          contract.write_text(contract_text.replace(contract_needle, 'strategy: MeasuringStrategy.BeforeDragging', 1))

          workspace = Path('apps/operations/src/app/OrdersWorkspace.tsx')
          text = workspace.read_text()
          import_needle = "  KeyboardSensor,\n  PointerSensor,"
          import_replacement = "  KeyboardSensor,\n  MeasuringStrategy,\n  PointerSensor,"
          if import_needle not in text:
              raise SystemExit('dnd-kit import insertion point missing')
          text = text.replace(import_needle, import_replacement, 1)

          constant_needle = "const CART_RESIZE_KEYBOARD_STEP = 24;\n"
          constant_replacement = constant_needle + "const MENU_EDIT_MEASURING = {\n  droppable: { strategy: MeasuringStrategy.BeforeDragging },\n};\n"
          if constant_needle not in text:
              raise SystemExit('menu edit measuring constant insertion point missing')
          text = text.replace(constant_needle, constant_replacement, 1)

          pattern = re.compile(r'(?m)^(\s*)collisionDetection=\{closestCenter\}$')
          matches = list(pattern.finditer(text))
          if len(matches) != 2:
              raise SystemExit(f'expected 2 menu DndContext collision lines, found {len(matches)}')
          text = pattern.sub(lambda match: f"{match.group(1)}collisionDetection={{closestCenter}}\n{match.group(1)}measuring={{MENU_EDIT_MEASURING}}", text)
          workspace.write_text(text)

          styles = Path('apps/operations/src/styles/final-pos-corrections.css')
          css = styles.read_text()
          idle_motion = '''\n@keyframes menu-edit-jiggle {\n  0%,\n  100% {\n    rotate: -0.2deg;\n    translate: 0 0;\n  }\n  50% {\n    rotate: 0.2deg;\n    translate: 0 -0.5px;\n  }\n}\n\n@media (prefers-reduced-motion: no-preference) {\n  .category-tab-reordering {\n    animation: menu-edit-jiggle 1.8s ease-in-out infinite;\n  }\n\n  .menu-edit-product-card {\n    animation: menu-edit-jiggle 1.95s ease-in-out infinite;\n  }\n\n  .category-tab-reordering:nth-child(2n),\n  .menu-edit-product-card:nth-child(2n) {\n    animation-delay: -0.45s;\n  }\n\n  .category-tab-reordering:nth-child(3n),\n  .menu-edit-product-card:nth-child(3n) {\n    animation-delay: -0.9s;\n  }\n}\n'''
          if idle_motion not in css:
              raise SystemExit('idle jiggle block missing')
          styles.write_text(css.replace(idle_motion, '\n', 1))
          PY
          npx prettier --write apps/operations/src/app/OrdersWorkspace.tsx apps/operations/src/styles/final-pos-corrections.css apps/operations/src/app/unifiedMenuEditMode.source.test.ts
          git diff --check
      - name: Verify focused source and reducer contracts
        run: npx vitest run apps/operations/src/app/unifiedMenuEditMode.source.test.ts apps/operations/src/app/menuLayoutEditorSession.test.ts apps/operations/src/app/selectedCategoryVisibility.test.ts
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Verify desktop spatial keyboard and pointer reorder
        run: npx playwright test e2e/menu-layout-editor.e2e.ts --project=desktop-browser-fallback --grep "desktop pointer and spatial keyboard reorder persist after save and re-entry" --retries=0
      - name: Verify existing unified keyboard regression on desktop
        run: npx playwright test e2e/operations.e2e.ts --project=desktop-browser-fallback --grep "unified menu edit persists one combined worker layout with keyboard and rollback" --retries=0
      - name: Verify existing unified keyboard regression on tablet
        run: npx playwright test e2e/operations.e2e.ts --project=mobile-tablet-browser-fallback --grep "unified menu edit persists one combined worker layout with keyboard and rollback" --retries=0
      - name: Verify existing unified keyboard regression on mobile
        run: npx playwright test e2e/operations.e2e.ts --project=mobile-browser-fallback --grep "unified menu edit persists one combined worker layout with keyboard and rollback" --retries=0
      - name: Verify pickup/category rollback and save invariants
        run: npx playwright test e2e/menu-layout-editor.e2e.ts --project=desktop-browser-fallback --grep "pickup rollback, save failure, and save-in-flight freeze preserve transaction invariants" --retries=0
      - name: Verify selected category stability at 375px repeatedly
        run: npx playwright test e2e/menu-layout-editor.e2e.ts --project=mobile-browser-fallback --grep "menu editor keeps selected category reachable and preserves Product Card geometry" --repeat-each=5 --retries=0
      - name: Verify real touch acceptance
        run: npx playwright test e2e/menu-layout-editor.touch.e2e.ts --project=touch-mobile-browser-fallback --retries=0
      - name: Verify dirty shell exits
        run: npx playwright test e2e/menu-layout-editor.e2e.ts --project=desktop-browser-fallback --grep "dirty shell exits keep or discard the exact editor transaction" --retries=0
      - name: Verify branch System Color matrix repeatedly without relaxed thresholds
        run: npx playwright test e2e/worker-system-color-matrix.e2e.ts --project=desktop-browser-fallback --grep "worker system color robustness matrix verifies actual rendered controls in light and dark" --repeat-each=3 --retries=0
      - name: Commit verified correction and self-remove
        shell: bash
        run: |
          rm .github/workflows/_temp_phase_a_interaction_fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/operations/src/app/OrdersWorkspace.tsx apps/operations/src/styles/final-pos-corrections.css apps/operations/src/app/unifiedMenuEditMode.source.test.ts .github/workflows/_temp_phase_a_interaction_fix.yml
          git diff --cached --check
          git commit -m 'fix(menu-editor): stabilize spatial reorder interactions'
          git push origin HEAD:refactor/menu-layout-editor-long-term
