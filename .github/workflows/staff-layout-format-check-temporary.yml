name: Temporary Staff layout exact Prettier diff
on:
  pull_request:
    paths:
      - '.github/workflows/staff-layout-format-check-temporary.yml'
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Print exact staff CSS formatting difference
        run: |
          npx prettier apps/admin/src/staff/staff.css | diff -u apps/admin/src/staff/staff.css - || true
