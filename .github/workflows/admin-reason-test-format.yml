name: Admin Reason Test Format

on:
  pull_request:
    paths:
      - '.github/workflows/admin-reason-test-format.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format reason-code test only
        run: npx prettier --write packages/application/src/ordersBoard.reasonCodes.sqlite.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/application/src/ordersBoard.reasonCodes.sqlite.test.ts
          git commit -m 'style(settings): format reason-code test'
          git push origin HEAD:${GITHUB_HEAD_REF}
