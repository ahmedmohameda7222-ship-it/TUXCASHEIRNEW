name: Admin Plan 2 Round 16 Patcher

on:
  push:
    branches:
      - fix/admin-plan2-round16-review
    paths:
      - '.github/workflows/admin-plan2-round16-patcher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/admin-plan2-round16-review
          fetch-depth: 0
      - name: Normalize guarded Round 16 intake formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/order-intake/order-intake.ts')
          text = path.read_text()
          old = (
            "  const now = new Date();\n"
            "if (!isPublishedOnlineOrderingOpenAt(authority, now)) {\n"
            "  return errorResponse(409, ONLINE_ORDERING_OUTSIDE_HOURS);\n"
            "}\n"
            "const fulfillmentServiceKind =\n"
            "  request.fulfillmentPreference === 'DELIVERY' ? 'DELIVERY' : 'OPEN';\n"
            "if (!isPublishedServiceKindOpenAt(authority, fulfillmentServiceKind, now)) {\n"
            "  return errorResponse(409, 'fulfillment_outside_hours');\n"
            "}\n"
          )
          new = (
            "  const now = new Date();\n"
            "  if (!isPublishedOnlineOrderingOpenAt(authority, now)) {\n"
            "    return errorResponse(409, ONLINE_ORDERING_OUTSIDE_HOURS);\n"
            "  }\n"
            "  const fulfillmentServiceKind =\n"
            "    request.fulfillmentPreference === 'DELIVERY' ? 'DELIVERY' : 'OPEN';\n"
            "  if (!isPublishedServiceKindOpenAt(authority, fulfillmentServiceKind, now)) {\n"
            "    return errorResponse(409, 'fulfillment_outside_hours');\n"
            "  }\n"
          )
          if text.count(old) != 1:
            raise SystemExit(f'expected one unformatted Round 16 block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit source formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/order-intake/order-intake.ts
          git diff --cached --check
          git commit -m "style(admin): format fulfillment hours guard"
          git push origin HEAD:fix/admin-plan2-round16-review
