name: Task 8 Final Fixture Materializer

on:
  push:
    branches:
      - work/operations-whatsapp-inbox-live
    paths:
      - .github/workflows/task8-final-fixture-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact Task 8 fixture tree
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .recovery/task8-final-fixture.patch.gz.b64 | gzip -d > /tmp/task8-final-fixture.patch
          test "$(sha256sum /tmp/task8-final-fixture.patch | awk '{print $1}')" = "a9757d1c3a9a28317d09993421c1388fa7053caa9ed52e8e3714b40feeb2f133"
          git rm .recovery/task8-final-fixture.patch.gz.b64 .github/workflows/task8-final-fixture-materialize.yml
          git apply --index /tmp/task8-final-fixture.patch
          test "$(git write-tree)" = "b9fa85147fde0cde7ac497450b957d9807f9fcac"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(task8): type nullable messaging policy fixtures'
          git push origin HEAD:work/operations-whatsapp-inbox-live
