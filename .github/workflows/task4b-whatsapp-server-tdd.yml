name: Task 4B WhatsApp Server TDD

on:
  push:
    branches:
      - feat/ops-whatsapp-task4b-red

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Shared contract RED
        run: npm test -- packages/application/src/whatsappRemote.test.ts
