name: Admin Plan 2 Prettier Helper

on:
  push:
    branches:
      - tmp/admin-plan2-prettier-helper

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/admin-plan2-prettier-helper
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format acceptance files
        run: >-
          npx prettier --write
          apps/admin/api/admin/catalog.ts
          apps/admin/api/admin/settings.ts
          apps/admin/src/catalog/CatalogPage.tsx
          apps/admin/src/catalog/useCatalog.ts
          apps/admin/src/settings/PaymentsPage.tsx
          apps/admin/src/settings/SettingsPage.tsx
          apps/admin/src/settings/ShopsPage.tsx
          apps/admin/src/settings/useSettings.ts
          packages/admin-contracts/src/catalog.ts
          packages/admin-contracts/src/settings.ts
      - name: Commit formatted files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/admin/api/admin/catalog.ts \
            apps/admin/api/admin/settings.ts \
            apps/admin/src/catalog/CatalogPage.tsx \
            apps/admin/src/catalog/useCatalog.ts \
            apps/admin/src/settings/PaymentsPage.tsx \
            apps/admin/src/settings/SettingsPage.tsx \
            apps/admin/src/settings/ShopsPage.tsx \
            apps/admin/src/settings/useSettings.ts \
            packages/admin-contracts/src/catalog.ts \
            packages/admin-contracts/src/settings.ts
          git commit -m "chore(admin): format final acceptance files"
          git push origin HEAD:tmp/admin-plan2-prettier-helper
