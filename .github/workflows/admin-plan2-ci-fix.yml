name: Admin Plan 2 CI Fix

on:
  push:
    branches:
      - feat/admin-02-catalog-settings
    paths:
      - .github/workflows/admin-plan2-ci-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/admin-02-catalog-settings
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Apply exact CI regression fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          scheduler = Path('scripts/test-admin-catalog-scheduler-migration.mjs')
          text = scheduler.read_text()
          old = 'supabase/migrations/20260910120600_admin_scheduler_retry_hardening.sql'
          new = 'supabase/migrations/20260910120630_admin_scheduler_retry_hardening.sql'
          if old not in text:
              raise SystemExit('scheduler stale migration path not found')
          scheduler.write_text(text.replace(old, new))

          spec = Path('e2e/admin-settings.spec.ts')
          text = spec.read_text()
          replacements = [
              ("  await page.getByRole('button', { name: 'Edit Tax / VAT (bps)' }).click();\n", ''),
              ("  await page.getByRole('button', { name: 'Edit Order prefix' }).click();\n", ''),
              ("page.getByLabel('Requires reference')", "page.getByLabel('Reference required')"),
              ("page.getByRole('button', { name: 'Save Cash' })", "page.getByRole('button', { name: 'Save payment method' })"),
              ("page.getByRole('heading', { name: 'Reason codes' })", "page.getByRole('heading', { name: 'Configured operational reasons' })"),
              ("await page.getByLabel('Active').uncheck();", "await page.getByLabel('CUSTOMER_CHANGED_MIND reason status').selectOption('inactive');"),
              ("page.getByRole('button', { name: 'Save reason' })", "page.getByRole('button', { name: 'Save CUSTOMER_CHANGED_MIND' })"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'stale E2E selector not found: {old}')
              text = text.replace(old, new, 1)
          spec.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Format touched files
        run: npx prettier --write scripts/test-admin-catalog-scheduler-migration.mjs e2e/admin-settings.spec.ts
      - name: Verify scheduler invariant
        run: node scripts/test-admin-catalog-scheduler-migration.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Admin settings rendered E2E
        run: npx playwright test e2e/admin-settings.spec.ts --config playwright.admin.config.ts
      - name: Commit verified fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test-admin-catalog-scheduler-migration.mjs e2e/admin-settings.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m 'test(admin): align Plan 2 exact-head regressions'
          git push origin HEAD:feat/admin-02-catalog-settings
