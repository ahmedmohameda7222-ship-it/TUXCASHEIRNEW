name: Temporary Staff Add Employee Prettier
on:
  push:
    branches:
      - fix/staff-mainline-add-employee-access-20261029
    paths:
      - .github/workflows/staff-add-employee-prettier-temporary.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/staff-mainline-add-employee-access-20261029
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format exact changed files
        run: npx prettier --write apps/admin/src/staff/StaffPage.tsx e2e/admin-workforce.spec.ts
      - name: Verify and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/staff/StaffPage.tsx e2e/admin-workforce.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(staff): normalize new employee access and shift workflow"
            git push origin HEAD:fix/staff-mainline-add-employee-access-20261029
          fi
